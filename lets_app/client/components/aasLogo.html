    // Get the embedded source (default to colored)
    getSrc(white = false) {
      return white ? this.base64White : this.base64;
    },
    
    // Get logo as img element
    getImage(height = 50, className = '', white = false) {
      const img = document.createElement('img');
      img.src = this.getSrc(white);
      img.alt = 'AAS Logo';
      img.style.height = height + 'px';
      img.style.width = 'auto';
      if (className) img.className = className;
      return img;
    },
    
    // Get logo as HTML string
    getHTML(height = 50, className = '', white = false) {
      return `<img src="${this.getSrc(white)}" alt="AAS Logo" style="height: ${height}px; width: auto; vertical-align: middle;" class="${className}" data-aas-logo="true">`;
    },
    
    // Update any placeholders on the page
    updatePlaceholders() {
      const placeholders = document.querySelectorAll('[data-aas-logo="true"]');
      placeholders.forEach(img => {
        // Just ensure the URL is set
        img.src = this.url;
      });
    }
  };
  
  // Initialize immediately
  window.AAS_LOGO.init();
