<!--
  ================================================================
  Travel Utilities - Shared Constants and Helpers
  ================================================================

  Provides shared data and utilities for travel request forms:
  - US States list (including territories)
  - OCONUS detection
  - Date/currency formatters
  - Common validation helpers
-->

<script>
window.TravelUtils = (function() {
  'use strict';

  // ==========================================================================
  // US STATES & TERRITORIES
  // ==========================================================================

  const US_STATES = [
    { abbr: 'AL', name: 'Alabama' },
    { abbr: 'AK', name: 'Alaska' },
    { abbr: 'AZ', name: 'Arizona' },
    { abbr: 'AR', name: 'Arkansas' },
    { abbr: 'CA', name: 'California' },
    { abbr: 'CO', name: 'Colorado' },
    { abbr: 'CT', name: 'Connecticut' },
    { abbr: 'DE', name: 'Delaware' },
    { abbr: 'DC', name: 'District of Columbia' },
    { abbr: 'FL', name: 'Florida' },
    { abbr: 'GA', name: 'Georgia' },
    { abbr: 'HI', name: 'Hawaii' },
    { abbr: 'ID', name: 'Idaho' },
    { abbr: 'IL', name: 'Illinois' },
    { abbr: 'IN', name: 'Indiana' },
    { abbr: 'IA', name: 'Iowa' },
    { abbr: 'KS', name: 'Kansas' },
    { abbr: 'KY', name: 'Kentucky' },
    { abbr: 'LA', name: 'Louisiana' },
    { abbr: 'ME', name: 'Maine' },
    { abbr: 'MD', name: 'Maryland' },
    { abbr: 'MA', name: 'Massachusetts' },
    { abbr: 'MI', name: 'Michigan' },
    { abbr: 'MN', name: 'Minnesota' },
    { abbr: 'MS', name: 'Mississippi' },
    { abbr: 'MO', name: 'Missouri' },
    { abbr: 'MT', name: 'Montana' },
    { abbr: 'NE', name: 'Nebraska' },
    { abbr: 'NV', name: 'Nevada' },
    { abbr: 'NH', name: 'New Hampshire' },
    { abbr: 'NJ', name: 'New Jersey' },
    { abbr: 'NM', name: 'New Mexico' },
    { abbr: 'NY', name: 'New York' },
    { abbr: 'NC', name: 'North Carolina' },
    { abbr: 'ND', name: 'North Dakota' },
    { abbr: 'OH', name: 'Ohio' },
    { abbr: 'OK', name: 'Oklahoma' },
    { abbr: 'OR', name: 'Oregon' },
    { abbr: 'PA', name: 'Pennsylvania' },
    { abbr: 'PR', name: 'Puerto Rico' },
    { abbr: 'RI', name: 'Rhode Island' },
    { abbr: 'SC', name: 'South Carolina' },
    { abbr: 'SD', name: 'South Dakota' },
    { abbr: 'TN', name: 'Tennessee' },
    { abbr: 'TX', name: 'Texas' },
    { abbr: 'UT', name: 'Utah' },
    { abbr: 'VT', name: 'Vermont' },
    { abbr: 'VA', name: 'Virginia' },
    { abbr: 'VI', name: 'Virgin Islands' },
    { abbr: 'WA', name: 'Washington' },
    { abbr: 'WV', name: 'West Virginia' },
    { abbr: 'WI', name: 'Wisconsin' },
    { abbr: 'WY', name: 'Wyoming' },
    { abbr: 'GU', name: 'Guam' },
    { abbr: 'AS', name: 'American Samoa' },
    { abbr: 'MP', name: 'Northern Mariana Islands' }
  ];

  // OCONUS territories use DoD per diem rates
  const OCONUS_STATES = ['AK', 'HI', 'PR', 'VI', 'GU', 'AS', 'MP'];

  // ==========================================================================
  // CONFIGURATION CONSTANTS
  // Mirrors server-side TravelConstants.js - keep in sync!
  // ==========================================================================

  const TRAVEL_CONFIG = {
    // Time constants
    MS_PER_DAY: 1000 * 60 * 60 * 24,
    MS_PER_HOUR: 1000 * 60 * 60,

    // Mileage rates (updated annually)
    MILEAGE_RATES: {
      PRIVATE: 0.70,
      GOVERNMENT: 0.22
    },

    // LAST-RESORT fallback for the "other costs" gross-up, used only when the
    // RPC that reads the `other_cost_percentage` Script Property fails. The
    // configured value is authoritative — see TravelCostService.loadCostConfig().
    //
    // This is NOT the business default. Changing it does not change what the
    // form applies; set the Script Property instead. It exists so a failed RPC
    // produces a plausible estimate rather than a 0% gross-up, which would
    // silently understate every request.
    OTHER_COST_PERCENTAGE_FALLBACK: 30,

    // Form configuration
    FORM_STEPS: {
      TOTAL: 6,
      FIRST: 1
    },

    // Status groupings
    STATUS: {
      NEEDS_INFO: ['NEEDS_INFO_SECTOR', 'NEEDS_INFO_BU', 'NEEDS_INFO_OSO'],
      TERMINAL: ['APPROVED', 'APPROVED_GOGOV', 'COMPLETED', 'DENIED', 'CANCELLED', 'SUBMITTER_CANCELLED'],
      PENDING: ['PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'PENDING_FAS']
    },

    // Location types that require site name
    // Location types that also need a site NAME. 'gsa-site' is included: a GSA
    // facility still needs identifying ("Regional Office Building", "1800 F"),
    // and without it a reviewer sees only a city.
    LOCATION_TYPES_WITH_SITE: ['client-site', 'contractor-site', 'gsa-site'],

    /**
     * Budget office code -> HR org code, and the display names for both.
     *
     * Two namespaces for the same four offices, confirmed with @clolry:
     *
     *   FC  = Front Office / AC   -> budget key FO
     *   FCA = OMD DAC             -> budget key OMD
     *   FCB = IDV DAC             -> budget key IDV
     *   FCC = CM DAC              -> budget key CM
     *
     * Both are stored on a request because different consumers need different
     * ones: BudgetConfig.js allocates against the OFFICE code, while HC_Orgs,
     * HC positions and DAC approval routing all key off the ORG code.
     *
     * Note the FAS Travel Exception Tracker wants NEITHER — its Portfolio
     * field is portfolio-level ('FC - Office of Acquisition Solutions
     * Development (CREATE)'), and FCA/FCB/FCC are divisions within it. See
     * FAS_PORTFOLIO_CODE in FASTrackerSync.js.
     */
    OFFICES: [
      { officeCode: 'FO',  orgCode: 'FC',  name: 'Front Office / AC' },
      { officeCode: 'OMD', orgCode: 'FCA', name: 'OMD DAC' },
      { officeCode: 'IDV', orgCode: 'FCB', name: 'IDV DAC' },
      { officeCode: 'CM',  orgCode: 'FCC', name: 'CM DAC' }
    ],

    // Character limits
    CHAR_LIMITS: {
      BLUF: 500,
      DETAILED_PURPOSE: 2000,
      COMMENTS: 1000
    },

    // UI dimensions
    UI: {
      FLATPICKR_CALENDAR_HEIGHT: 305,
      AWESOMPLETE_DROPDOWN_HEIGHT: 250
    }
  };

  // ==========================================================================
  // OCONUS DETECTION
  // ==========================================================================

  /**
   * Check if a state abbreviation is OCONUS (uses DoD rates)
   */
  function isOCONUS(stateAbbr) {
    return OCONUS_STATES.includes(stateAbbr?.toUpperCase());
  }

  /**
   * Get the full state name from abbreviation
   */
  function getStateName(abbr) {
    const state = US_STATES.find(s => s.abbr === abbr?.toUpperCase());
    return state ? state.name : abbr;
  }

  /**
   * Validate state abbreviation
   */
  function isValidState(abbr) {
    return US_STATES.some(s => s.abbr === abbr?.toUpperCase());
  }

  // ==========================================================================
  // DATE FORMATTERS
  // ==========================================================================

  /**
   * Format date for display (e.g., "Jan 15, 2025")
   */
  function formatDateDisplay(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr + 'T00:00:00');
    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    return date.toLocaleDateString('en-US', options);
  }

  /**
   * Calculate number of nights between two dates
   * DELEGATES to TravelDateService.calculateNights() when available
   * Kept for backward compatibility - prefer TravelDateService directly
   */
  function calculateNights(startDate, endDate) {
    // Delegate to canonical implementation if available
    if (window.TravelDateService?.calculateNights) {
      return window.TravelDateService.calculateNights(startDate, endDate);
    }
    // Fallback implementation
    if (!startDate || !endDate) return 0;
    const start = new Date(startDate);
    const end = new Date(endDate);
    start.setHours(0, 0, 0, 0);
    end.setHours(0, 0, 0, 0);
    const diffTime = end - start;
    const diffDays = Math.round(diffTime / TRAVEL_CONFIG.MS_PER_DAY);
    return Math.max(0, diffDays);
  }

  // ==========================================================================
  // CURRENCY FORMATTERS
  // ==========================================================================

  /**
   * Format number as currency
   */
  function formatCurrency(amount, decimals = 2) {
    const num = parseFloat(amount) || 0;
    return '$' + num.toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  /**
   * Parse currency string to number
   */
  function parseCurrency(str) {
    if (typeof str === 'number') return str;
    if (!str) return 0;
    return parseFloat(str.replace(/[$,]/g, '')) || 0;
  }

  // ==========================================================================
  // HTML SECURITY
  // ==========================================================================

  /**
   * Escape HTML special characters to prevent XSS
   * Use this when inserting user-provided content into HTML
   * @param {string} str - String to escape
   * @returns {string} Escaped string safe for HTML insertion
   */
  function escapeHtml(str) {
    if (!str) return '';
    if (typeof str !== 'string') str = String(str);
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ==========================================================================
  // TOAST NOTIFICATIONS
  // ==========================================================================

  /**
   * Show a toast notification
   * @param {string} message - The message to display
   * @param {string} type - 'success', 'error', 'warning', 'info' (default: 'info')
   */
  function showToast(message, type = 'info') {
    // Remove any existing toasts
    document.querySelectorAll('.travel-toast').forEach(t => t.remove());

    const iconMap = {
      success: 'fa-check-circle',
      error: 'fa-exclamation-circle',
      warning: 'fa-exclamation-triangle',
      info: 'fa-info-circle'
    };

    const toast = document.createElement('div');
    toast.className = `travel-toast travel-toast--${type}`;
    toast.innerHTML = `<i aria-hidden="true" class="fas ${iconMap[type] || iconMap.info}"></i><span>${escapeHtml(message)}</span>`;

    document.body.appendChild(toast);

    // Trigger animation (uses .show class per existing CSS)
    requestAnimationFrame(() => {
      toast.classList.add('show');
    });

    // Remove after delay
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // ==========================================================================
  // STATUS CODES & LABELS
  // ==========================================================================

  const STATUS_MAP = {
    'pending-approval': { label: 'Pending Approval', color: 'warning', icon: 'clock' },
    'approved': { label: 'Approved', color: 'success', icon: 'check-circle' },
    'needs-info': { label: 'Needs Info', color: 'info', icon: 'info-circle' },
    'denied': { label: 'Denied', color: 'danger', icon: 'times-circle' },
    'cancelled': { label: 'Cancelled', color: 'secondary', icon: 'ban' },
    'draft': { label: 'Draft', color: 'secondary', icon: 'edit' }
  };

  function getStatusInfo(status) {
    return STATUS_MAP[status] || { label: status, color: 'secondary', icon: 'question-circle' };
  }

  /**
   * The CURRENT review stage, derived from status where possible.
   *
   * Mirrors describeReviewStage in server/30_services/Email.js. Duplicated
   * because one feeds notifications and the other the portal card, and a
   * submitter seeing different wording in each would reasonably think they
   * were different things — test_routing_visibility asserts the two agree.
   *
   * WHY STATUS AND NOT Initial_Review_Level: that column records where a
   * request STARTED and never advances, while Current_Reviewer_Name does.
   * Pairing them showed the current reviewer against the stage the request
   * began at — correct on submission, progressively wrong afterwards.
   *
   * @param {string} status Requests.Status
   * @param {string} [reviewLevel] fallback for an unmapped status
   * @returns {string}
   */
  function describeReviewStage(status, reviewLevel) {
    // Labels from branding so a redeploy for another workgroup is a
    // configuration change. SCD = Service Center Director, DAC = Deputy
    // Assistant Commissioner (the SES running each of FCA/FCB/FCC). The
    // inherited code said "Sector Director" and "Business Unit".
    const b = (typeof window !== 'undefined' && window._letsBranding) || {};
    const sector = (b.sectorLabel || 'SCD') + ' review';
    const bu = (b.buLabel || 'DAC') + ' review';
    const fo = (b.foLabel || 'ASD Travel & Events') + ' review';

    const STATUS_STAGES = {
      PENDING_SECTOR: sector,
      PENDING_BU: bu,
      PENDING_OSO: fo,
      PENDING_FAS: 'FAS Front Office review',
      PENDING_DD_CONFIRMATION: 'Division Director confirmation',
      PENDING_CORRECTION: 'correction by the submitter',
      NEEDS_INFO: 'more information from the submitter',
      NEEDS_INFO_SECTOR: 'more information from the submitter',
      NEEDS_INFO_BU: 'more information from the submitter',
      NEEDS_INFO_OSO: 'more information from the submitter'
    };
    const key = String(status || '').toUpperCase().trim();
    if (STATUS_STAGES[key]) return STATUS_STAGES[key];

    // Keys are STORED Initial_Review_Level values and must not change.
    const LEVEL_LABELS = {
      'Sector': sector,
      'BU': bu,
      'OSO': fo,
      'AAS FO': fo,
      'FAS': 'FAS Front Office review'
    };
    if (LEVEL_LABELS[reviewLevel]) return LEVEL_LABELS[reviewLevel];
    return reviewLevel ? reviewLevel + ' review' : 'review';
  }

  /**
   * Short stage labels, for status badges and audit-log lines.
   *
   * describeReviewStage returns prose ("DAC review"); these are the bare
   * labels for places that add their own wording ("Pending DAC Review",
   * "Returned for More Info (DAC)").
   *
   * Both read the same branding, so a property change moves every surface at
   * once — which is the point. Four separate status maps across the portal,
   * review controller and two dashboards had hardcoded 'SD', 'BU' and
   * 'AAS FO' independently.
   *
   * @returns {{sector: string, bu: string, fo: string, fas: string}}
   */
  function stageLabels() {
    const b = (typeof window !== 'undefined' && window._letsBranding) || {};
    return {
      sector: b.sectorLabel || 'SCD',
      bu: b.buLabel || 'DAC',
      fo: b.foLabel || 'ASD Travel & Events',
      // Not configurable: FAS is the Federal Acquisition Service, a fixed
      // external body, not this workgroup's own naming.
      fas: 'FAS',

      // Not review stages, but carried here because every caller that needs
      // them already calls stageLabels(). The admin Users page said "Search
      // AAS staff" and "outside AAS staffing data" — @clolry: "I wanted it to
      // say ASD not AAS." Those strings need the ORG, not a stage.
      orgShort: b.orgShort || 'ASD',
      appName: b.appName || 'LETS'
    };
  }

  /**
   * True when a status means the submitter must act.
   *
   * NEEDS_INFO and PENDING_CORRECTION are not "waiting on a reviewer" — they
   * are waiting on the SUBMITTER, and showing "with <reviewer>" on one of
   * those actively misleads: the request will not move until the submitter
   * does something.
   */
  function isAwaitingSubmitter(status) {
    const key = String(status || '').toUpperCase().trim();
    return key.indexOf('NEEDS_INFO') === 0 || key === 'PENDING_CORRECTION';
  }

  // ==========================================================================
  // EXPORTS
  // ==========================================================================
  /**
   * HR org code for a budget office code, or '' when unknown.
   * Deliberately NOT a fallback to the input: a wrong org code would attribute
   * budget to the wrong DAC, which is worse than an empty one.
   */
  function officeCodeToOrgCode(officeCode) {
    var code = String(officeCode || '').trim().toUpperCase();
    for (var i = 0; i < TRAVEL_CONFIG.OFFICES.length; i++) {
      if (TRAVEL_CONFIG.OFFICES[i].officeCode === code) return TRAVEL_CONFIG.OFFICES[i].orgCode;
    }
    return '';
  }

  /** Budget office code for an HR org code, or '' when unknown. */
  function orgCodeToOfficeCode(orgCode) {
    var code = String(orgCode || '').trim().toUpperCase();
    for (var i = 0; i < TRAVEL_CONFIG.OFFICES.length; i++) {
      if (TRAVEL_CONFIG.OFFICES[i].orgCode === code) return TRAVEL_CONFIG.OFFICES[i].officeCode;
    }
    return '';
  }

  /** Display name for either code form, or '' when unknown. */
  function officeDisplayName(code) {
    var c = String(code || '').trim().toUpperCase();
    for (var i = 0; i < TRAVEL_CONFIG.OFFICES.length; i++) {
      var o = TRAVEL_CONFIG.OFFICES[i];
      if (o.officeCode === c || o.orgCode === c) return o.name;
    }
    return '';
  }


  return {
    // Configuration
    TRAVEL_CONFIG,

    // Data
    US_STATES,
    OCONUS_STATES,
    STATUS_MAP,

    // State helpers
    isOCONUS,
    getStateName,
    isValidState,

    // Date formatters
    formatDateDisplay,
    calculateNights,

    // Currency formatters
    formatCurrency,
    parseCurrency,

    // HTML security
    escapeHtml,

    // Toast notifications
    showToast,

    // Status helpers
    getStatusInfo,
    describeReviewStage,
    stageLabels,
    isAwaitingSubmitter,

    // Office / org code mapping (FO<->FC, OMD<->FCA, IDV<->FCB, CM<->FCC)
    officeCodeToOrgCode,
    orgCodeToOfficeCode,
    officeDisplayName
  };
})();
</script>
