  Controller._initTravelerInputs = function(traveler) {
    const self = this;
    const travelerId = traveler.id;

    // Employee autocomplete
    this._initEmployeeAutocomplete(travelerId);

    // LCAT input (editable field) - also updates header Role-BU display
    const lcatInput = document.getElementById(`tcLcat_${travelerId}`);
    if (lcatInput) {
      lcatInput.addEventListener('input', function() {
        window.TravelRequest.State.updateTraveler(travelerId, 'lcat', this.value);
        // Update Role-BU in header (get BU from current traveler state)
        const traveler = window.TravelRequest.State.getTraveler(travelerId);
        self._updateTravelerRoleBu(travelerId, { bu: traveler?.businessUnit || '' });
      });
    }

    // Funding type radio buttons
    const fundingRadios = document.querySelectorAll(`input[name="tcFunding_${travelerId}"]`);
    fundingRadios.forEach(radio => {
      radio.addEventListener('change', function() {
        window.TravelRequest.State.updateTraveler(travelerId, 'isClientPaid', this.value);
        // Update visual active state
        fundingRadios.forEach(r => {
          r.closest('.tc__toggle').classList.toggle('tc__toggle--active', r.checked);
        });
        // Check disclosure progress
        self._checkDisclosureProgress(travelerId);
      });
    });

    // Role justification textarea with focus-expand
    const roleJustification = document.getElementById(`tcRoleJustification_${travelerId}`);
    if (roleJustification) {
      roleJustification.addEventListener('input', function() {
        window.TravelRequest.State.updateTraveler(travelerId, 'roleJustification', this.value);
        // Check disclosure progress (debounced via blur for better UX)
      });
      roleJustification.addEventListener('blur', function() {
        self._checkDisclosureProgress(travelerId);
      });
      // Initialize focus-expand behavior
      this._initFocusExpandSingle(roleJustification);
    }

    // International travel fields
    this._initInternationalFields(travelerId);

    // Transport mode cards - toggles between cost and mileage fields
    const transportCardsContainer = document.getElementById(`tcTransportCards_${travelerId}`);
    if (transportCardsContainer) {
      transportCardsContainer.addEventListener('click', function(e) {
        const card = e.target.closest('.tc__transport-card');
        if (!card) return;

        const mode = card.dataset.mode;
        window.TravelRequest.State.updateTraveler(travelerId, 'transportMode', mode);

        // Update selected state on cards
        transportCardsContainer.querySelectorAll('.tc__transport-card').forEach(c => {
          c.classList.remove('tc__transport-card--selected');
        });
        card.classList.add('tc__transport-card--selected');

        const costWrap = document.getElementById(`tcTransportCostWrap_${travelerId}`);
        const mileWrap = document.getElementById(`tcTransportMileWrap_${travelerId}`);
        const rentalCarSection = document.getElementById(`tcRentalCarSection_${travelerId}`);

        // Show mileage fields for private/gov vehicle, cost field for others
        const showMileage = mode === 'private' || mode === 'gov';

        if (costWrap) {
          costWrap.classList.toggle('tc__transport-cost--hidden', showMileage);
        }
        if (mileWrap) {
          mileWrap.classList.toggle('tc__transport-mileage--hidden', !showMileage);
        }

        // Hide rental car section if primary mode is 'rental' (already renting as main transport)
        if (rentalCarSection) {
          rentalCarSection.classList.toggle('tc__rental-car--hidden', mode === 'rental');
          // If switching to rental, clear the rental car fields
          if (mode === 'rental') {
            window.TravelRequest.State.updateTraveler(travelerId, 'needsRentalCar', false);
            window.TravelRequest.State.updateTraveler(travelerId, 'rentalCarCost', 0);
          }
          // Sync cost input visibility with current toggle state
          const rentalCarCostWrap = document.getElementById(`tcRentalCarCostWrap_${travelerId}`);
          if (rentalCarCostWrap) {
            const traveler = window.TravelRequest.State.getTraveler(travelerId);
            const needsRental = traveler && traveler.needsRentalCar === true;
            rentalCarCostWrap.classList.toggle('tc__rental-car-cost--hidden', !needsRental);
          }
        }

        // Recalculate and update display
        self._updateTransportCalc(travelerId);
        self._updateTravelerCostDisplay(travelerId);
        self._updateTravelersTotal();
        // Note: Don't reveal costs section here - wait until they enter a value
      });
    }

    // Transport cost input (for Air, Rail, Rental)
    const transportCostInput = document.getElementById(`tcTransportCost_${travelerId}`);
    if (transportCostInput) {
      transportCostInput.addEventListener('input', function() {
        window.TravelRequest.State.updateTraveler(travelerId, 'ticketCost', parseFloat(this.value) || 0);
        self._updateTransportCalc(travelerId);
        self._updateTravelerCostDisplay(travelerId);
        self._updateTravelersTotal();
        // Reveal costs section after entering a value
        self._checkDisclosureProgress(travelerId);
      });
    }

    // Transport miles input (for Private/Gov Vehicle)
    const transportMilesInput = document.getElementById(`tcTransportMiles_${travelerId}`);
    if (transportMilesInput) {
      transportMilesInput.addEventListener('input', function() {
        const totalMiles = parseInt(this.value) || 0;
        // Store as combined mileage (to and from)
        window.TravelRequest.State.updateTraveler(travelerId, 'milesToDeparture', totalMiles);
        window.TravelRequest.State.updateTraveler(travelerId, 'milesFromArrival', 0);
        self._updateTransportCalc(travelerId);
        self._updateTravelerCostDisplay(travelerId);
        self._updateTravelersTotal();
        // Reveal costs section after entering a value
        self._checkDisclosureProgress(travelerId);
      });
    }

    // Rental car toggle (Yes/No radio buttons)
    const rentalCarRadios = document.querySelectorAll(`input[name="tcRentalCar_${travelerId}"]`);
    rentalCarRadios.forEach(radio => {
      radio.addEventListener('change', function() {
        const needsRental = this.value === 'yes';
        window.TravelRequest.State.updateTraveler(travelerId, 'needsRentalCar', needsRental);

        // Update visual active state
        rentalCarRadios.forEach(r => {
          r.closest('.tc__toggle').classList.toggle('tc__toggle--active', r.checked);
        });

        // Show/hide cost input
        const costWrap = document.getElementById(`tcRentalCarCostWrap_${travelerId}`);
        if (costWrap) {
          costWrap.classList.toggle('tc__rental-car-cost--hidden', !needsRental);
        }

        // Clear cost if selecting No
        if (!needsRental) {
          window.TravelRequest.State.updateTraveler(travelerId, 'rentalCarCost', 0);
          const costInput = document.getElementById(`tcRentalCarCost_${travelerId}`);
          if (costInput) costInput.value = '';
        }

        // Recalculate and update display
        self._updateTransportCalc(travelerId);
        self._updateTravelerCostDisplay(travelerId);
        self._updateTravelersTotal();
      });
    });

    // Rental car cost input
    const rentalCarCostInput = document.getElementById(`tcRentalCarCost_${travelerId}`);
    if (rentalCarCostInput) {
      rentalCarCostInput.addEventListener('input', function() {
        window.TravelRequest.State.updateTraveler(travelerId, 'rentalCarCost', parseFloat(this.value) || 0);
        self._updateTransportCalc(travelerId);
        self._updateTravelerCostDisplay(travelerId);
        self._updateTravelersTotal();
      });
    }

    // Leg attendance checkboxes
    this._bindLegAttendanceEvents(travelerId);

    // Traveler leg date pickers
    this._initTravelerLegDatePickers(travelerId);

    // Fetch per diem for all attending legs
    this._fetchAllLegPerDiem(travelerId);

    // Local travel inputs (if any legs are local)
    this._initLocalTravelInputs(travelerId);

    // For restored travelers (from draft), reveal appropriate stages and update transport visibility
    const disclosureStage = this._getDisclosureStage(traveler);
    if (disclosureStage >= 3) {
      this._revealStage(travelerId, 'transport');
    }
    if (disclosureStage >= 4) {
      this._revealStage(travelerId, 'costs');
    }

    // Update transport section visibility (hide for local travel only)
    this._updateTransportSectionVisibility(travelerId);

    // Update cost displays for restored data
    this._updateTransportCalc(travelerId);
    this._updateTravelerCostDisplay(travelerId);

    // Hide summary for new travelers (they start expanded)
    this._setTravelerSummaryVisible(travelerId, false);
  };

  /**
   * Update transport calculation and display
   * Handles both cost-based (air/rail/rental) and mileage-based (private/gov) transport
   */
  Controller._updateTransportCalc = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const transportMode = traveler.transportMode || '';

    let primaryTransport = 0;

    if (transportMode === 'private' || transportMode === 'gov') {
      // Mileage-based calculation
      const rate = window.TravelRequest.getMileageRate(transportMode);
      const totalMiles = (traveler.milesToDeparture || 0) + (traveler.milesFromArrival || 0);
      primaryTransport = totalMiles * rate;

      // Update mileage calculation display
      const calcEl = document.getElementById(`tcTransportCalc_${travelerId}`);
      if (calcEl) {
        calcEl.textContent = `× $${rate.toFixed(3)} = $${primaryTransport.toFixed(2)}`;
      }

      // Store mileage cost (clear ticket cost)
      state.updateTraveler(travelerId, 'mileageCost', primaryTransport);
      state.updateTraveler(travelerId, 'ticketCost', 0);
    } else {
      // Cost-based (air, rail, rental)
      primaryTransport = traveler.ticketCost || 0;

      // Clear mileage cost
      state.updateTraveler(travelerId, 'mileageCost', 0);
      state.updateTraveler(travelerId, 'milesToDeparture', 0);
      state.updateTraveler(travelerId, 'milesFromArrival', 0);
    }

    // Add rental car cost if applicable (not shown when primary mode is 'rental')
    const rentalCarCost = (traveler.needsRentalCar && transportMode !== 'rental') ? (traveler.rentalCarCost || 0) : 0;
    const transportTotal = primaryTransport + rentalCarCost;

    // Update transport total display
    const totalEl = document.getElementById(`tcTransportTotal_${travelerId}`);
    if (totalEl) {
      totalEl.textContent = `$${transportTotal.toFixed(2)}`;
    }

    // Update transportation total in state
    state.updateTraveler(travelerId, 'transportationTotal', transportTotal);
  };

  Controller._initEmployeeAutocomplete = function(travelerId) {
    const self = this;
    const nameInput = document.getElementById(`tcEmployee_${travelerId}`);
    if (!nameInput) return;

    // If staffing data isn't loaded yet, wait for it
    if (!this._staffingData || this._staffingData.length === 0) {
      nameInput.placeholder = 'Loading...';
      // Retry after a short delay
      setTimeout(function() {
        if (self._staffingData && self._staffingData.length > 0) {
          self._setupEmployeeAutocomplete(travelerId, nameInput);
        } else {
          // Try again
          setTimeout(function() {
            self._setupEmployeeAutocomplete(travelerId, nameInput);
          }, 1000);
        }
      }, 500);
      return;
    }

    this._setupEmployeeAutocomplete(travelerId, nameInput);
  };

  Controller._setupEmployeeAutocomplete = function(travelerId, nameInput) {
    const self = this;

    if (!this._staffingData || this._staffingData.length === 0) {
      nameInput.placeholder = 'Type name...';
      return;
    }

    nameInput.placeholder = 'Search...';

    // Clean up existing instance if any
    if (this._autocompleteInstances[`traveler_name_${travelerId}`]) {
      this._autocompleteInstances[`traveler_name_${travelerId}`].destroy();
    }

    const employeeList = this._staffingData.map(emp => ({
      label: `${emp.employeeName} (${emp.orgCode || 'N/A'})`,
      value: emp.employeeName,
      data: emp
    }));

    const awInstance = new Awesomplete(nameInput, {
      list: employeeList,
      minChars: 2,
      autoFirst: true,
      maxItems: 10,
      filter: (text, input) => text.label.toLowerCase().includes(input.toLowerCase()),
      item: (text, input) => Awesomplete.ITEM(text.label, input),
      replace: function(text) { this.input.value = text.value; }
    });

    this._autocompleteInstances[`traveler_name_${travelerId}`] = awInstance;

    nameInput.addEventListener('awesomplete-selectcomplete', function(ev) {
      // Awesomplete doesn't preserve custom data property, so look up by value
      const selectedName = ev.text.value;
      const employeeData = self._staffingData.find(emp => emp.employeeName === selectedName);

      if (employeeData) {
        self._applyEmployeeData(travelerId, employeeData);
        self._updateTravelerHeaderDisplay(travelerId, employeeData);
      }
    });

    this._floatAwesomplete(awInstance, { minWidth: 220 });
  };

  Controller._updateTravelerHeaderDisplay = function(travelerId, employeeData) {
    const nameEl = document.getElementById(`tcName_${travelerId}`);
    const roleBuEl = document.getElementById(`tcRoleBu_${travelerId}`);
    if (nameEl) nameEl.textContent = employeeData.employeeName || 'New Traveler';

    // Update Role - BU display
    this._updateTravelerRoleBu(travelerId, employeeData);

    // Check if we can advance disclosure stage
    this._checkDisclosureProgress(travelerId);
  };

  /**
   * Update the Role - BU display in the header
   */
  Controller._updateTravelerRoleBu = function(travelerId, employeeData) {
    const roleBuEl = document.getElementById(`tcRoleBu_${travelerId}`);
    if (!roleBuEl) return;

    const lcatInput = document.getElementById(`tcLcat_${travelerId}`);

  /**
   * Recalculate per diem for a leg based on current date inputs
   * Updates the UI immediately using existing rates, then fetches new rates if needed
   */
  Controller._recalcLegPerDiem = function(travelerId, legId) {
    const state = window.TravelRequest.State;
    const leg = state.getLeg(legId);
    const traveler = state.getTraveler(travelerId);
    const legCost = traveler?.legCosts[legId] || {};

    if (!leg) return;

    // Get lodging dates (nights)
    const lodgingStart = legCost.lodgingStartDate || leg.startDate;
    const lodgingEnd = legCost.lodgingEndDate || leg.endDate;

    // Get M&IE dates (days)
    const mieStart = legCost.mieStartDate || leg.startDate;
    const mieEnd = legCost.mieEndDate || leg.endDate;

    // Calculate nights and days
    const msPerDay = 24 * 60 * 60 * 1000;

    let lodgingNights = 0;
    if (lodgingStart && lodgingEnd) {
      const start = new Date(lodgingStart);
      const end = new Date(lodgingEnd);
      lodgingNights = Math.max(0, Math.round((end - start) / msPerDay));
    }

    let mieDays = 0;
    if (mieStart && mieEnd) {
      const start = new Date(mieStart);
      const end = new Date(mieEnd);
      mieDays = Math.max(0, Math.round((end - start) / msPerDay) + 1);
    }

    // Get existing rates (if we have them)
    const lodgingRate = legCost.lodgingRate || 0;
    const mieRate = legCost.mieRate || 0;

    // Determine if this is a GSA location (CONUS US)
    // GSA rates vary by month, so we must re-fetch when dates change
    const isUS = !leg.country || leg.country === 'United States' || leg.country === 'USA';
    const isOCONUS = isUS && TravelUtils?.isOCONUS?.(leg.state);
    const isGSA = isUS && !isOCONUS;

    // For GSA: Always re-fetch to get accurate day-by-day calculation with monthly rate variations
    // For DOS/DoD: Simple rate × nights is fine (rates are seasonal, not monthly)
    if (isGSA && leg.city && lodgingStart && lodgingEnd) {
      // Update nights/days in state first (for display)
      state.updateTravelerLegCost(travelerId, legId, 'lodgingNights', lodgingNights);
      state.updateTravelerLegCost(travelerId, legId, 'mieDays', mieDays);

      // Fetch fresh rates from GSA API (will calculate day-by-day totals)
      this._fetchLegPerDiem(travelerId, legId);
      return;
    }

    // For DOS/DoD: Use simple rate × nights calculation
    const lodgingCalculated = lodgingRate * lodgingNights;

    // M&IE: 75% first and last day, 100% middle days (via TravelDateService)
    const mieResult = TravelDateService.calculateMieWithReduction(mieDays, mieRate);
    const mieCalculated = mieResult.total;

    // Update state - the state's updateTravelerLegCost handles override logic
    state.updateTravelerLegCost(travelerId, legId, 'lodgingNights', lodgingNights);
    state.updateTravelerLegCost(travelerId, legId, 'mieDays', mieDays);
    state.updateTravelerLegCost(travelerId, legId, 'lodgingCalculated', lodgingCalculated);
    state.updateTravelerLegCost(travelerId, legId, 'mieCalculated', mieCalculated);

    // Update the UI immediately
    this._updateLegCostDisplay(travelerId, legId);
    this._updateTravelerCostDisplay(travelerId);
    this._updateTravelersTotal();

    // If we don't have rates yet, fetch them (for DOS/DoD)
    if (lodgingRate === 0 && mieRate === 0 && leg.city) {
      this._fetchLegPerDiem(travelerId, legId);
    }
  };

  // ==========================================================================

  Controller._fetchAllLegPerDiem = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);

    traveler.attendingLegs.forEach(legId => {
      const legCost = traveler.legCosts[legId];

      // Skip local travel legs - no per diem for local travel
      if (legCost && legCost.isLocalTravel) {
        return;
      }

      // If we already have rates cached, just update the display without fetching
      if (legCost && (legCost.lodgingRate > 0 || legCost.mieRate > 0)) {
        this._updateLegCostDisplay(travelerId, legId);
      } else {
        // No rates yet - fetch them
        this._fetchLegPerDiem(travelerId, legId);
      }
    });

    // Update traveler totals display (uses cached state values)
    this._updateTravelerCostDisplay(travelerId);
  };

  Controller._fetchLegPerDiem = async function(travelerId, legId) {
    const self = this;
    const state = window.TravelRequest.State;
    const leg = state.getLeg(legId);
    const traveler = state.getTraveler(travelerId);
    const legCost = traveler?.legCosts[legId] || {};

    if (!leg || !leg.city) {
      console.warn('[PerDiem] Skipping fetch - missing leg data:', { legId, hasLeg: !!leg, city: leg?.city });
      return;
    }

    // Skip local travel legs - no per diem for local travel
    if (legCost.isLocalTravel) {
      return;
    }

    // Get SEPARATE dates for lodging and M&IE
    const lodgingStart = legCost.lodgingStartDate || leg.startDate;
    const lodgingEnd = legCost.lodgingEndDate || leg.endDate;
    const mieStart = legCost.mieStartDate || leg.startDate;
    const mieEnd = legCost.mieEndDate || leg.endDate;

    if (!lodgingStart || !lodgingEnd) {
      console.warn('[PerDiem] Skipping fetch - missing dates:', { legId, lodgingStart, lodgingEnd, legStartDate: leg.startDate, legEndDate: leg.endDate });
      return;
    }

    console.log('[PerDiem] Fetching rates for:', { travelerId, legId, city: leg.city, state: leg.state, country: leg.country, lodgingStart, lodgingEnd, mieStart, mieEnd });

    try {
      // Fetch rates using LODGING dates (to get the rate lookup)
      const rateResult = await TravelCostService.getPerDiemRates({
        country: leg.country,
        state: leg.state,
        city: leg.city,
        startDate: lodgingStart,
        endDate: lodgingEnd
      });

      if (!rateResult || !rateResult.success) {
        console.error('[PerDiem] Fetch failed:', rateResult?.error, rateResult);
        return;
      }

      console.log('[PerDiem] Rates received:', { legId, lodgingRate: rateResult.lodgingRate, mieRate: rateResult.mieRate, lodgingTotal: rateResult.lodgingTotal });

      // Calculate M&IE SEPARATELY using M&IE dates (not lodging dates)
      const msPerDay = 24 * 60 * 60 * 1000;
      let mieDays = 0;
      if (mieStart && mieEnd) {
        const start = new Date(mieStart);
        const end = new Date(mieEnd);
        mieDays = Math.max(0, Math.round((end - start) / msPerDay) + 1);
      }

      // Calculate M&IE with 75% first/last day reduction
      const mieRate = rateResult.mieRate || 0;
      const mieResult = TravelDateService.calculateMieWithReduction(mieDays, mieRate);

      // Update lodging from server (uses lodging dates)
      // Update M&IE calculated locally (uses M&IE dates)
      state.updateTravelerLegPerDiem(travelerId, legId, {
        lodging: {
          rate: rateResult.lodgingRate || 0,
          averageRate: rateResult.lodgingRate || 0,
          nights: rateResult.nights || 0,
          total: rateResult.lodgingTotal || 0,
          breakdown: rateResult.breakdown,
          ratesVaried: rateResult.ratesVaried || false
        },
        mie: {
          dailyRate: mieRate,
          rate: mieRate,
          days: mieDays,
          total: mieResult.total
        }
      });

      // Update the display
      self._updateLegCostDisplay(travelerId, legId);
      self._updateTravelerCostDisplay(travelerId);

    } catch (error) {
      console.error('[PerDiem] Fetch error:', error);
    }
  };

  Controller._updateLegCostDisplay = function(travelerId, legId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const legCost = traveler?.legCosts[legId];
    if (!legCost) return;

    // Update lodging calculation display
    var isLodgingNa = this._isNaOverride(legCost, 'lodging');
    const lodgingCalcEl = document.getElementById(`tcLodgingCalc_${travelerId}_${legId}`);
    if (lodgingCalcEl) {
      lodgingCalcEl.textContent = this._formatLodgingCalc(legCost);
      lodgingCalcEl.classList.toggle('tc__perdiem-calc--hidden', legCost.lodgingOverride || isLodgingNa);
    }

    // Update lodging total
    const lodgingEl = document.getElementById(`tcLodging_${travelerId}_${legId}`);
    if (lodgingEl) {
      if (isLodgingNa) {
        lodgingEl.textContent = 'N/A';
        lodgingEl.classList.add('tc__perdiem-amount--na');
        lodgingEl.classList.remove('tc__perdiem-amount--override');
      } else {
        lodgingEl.textContent = `$${(legCost.lodgingTotal || 0).toFixed(2)}`;
        lodgingEl.classList.remove('tc__perdiem-amount--na');
        lodgingEl.classList.toggle('tc__perdiem-amount--override', legCost.lodgingOverride);
      }
    }

    // Update M&IE calculation display with 75% first/last day breakdown
    var isMieNa = this._isNaOverride(legCost, 'mie');
    const mieCalcEl = document.getElementById(`tcMieCalc_${travelerId}_${legId}`);
    if (mieCalcEl) {
      mieCalcEl.textContent = this._formatMieCalc(legCost.mieDays || 0, legCost.mieRate || 0);
      mieCalcEl.classList.toggle('tc__perdiem-calc--hidden', legCost.mieOverride || isMieNa);
    }

    // Update M&IE total
    const mieEl = document.getElementById(`tcMie_${travelerId}_${legId}`);
    if (mieEl) {
      if (isMieNa) {
        mieEl.textContent = 'N/A';
        mieEl.classList.add('tc__perdiem-amount--na');
        mieEl.classList.remove('tc__perdiem-amount--override');
      } else {
        mieEl.textContent = `$${(legCost.mieTotal || 0).toFixed(2)}`;
        mieEl.classList.remove('tc__perdiem-amount--na');
        mieEl.classList.toggle('tc__perdiem-amount--override', legCost.mieOverride);
      }
    }

    // Update leg subtotal
    const subtotalEl = document.getElementById(`tcLegSubtotal_${travelerId}_${legId}`);
    if (subtotalEl) subtotalEl.textContent = `$${(legCost.legSubtotal || 0).toFixed(2)}`;
  };

  Controller._updateTravelerCostDisplay = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    if (!traveler) return;

    // Force recalculation (sets traveler.subtotal, localTravelTotal, etc.)
    state._recalculateTravelerCosts(traveler, 'display');

    // Transport total
    const transportTotalEl = document.getElementById(`tcTransportTotal_${travelerId}`);
    if (transportTotalEl) transportTotalEl.textContent = `$${(traveler.transportationTotal || 0).toFixed(2)}`;

    // Grand breakdown - show/hide based on whether values are > 0
    const gtTransport = document.getElementById(`tcGrandTransport_${travelerId}`);
    const gtLodging = document.getElementById(`tcGrandLodging_${travelerId}`);
    const gtMie = document.getElementById(`tcGrandMie_${travelerId}`);
    const gtLocal = document.getElementById(`tcGrandLocal_${travelerId}`);
    const gtOther = document.getElementById(`tcGrandOther_${travelerId}`);
    const gtTotal = document.getElementById(`tcGrandTotal_${travelerId}`);

    const transportVal = traveler.transportationTotal || 0;
    const lodgingVal = traveler.lodgingTotal || 0;
    const mieVal = traveler.mieTotal || 0;
    const localVal = traveler.localTravelTotal || 0;
    const otherVal = traveler.otherTotal || 0;

    // Update values and show/hide parent span based on value
    if (gtTransport) {
      gtTransport.textContent = `$${transportVal.toFixed(2)}`;
      gtTransport.parentElement.classList.toggle('hidden', transportVal <= 0);

    if (gtLodging) {
      gtLodging.textContent = `$${lodgingVal.toFixed(2)}`;
      gtLodging.parentElement.classList.toggle('hidden', lodgingVal <= 0);
    }
    if (gtMie) {
      gtMie.textContent = `$${mieVal.toFixed(2)}`;
      gtMie.parentElement.classList.toggle('hidden', mieVal <= 0);
    }
    if (gtLocal) {
      gtLocal.textContent = `$${localVal.toFixed(2)}`;
      gtLocal.parentElement.classList.toggle('hidden', localVal <= 0);
    }
    if (gtOther) {
      gtOther.textContent = `$${otherVal.toFixed(2)}`;
      gtOther.parentElement.classList.toggle('hidden', otherVal <= 0);
    }

    if (gtTotal) gtTotal.textContent = `$${(traveler.subtotal || 0).toFixed(2)}`;

    // Header total
    const headerTotal = document.getElementById(`tcTotal_${travelerId}`);
    if (headerTotal) headerTotal.textContent = `$${(traveler.subtotal || 0).toFixed(2)}`;

    // Update summary
    this._updateTravelerSummary(travelerId);

  /**
   * Update the collapsed summary line (transport mode + destinations + costs)
   * Properly separates local vs non-local travel destinations
   */
  Controller._updateTravelerSummary = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const summaryEl = document.getElementById(`tcSummary_${travelerId}`);
    if (!summaryEl || !traveler) return;

    const legs = state.getLegs();
    const attendingLegs = traveler.attendingLegs || [];
    const legCosts = traveler.legCosts || {};

    // Separate local vs non-local destinations
    const localDestinations = [];
    const nonLocalDestinations = [];

    legs.filter(leg => attendingLegs.includes(leg.id)).forEach(leg => {
      const dest = leg.city || leg.state;
      if (!dest) return;

      const isLocal = legCosts[leg.id]?.isLocalTravel || false;
      if (isLocal) {
        localDestinations.push(dest);
      } else {
        nonLocalDestinations.push(dest);
      }
    });

    // Build transport mode label
    const transportLabels = {
      'air': 'Air',
      'rail': 'Rail',
      'rental': 'Rental',
      'private': 'POV',
      'gov': 'GOV'
    };
    const transportMode = traveler.transportMode || '';
    const transportLabel = transportLabels[transportMode] || '';

    // Build summary parts
    const summaryParts = [];

    // Non-local destinations with transport mode
    if (nonLocalDestinations.length > 0) {
      const displayDests = nonLocalDestinations.slice(0, 2);
      if (nonLocalDestinations.length > 2) {
        displayDests.push(`+${nonLocalDestinations.length - 2}`);
      }
      summaryParts.push(`${transportLabel} · ${displayDests.join(', ')}`);
    }

    // Local destinations
    if (localDestinations.length > 0) {
      const displayDests = localDestinations.slice(0, 2);
      if (localDestinations.length > 2) {
        displayDests.push(`+${localDestinations.length - 2}`);
      }
      summaryParts.push(`Local · ${displayDests.join(', ')}`);
    }

    // Cost breakdown (compact format) - use state values
    const costParts = [];
    const transportCost = traveler.transportationTotal || 0;
    const lodgingTotal = traveler.lodgingTotal || 0;
    const mieTotal = traveler.mieTotal || 0;
    const localTravelTotal = traveler.localTravelTotal || 0;

    // Show costs for both local and non-local
    if (transportCost > 0) {
      costParts.push(`$${Math.round(transportCost)} trans`);
    }
    if (lodgingTotal > 0) {
      costParts.push(`$${Math.round(lodgingTotal)} lodging`);
    }
    if (mieTotal > 0) {
      costParts.push(`$${Math.round(mieTotal)} M&IE`);
    }
    if (localTravelTotal > 0) {
      costParts.push(`$${Math.round(localTravelTotal)} local`);
    }

    // Combine parts with separator
    let summary = summaryParts.join(' | ');
    if (costParts.length > 0) {
      summary += ' | ' + costParts.join(' · ');
    }

    summaryEl.textContent = summary || 'No destinations';
  };

  // ==========================================================================
  // PROGRESSIVE DISCLOSURE
  // ==========================================================================

  /**
   * Determine disclosure stage based on traveler data
   * Stage 1: Initial - employee + funding + justification visible
   * Stage 2: Employee selected - show details row (Role, Duty Loc, BU)
   * Stage 3: Employee + funding + justification filled - show transport
   * Stage 4: Transport interacted - show per diem & totals
   */
  Controller._getDisclosureStage = function(traveler) {
    const hasEmployee = traveler.employeeName || traveler.employeeId;
    const hasFunding = !!traveler.isClientPaid;
    const hasJustification = !!traveler.roleJustification;
    const hasTransportData = traveler.ticketCost > 0 || traveler.milesToDeparture > 0 || traveler.milesFromArrival > 0;

    // Check if all legs are local travel (no transport section needed)
    const allLegsLocal = this._allLegsAreLocalTravel ? this._allLegsAreLocalTravel(traveler) : false;

    // Stage 4: Has transport data OR all legs are local (costs section visible)
    if (hasEmployee && hasFunding && hasJustification && (hasTransportData || allLegsLocal)) {
      return 4;
    }

    // Stage 3: Has employee + funding + justification (transport visible)
    if (hasEmployee && hasFunding && hasJustification) {
      return 3;
    }

    // Stage 2: Has employee selected (details visible)
    if (hasEmployee) {
      return 2;
    }

    // Stage 1: Initial state
    return 1;
  };

  /**
   * Update disclosure stage for a traveler card
   * Reveals sections based on completed data
   */
  Controller._updateDisclosureStage = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    if (!traveler) return;

    const card = this._elements.travelersContainer?.querySelector(`[data-traveler-id="${travelerId}"]`);
    if (!card) return;

    const newStage = this._getDisclosureStage(traveler);
    const currentStage = parseInt(card.dataset.disclosureStage) || 1;

    // Only advance stages, don't go backwards (user can still edit previous sections)
    if (newStage <= currentStage) return;

    card.dataset.disclosureStage = newStage;

    // Animate newly revealed sections
    if (newStage >= 2) {
      this._revealStage(travelerId, 'details');
    }
    if (newStage >= 3) {
      this._revealStage(travelerId, 'transport');
    }
    if (newStage >= 4) {
      this._revealStage(travelerId, 'costs');
    }
  };

  /**
   * Reveal a disclosure stage with animation
   * Stage 2 uses reveal fields (Role, Duty Loc, BU) via CSS data-attribute
   * Stages 3-4 use stage wrapper divs
   */
  Controller._revealStage = function(travelerId, stageName) {
    // Stage 2 (details) is handled via CSS data-disclosure-stage attribute
    // which automatically shows .tc__reveal fields
    if (stageName === 'details') return;

    // Stages 3-4 use wrapper divs
    const stageEl = document.getElementById(`tcStage${stageName.charAt(0).toUpperCase() + stageName.slice(1)}_${travelerId}`);
    if (!stageEl || stageEl.classList.contains('tc__stage--revealed')) return;

    // Add revealed class for CSS transition
    stageEl.classList.add('tc__stage--revealed');

    // Show the travelers total bar when costs stage is revealed
    if (stageName === 'costs' && this._elements.travelersTotal) {
      this._elements.travelersTotal.classList.remove('hidden');
    }
  };

  /**
   * Check disclosure requirements and advance if ready
   * Called after field changes to potentially reveal next section
   *
   * Progressive disclosure flow:
   * - Stage 1: Employee + Funding + Justification (always visible)
   * - Stage 2: Details (Role, Duty Loc, BU) - after employee selected
   * - Stage 3: Transport - after employee + funding + justification filled
   *            (skipped if all legs are local travel)
   * - Stage 4: Costs - after entering transport cost/mileage, OR immediately
   *            after Stage 2 if all legs are local travel
   */
  Controller._checkDisclosureProgress = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    if (!traveler) return;

    const card = this._elements.travelersContainer?.querySelector(`[data-traveler-id="${travelerId}"]`);
    if (!card) return;

    const currentStage = parseInt(card.dataset.disclosureStage) || 1;
    const hasEmployee = traveler.employeeName || traveler.employeeId;
    const hasFunding = !!traveler.isClientPaid;
    const hasJustification = !!traveler.roleJustification;
    const hasTransportValue = (traveler.ticketCost > 0) || (traveler.milesToDeparture > 0) || (traveler.milesFromArrival > 0);

    // Check if all legs are local travel (transport section hidden)
    const allLegsLocal = this._allLegsAreLocalTravel ? this._allLegsAreLocalTravel(traveler) : false;

    // Stage 2: Details row (after employee selected)
    if (currentStage < 2 && hasEmployee) {
      card.dataset.disclosureStage = 2;
      this._revealStage(travelerId, 'details');
    }

    // Stage 3: Transport (after employee + funding + justification)
    // Skip this stage if all legs are local travel
    if (currentStage < 3 && hasEmployee && hasFunding && hasJustification) {
      if (allLegsLocal) {
        // Skip transport stage, go directly to costs
        card.dataset.disclosureStage = 4;
        this._revealStage(travelerId, 'costs');
      } else {
        card.dataset.disclosureStage = 3;
        this._revealStage(travelerId, 'transport');
      }
    }

    // Stage 4: Costs (after entering a transport cost or mileage value)
    // Or if we're at stage 3 and all legs become local travel
    if (currentStage < 4 && currentStage >= 3) {
      if (hasTransportValue || allLegsLocal) {
        card.dataset.disclosureStage = 4;
        this._revealStage(travelerId, 'costs');
      }
    }
  };

  // ==========================================================================
  // EXPAND/COLLAPSE
  // ==========================================================================

  Controller._toggleTravelerExpanded = function(travelerId) {
    const state = window.TravelRequest.State;
    state.toggleTravelerExpanded(travelerId);

    const traveler = state.getTraveler(travelerId);
    const body = document.getElementById(`tcBody_${travelerId}`);
    const card = this._elements.travelersContainer?.querySelector(`[data-traveler-id="${travelerId}"]`);

    if (body && card) {
      const toggleIcon = card.querySelector('.tc__toggle i');
      if (traveler.isExpanded) {
        body.classList.remove('hidden');
        if (toggleIcon) toggleIcon.className = 'fas fa-chevron-down';
        // Hide summary when expanded - details are visible in the body
        this._setTravelerSummaryVisible(travelerId, false);
      } else {
        body.classList.add('hidden');
        if (toggleIcon) toggleIcon.className = 'fas fa-chevron-right';
        // Show summary when collapsed
        this._updateTravelerSummary(travelerId);
        this._setTravelerSummaryVisible(travelerId, true);
      }
    }
  };

  /**
   * Show or hide traveler summary elements in the header
   */
  Controller._setTravelerSummaryVisible = function(travelerId, visible) {
    const summaryEl = document.getElementById(`tcSummary_${travelerId}`);
    const totalEl = document.getElementById(`tcTotal_${travelerId}`);

    if (summaryEl) summaryEl.classList.toggle('hidden', !visible);
    if (totalEl) totalEl.classList.toggle('hidden', !visible);
  };

})();
</script>
