<!-- client/controllers/form/travelRequestTravelers.html -->
<!-- Travelers Module: Compact leg-based cost table design -->
<script>
(function() {
  'use strict';

  const Controller = window.TravelRequest.Controller;

  // ==========================================================================
  // TRAVELERS MODULE
  // Extends Controller with traveler management functionality
  // ==========================================================================

  /**
   * Initialize travelers module
   */
  Controller._initTravelers = function() {
    const self = this;

    // Bind add traveler buttons
    if (this._elements.btnAddTraveler) {
      this._elements.btnAddTraveler.addEventListener('click', () => self._handleAddTraveler());
    }
    if (this._elements.emptyStateAddTraveler) {
      this._elements.emptyStateAddTraveler.addEventListener('click', () => self._handleAddTraveler());
    }

    // Update empty state visibility
    this._updateTravelersEmptyState();
  };

  // ==========================================================================
  // TRAVELER MANAGEMENT
  // ==========================================================================

  /**
   * Validate a traveler has completed required fields
   * Returns { valid: boolean, missing: string[] }
   */
  Controller._validateTraveler = function(traveler) {
    const missing = [];

    if (!traveler.employeeName && !traveler.employeeId) {
      missing.push('employee');
    }
    if (!traveler.isClientPaid) {
      missing.push('funding');
    }
    if (!traveler.roleJustification) {
      missing.push('justification');
    }

    // Transport validation: check based on mode (skip if local-travel-only)
    const transportMode = traveler.transportMode || '';
    const isMileageMode = transportMode === 'private' || transportMode === 'gov';

    if (isMileageMode) {
      // Mileage modes require miles to be entered (0 is not valid for mileage)
      if (!traveler.milesToDeparture && !traveler.milesFromArrival) {
        missing.push('transport');
      }
    } else {
      // Cost-based modes (air, rail, rental): $0 is valid, undefined/null is not
      if (traveler.ticketCost === undefined || traveler.ticketCost === null || traveler.ticketCost === '') {
        missing.push('transport');
      }
    }

    return {
      valid: missing.length === 0,
      missing: missing
    };
  };

  /**
   * Validate all existing travelers before adding a new one
   * Returns the first incomplete traveler or null if all valid
   */
  Controller._validateAllTravelers = function() {
    const state = window.TravelRequest.State;
    const travelers = state.getTravelers();

    for (const traveler of travelers) {
      const result = this._validateTraveler(traveler);
      if (!result.valid) {
        return { traveler, missing: result.missing };
      }
    }
    return null;
  };

  /**
   * Collapse all traveler cards
   */
  Controller._collapseAllTravelers = function() {
    const state = window.TravelRequest.State;
    const travelers = state.getTravelers();

    travelers.forEach(traveler => {
      if (traveler.isExpanded) {
        state.updateTraveler(traveler.id, 'isExpanded', false);
        const body = document.getElementById(`tcBody_${traveler.id}`);
        const card = this._elements.travelersContainer?.querySelector(`[data-traveler-id="${traveler.id}"]`);
        if (body) body.classList.add('hidden');
        if (card) {
          const toggleIcon = card.querySelector('.tc__toggle i');
          if (toggleIcon) toggleIcon.className = 'fas fa-chevron-right';
        }
        // Update and show summary when collapsing
        this._updateTravelerSummary(traveler.id);
        this._setTravelerSummaryVisible(traveler.id, true);
      }
    });
  };

  /**
   * Highlight incomplete fields on a traveler card
   */
  Controller._highlightIncompleteFields = function(travelerId, missingFields) {
    const card = this._elements.travelersContainer?.querySelector(`[data-traveler-id="${travelerId}"]`);
    if (!card) return;

    // Remove any existing highlights
    card.querySelectorAll('.tc__field--error').forEach(el => el.classList.remove('tc__field--error'));

    // Add error class to missing fields
    missingFields.forEach(field => {
      let targetEl;
      switch(field) {
        case 'employee':
          targetEl = document.getElementById(`tcEmployee_${travelerId}`)?.closest('.tc__field');
          break;
        case 'funding':
          targetEl = card.querySelector('.tc__funding');
          break;
        case 'justification':
          targetEl = card.querySelector('.tc__justification');
          break;
        case 'transport':
          targetEl = card.querySelector('.tc__transport-inputs');
          break;
      }
      if (targetEl) targetEl.classList.add('tc__field--error');
    });

    // Remove highlights after a few seconds
    setTimeout(() => {
      card.querySelectorAll('.tc__field--error').forEach(el => el.classList.remove('tc__field--error'));
    }, 3000);
  };

  Controller._handleAddTraveler = function() {
    const state = window.TravelRequest.State;

    // Validate existing travelers first
    const incomplete = this._validateAllTravelers();
    if (incomplete) {
      // Expand the incomplete traveler and highlight missing fields
      const { traveler, missing } = incomplete;
      if (!traveler.isExpanded) {
        this._toggleTravelerExpanded(traveler.id);
      }
      this._highlightIncompleteFields(traveler.id, missing);
      return; // Don't add new traveler
    }

    // Collapse all existing travelers
    this._collapseAllTravelers();

    // Add new traveler
    const traveler = state.addTraveler();
    this._renderTravelerCard(traveler);
    this._updateTravelersEmptyState();
    this._updateTravelersTotal();

    // Scroll to the new card
    const newCard = this._elements.travelersContainer?.querySelector(`[data-traveler-id="${traveler.id}"]`);
    if (newCard) {
      newCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  };

  Controller._applyEmployeeData = function(travelerId, employeeData) {
    const state = window.TravelRequest.State;
    state.updateTraveler(travelerId, 'employeeId', employeeData.employeeId || '');
    state.updateTraveler(travelerId, 'employeeName', employeeData.employeeName || '');
    state.updateTraveler(travelerId, 'email', employeeData.email || '');
    state.updateTraveler(travelerId, 'orgCode', employeeData.orgCode || '');
    state.updateTraveler(travelerId, 'businessUnit', employeeData.bu || '');
    state.updateTraveler(travelerId, 'lcat', employeeData.lcat || '');
    state.updateTraveler(travelerId, 'ddName', employeeData.ddName || '');
    state.updateTraveler(travelerId, 'ddEmail', employeeData.ddEmail || '');
    state.updateTraveler(travelerId, 'dutyLocation', employeeData.dutyLocation || '');

    // Duty station for local travel calculation (address from location codes sheet)
    state.updateTraveler(travelerId, 'dutyStationAddress', employeeData.dutyStationAddress || '');
    state.updateTraveler(travelerId, 'dutyStationCity', employeeData.dutyStationCity || '');
    state.updateTraveler(travelerId, 'dutyStationState', employeeData.dutyStationState || '');
    state.updateTraveler(travelerId, 'dutyLocationCode', employeeData.locationCode || '');

    // Update the employee info display fields
    this._updateEmployeeInfoDisplay(travelerId, employeeData);

    // Check local travel status for all legs
    this._checkLocalTravelForTraveler(travelerId);
  };

  Controller._updateEmployeeInfoDisplay = function(travelerId, employeeData) {
    const lcatInput = document.getElementById(`tcLcat_${travelerId}`);
    const dutyLocEl = document.getElementById(`tcDutyLoc_${travelerId}`);
    const buEl = document.getElementById(`tcBU_${travelerId}`);

    if (lcatInput) lcatInput.value = employeeData.lcat || '';
    if (dutyLocEl) dutyLocEl.textContent = employeeData.dutyLocation || '-';
    if (buEl) buEl.textContent = employeeData.bu || '-';
  };

  Controller._removeTraveler = function(travelerId) {
    const state = window.TravelRequest.State;
    if (state.removeTraveler(travelerId)) {
      const card = this._elements.travelersContainer.querySelector(`[data-traveler-id="${travelerId}"]`);
      if (card) card.remove();
      this._cleanupTravelerAutocomplete(travelerId);
      this._cleanupTravelerDatePickers(travelerId);
      this._updateTravelersEmptyState();
      this._updateTravelersTotal();
    }
  };

  Controller._cleanupTravelerAutocomplete = function(travelerId) {
    const key = `traveler_name_${travelerId}`;
    if (this._autocompleteInstances[key]) {
      this._autocompleteInstances[key].destroy();
      delete this._autocompleteInstances[key];
    }
  };

  Controller._cleanupTravelerDatePickers = function(travelerId) {
    // Clean up all date pickers for this traveler's legs
    const keysToDelete = Object.keys(this._datePickers).filter(key => key.includes(`_${travelerId}_`));
    keysToDelete.forEach(key => {
      if (this._datePickers[key] && this._datePickers[key].destroy) {
        this._datePickers[key].destroy();
      }
      delete this._datePickers[key];
    });
  };

  Controller._updateTravelersEmptyState = function() {
    const state = window.TravelRequest.State;
    const hasTravelers = state.getTravelerCount() > 0;
    if (this._elements.travelersEmptyState) {
      this._elements.travelersEmptyState.classList.toggle('hidden', hasTravelers);
    }
    if (this._elements.btnAddTraveler) {
      this._elements.btnAddTraveler.classList.toggle('hidden', !hasTravelers);
    }
    if (this._elements.travelersTotal) {
      // Hide entire bar until at least one traveler reaches costs stage (after funding + justification)
      const showTotalBar = hasTravelers && this._anyTravelerAtCostsStage();
      this._elements.travelersTotal.classList.toggle('hidden', !showTotalBar);
    }
  };

  /**
   * Refresh all traveler cards (called when returning to Travelers step)
   * Re-renders cards to reflect any changes in legs
   */
  Controller._refreshTravelerCards = function() {
    const state = window.TravelRequest.State;
    const travelers = state.getTravelers();

    if (travelers.length === 0) return;

    // Clear existing cards and re-render
    if (this._elements.travelersContainer) {
      // Remove existing traveler cards (class is 'tc', not 'traveler-card')
      const existingCards = this._elements.travelersContainer.querySelectorAll('.tc[data-traveler-id]');
      existingCards.forEach(card => {
        const travelerId = card.dataset.travelerId;
        this._cleanupTravelerAutocomplete(travelerId);
        card.remove();
      });

      // Re-render all travelers
      travelers.forEach(traveler => {
        this._renderTravelerCard(traveler);
      });

      // Update totals and bar visibility based on disclosure stage
      this._updateTravelersTotal();
      if (this._elements.travelersTotal) {
        this._elements.travelersTotal.classList.toggle('hidden', !this._anyTravelerAtCostsStage());
      }
    }
  };

  Controller._updateTravelersTotal = function() {
    const state = window.TravelRequest.State;
    const travelers = state.getTravelers();
    const count = travelers.length;

    // Sum category totals from state (already calculated by _recalculateTravelerCosts)
    let transportTotal = 0;
    let lodgingTotal = 0;
    let mieTotal = 0;
    let localTotal = 0;
    let otherTotal = 0;

    travelers.forEach(function(traveler) {
      transportTotal += traveler.transportationTotal || 0;
      lodgingTotal += traveler.lodgingTotal || 0;
      mieTotal += traveler.mieTotal || 0;
      localTotal += traveler.localTravelTotal || 0;
      otherTotal += traveler.otherTotal || 0;
    });

    const grandTotal = transportTotal + lodgingTotal + mieTotal + localTotal + otherTotal;

    if (this._elements.travelersTotal) {
      const countEl = this._elements.travelersTotal.querySelector('.travelers-total__count');
      const transportEl = document.getElementById('travelersTotalTransport');
      const lodgingEl = document.getElementById('travelersTotalLodging');
      const mieEl = document.getElementById('travelersTotalMie');
      const localEl = document.getElementById('travelersTotalLocal');
      const otherEl = document.getElementById('travelersTotalOther');
      const valueEl = this._elements.travelersTotal.querySelector('.travelers-total__value');

      if (countEl) countEl.textContent = `${count} traveler${count !== 1 ? 's' : ''}`;

      // Update values and show/hide parent span based on value > 0
      if (transportEl) {
        transportEl.textContent = state.formatCurrency(transportTotal);
        transportEl.parentElement.classList.toggle('hidden', transportTotal <= 0);
      }
      if (lodgingEl) {
        lodgingEl.textContent = state.formatCurrency(lodgingTotal);
        lodgingEl.parentElement.classList.toggle('hidden', lodgingTotal <= 0);
      }
      if (mieEl) {
        mieEl.textContent = state.formatCurrency(mieTotal);
        mieEl.parentElement.classList.toggle('hidden', mieTotal <= 0);
      }
      if (localEl) {
        localEl.textContent = state.formatCurrency(localTotal);
        localEl.parentElement.classList.toggle('hidden', localTotal <= 0);
      }
      if (otherEl) {
        otherEl.textContent = state.formatCurrency(otherTotal);
        otherEl.parentElement.classList.toggle('hidden', otherTotal <= 0);
      }
      if (valueEl) valueEl.textContent = state.formatCurrency(grandTotal);
    }
  };

  /**
   * Check if any traveler has reached the costs disclosure stage
   */
  Controller._anyTravelerAtCostsStage = function() {
    if (!this._elements.travelersContainer) return false;
    const cards = this._elements.travelersContainer.querySelectorAll('.tc[data-traveler-id]');
    for (const card of cards) {
      const stage = parseInt(card.dataset.disclosureStage) || 1;
      if (stage >= 4) return true;
    }
    return false;
  };

  // ==========================================================================
  // TRAVELER CARD RENDERING - Compact Table Design
  // ==========================================================================

  Controller._renderTravelerCard = function(traveler) {
    const state = window.TravelRequest.State;
    const legs = state.getLegs();
    // Get mileage rate based on transport mode (private or gov vehicle)
    const transportMode = traveler.transportMode || '';
    const mileageRate = window.TravelRequest.getMileageRate(transportMode === 'gov' ? 'gov' : 'private');

    // Determine initial disclosure stage based on existing data
    const disclosureStage = this._getDisclosureStage(traveler);

    const cardHtml = `
      <div class="tc" data-traveler-id="${traveler.id}" data-disclosure-stage="${disclosureStage}">
        <!-- Header -->
        <div class="tc__header">
          <div class="tc__info">
            <i aria-hidden="true" class="fas fa-user tc__icon"></i>
            <span class="tc__name" id="tcName_${traveler.id}">${traveler.employeeName || 'New Traveler'}</span>
            <span class="tc__role-bu" id="tcRoleBu_${traveler.id}"></span>
            <span class="tc__summary" id="tcSummary_${traveler.id}"></span>
          </div>
          <div class="tc__actions">
            <span class="tc__total" id="tcTotal_${traveler.id}">$0.00</span>
            <button type="button" class="tc__toggle" onclick="TravelRequest.Controller._toggleTravelerExpanded('${traveler.id}')" title="Toggle">
              <i aria-hidden="true" class="fas fa-chevron-down"></i>
            </button>
            <button type="button" class="tc__remove" onclick="TravelRequest.Controller._removeTraveler('${traveler.id}')" title="Remove">
              <i aria-hidden="true" class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <!-- Body -->
        <div class="tc__body" id="tcBody_${traveler.id}">
          <!-- Employee & Classification Section -->
          <div class="tc__stage tc__stage--employee">
            <div class="tc__details">
              <!-- Left Column: Employee Info (2x2 grid) -->
              <div class="tc__details-left">
                <div class="tc__details-grid">
                  <div class="tc__field tc__field--name">
                    <label>Employee</label>
                    <input type="text" class="form-control form-control-sm traveler-name-input"
                           id="tcEmployee_${traveler.id}" placeholder="Search..." autocomplete="off"
                           value="${traveler.employeeName || ''}">
                  </div>
                  <!-- Role field (revealed after employee selected) -->
                  <div class="tc__field tc__field--lcat tc__reveal" id="tcRevealRole_${traveler.id}">
                    <label>Role</label>
                    <input type="text" class="form-control form-control-sm" id="tcLcat_${traveler.id}"
                           placeholder="PM, COR..." value="${traveler.lcat || ''}">
                  </div>
                  <!-- Duty Location (revealed after employee selected) -->
                  <div class="tc__field tc__field--info tc__reveal" id="tcRevealDuty_${traveler.id}">
                    <label>Duty Location</label>
                    <span class="tc__info-value" id="tcDutyLoc_${traveler.id}">${traveler.dutyLocation || '-'}</span>
                  </div>
                  <!-- BU (revealed after employee selected) -->
                  <div class="tc__field tc__field--info tc__reveal" id="tcRevealBU_${traveler.id}">
                    <label>BU</label>
                    <span class="tc__info-value" id="tcBU_${traveler.id}">${traveler.businessUnit || '-'}</span>
                  </div>
                </div>
              </div>
              <!-- Right Column: Funding & Justification (revealed after employee selected) -->
              <div class="tc__details-right tc__reveal">
                <div class="tc__funding">
                  <label class="tc__field-label">Funding</label>
                  <div class="tc__toggle-group">
                    <label class="tc__toggle ${traveler.isClientPaid === 'client' ? 'tc__toggle--active' : ''}">
                      <input type="radio" name="tcFunding_${traveler.id}" value="client"
                             ${traveler.isClientPaid === 'client' ? 'checked' : ''}>
                      <span>Client-Paid</span>
                    </label>
                    <label class="tc__toggle ${traveler.isClientPaid === 'overhead' ? 'tc__toggle--active' : ''}">
                      <input type="radio" name="tcFunding_${traveler.id}" value="overhead"
                             ${traveler.isClientPaid === 'overhead' ? 'checked' : ''}>
                      <span>Overhead</span>
                    </label>
                  </div>
                </div>
                <div class="tc__justification">
                  <label class="tc__field-label">Role Justification</label>
                  <textarea class="form-control form-control-sm focus-expand" id="tcRoleJustification_${traveler.id}"
                            data-rows-min="1" data-rows-focus="3" data-rows-filled="2"
                            placeholder="Why is this traveler required?">${traveler.roleJustification || ''}</textarea>
                </div>
              </div>
            </div>
          </div>

          ${this._renderInternationalSection(traveler)}

          <!-- Stage 3: Transportation Section (revealed after funding & justification) -->
          <div class="tc__stage tc__stage--transport tc__transport" id="tcStageTransport_${traveler.id}">
            <label class="tc__transport-label">Primary Travel Method</label>
            <div class="tc__transport-row">
              <div class="tc__transport-cards" id="tcTransportCards_${traveler.id}">
                <button type="button" class="tc__transport-card ${traveler.transportMode === 'air' ? 'tc__transport-card--selected' : ''}"
                        data-mode="air" data-traveler-id="${traveler.id}">
                  <i aria-hidden="true" class="fas fa-plane"></i>
                  <span>Air</span>
                </button>
                <button type="button" class="tc__transport-card ${traveler.transportMode === 'rail' ? 'tc__transport-card--selected' : ''}"
                        data-mode="rail" data-traveler-id="${traveler.id}">
                  <i aria-hidden="true" class="fas fa-train"></i>
                  <span>Rail</span>
                </button>
                <button type="button" class="tc__transport-card ${traveler.transportMode === 'rental' ? 'tc__transport-card--selected' : ''}"
                        data-mode="rental" data-traveler-id="${traveler.id}">
                  <i aria-hidden="true" class="fas fa-car"></i>
                  <span>Rental</span>
                </button>
                <button type="button" class="tc__transport-card ${traveler.transportMode === 'private' ? 'tc__transport-card--selected' : ''}"
                        data-mode="private" data-traveler-id="${traveler.id}">
                  <i aria-hidden="true" class="fas fa-car-side"></i>
                  <span>POV</span>
                </button>
                <button type="button" class="tc__transport-card tc__transport-card--gov ${traveler.transportMode === 'gov' ? 'tc__transport-card--selected' : ''}"
                        data-mode="gov" data-traveler-id="${traveler.id}">
                  <i aria-hidden="true" class="fas fa-car-side"></i>
                  <span class="tc__transport-card-badge">GOV</span>
                </button>
              </div>
              <div class="tc__transport-inputs">
              <!-- Cost field (for Air, Rail, Rental) -->
              <div class="tc__transport-cost ${(traveler.transportMode === 'private' || traveler.transportMode === 'gov') ? 'tc__transport-cost--hidden' : ''}"
                   id="tcTransportCostWrap_${traveler.id}">
                <label class="tc__transport-input-label">Estimated Cost</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text">$</span>
                  <input type="number" class="form-control tc__transport-amount" id="tcTransportCost_${traveler.id}"
                         value="${traveler.ticketCost > 0 ? traveler.ticketCost : ''}" min="0" step="0.01" placeholder="0.00"
                         data-traveler-id="${traveler.id}">
                </div>
              </div>
              <!-- Mileage fields (for Private/Gov Vehicle) -->
              <div class="tc__transport-mileage ${(traveler.transportMode === 'private' || traveler.transportMode === 'gov') ? '' : 'tc__transport-mileage--hidden'}"
                   id="tcTransportMileWrap_${traveler.id}">
                <label class="tc__transport-input-label">Total Miles (round trip)</label>
                <div class="tc__transport-mileage-row">
                  <div class="input-group input-group-sm">
                    <input type="number" class="form-control tc__transport-miles" id="tcTransportMiles_${traveler.id}"
                           value="${((traveler.milesToDeparture || 0) + (traveler.milesFromArrival || 0)) > 0 ? (traveler.milesToDeparture || 0) + (traveler.milesFromArrival || 0) : ''}" min="0" step="1" placeholder="0"
                           data-traveler-id="${traveler.id}">
                    <span class="input-group-text">mi</span>
                  </div>
                  <span class="tc__transport-calc" id="tcTransportCalc_${traveler.id}">
                    × $${mileageRate.toFixed(3)} = $${(((traveler.milesToDeparture || 0) + (traveler.milesFromArrival || 0)) * mileageRate).toFixed(2)}
                  </span>
                </div>
              </div>
              </div>

              <!-- Rental Car Section (hidden if primary mode is Rental) -->
              <div class="tc__rental-car ${traveler.transportMode === 'rental' ? 'tc__rental-car--hidden' : ''}" id="tcRentalCarSection_${traveler.id}">
                <label class="tc__transport-input-label">Rental Car?</label>
                <div class="tc__rental-car-row">
                  <div class="tc__toggle-group" id="tcRentalCarToggle_${traveler.id}">
                    <label class="tc__toggle ${traveler.needsRentalCar === true ? 'tc__toggle--active' : ''}">
                      <input type="radio" name="tcRentalCar_${traveler.id}" value="yes"
                             ${traveler.needsRentalCar === true ? 'checked' : ''}>
                      <span>Yes</span>
                    </label>
                    <label class="tc__toggle ${traveler.needsRentalCar !== true ? 'tc__toggle--active' : ''}">
                      <input type="radio" name="tcRentalCar_${traveler.id}" value="no"
                             ${traveler.needsRentalCar !== true ? 'checked' : ''}>
                      <span>No</span>
                    </label>
                  </div>
                  <div class="tc__rental-car-cost ${traveler.needsRentalCar === true ? '' : 'tc__rental-car-cost--hidden'}" id="tcRentalCarCostWrap_${traveler.id}">
                    <div class="input-group input-group-sm">
                      <span class="input-group-text">$</span>
                      <input type="number" class="form-control tc__rental-car-amount" id="tcRentalCarCost_${traveler.id}"
                             value="${traveler.rentalCarCost > 0 ? traveler.rentalCarCost : ''}" min="0" step="0.01" placeholder="0.00"
                             data-traveler-id="${traveler.id}">
                    </div>
                  </div>
                </div>
              </div>

              <div class="tc__transport-total">
                Total: <strong id="tcTransportTotal_${traveler.id}">$${(traveler.transportationTotal || 0).toFixed(2)}</strong>
              </div>
            </div>
          </div>

          <!-- Stage 4: Per Diem & Totals (revealed after transport selection) -->
          <div class="tc__stage tc__stage--costs" id="tcStageCosts_${traveler.id}">
            <!-- Per Diem Section -->
            <div class="tc__perdiem">
              <div class="tc__perdiem-header">
                <span class="tc__perdiem-title"><i aria-hidden="true" class="fas fa-calculator"></i> Per Diem Estimate</span>
              </div>
              <div class="tc__perdiem-body" id="tcPerDiemBody_${traveler.id}">
                ${this._renderPerDiemRows(traveler, legs)}
              </div>
            </div>

            <!-- Grand Total Bar -->
            <div class="tc__grand">
              <div class="tc__grand-breakdown">
                <span>Transport: <strong id="tcGrandTransport_${traveler.id}">$0.00</strong></span>
                <span>Lodging: <strong id="tcGrandLodging_${traveler.id}">$0.00</strong></span>
                <span>M&IE: <strong id="tcGrandMie_${traveler.id}">$0.00</strong></span>
                <span>Local: <strong id="tcGrandLocal_${traveler.id}">$0.00</strong></span>
                <span>+15%: <strong id="tcGrandOther_${traveler.id}">$0.00</strong></span>
              </div>
              <div class="tc__grand-total">
                <span>TOTAL</span>
                <strong id="tcGrandTotal_${traveler.id}">$0.00</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    if (this._elements.travelersEmptyState) {
      this._elements.travelersEmptyState.insertAdjacentHTML('beforebegin', cardHtml);
    } else {
      this._elements.travelersContainer.insertAdjacentHTML('beforeend', cardHtml);
    }

    this._initTravelerInputs(traveler);
  };

  /**
   * Render per diem rows for each leg
   */
  Controller._renderPerDiemRows = function(traveler, legs) {
    if (!legs.length) {
      return '<div class="tc__perdiem-empty">Add destinations in Itinerary to see per diem costs</div>';
    }

    // If THIS traveler's local-travel check is in flight, show a loader
    // instead of potentially-wrong per-diem rows. The check resolves async
    // (server geocoding ~200-500ms); rendering the standard per-diem UI
    // immediately would briefly show a non-local-travel section even for a
    // trip that's actually within 50 mi. _checkLocalTravelForTraveler's
    // .finally() calls _refreshPerDiemSection once this traveler's check
    // settles, replacing the loader with the real rows.
    //
    // Per-traveler gating (not global) so a slow check on traveler A doesn't
    // block the render of traveler B's per-diem rows after B's check
    // already finished.
    if (Controller._pendingLocalTravelTravelerIds &&
        Controller._pendingLocalTravelTravelerIds.has(traveler.id)) {
      return `
        <div class="tc__perdiem-loading" style="padding: 16px; text-align: center; color: var(--color-text-secondary); font-size: 0.875rem;">
          <i class="fas fa-spinner fa-spin" aria-hidden="true" style="margin-right: 8px;"></i>
          <span>Calculating trip distances...</span>
        </div>
      `;
    }

    // Separate legs into regular (per diem) and local travel
    const regularLegs = [];
    const localLegs = [];

    legs.forEach(leg => {
      const legCost = traveler.legCosts[leg.id] || {};
      if (legCost.isLocalTravel) {
        localLegs.push(leg);
      } else {
        regularLegs.push(leg);
      }
    });

    let html = '';

      const legCost = traveler.legCosts[leg.id] || {};

      const isAttending = traveler.attendingLegs.includes(leg.id);

      const lodgingEnd = legCost.lodgingEndDate || leg.endDate || '';
      const mieStart = legCost.mieStartDate || leg.startDate || '';
      const mieEnd = legCost.mieEndDate || leg.endDate || '';

      // Check if lodging dates differ from itinerary (user needs to confirm)

              <div class="tc__override-content">
                <div class="tc__override-field">
                  <label>Override:</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" id="tcMieOverrideAmount_${traveler.id}_${leg.id}"

                           placeholder="${(legCost.mieTotal || 0).toFixed(2)}"
                           data-traveler-id="${traveler.id}" data-leg-id="${leg.id}" data-type="mie">
                  </div>
                </div>
                <div class="tc__override-field tc__override-field--reason">

                  <input type="text" class="form-control form-control-sm" id="tcMieOverrideReason_${traveler.id}_${leg.id}"

                         placeholder="e.g., Meals provided"
                         data-traveler-id="${traveler.id}" data-leg-id="${leg.id}" data-type="mie">
                </div>
                <button type="button" class="tc__override-clear"
                        onclick="TravelRequest.Controller._clearOverride('${traveler.id}', '${leg.id}', 'mie')"
                        title="Clear override">
                  <i aria-hidden="true" class="fas fa-times"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Render local travel section (commute info + local legs) grouped together
    if (localLegs.length > 0) {
      // Add commute info section first
      html += this._renderLocalTravelCommuteInfo(traveler);

      // Then render all local travel legs
      html += localLegs.map((leg) => {
        const legCost = traveler.legCosts[leg.id] || {};
        return this._renderLocalTravelLegRow(traveler, leg, legCost);
      }).join('');
    }

    return html;
  };

  /**
   * Dismiss lodging dates warning (called when user changes dates)
   */
  Controller._dismissLodgingWarning = function(travelerId, legId) {
    const state = window.TravelRequest.State;
    state.updateTravelerLegCost(travelerId, legId, 'lodgingDatesConfirmed', true);

    // Remove warning icon
    const warningIcon = document.getElementById(`tcDateWarning_${travelerId}_${legId}`);
    if (warningIcon) warningIcon.remove();

    // Remove warning class from date chip wrappers
    const startChip = document.getElementById(`tcLodgingStartChip_${travelerId}_${legId}`);
    const endChip = document.getElementById(`tcLodgingEndChip_${travelerId}_${legId}`);

    if (startChip) {
      startChip.classList.remove('tc__perdiem-chip--warning');
    }
    if (endChip) {
      endChip.classList.remove('tc__perdiem-chip--warning');
    }
  };

  Controller._formatLegLocationShort = function(leg) {
    // Use shared escapeHtml to prevent XSS from user-provided city/state/country
    const escape = TravelUtils?.escapeHtml || (s => s);
    if (leg.city && leg.state) return `${escape(leg.city)}, ${escape(leg.state)}`;
    if (leg.city && leg.country && leg.country !== 'United States') return `${escape(leg.city)}, ${escape(leg.country)}`;
    if (leg.city) return escape(leg.city);
    return `Stop ${leg.legNumber}`;
  };

  /**
   * Format lodging calculation - shows breakdown when rates vary by month
   */
  Controller._formatLodgingCalc = function(legCost) {
    const nights = legCost.lodgingNights || 0;
    const rate = legCost.lodgingRate || 0;

    if (nights === 0) {
      return '0 nights';
    }

    // If rates varied and we have a breakdown, show grouped format
    if (legCost.lodgingRatesVaried && legCost.lodgingBreakdown && legCost.lodgingBreakdown.length > 0) {
      // Group nights by rate
      const rateGroups = {};
      legCost.lodgingBreakdown.forEach(night => {
        const r = night.rate || 0;
        rateGroups[r] = (rateGroups[r] || 0) + 1;
      });

      // Sort by rate (ascending) and format
      const parts = Object.entries(rateGroups)
        .sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]))
        .map(([r, count]) => `${count} night${count > 1 ? 's' : ''} @ $${parseFloat(r).toFixed(0)}`);

      return parts.join(' + ');
    }

    // Simple format when rates don't vary
    return `${nights} nights × $${rate.toFixed(2)}`;
  };

  /**
   * Format M&IE calculation with 75% first/last day breakdown
   */
  Controller._formatMieCalc = function(days, rate) {
    if (days === 0) {
      return '0 days';
    } else if (days === 1) {
      return `1d @ 75% · $${rate}/day`;
    } else if (days === 2) {
      return `2d @ 75% · $${rate}/day`;
    } else {
      const middleDays = days - 2;
      return `2d @ 75% + ${middleDays}d @ 100% · $${rate}/day`;
    }
  };

  /**
   * Check if traveler has any local travel legs
   */
  Controller._hasLocalTravelLegs = function(traveler) {
    if (!traveler.legCosts) return false;
    return Object.values(traveler.legCosts).some(lc => lc.isLocalTravel);
  };

  /**
   * LOCAL TRAVEL RADIUS (miles) - GSA OAS 5770.1B default
   */
  Controller.LOCAL_TRAVEL_RADIUS = 50;

  /**
   * Cache for distance calculations to avoid repeated server calls
   * Key: "originCity,originState|destCity,destState" -> distance in miles
   */
  Controller._distanceCache = {};

  /**
   * In-flight tracking for local-travel checks. Two parallel structures:
   *
   *   _pendingLocalTravelChecks  — Array of all in-flight promises. Submit
   *     awaits Promise.all of this so a fast user can't outrun the server
   *     geocoding and submit with isLocalTravel=false (stale default).
   *
   *   _pendingLocalTravelTravelerIds  — Set of traveler IDs whose checks
   *     are in flight. _renderPerDiemRows consults this PER TRAVELER to
   *     decide whether to render a "Calculating trip distances..." loader
   *     instead of the per-diem rows. Using a per-traveler set instead of
   *     the global array prevents one traveler's pending check from
   *     blocking the per-diem render of an OTHER traveler whose check
   *     already finished.
   *
   * Background — REQ-2026-0166 (Springfield VA → Tysons VA, ~15 mi):
   *   _checkLocalTravelForTraveler is async (await server geocoding +
   *   distance calc, ~200-500ms). Before this tracking + submit-time wait,
   *   a user fast enough to click Submit before the geocoding resolved
   *   would submit with isLocalTravel still at its default false value.
   *   The state update from the geocoding would land moments later — too
   *   late, the request was already sent.
   *
   * Tracking pattern: every call to _checkLocalTravelForTraveler pushes
   * its promise onto the array AND adds the travelerId to the set; the
   * .finally() hook removes the entry from both when the promise settles.
   */
  Controller._pendingLocalTravelChecks = [];
  Controller._pendingLocalTravelTravelerIds = new Set();

  /**
   * Check and update local travel status for all legs for a traveler
   * Called when employee is selected and duty station is known
   * Uses async geocoding to calculate distances
   * @param {string} travelerId - The traveler ID
   * @returns {Promise<void>} Resolves when every leg has been checked and
   *   the UI refresh + transport-visibility + disclosure-progress hooks
   *   have run. The returned promise is also tracked in
   *   _pendingLocalTravelChecks so submit can wait on it.
   */
  Controller._checkLocalTravelForTraveler = function(travelerId) {
    var self = this;

    // Mark this traveler as having a pending check BEFORE starting the async
    // work, so any synchronous render of the per-diem section (e.g. user
    // navigates to costs while we're computing) shows the loader.
    Controller._pendingLocalTravelTravelerIds.add(travelerId);

    var promise = (async function() {
      const state = window.TravelRequest.State;
      const traveler = state.getTraveler(travelerId);
      if (!traveler) return;

      // Need duty station info
      if (!traveler.dutyStationCity || !traveler.dutyStationState) {
        return;
      }

      const legs = state.getLegs() || [];

      // Check each leg (async)
      for (const leg of legs) {
        if (!leg.city || !leg.state) {
          continue;
        }
        const isLocal = await self._isLegLocalTravel(traveler, leg);
        state.updateTravelerLegCost(travelerId, leg.id, 'isLocalTravel', isLocal);
      }
    })();

    // Track in-flight state. Both structures are cleaned up in the same
    // .finally() so the per-diem refresh runs only AFTER the per-traveler
    // pending flag is cleared — otherwise _renderPerDiemRows would still see
    // this traveler in the pending set and re-render the loader on top of
    // the loader we just had.
    Controller._pendingLocalTravelChecks.push(promise);
    promise.finally(function() {
      // Remove from global array
      const idx = Controller._pendingLocalTravelChecks.indexOf(promise);
      if (idx >= 0) Controller._pendingLocalTravelChecks.splice(idx, 1);
      // Clear per-traveler pending flag
      Controller._pendingLocalTravelTravelerIds.delete(travelerId);

      // Refresh the per-diem section now that pending state is clean —
      // _renderPerDiemRows will produce the real rows (either local-travel
      // or standard per-diem) instead of the loader. This runs
      // unconditionally so non-local-travel trips also clear the loader.
      self._refreshPerDiemSection(travelerId);

      // Update transport section visibility (hide if all legs are local)
      self._updateTransportSectionVisibility(travelerId);

      // Re-check disclosure progress now that local travel status is known —
      // skip the transport stage if all legs are local.
      self._checkDisclosureProgress(travelerId);
    });

    return promise;
  };

  /**
   * Re-run the local-travel check for every traveler. Call after a leg's
   * city or state finalizes — `_checkLocalTravelForTraveler` only runs on
   * employee selection, so without this hook a leg that was edited later
   * keeps `isLocalTravel=false` even when it should be true.
   */
  Controller._recheckLocalTravelForAllTravelers = function() {
    const state = window.TravelRequest.State;
    const travelers = (state.getTravelers && state.getTravelers()) || [];
    travelers.forEach(t => {
      if (t && t.id) this._checkLocalTravelForTraveler(t.id);
    });
  };

  /**
   * Check if a specific leg is local travel for a traveler
   * Uses server-side geocoding to calculate distance
   * @param {Object} traveler - The traveler object
   * @param {Object} leg - The leg object
   * @returns {Promise<boolean>} True if the leg is within local travel radius
   */
  Controller._isLegLocalTravel = async function(traveler, leg) {
    // Need duty station info to calculate distance
    if (!traveler.dutyStationCity || !traveler.dutyStationState) {
      return false;
    }

    // Need destination info
    if (!leg.city || !leg.state) {
      return false;
    }

    // Quick check: same city/state is definitely local
    if (traveler.dutyStationCity.toLowerCase() === leg.city.toLowerCase() &&
        traveler.dutyStationState.toLowerCase() === leg.state.toLowerCase()) {
      return true;
    }

    // Calculate distance using server geocoding
    const distance = await this._calculateDistanceBetweenLocations(
      traveler.dutyStationAddress || '',
      traveler.dutyStationCity,
      traveler.dutyStationState,
      leg.city,
      leg.state
    );

    // If distance calculation fails, assume not local travel
    if (distance === null) {
      return false;
    }

    return distance < this.LOCAL_TRAVEL_RADIUS;
  };

  /**
   * Calculate "as the crow flies" distance between two locations
   * Uses server-side geocoding with caching
   * @param {string} originAddress - Origin street address (optional)
   * @param {string} originCity - Origin city
   * @param {string} originState - Origin state
   * @param {string} destCity - Destination city
   * @param {string} destState - Destination state
   * @returns {Promise<number|null>} Distance in miles, or null if calculation fails
   */
  Controller._calculateDistanceBetweenLocations = async function(originAddress, originCity, originState, destCity, destState) {
    // Check cache first
    const cacheKey = `${originCity},${originState}|${destCity},${destState}`;
    if (this._distanceCache[cacheKey] !== undefined) {
      return this._distanceCache[cacheKey];
    }

    // Call server for geocoding and distance calculation
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((result) => {
          if (result.success) {
            const distance = result.distanceMiles;
            this._distanceCache[cacheKey] = distance;
            resolve(distance);
          } else {
            this._distanceCache[cacheKey] = null;
            resolve(null);
          }
        })
        .withFailureHandler(() => {
          this._distanceCache[cacheKey] = null;
          resolve(null);
        })
        .calculateTravelDistance(
          { address: originAddress, city: originCity, state: originState },
          { address: '', city: destCity, state: destState }
        );
    });
  };

  /**
   * Check if all attending legs are local travel
   * @param {Object} traveler - The traveler object
   * @returns {boolean} True if ALL attending legs are local travel
   */
  Controller._allLegsAreLocalTravel = function(traveler) {
    if (!traveler.attendingLegs || traveler.attendingLegs.length === 0) {
      return false;
    }
    if (!traveler.legCosts) return false;
    return traveler.attendingLegs.every(legId => {
      const legCost = traveler.legCosts[legId];
      return legCost && legCost.isLocalTravel;
    });
  };

  /**
   * Update transport section visibility based on local travel status
   * Hide transport method selection if ALL attending legs are local travel
   * @param {string} travelerId - The traveler ID
   */
  Controller._updateTransportSectionVisibility = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    if (!traveler) return;

    const transportSection = document.getElementById(`tcStageTransport_${travelerId}`);
    if (!transportSection) return;

    const allLocal = this._allLegsAreLocalTravel(traveler);

    if (allLocal) {
      // Hide transport section - local travel uses POV by default
      transportSection.classList.add('hidden');
      // Clear transport-related costs since they don't apply
      state.updateTraveler(travelerId, 'transportMode', '');
      state.updateTraveler(travelerId, 'ticketCost', 0);
      state.updateTraveler(travelerId, 'transportationTotal', 0);
    } else {
      // Show transport section - needed for TDY legs
      transportSection.classList.remove('hidden');
      // Restore default transport mode if not set
      if (!traveler.transportMode) {
        state.updateTraveler(travelerId, 'transportMode', 'air');
      }
    }

    // Update cost display
    this._updateTravelerCostDisplay(travelerId);
  };

  /**
   * Refresh the per diem section for a traveler
   * Called when local travel status changes
   */
  Controller._refreshPerDiemSection = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const legs = state.getLegs() || [];

    const perDiemBody = document.getElementById(`tcPerDiemBody_${travelerId}`);
    if (!perDiemBody) return;

    // Re-render the per diem rows (includes local travel sections)
    perDiemBody.innerHTML = this._renderPerDiemRows(traveler, legs);

    // Re-initialize inputs (per diem date pickers and local travel inputs)
    this._initTravelerLegDatePickers(travelerId);
    this._initLocalTravelInputs(travelerId);

    // Re-bind leg attendance events
    this._bindLegAttendanceEvents(travelerId);

    // Fetch per diem for non-local legs
    this._fetchAllLegPerDiem(travelerId);

    // Update transport section visibility (hide if all legs are local)
    this._updateTransportSectionVisibility(travelerId);
  };

  /**
   * Initialize local travel input event handlers
   */
  Controller._initLocalTravelInputs = function(travelerId) {
    const self = this;
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);

    if (!this._hasLocalTravelLegs(traveler)) return;

    // Telework checkbox
    const teleworkCheckbox = document.getElementById(`tcTelework_${travelerId}`);
    if (teleworkCheckbox) {
      teleworkCheckbox.addEventListener('change', function() {
        state.updateTraveler(travelerId, 'isFullTimeTelework', this.checked);

        // Hide/show commute fields
        const commuteFields = document.getElementById(`tcCommuteFields_${travelerId}`);
        if (commuteFields) {
          commuteFields.classList.toggle('hidden', this.checked);
        }

        // Recalculate all local travel legs
        self._updateAllLocalTravelCalcs(travelerId);
      });
    }

    // Commute distance input
    const commuteDistanceInput = document.getElementById(`tcCommuteDistance_${travelerId}`);
    if (commuteDistanceInput) {
      commuteDistanceInput.addEventListener('input', function() {
        state.updateTraveler(travelerId, 'normalCommuteDistance', parseFloat(this.value) || 0);
        self._updateAllLocalTravelCalcs(travelerId);
      });
    }

    // Commute parking input
    const commuteParkingInput = document.getElementById(`tcCommuteParking_${travelerId}`);
    if (commuteParkingInput) {
      commuteParkingInput.addEventListener('input', function() {
        state.updateTraveler(travelerId, 'normalCommuteParking', parseFloat(this.value) || 0);
        self._updateAllLocalTravelCalcs(travelerId);
      });
    }

    // Initialize per-leg local travel inputs
    const legs = state.getLegs() || [];
    legs.forEach(leg => {
      const legCost = traveler.legCosts[leg.id];
      if (legCost && legCost.isLocalTravel) {
        this._initLocalTravelLegInputs(travelerId, leg.id);
      }
    });

    // Calculate initial values for restored drafts
    this._updateAllLocalTravelCalcs(travelerId);
  };

  /**
   * Initialize local travel inputs for a specific leg
   */
  Controller._initLocalTravelLegInputs = function(travelerId, legId) {
    const self = this;
    const state = window.TravelRequest.State;

    // Miles driven input
    const milesInput = document.getElementById(`tcLocalMiles_${travelerId}_${legId}`);
    if (milesInput) {
      milesInput.addEventListener('input', function() {
        state.updateTravelerLegCost(travelerId, legId, 'localMilesDriven', parseFloat(this.value) || 0);
        self._updateLocalTravelCalc(travelerId, legId);
      });
    }

    // Gov vehicle available checkbox
    const govVehicleCheckbox = document.getElementById(`tcGovVehicle_${travelerId}_${legId}`);
    if (govVehicleCheckbox) {
      govVehicleCheckbox.addEventListener('change', function() {
        state.updateTravelerLegCost(travelerId, legId, 'wasGovVehicleAvailable', this.checked);
        self._updateLocalTravelCalc(travelerId, legId);
      });
    }

    // Parking input
    const parkingInput = document.getElementById(`tcLocalParking_${travelerId}_${legId}`);
    if (parkingInput) {
      parkingInput.addEventListener('input', function() {
        state.updateTravelerLegCost(travelerId, legId, 'localParking', parseFloat(this.value) || 0);
        self._updateLocalTravelCalc(travelerId, legId);
      });
    }

    // Tolls input
    const tollsInput = document.getElementById(`tcLocalTolls_${travelerId}_${legId}`);
    if (tollsInput) {
      tollsInput.addEventListener('input', function() {
        state.updateTravelerLegCost(travelerId, legId, 'localTolls', parseFloat(this.value) || 0);
        self._updateLocalTravelCalc(travelerId, legId);
      });
    }
  };

  /**
   * Update local travel calculation for a single leg
   */
  Controller._updateLocalTravelCalc = function(travelerId, legId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const legCost = traveler.legCosts[legId];

    if (!legCost || !legCost.isLocalTravel) return;

    // Calculate reimbursement using state helper
    const calc = state._calculateLocalTravelReimbursement(traveler, legCost);

    // Update display elements
    const mileageCalcEl = document.getElementById(`tcLocalMileageCalc_${travelerId}_${legId}`);
    const mileageAmtEl = document.getElementById(`tcLocalMileageAmt_${travelerId}_${legId}`);
    const parkingCalcEl = document.getElementById(`tcLocalParkingCalc_${travelerId}_${legId}`);
    const parkingAmtEl = document.getElementById(`tcLocalParkingAmt_${travelerId}_${legId}`);
    const tollsAmtEl = document.getElementById(`tcLocalTollsAmt_${travelerId}_${legId}`);
    const legTotalEl = document.getElementById(`tcLegSubtotal_${travelerId}_${legId}`);

    if (mileageCalcEl) {
      mileageCalcEl.textContent = `Reimbursable: ${calc.reimbursableMiles} mi × $${calc.mileageRate.toFixed(3)}`;
    }
    if (mileageAmtEl) {
      mileageAmtEl.textContent = `$${calc.mileageReimbursement.toFixed(2)}`;
    }
    if (parkingCalcEl) {
      const commuteParking = traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteParking || 0);
      parkingCalcEl.textContent = `Excess over $${commuteParking.toFixed(2)} commute`;
    }
    if (parkingAmtEl) {
      parkingAmtEl.textContent = `$${calc.excessParking.toFixed(2)}`;
    }
    if (tollsAmtEl) {
      tollsAmtEl.textContent = `$${calc.tollsReimbursement.toFixed(2)}`;
    }
    if (legTotalEl) {
      legTotalEl.textContent = `$${calc.total.toFixed(2)}`;
    }

    // Update state with calculated total
    state.updateTravelerLegCost(travelerId, legId, 'localTravelTotal', calc.total);

    // Update overall traveler totals
    this._updateTravelerCostDisplay(travelerId);
    this._updateTravelersTotal();
  };

  /**
   * Update all local travel calculations for a traveler
   * Called when commute info changes
   */
  Controller._updateAllLocalTravelCalcs = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const legs = state.getLegs() || [];

    legs.forEach(leg => {
      const legCost = traveler.legCosts[leg.id];
      if (legCost && legCost.isLocalTravel) {
        this._updateLocalTravelCalc(travelerId, leg.id);
      }
    });
  };

  // ==========================================================================
  // OVERRIDE PANEL FUNCTIONS
  // ==========================================================================

  /**
   * Toggle override panel visibility with slide animation
   */
  Controller._toggleOverridePanel = function(travelerId, legId, type) {
    const panelId = type === 'lodging'
      ? `tcLodgingOverridePanel_${travelerId}_${legId}`
      : `tcMieOverridePanel_${travelerId}_${legId}`;
    const panel = document.getElementById(panelId);
    if (!panel) return;

    const isHidden = panel.classList.contains('hidden');

    if (isHidden) {
      // Show panel with slide animation
      panel.classList.remove('hidden');
      panel.style.maxHeight = '0';
      panel.style.overflow = 'hidden';
      requestAnimationFrame(() => {
        panel.style.transition = 'max-height 0.25s ease-out';
        panel.style.maxHeight = panel.scrollHeight + 'px';
      });

      // Initialize override input listeners
      this._initOverrideInputs(travelerId, legId, type);
    } else {
      // Hide panel with slide animation
      panel.style.transition = 'max-height 0.2s ease-in';
      panel.style.maxHeight = '0';
      setTimeout(() => {
        panel.classList.add('hidden');
      }, 200);
    }
  };

  /**
   * Initialize override input listeners - just updates display as you type
   */
  Controller._initOverrideInputs = function(travelerId, legId, type) {
    const self = this;
    const prefix = type === 'lodging' ? 'tcLodging' : 'tcMie';
    const amountInput = document.getElementById(`${prefix}OverrideAmount_${travelerId}_${legId}`);

    if (!amountInput || amountInput._overrideInitialized) return;
    amountInput._overrideInitialized = true;

    const amountId = type === 'lodging'
      ? `tcLodging_${travelerId}_${legId}`
      : `tcMie_${travelerId}_${legId}`;
    const calcId = type === 'lodging'
      ? `tcLodgingCalc_${travelerId}_${legId}`
      : `tcMieCalc_${travelerId}_${legId}`;

    // Update state and all totals in real-time as user types
    amountInput.addEventListener('input', function() {
      const state = window.TravelRequest.State;
      const amount = parseFloat(this.value) || 0;
      const amountEl = document.getElementById(amountId);
      const calcEl = document.getElementById(calcId);

      // Update visual state of the amount display
      if (amountEl) {
        if (amount > 0) {
          amountEl.textContent = `$${amount.toFixed(2)}`;
          amountEl.classList.add('tc__perdiem-amount--override');
        } else {
          amountEl.classList.remove('tc__perdiem-amount--override');
        }
      }
      if (calcEl) {
        calcEl.classList.toggle('tc__perdiem-calc--hidden', amount > 0);
      }

      // Update state in real-time
      const traveler = state.getTraveler(travelerId);
      const legCost = traveler?.legCosts?.[legId];
      if (!legCost) return;

      // Update override values on legCost
      if (type === 'lodging') {
        legCost.lodgingOverrideAmount = amount;
        legCost.lodgingOverride = amount > 0;
        legCost.lodgingTotal = amount > 0 ? amount : (legCost.lodgingCalculated || 0);
      } else {
        legCost.mieOverrideAmount = amount;
        legCost.mieOverride = amount > 0;
        legCost.mieTotal = amount > 0 ? amount : (legCost.mieCalculated || 0);
      }

      // Update leg subtotal
      legCost.legSubtotal = (legCost.lodgingTotal || 0) + (legCost.mieTotal || 0);

      // Recalculate and update all totals
      state._recalculateTravelerCosts(traveler, 'override');
      self._updateLegCostDisplay(travelerId, legId);
      self._updateTravelerCostDisplay(travelerId);
      self._updateTravelersTotal();
    });

    // Save reason on blur of amount input
    amountInput.addEventListener('blur', function() {
      const state = window.TravelRequest.State;
      const reasonInput = document.getElementById(`${prefix}OverrideReason_${travelerId}_${legId}`);
      const reason = reasonInput?.value?.trim() || '';

      const traveler = state.getTraveler(travelerId);
      const legCost = traveler?.legCosts?.[legId];
      if (!legCost) return;

      // Save the reason field
      if (type === 'lodging') {
        legCost.lodgingOverrideReason = reason;
      } else {
        legCost.mieOverrideReason = reason;
      }
    });

    // Also save reason on blur of reason input itself
    const reasonInput = document.getElementById(`${prefix}OverrideReason_${travelerId}_${legId}`);
    if (reasonInput) {
      reasonInput.addEventListener('blur', function() {
        const state = window.TravelRequest.State;
        const reason = this.value?.trim() || '';

        const traveler = state.getTraveler(travelerId);
        const legCost = traveler?.legCosts?.[legId];
        if (!legCost) return;

        // Save the reason field
        if (type === 'lodging') {
          legCost.lodgingOverrideReason = reason;
        } else {
          legCost.mieOverrideReason = reason;
        }
      });
    }
  };

  /**
   * Clear override and restore calculated value
   */
  Controller._clearOverride = function(travelerId, legId, type) {
    const state = window.TravelRequest.State;
    const prefix = type === 'lodging' ? 'tcLodging' : 'tcMie';

    // Clear inputs
    const amountInput = document.getElementById(`${prefix}OverrideAmount_${travelerId}_${legId}`);
    const reasonInput = document.getElementById(`${prefix}OverrideReason_${travelerId}_${legId}`);
    if (amountInput) amountInput.value = '';
    if (reasonInput) reasonInput.value = '';

    // Get the leg cost object to update directly
    const traveler = state.getTraveler(travelerId);
    const legCost = traveler?.legCosts?.[legId];
    if (!legCost) return;

    // Clear override and restore calculated value
    if (type === 'lodging') {
      legCost.lodgingOverride = false;
      legCost.lodgingOverrideAmount = 0;
      legCost.lodgingOverrideReason = '';
      legCost.lodgingTotal = legCost.lodgingCalculated || 0;
    } else {
      legCost.mieOverride = false;
      legCost.mieOverrideAmount = 0;
      legCost.mieOverrideReason = '';
      legCost.mieTotal = legCost.mieCalculated || 0;
    }

    // Update leg subtotal
    legCost.legSubtotal = (legCost.lodgingTotal || 0) + (legCost.mieTotal || 0);

    // Force recalculation of traveler totals
    state._recalculateTravelerCosts(traveler, 'clearOverride');

    // Reset display classes
    const amountId = type === 'lodging' ? `tcLodging_${travelerId}_${legId}` : `tcMie_${travelerId}_${legId}`;
    const calcId = type === 'lodging' ? `tcLodgingCalc_${travelerId}_${legId}` : `tcMieCalc_${travelerId}_${legId}`;
    const amountEl = document.getElementById(amountId);
    const calcEl = document.getElementById(calcId);

    if (amountEl) amountEl.classList.remove('tc__perdiem-amount--override');
    if (calcEl) calcEl.classList.remove('tc__perdiem-calc--hidden');

    // Reset N/A button state in case it was active
    this._updateNaToggleButton(travelerId, legId, type, false);

    // Update all displays
    this._updateLegCostDisplay(travelerId, legId);
    this._updateTravelerCostDisplay(travelerId);
    this._updateTravelersTotal();

    // Close panel
    this._toggleOverridePanel(travelerId, legId, type);
  };

  /**
   * Returns true if a per-diem type is in the N/A (intentionally-zeroed) state.
   * Detection: override enabled AND amount is exactly 0.
   */
  Controller._isNaOverride = function(legCost, type) {
    if (type === 'lodging') {
      return legCost.lodgingOverride === true && (legCost.lodgingOverrideAmount || 0) === 0;
    }
    return legCost.mieOverride === true && (legCost.mieOverrideAmount || 0) === 0;
  };

  /**
   * Toggle the N/A state for lodging or M&IE on a specific leg.
   * N/A = override:true, amount:0, reason:'N/A'
   * Toggling OFF restores the calculated per diem value.
   */
  Controller._toggleNaOverride = function(travelerId, legId, type) {
    var self = this;
    var state = window.TravelRequest.State;
    var traveler = state.getTraveler(travelerId);
    var legCost = traveler?.legCosts?.[legId];
    if (!legCost) return;

    var isCurrentlyNa = self._isNaOverride(legCost, type);

    if (isCurrentlyNa) {
      // Turn OFF — restore to calculated value
      if (type === 'lodging') {
        legCost.lodgingOverride = false;
        legCost.lodgingOverrideAmount = 0;
        legCost.lodgingOverrideReason = '';
        legCost.lodgingTotal = legCost.lodgingCalculated || 0;
      } else {
        legCost.mieOverride = false;
        legCost.mieOverrideAmount = 0;
        legCost.mieOverrideReason = '';
        legCost.mieTotal = legCost.mieCalculated || 0;
      }
    } else {
      // Turn ON — close any open override panel first
      var prefix = type === 'lodging' ? 'tcLodging' : 'tcMie';
      var panel = document.getElementById(prefix + 'OverridePanel_' + travelerId + '_' + legId);
      if (panel && !panel.classList.contains('hidden')) {
        self._toggleOverridePanel(travelerId, legId, type);
      }
      // Clear override input values
      var amountInput = document.getElementById(prefix + 'OverrideAmount_' + travelerId + '_' + legId);
      var reasonInput = document.getElementById(prefix + 'OverrideReason_' + travelerId + '_' + legId);
      if (amountInput) amountInput.value = '';
      if (reasonInput) reasonInput.value = '';

      if (type === 'lodging') {
        legCost.lodgingOverride = true;
        legCost.lodgingOverrideAmount = 0;
        legCost.lodgingOverrideReason = 'N/A';
        legCost.lodgingTotal = 0;
      } else {
        legCost.mieOverride = true;
        legCost.mieOverrideAmount = 0;
        legCost.mieOverrideReason = 'N/A';
        legCost.mieTotal = 0;
      }
    }

    // Recalculate
    legCost.legSubtotal = (legCost.lodgingTotal || 0) + (legCost.mieTotal || 0);
    state._recalculateTravelerCosts(traveler, 'naOverride');

    // Update DOM
    self._updateNaToggleButton(travelerId, legId, type, !isCurrentlyNa);
    self._updateLegCostDisplay(travelerId, legId);
    self._updateTravelerCostDisplay(travelerId);
    self._updateTravelersTotal();

  /**
   * Handle NFS file upload (from traveler card)
   */
  Controller._handleNFSUpload = function(travelerId, input) {
    const file = input.files[0];
    if (!file) return;

    const state = window.TravelRequest.State;
    const draftId = state.getField('draftId') || window.TravelRequest.Controller._currentDraftId;
    const uploadedDiv = document.getElementById(`tcNfsUploaded_${travelerId}`);
    const fileNameLink = document.getElementById(`tcNfsFileName_${travelerId}`);
    const nfsRow = document.querySelector(`#tcNfsAction_${travelerId} .tc__nfs-row`);
    const uploadBtn = input.parentElement.querySelector('.tc__nfs-upload-btn');

    // Show loading state
    if (uploadBtn) {
      uploadBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Uploading...';
      uploadBtn.disabled = true;
    }

    // Read file as base64
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result.split(',')[1];

      // Use the file service proxy for uploads
      google.script.run
        .withSuccessHandler(function(result) {
          // Always reset button state
          if (uploadBtn) {
            uploadBtn.innerHTML = '<i aria-hidden="true" class="fas fa-upload"></i> Upload Completed Form';
            uploadBtn.disabled = false;
          }

          if (result.success) {
            // Update state
            state.updateTraveler(travelerId, 'nfsFileId', result.fileId);
            state.updateTraveler(travelerId, 'nfsFileName', file.name);
            state.updateTraveler(travelerId, 'nfsWorksheetSubmitted', true);

            // Update UI - hide buttons, show uploaded file
            if (fileNameLink) fileNameLink.textContent = file.name;
            if (nfsRow) nfsRow.classList.add('hidden');
            if (uploadedDiv) uploadedDiv.classList.remove('hidden');
          } else {
            alert('Upload failed: ' + (result.error || 'Unknown error'));
          }
          input.value = '';
        })
        .withFailureHandler(function(error) {
          alert('Upload failed: ' + error.message);
          if (uploadBtn) {
            uploadBtn.innerHTML = '<i aria-hidden="true" class="fas fa-upload"></i> Upload Completed Form';
            uploadBtn.disabled = false;
          }
          input.value = '';
        })
        .uploadNFSDraftFile({
          name: file.name,
          type: file.type,
          data: base64Data,
          draftId: draftId,
          travelerId: travelerId
        });
    };
    reader.readAsDataURL(file);
  };

  /**

   */
  Controller._removeNFSFile = function(travelerId) {
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const fileId = traveler?.nfsFileId;
    const uploadedDiv = document.getElementById(`tcNfsUploaded_${travelerId}`);
    const nfsRow = document.querySelector(`#tcNfsAction_${travelerId} .tc__nfs-row`);

        .deleteTravelDraftFile(fileId);

  /**
   * Download NFS worksheet directly (no modal)
   */
  Controller._createNFSWorksheetCopy = function(travelerId) {
    const self = this;
    const state = window.TravelRequest.State;
    const traveler = state.getTraveler(travelerId);
    const travelerName = traveler?.employeeName || 'Traveler';

    // Get the download button to show loading state
    const downloadBtn = document.getElementById(`tcNfsDownload_${travelerId}`);
    if (downloadBtn) {
      downloadBtn.disabled = true;
      downloadBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Downloading...';
    }

    // Build filename
    const sanitizedName = travelerName.replace(/[^a-zA-Z0-9\s]/g, '').trim().replace(/\s+/g, '_');
    const timestamp = new Date().toISOString().slice(0, 10);
    const fileName = `NFS_Worksheet_${sanitizedName}_${timestamp}.pdf`;

    // Fetch PDF from server and download
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          // Convert base64 to blob for download
          const byteCharacters = atob(result.data);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: result.mimeType || 'application/pdf' });

          // Create download link
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);

          // Show toast with instructions
          self._showToast('Downloaded! Fill it out in Chrome or Adobe, then upload.', 'success');
        } else {
          self._showToast('Download failed: ' + (result.error || 'Unknown error'), 'danger');
        }

        // Reset button
        if (downloadBtn) {
          downloadBtn.disabled = false;
          downloadBtn.innerHTML = '<i aria-hidden="true" class="fas fa-file-pdf"></i> Get NFS Worksheet';
        }
      })
      .withFailureHandler(function(error) {
        self._showToast('Download failed: ' + error.message, 'danger');
        if (downloadBtn) {
          downloadBtn.disabled = false;
          downloadBtn.innerHTML = '<i aria-hidden="true" class="fas fa-file-pdf"></i> Get NFS Worksheet';
        }
      })
      .getNFSWorksheetTemplate();
  };
