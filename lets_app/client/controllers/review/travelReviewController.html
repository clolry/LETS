    _costsEditMode: false,
    _costsOriginal: null,

    /**
     * Check if user can edit costs (submitter in editable status)
     */
    _canEditCosts() {
      if (!this._requestData) return false;
      const { request } = this._requestData;

      if (this._mode === 'submitter') {
        const statusConfig = TravelUtils?.TRAVEL_CONFIG?.STATUS || {};
        const editableStatuses = [
          ...(statusConfig.NEEDS_INFO || ['NEEDS_INFO_SECTOR', 'NEEDS_INFO_BU', 'NEEDS_INFO_OSO']),
          'PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'PENDING_FAS', 'DRAFT'
        ];
        return editableStatuses.includes(request.status);
      }
      return false;
    },

    /**
     * Update edit button in costs section header
     */
    _updateCostsEditButton(canEdit, isEditMode) {
      const headerActions = document.querySelector('#sectionCosts .review-section__header-actions');

      // Create header-actions if it doesn't exist
      if (!headerActions) {
        const sectionHeader = document.querySelector('#sectionCosts .review-section__header');
        if (sectionHeader) {
          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'review-section__header-actions';
          sectionHeader.appendChild(actionsDiv);
        }
      }

      const container = document.querySelector('#sectionCosts .review-section__header-actions');
      if (!container) return;

      // Remove existing edit button if present
      const existingBtn = container.querySelector('.review-costs__edit-btn');
      if (existingBtn) {
        existingBtn.remove();
      }

      // Add edit button if allowed and not in edit mode
      if (canEdit && !isEditMode) {
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'review-costs__edit-btn';
        editBtn.innerHTML = '<i aria-hidden="true" class="fas fa-pencil-alt"></i><span>Edit</span>';
        editBtn.onclick = () => TravelReview.Controller.toggleCostsEdit();
        container.insertBefore(editBtn, container.firstChild);
      }
    },

    /**
     * Toggle costs edit mode
     */
    toggleCostsEdit() {
      if (!this._costsEditMode) {
        // Entering edit mode - save original state including totals
        this._costsOriginal = {
          sharedCosts: JSON.parse(JSON.stringify(this._requestData.request.sharedCosts || {})),
          travelers: JSON.parse(JSON.stringify(this._requestData.travelers)),
          sharedTotal: parseFloat(this._requestData.request.sharedTotal) || 0,
          travelerTotal: parseFloat(this._requestData.request.travelerTotal) || 0,
          grandTotal: parseFloat(this._requestData.request.grandTotal) || 0
        };
        this._removedLegCosts = [];
      }
      this._costsEditMode = !this._costsEditMode;
      this._renderCosts(
        this._requestData.request,
        this._requestData.travelers,
        this._requestData.legs
      );
    },

    /**
     * Cancel costs edit mode
     */
    cancelCostsEdit() {
      if (this._costsOriginal) {
        this._requestData.request.sharedCosts = this._costsOriginal.sharedCosts;
        this._requestData.travelers = this._costsOriginal.travelers;
      }
      this._costsEditMode = false;
      this._costsOriginal = null;
      this._removedLegCosts = [];
      this._cleanupLegCostDatePickers();
      this._renderCosts(
        this._requestData.request,
        this._requestData.travelers,
        this._requestData.legs
      );
    },

    /**
     * Cleanup date picker instances to prevent memory leaks
     */
    _cleanupLegCostDatePickers() {
      if (this._legCostDatePickers) {
        Object.values(this._legCostDatePickers).forEach(fp => {
          if (fp && typeof fp.destroy === 'function') {
            fp.destroy();
          }
        });
        this._legCostDatePickers = {};
      }
    },

    /**
     * Update shared cost value as user types
     */
    updateSharedCost(category, field, value) {
      if (!this._requestData.request.sharedCosts) {
        this._requestData.request.sharedCosts = {};
      }
      if (!this._requestData.request.sharedCosts[category]) {
        this._requestData.request.sharedCosts[category] = { amount: 0, description: '' };
      }

      if (field === 'amount') {
        this._requestData.request.sharedCosts[category].amount = parseFloat(value) || 0;
      } else {
        this._requestData.request.sharedCosts[category].description = value;
      }

      // Update shared total display
      this._updateSharedTotalDisplay();
    },

    /**
     * Update the shared total display while editing
     */
    _updateSharedTotalDisplay() {
      const sharedCosts = this._requestData.request.sharedCosts || {};
      const sharedTotal =
        (parseFloat(sharedCosts.facilities?.amount) || 0) +
        (parseFloat(sharedCosts.audioVisual?.amount) || 0) +
        (parseFloat(sharedCosts.logistics?.amount) || 0) +
        (parseFloat(sharedCosts.other?.amount) || 0);

      const sharedTotalEl = document.getElementById('sharedCostsTotal');
      if (sharedTotalEl) {
        sharedTotalEl.textContent = this._formatCurrency(sharedTotal);
      }

      // Also update grand total
      const travelerTotal = this._requestData.request.travelerTotal || 0;
      const grandTotal = travelerTotal + sharedTotal;
      const grandTotalEl = document.querySelector('.review-cost-summary__total-amount');
      if (grandTotalEl) {
        grandTotalEl.textContent = this._formatCurrency(grandTotal);
      }
    },

    /**
     * Save shared costs changes to server
     */
    async saveSharedCosts() {
      const saveBtn = document.querySelector('.review-costs-edit__actions .btn-primary');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Saving...';
      }

      try {
        const sharedCosts = this._requestData.request.sharedCosts || {};

        const updates = {
          requestId: this._requestData.request.requestId,
          sharedCosts: {
            facilities: sharedCosts.facilities || { amount: 0, description: '' },
            audioVisual: sharedCosts.audioVisual || { amount: 0, description: '' },
            logistics: sharedCosts.logistics || { amount: 0, description: '' },
            other: sharedCosts.other || { amount: 0, description: '' }
          }
        };

        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateSharedCostsForReview(updates);
        });

        if (result && result.success) {
          // Capture for edit history BEFORE clearing original
          const sharedCostsData = updates.sharedCosts;
          const originalCosts = this._costsOriginal?.sharedCosts || {};

          // Compute changed categories BEFORE clearing original state
          const changedCategories = {};
          const categories = ['facilities', 'audioVisual', 'logistics', 'other'];

          categories.forEach(cat => {
            const oldAmount = parseFloat(originalCosts[cat]?.amount) || 0;
            const newAmount = parseFloat(sharedCostsData[cat]?.amount) || 0;
            const oldDesc = originalCosts[cat]?.description || '';
            const newDesc = sharedCostsData[cat]?.description || '';

            if (oldAmount !== newAmount || oldDesc !== newDesc) {
              changedCategories[cat] = {
                old: { amount: oldAmount, description: oldDesc },
                new: { amount: newAmount, description: newDesc }
              };
            }
          });

          // Update local data with server response
          const data = result.data || {};
          this._requestData.request.sharedTotal = data.sharedTotal;
          this._requestData.request.grandTotal = data.grandTotal;

          // Update grand total display in sidebar
          document.getElementById('reviewGrandTotal').textContent = this._formatCurrency(data.grandTotal);

          // Exit edit mode - clear original AFTER computing changes
          this._costsEditMode = false;
          this._costsOriginal = null;

          // Re-render costs section
          this._renderCosts(
            this._requestData.request,
            this._requestData.travelers,
            this._requestData.legs
          );

          // Add local edit history entry if there were changes
          if (Object.keys(changedCategories).length > 0) {
            this._addLocalEditEntry('Edit_SharedCosts', {
              changes: changedCategories,
              sharedTotal: data.sharedTotal
            });
          }

          console.log('Shared costs updated successfully');
        } else {
          throw new Error((result && result.error) || 'Failed to save shared costs');
        }

      } catch (error) {
        console.error('Error saving shared costs:', error);
        this._showToast('Failed to save changes: ' + (error.message || 'Unknown error'), 'error');

        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-save"></i> Save Changes';
        }
      }
    },

            <div class="review-cost-matrix__cell review-cost-matrix__cell--amount ${travelerCosts.mieOverride ? 'review-cost-matrix__cell--override' : ''}">
              ${this._formatCurrency(travelerCosts.mie)}
              ${travelerCosts.mieOverride ? `<i aria-hidden="true" class="fas fa-exclamation-triangle review-cost-matrix__override-icon" title="Override applied - click to expand row for details"></i>` : ''}
            </div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">
              ${this._formatCurrency(travelerCosts.other)}
            </div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--total">
              ${this._formatCurrency(traveler.subtotal)}
            </div>
          </div>
        `;

        // Leg detail rows (hidden by default). Match isExpandable above
        // so a mileage-mode row also gets a leg-details container for
        // the "POV X mi × $rate" breakdown to render into.
        if (hasLegDetails || travelerCosts.needsRentalCar || isMileageMode) {
          html += `<div class="review-cost-matrix__leg-details hidden" id="leg-details-${travelerId}">`;

          // Check if ALL legs are local travel (no transport section needed)
          const allLegsLocal = travelerCosts.legDetails && travelerCosts.legDetails.length > 0 &&
            travelerCosts.legDetails.every(leg => leg.isLocalTravel);

          // Transport breakdown — only render when there's something
          // beyond the Transport column total to show: a mileage-rate
          // calc (POV/GOV) or a rental-car add-on. Air/Public modes
          // already show their full cost in the column, no point
          // duplicating it here. Edit mode always renders so users
          // can change the mode/cost.
          const isMileageDetail = travelerCosts.transportMode === 'private' || travelerCosts.transportMode === 'gov';
          if (!allLegsLocal && (isMileageDetail || travelerCosts.needsRentalCar || isEditMode)) {
            const transportIcon = this._getTransportIcon(travelerCosts.transportMode);
            const transportLabel = this._getTransportModeLabel(travelerCosts.transportMode);
            const isMileage = travelerCosts.transportMode === 'private' || travelerCosts.transportMode === 'gov';

            if (isEditMode) {
              // EDIT MODE - Editable transport costs
              html += this._renderTransportEditSection(traveler, travelerCosts);
            } else {
              // VIEW MODE - Display only
              html += `
                <div class="review-cost-matrix__transport-breakdown">
                  <div class="review-cost-matrix__transport-items">
                    <div class="review-cost-matrix__transport-item">
                      <span class="review-cost-matrix__transport-label">
                        <i aria-hidden="true" class="fas ${transportIcon}"></i> ${transportLabel}
                        ${isMileage ? `<span class="review-cost-matrix__transport-calc">${travelerCosts.totalMiles} mi × $${(travelerCosts.mileageRate || 0).toFixed(3)}</span>` : ''}
                      </span>
                      <span class="review-cost-matrix__transport-amount">
                        ${this._formatCurrency(isMileage ? travelerCosts.transport : travelerCosts.ticketCost)}
                      </span>
                      <span></span><span></span><span></span><span></span>
                    </div>
                    ${travelerCosts.needsRentalCar ? `
                    <div class="review-cost-matrix__transport-item">
                      <span class="review-cost-matrix__transport-label">
                        <i aria-hidden="true" class="fas fa-car"></i> Rental Car
                      </span>
                      <span class="review-cost-matrix__transport-amount">${this._formatCurrency(travelerCosts.rentalCarCost)}</span>
                      <span></span><span></span><span></span><span></span>
                    </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }
          }

          // Check if traveler has any local travel legs
          const hasLocalLegs = travelerCosts.legDetails && travelerCosts.legDetails.some(leg => leg.isLocalTravel);

          // Render commute info section BEFORE local travel legs (edit mode only)
          if (hasLocalLegs && isEditMode) {
            html += this._renderCommuteInfoSection(traveler, travelerId);
          }

          travelerCosts.legDetails.forEach((leg, legIndex) => {

            // Check if this is a local travel leg
            if (leg.isLocalTravel) {
              // LOCAL TRAVEL LEG - Different layout
              const mileageRate = TravelCostService.getMileageRate(leg.wasGovVehicleAvailable ? 'gov' : 'private');
              const reimbursableMiles = Math.max(0, leg.localMilesDriven - leg.normalCommuteDistance);
              const mileageAmount = reimbursableMiles * mileageRate;
              const excessParking = Math.max(0, leg.localParking - leg.normalCommuteParking);
              const legEditId = `${travelerId}-${leg.legId}`;

              if (isEditMode) {
                // EDIT MODE - Editable local travel fields
                html += this._renderLocalTravelEditRow(leg, travelerId, legEditId, travelerCosts.legDetails.length);
              } else {
                // VIEW MODE - Display only
                html += `
                  <div class="review-cost-matrix__leg-row review-cost-matrix__leg-row--local">
                    <div class="review-cost-matrix__cell">
                      <i aria-hidden="true" class="fas fa-car" style="margin-right:0.25rem;"></i>
                      ${this._escapeHtml(leg.location)}
                      <span class="review-cost-matrix__local-badge">LOCAL</span>
                    </div>
                    <div class="review-cost-matrix__cell" colspan="4"></div>
                    <div class="review-cost-matrix__cell review-cost-matrix__cell--total review-cost-matrix__cell--total--sub">
                      ${this._formatCurrency(leg.localTravelTotal)}
                    </div>
                  </div>
                  <div class="review-cost-matrix__local-breakdown">
                    <div class="review-cost-matrix__local-item">
                      <span class="review-cost-matrix__local-label">Mileage</span>
                      <span class="review-cost-matrix__local-calc">
                        ${leg.localMilesDriven} mi @ $${mileageRate.toFixed(3)}
                        ${leg.normalCommuteDistance > 0 ? `<span class="review-cost-matrix__local-deduct">(less ${leg.normalCommuteDistance}mi commute)</span>` : ''}
                      </span>
                      <span class="review-cost-matrix__local-amount">${this._formatCurrency(mileageAmount)}</span>
                    </div>
                    <div class="review-cost-matrix__local-item">
                      <span class="review-cost-matrix__local-label">Parking</span>
                      <span class="review-cost-matrix__local-calc">
                        ${this._formatCurrency(leg.localParking)}
                        ${leg.normalCommuteParking > 0 ? `<span class="review-cost-matrix__local-deduct">(less ${this._formatCurrency(leg.normalCommuteParking)} commute)</span>` : ''}
                      </span>
                      <span class="review-cost-matrix__local-amount">${this._formatCurrency(excessParking)}</span>
                    </div>
                    <div class="review-cost-matrix__local-item">
                      <span class="review-cost-matrix__local-label">Tolls</span>
                      <span class="review-cost-matrix__local-calc"></span>
                      <span class="review-cost-matrix__local-amount">${this._formatCurrency(leg.localTolls)}</span>
                    </div>
                  </div>
                `;
              }
            } else {
              // REGULAR PER DIEM LEG
              const hasLodgingOverride = leg.lodgingOverride;
              const hasMieOverride = leg.mieOverride;
              const legEditId = `${travelerId}-${leg.legId}`;

              if (isEditMode) {
                // EDIT MODE - Editable leg row
                html += this._renderLegCostEditRow(leg, travelerId, legEditId, travelerCosts.legDetails.length);
              } else {
                // VIEW MODE - Display only
                // Check if dates are custom (not using itinerary dates)
                const lodgingHasCustomDates = leg.lodgingUsesItineraryDates === false;
                const mieHasCustomDates = leg.mieUsesItineraryDates === false;
                const hasAnyCustomDates = lodgingHasCustomDates || mieHasCustomDates;

                // Format dates for display
                const formatShortDate = (dateStr) => {
                  if (!dateStr) return '';
                  return TravelDateService.formatDate(dateStr, 'shortMonth') || '';
                };

                // Build lodging date display
                let lodgingDateHtml = '';
                if (lodgingHasCustomDates && leg.lodgingStartDate && leg.lodgingEndDate) {
                  lodgingDateHtml = `<div class="review-cost-matrix__custom-dates">
                    <i aria-hidden="true" class="fas fa-calendar-alt"></i>
                    ${formatShortDate(leg.lodgingStartDate)} – ${formatShortDate(leg.lodgingEndDate)}
                  </div>`;
                }

                // Build M&IE date display
                let mieDateHtml = '';
                if (mieHasCustomDates && leg.mieStartDate && leg.mieEndDate) {
                  mieDateHtml = `<div class="review-cost-matrix__custom-dates">
                    <i aria-hidden="true" class="fas fa-calendar-alt"></i>
                    ${formatShortDate(leg.mieStartDate)} – ${formatShortDate(leg.mieEndDate)}
                  </div>`;
                }

                html += `
                  <div class="review-cost-matrix__leg-row ${hasAnyCustomDates ? 'review-cost-matrix__leg-row--custom-dates' : ''}">
                    <div class="review-cost-matrix__cell">${this._escapeHtml(leg.location)}</div>
                    <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">—</div>
                    <div class="review-cost-matrix__cell review-cost-matrix__cell--amount ${hasLodgingOverride ? 'review-cost-matrix__cell--override' : ''} ${hasLodgingOverride && (leg.lodgingOverrideAmount || 0) === 0 ? 'review-cost-matrix__cell--na' : ''} ${lodgingHasCustomDates ? 'review-cost-matrix__cell--custom-dates' : ''}">
                      ${hasLodgingOverride && (leg.lodgingOverrideAmount || 0) === 0
                        ? '<span class="review-cost-matrix__na-badge">N/A</span>'
                        : this._formatCurrency(leg.lodging)}
                      ${!(hasLodgingOverride && (leg.lodgingOverrideAmount || 0) === 0) && leg.lodgingNights ? `<span style="opacity:0.7">(${leg.lodgingNights}n)</span>` : ''}
                      ${lodgingDateHtml}
                    </div>
                    <div class="review-cost-matrix__cell review-cost-matrix__cell--amount ${hasMieOverride ? 'review-cost-matrix__cell--override' : ''} ${hasMieOverride && (leg.mieOverrideAmount || 0) === 0 ? 'review-cost-matrix__cell--na' : ''} ${mieHasCustomDates ? 'review-cost-matrix__cell--custom-dates' : ''}">
                      ${hasMieOverride && (leg.mieOverrideAmount || 0) === 0
                        ? '<span class="review-cost-matrix__na-badge">N/A</span>'
                        : this._formatCurrency(leg.mie)}
                      ${!(hasMieOverride && (leg.mieOverrideAmount || 0) === 0) && leg.mieDays ? `<span style="opacity:0.7">(${leg.mieDays}d)</span>` : ''}
                      ${mieDateHtml}
                    </div>
                    <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">—</div>
                    <div class="review-cost-matrix__cell review-cost-matrix__cell--total review-cost-matrix__cell--total--sub">
                      ${this._formatCurrency(leg.lodging + leg.mie)}
                    </div>
                  </div>
                `;

                // Inline override details for this leg
                if (hasLodgingOverride) {
                  var isLodgingNa = (leg.lodgingOverrideAmount || 0) === 0;
                  var lodgingReasonClickable = leg.lodgingReason && leg.lodgingReason.length > 50;
                  html += `
                    <div class="review-cost-matrix__override-row">
                      <div class="review-cost-override ${isLodgingNa ? 'review-cost-override--na' : ''}">
                        <span class="review-cost-override__header"><i aria-hidden="true" class="fas ${isLodgingNa ? 'fa-ban' : 'fa-info-circle'}"></i> ${isLodgingNa ? 'Lodging Waived (N/A)' : 'Lodging Override'}</span>
                        ${isLodgingNa ? '' : `
                        <span class="review-cost-override__calc">${this._formatCurrency(leg.lodgingCalculated)}</span>
                        <i aria-hidden="true" class="fas fa-arrow-right" style="font-size:0.5rem;color:var(--color-slate-400)"></i>
                        <span class="review-cost-override__final">${this._formatCurrency(leg.lodgingOverrideAmount)}</span>`}
                        ${leg.lodgingReason && leg.lodgingReason !== 'N/A' ? `<span class="review-cost-override__reason ${lodgingReasonClickable ? 'review-cost-override__reason--clickable' : ''}"
                          ${lodgingReasonClickable ? `onclick="TravelReview.Controller.showOverrideFocus('Lodging Override', '${this._escapeAttr(leg.lodgingReason)}'); event.stopPropagation();"` : ''}
                          >"${this._escapeHtml(leg.lodgingReason)}"</span>` : ''}
                      </div>
                    </div>
                  `;
                }
                if (hasMieOverride) {
                  var isMieNa = (leg.mieOverrideAmount || 0) === 0;
                  var mieReasonClickable = leg.mieReason && leg.mieReason.length > 50;
                  html += `
                    <div class="review-cost-matrix__override-row">
                      <div class="review-cost-override ${isMieNa ? 'review-cost-override--na' : ''}">
                        <span class="review-cost-override__header"><i aria-hidden="true" class="fas ${isMieNa ? 'fa-ban' : 'fa-info-circle'}"></i> ${isMieNa ? 'M&IE Waived (N/A)' : 'M&IE Override'}</span>
                        ${isMieNa ? '' : `
                        <span class="review-cost-override__calc">${this._formatCurrency(leg.mieCalculated)}</span>
                        <i aria-hidden="true" class="fas fa-arrow-right" style="font-size:0.5rem;color:var(--color-slate-400)"></i>
                        <span class="review-cost-override__final">${this._formatCurrency(leg.mieOverrideAmount)}</span>`}
                        ${leg.mieReason && leg.mieReason !== 'N/A' ? `<span class="review-cost-override__reason ${mieReasonClickable ? 'review-cost-override__reason--clickable' : ''}"
                          ${mieReasonClickable ? `onclick="TravelReview.Controller.showOverrideFocus('M&IE Override', '${this._escapeAttr(leg.mieReason)}'); event.stopPropagation();"` : ''}
                          >"${this._escapeHtml(leg.mieReason)}"</span>` : ''}
                      </div>
                    </div>
                  `;
                }
              }
            }
          });
          html += `</div>`;
        }
      });

      // Subtotal row
      html += `
          <div class="review-cost-matrix__row review-cost-matrix__row--subtotal">
            <div class="review-cost-matrix__cell review-cost-matrix__cell--name">Traveler Subtotal</div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">${this._formatCurrency(costSummary.transportTotal)}</div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">${this._formatCurrency(costSummary.lodgingTotal)}</div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">${this._formatCurrency(costSummary.mieTotal)}</div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--amount">${this._formatCurrency(costSummary.otherTotal)}</div>
            <div class="review-cost-matrix__cell review-cost-matrix__cell--total">${this._formatCurrency(request.travelerTotal)}</div>
          </div>
        </div>
      </div>
      `;

      // ===== SHARED COSTS BREAKDOWN =====
      const sharedCosts = request.sharedCosts || {};
      const hasSharedCosts =
        (sharedCosts.facilities?.amount || 0) > 0 ||
        (sharedCosts.audioVisual?.amount || 0) > 0 ||
        (sharedCosts.logistics?.amount || 0) > 0 ||
        (sharedCosts.other?.amount || 0) > 0;

      // Always show in edit mode, or if there are shared costs
      if (isEditMode || hasSharedCosts) {
        const sharedTotal =
          (parseFloat(sharedCosts.facilities?.amount) || 0) +
          (parseFloat(sharedCosts.audioVisual?.amount) || 0) +
          (parseFloat(sharedCosts.logistics?.amount) || 0) +
          (parseFloat(sharedCosts.other?.amount) || 0);

        html += `
          <div class="review-cost-shared ${isEditMode ? 'review-cost-shared--editing' : ''}">
            <div class="review-cost-shared__header" ${!isEditMode ? 'role="button" tabindex="0" aria-label="Toggle shared costs section" onclick="TravelReview.Controller.toggleSharedCosts()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}"' : ''}>
              <span><i aria-hidden="true" class="fas fa-building"></i> Shared Costs</span>
              <span class="review-cost-shared__total" id="sharedCostsTotal">${this._formatCurrency(sharedTotal)}</span>
              ${!isEditMode ? '<i aria-hidden="true" class="fas fa-chevron-down review-cost-shared__toggle" id="sharedCostsToggle"></i>' : ''}
            </div>
            <div class="review-cost-shared__body ${isEditMode ? '' : 'hidden'}" id="sharedCostsBody">
        `;

        if (isEditMode) {
          // EDIT MODE - Show all 4 categories with inputs
          html += this._renderSharedCostEditItem('facilities', 'Facilities/Space', sharedCosts.facilities);
          html += this._renderSharedCostEditItem('audioVisual', 'Audio/Visual', sharedCosts.audioVisual);
          html += this._renderSharedCostEditItem('logistics', 'Logistics', sharedCosts.logistics);
          html += this._renderSharedCostEditItem('other', 'Other', sharedCosts.other);
        } else {
          // VIEW MODE - Only show categories with values
          if ((sharedCosts.facilities?.amount || 0) > 0) {
            html += this._renderSharedCostItem('Facilities/Space', sharedCosts.facilities.amount, sharedCosts.facilities.description);
          }
          if ((sharedCosts.audioVisual?.amount || 0) > 0) {
            html += this._renderSharedCostItem('Audio/Visual', sharedCosts.audioVisual.amount, sharedCosts.audioVisual.description);
          }
          if ((sharedCosts.logistics?.amount || 0) > 0) {
            html += this._renderSharedCostItem('Logistics', sharedCosts.logistics.amount, sharedCosts.logistics.description);
          }
          if ((sharedCosts.other?.amount || 0) > 0) {
            html += this._renderSharedCostItem('Other', sharedCosts.other.amount, sharedCosts.other.description);
          }
        }

        // Close shared costs container
        html += `
            </div>
          </div>
        `;
      }

      // Add save/cancel buttons in edit mode
      if (isEditMode) {
        html += `
          <div class="review-costs-edit__actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="TravelReview.Controller.cancelCostsEdit()">
              Cancel
            </button>
            <button type="button" class="btn btn-sm btn-primary" onclick="TravelReview.Controller.saveTravelerLegCosts()">
              <i aria-hidden="true" class="fas fa-save"></i> Save Changes
            </button>
          </div>
        `;
      }

      document.getElementById('costsContent').innerHTML = html;

      // Initialize date pickers after render
      if (isEditMode) {
        // Use setTimeout to ensure DOM is ready
        setTimeout(() => {
          this._initLegCostDatePickers();
          // Auto-expand all traveler details in edit mode
          travelers.forEach((traveler, index) => {
            const travelerId = traveler.travelerId || `traveler-cost-${index}`;
            const details = document.getElementById(`leg-details-${travelerId}`);
            const icon = document.getElementById(`expand-${travelerId}`);
            const row = document.querySelector(`[data-traveler-id="${travelerId}"]`);
            if (details) {
              details.classList.remove('hidden');
              if (icon) icon.style.transform = 'rotate(90deg)';
              if (row) row.classList.add('review-cost-matrix__row--expanded');
            }
          });
        }, 0);
      }
    },

    _calculateCostSummary(travelers, request) {
      let lodgingTotal = 0, mieTotal = 0, transportTotal = 0, otherTotal = 0;
      let lodgingOverrides = 0, mieOverrides = 0;

      travelers.forEach(traveler => {
        transportTotal += traveler.transportationTotal || 0;
        otherTotal += traveler.otherTotal || 0;

        if (traveler.legCosts) {
          traveler.legCosts.forEach(legCost => {
            lodgingTotal += legCost.lodgingTotal || 0;
            mieTotal += legCost.mieTotal || 0;

            if (legCost.lodgingOverride) lodgingOverrides++;
            if (legCost.mieOverride) mieOverrides++;
          });
        }
      });

      return {
        lodgingTotal,
        mieTotal,
        transportTotal,
        otherTotal,
        lodgingOverrides,
        mieOverrides,
        totalOverrides: lodgingOverrides + mieOverrides
      };
    },

    _getTravelerCostBreakdown(traveler, legs) {
      let lodging = 0, mie = 0, lodgingOverride = false, mieOverride = false;
      let legDetails = [];

      if (traveler.legCosts) {
        traveler.legCosts.forEach(legCost => {
          lodging += legCost.lodgingTotal || 0;
          mie += legCost.mieTotal || 0;

          if (legCost.lodgingOverride) lodgingOverride = true;
          if (legCost.mieOverride) mieOverride = true;

          // Find the leg info for location name
          const leg = legs ? legs.find(l => l.legId === legCost.legId) : null;
          const location = leg ? (leg.locationDisplay || `Leg ${leg.legNumber}`) : 'Unknown';

          legDetails.push({
            // IDs for editing
            legId: legCost.legId,
            travelerId: legCost.travelerId || traveler.travelerId,
            // Independent lodging dates
            lodgingStartDate: legCost.lodgingStartDate,
            lodgingEndDate: legCost.lodgingEndDate,
            lodgingUsesItineraryDates: legCost.lodgingUsesItineraryDates,
            // Independent M&IE dates
            mieStartDate: legCost.mieStartDate,
            mieEndDate: legCost.mieEndDate,
            mieUsesItineraryDates: legCost.mieUsesItineraryDates,
            // Itinerary dates for constraints
            itineraryStartDate: leg?.startDate,
            itineraryEndDate: leg?.endDate,
            // Display
            location,
            lodging: legCost.lodgingTotal || 0,
            mie: legCost.mieTotal || 0,
            lodgingNights: legCost.lodgingNights,
            mieDays: legCost.mieDays,
            // Rates for recalculation
            lodgingRate: legCost.lodgingRate || leg?.lodgingRate || 0,
            mieRate: legCost.mieRate || leg?.mieRate || 0,
            // Override data
            lodgingOverride: legCost.lodgingOverride,
            mieOverride: legCost.mieOverride,
            lodgingCalculated: legCost.lodgingCalculated,
            lodgingOverrideAmount: legCost.lodgingOverrideAmount,
            lodgingReason: legCost.lodgingOverrideReason,
            mieCalculated: legCost.mieCalculated,
            mieOverrideAmount: legCost.mieOverrideAmount,
            mieReason: legCost.mieOverrideReason,
            // Local travel fields
            isLocalTravel: legCost.isLocalTravel || false,
            localMilesDriven: legCost.localMilesDriven || 0,
            wasGovVehicleAvailable: legCost.wasGovVehicleAvailable || false,
            localParking: legCost.localParking || 0,
            localTolls: legCost.localTolls || 0,
            localTravelTotal: legCost.localTravelTotal || 0,
            // Traveler-level commute info for context. Telework forces
            // these to 0 for display/calc; the stored values stay intact
            // on the traveler object so toggling the flag preserves input.
            normalCommuteDistance: traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteDistance || 0),
            normalCommuteParking: traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteParking || 0)
          });
        });
      }

      return {
        transport: traveler.transportationTotal || 0,
        transportMode: traveler.transportMode || '',
        ticketCost: traveler.ticketCost || 0,
        totalMiles: traveler.totalMiles || 0,
        mileageRate: traveler.mileageRate || 0,
        needsRentalCar: traveler.needsRentalCar || false,
        rentalCarCost: traveler.rentalCarCost || 0,
        lodging,
        mie,
        other: traveler.otherTotal || 0,
        lodgingOverride,
        mieOverride,
        legDetails
      };
    },

    _renderSharedCostItem(label, amount, description) {
      return `
        <div class="review-cost-shared__item">
          <div class="review-cost-shared__item-info">
            <span class="review-cost-shared__item-label">${this._escapeHtml(label)}</span>
            ${description ? `<span class="review-cost-shared__item-desc">${this._escapeHtml(description)}</span>` : ''}
          </div>
          <span class="review-cost-shared__item-amount">${this._formatCurrency(amount)}</span>
        </div>
      `;
    },

    _renderSharedCostEditItem(category, label, data) {
      const amount = data?.amount || 0;
      const description = data?.description || '';

      // Icon mapping for categories
      const icons = {
        facilities: 'fa-building',
        audioVisual: 'fa-microphone',
        logistics: 'fa-truck',
        other: 'fa-ellipsis-h'
      };
      const icon = icons[category] || 'fa-tag';

      return `
        <div class="review-cost-shared__edit-row ${amount > 0 ? 'review-cost-shared__edit-row--filled' : ''}">
          <span class="review-cost-shared__edit-label">
            <i aria-hidden="true" class="fas ${icon}"></i>
            ${this._escapeHtml(label)}
          </span>
          <div class="review-cost-shared__edit-amount">
            <span class="review-cost-shared__edit-currency">$</span>
            <input type="number"
                   class="review-cost-shared__edit-amount-input"
                   placeholder="0.00"
                   step="0.01"
                   min="0"
                   value="${amount > 0 ? amount : ''}"
                   oninput="TravelReview.Controller.updateSharedCost('${category}', 'amount', this.value)">
          </div>
          <input type="text"
                 class="review-cost-shared__edit-desc"
                 placeholder="Description (optional)"
                 value="${this._escapeAttr(description)}"
                 oninput="TravelReview.Controller.updateSharedCost('${category}', 'description', this.value)">
        </div>
      `;
    },

    toggleSharedCosts() {
      const body = document.getElementById('sharedCostsBody');
      const toggle = document.getElementById('sharedCostsToggle');
      const isHidden = body.classList.contains('hidden');
      body.classList.toggle('hidden');
      toggle.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
    },

    toggleTravelerCostDetails(travelerId) {
      const details = document.getElementById(`leg-details-${travelerId}`);
      const icon = document.getElementById(`expand-${travelerId}`);
      const row = document.querySelector(`[data-traveler-id="${travelerId}"]`);

      if (details && icon) {
        const isHidden = details.classList.contains('hidden');
        details.classList.toggle('hidden');
        icon.style.transform = isHidden ? 'rotate(90deg)' : 'rotate(0deg)';
        if (row) row.classList.toggle('review-cost-matrix__row--expanded', isHidden);
      }
    },

    // =========================================================================
    // TRAVELER LEG COSTS - Edit Mode Helpers

    /**

    /**
     * Render editable transport section for a traveler
     * Uses familiar card-based UI from the form
     */
    _renderTransportEditSection(traveler, travelerCosts) {
      const travelerId = traveler.travelerId;
      const transportMode = travelerCosts.transportMode || '';
      const isMileage = transportMode === 'private' || transportMode === 'gov';
      const isRentalMode = transportMode === 'rental';

      // Transport mode cards - compact version of form's tc__transport-cards
      const modes = [
        { mode: 'air', icon: 'fa-plane', label: 'Air' },
        { mode: 'rail', icon: 'fa-train', label: 'Rail' },
        { mode: 'rental', icon: 'fa-car', label: 'Rental' },
        { mode: 'private', icon: 'fa-car-side', label: 'POV' },
        { mode: 'gov', icon: 'fa-car-side', label: 'GOV', isGov: true }
      ];

      const modeCards = modes.map(m => `
        <button type="button"
                class="review-transport__card ${transportMode === m.mode ? 'review-transport__card--selected' : ''} ${m.isGov ? 'review-transport__card--gov' : ''}"
                data-mode="${m.mode}"
                onclick="TravelReview.Controller.updateTravelerTransport('${travelerId}', 'transportMode', '${m.mode}')">
          <i aria-hidden="true" class="fas ${m.icon}"></i>
          <span>${m.label}</span>
        </button>
      `).join('');

      return `
        <div class="review-transport-edit" id="transportEdit_${travelerId}">

                         placeholder="0.00"

              </div>
              <div class="review-transport__mileage ${isMileage ? '' : 'review-transport__mileage--hidden'}" id="transportMileWrap_${travelerId}">

                  <input type="checkbox"
                         ${travelerCosts.needsRentalCar ? 'checked' : ''}
                         onchange="TravelReview.Controller.updateTravelerTransport('${travelerId}', 'needsRentalCar', this.checked)">

                  <span>Rental</span>
                </label>

                           class="form-control review-transport__amount"

    /**
     * Update traveler transport costs
     */
    updateTravelerTransport(travelerId, field, value) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler) return;

      const isMileageMode = (mode) => mode === 'private' || mode === 'gov';

      if (field === 'transportMode') {
        const prevMode = traveler.transportMode || '';
        traveler.transportMode = value;

        // Update card selection UI
        const container = document.getElementById(`transportEdit_${travelerId}`);
        if (container) {
          container.querySelectorAll('.review-transport__card').forEach(card => {
            const isSelected = card.dataset.mode === value;
            card.classList.toggle('review-transport__card--selected', isSelected);
          });

          // Toggle cost vs mileage inputs
          const costWrap = document.getElementById(`transportCostWrap_${travelerId}`);
          const mileWrap = document.getElementById(`transportMileWrap_${travelerId}`);
          const rentalToggle = document.getElementById(`rentalToggleWrap_${travelerId}`);

          if (costWrap) costWrap.classList.toggle('review-transport__cost--hidden', isMileageMode(value));
          if (mileWrap) mileWrap.classList.toggle('review-transport__mileage--hidden', !isMileageMode(value));

          // Hide rental option when primary mode is rental
          if (rentalToggle) rentalToggle.classList.toggle('review-transport__rental-toggle--hidden', value === 'rental');

          // Clear ticket cost when switching TO mileage mode (POV/GOV)
          if (isMileageMode(value) && !isMileageMode(prevMode)) {
            traveler.ticketCost = 0;
            // Clear the ticket cost input field
            const costInput = container.querySelector('.review-transport__cost input');
            if (costInput) {
              costInput.value = '';
            }
          }

          // Update mileage rate whenever switching to or between mileage modes
          if (isMileageMode(value)) {
            // Set proper mileage rate from TravelCostService
            traveler.mileageRate = TravelCostService.getMileageRate(value === 'gov' ? 'gov' : 'private');
            // Update the rate display
            const calcEl = container.querySelector('.review-transport__calc');
            if (calcEl) {
              calcEl.textContent = `× $${traveler.mileageRate.toFixed(3)}`;
            }
          }

          // Clear mileage when switching FROM mileage mode to non-mileage
          if (!isMileageMode(value) && isMileageMode(prevMode)) {
            traveler.totalMiles = 0;
            traveler.mileageRate = 0;
            // Clear the mileage input field
            const mileInput = container.querySelector('.review-transport__miles');
            if (mileInput) {
              mileInput.value = '';
            }
          }

          // Clear rental if switching TO rental mode
          if (value === 'rental') {
            traveler.needsRentalCar = false;
            traveler.rentalCarCost = 0;
            // Uncheck the rental checkbox and clear the input
            const rentalCheckbox = container.querySelector('.review-transport__rental-label input[type="checkbox"]');
            if (rentalCheckbox) {
              rentalCheckbox.checked = false;
            }
            const rentalCostWrap = document.getElementById(`rentalCostWrap_${travelerId}`);
            if (rentalCostWrap) {
              rentalCostWrap.classList.add('review-transport__rental-cost--hidden');
              const rentalInput = rentalCostWrap.querySelector('input');
              if (rentalInput) {
                rentalInput.value = '';
              }
            }
          }
        }

        // Recalculate total
        this._recalcTransportTotal(traveler);
        this._updateTransportTotalDisplay(travelerId, traveler.transportationTotal);

      } else if (field === 'totalMiles') {
        traveler.totalMiles = parseInt(value) || 0;
        this._recalcTransportTotal(traveler);
        this._updateTransportTotalDisplay(travelerId, traveler.transportationTotal);

      } else if (field === 'ticketCost') {
        traveler.ticketCost = parseFloat(value) || 0;
        this._recalcTransportTotal(traveler);
        this._updateTransportTotalDisplay(travelerId, traveler.transportationTotal);

      } else if (field === 'needsRentalCar') {
        traveler.needsRentalCar = value;
        // Show/hide rental cost input
        const rentalCostWrap = document.getElementById(`rentalCostWrap_${travelerId}`);
        if (rentalCostWrap) {
          rentalCostWrap.classList.toggle('review-transport__rental-cost--hidden', !value);
        }
        // Clear rental cost if unchecked
        if (!value) {
          traveler.rentalCarCost = 0;
          // Clear the input field as well
          const rentalInput = rentalCostWrap?.querySelector('input');
          if (rentalInput) {
            rentalInput.value = '';
          }
        }
        this._recalcTransportTotal(traveler);
        this._updateTransportTotalDisplay(travelerId, traveler.transportationTotal);

      } else if (field === 'rentalCarCost') {
        traveler.rentalCarCost = parseFloat(value) || 0;
        this._recalcTransportTotal(traveler);
        this._updateTransportTotalDisplay(travelerId, traveler.transportationTotal);
      }
    },

    /**
     * Recalculate transport total for a traveler
     */
    _recalcTransportTotal(traveler) {
      const mode = traveler.transportMode || '';
      const isMileage = mode === 'private' || mode === 'gov';

      if (isMileage) {
        // Use traveler's rate or get from TravelCostService
        const rate = traveler.mileageRate || TravelCostService.getMileageRate(mode === 'gov' ? 'gov' : 'private');
        traveler.mileageRate = rate; // Ensure it's set
        traveler.transportationTotal = (traveler.totalMiles || 0) * rate;
      } else {
        traveler.transportationTotal = traveler.ticketCost || 0;
      }

      if (traveler.needsRentalCar && mode !== 'rental') {
        traveler.transportationTotal += traveler.rentalCarCost || 0;
      }
    },

    /**
     * Update the transport total display
     */
    _updateTransportTotalDisplay(travelerId, total) {
      const totalEl = document.getElementById(`transportTotal_${travelerId}`);
      if (totalEl) {
        totalEl.textContent = this._formatCurrency(total || 0);
      }
    },

    /**
     * Render local travel edit row for a single leg
     * Uses the same tc__local-* structure as the form for consistency
     */
    _renderLocalTravelEditRow(leg, travelerId, legEditId, totalLegs) {
      const privateRate = TravelCostService.getMileageRate('private');
      const govRate = TravelCostService.getMileageRate('gov');
      const currentRate = leg.wasGovVehicleAvailable ? govRate : privateRate;
      const reimbursableMiles = Math.max(0, (leg.localMilesDriven || 0) - (leg.normalCommuteDistance || 0));
      const mileageAmount = reimbursableMiles * currentRate;
      const excessParking = Math.max(0, (leg.localParking || 0) - (leg.normalCommuteParking || 0));
      const tollsAmount = leg.localTolls || 0;
      const calculatedTotal = mileageAmount + excessParking + tollsAmount;

      return `
        <div class="tc__local-leg" data-leg-id="${leg.legId}" data-leg-edit-id="${legEditId}">
          <div class="tc__local-leg-header">
            <span class="tc__local-location">
              <i aria-hidden="true" class="fas fa-car" style="margin-right:0.25rem;"></i>
              ${this._escapeHtml(leg.location)}
            </span>
            <span class="tc__local-badge">Local Travel</span>
            <span class="tc__local-leg-total" id="tcLegSubtotal_${legEditId}">
              ${this._formatCurrency(calculatedTotal)}
            </span>
            ${totalLegs > 1 ? `
              <button type="button" class="tc__local-remove"
                      onclick="TravelReview.Controller.removeTravelerFromLeg('${travelerId}', '${leg.legId}'); event.stopPropagation();"

            ` : ''}

              <span class="tc__local-label"><i aria-hidden="true" class="fas fa-road"></i> Miles Driven</span>
