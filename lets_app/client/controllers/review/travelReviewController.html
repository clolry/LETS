    /**
     * Initialize date pickers for leg cost edit inputs after render
     */
    _initLegCostDatePickers() {
      const dateInputs = document.querySelectorAll('.leg-cost-date-input');

      // Store flatpickr instances for cross-referencing
      if (!this._legCostDatePickers) {
        this._legCostDatePickers = {};
      }

      dateInputs.forEach(input => {
        const travelerId = input.dataset.travelerId;
        const legId = input.dataset.legId;
        const field = input.dataset.field;
        const costType = input.dataset.costType; // 'lodging' or 'mie'
        const itineraryStart = input.dataset.itineraryStart;
        const itineraryEnd = input.dataset.itineraryEnd;
        const chipId = input.parentElement.id;
        const legEditId = `${travelerId}-${legId}`;

        // Calculate date constraints: ±7 days from itinerary dates
        let minDateBound = null;
        let maxDateBound = null;

        if (itineraryStart) {
          const start = new Date(itineraryStart);
          start.setDate(start.getDate() - 7);
          minDateBound = start.toISOString().split('T')[0];
        }
        if (itineraryEnd) {
          const end = new Date(itineraryEnd);
          end.setDate(end.getDate() + 7);
          maxDateBound = end.toISOString().split('T')[0];
        }

        // Determine if this is a start or end date field
        const isStartField = field.includes('Start');
        const isEndField = field.includes('End');

        // Get the corresponding end/start input ID
        const endFieldId = field.replace('Start', 'End');
        const startFieldId = field.replace('End', 'Start');

        const fpInstance = flatpickr(input, {
          dateFormat: 'Y-m-d',
          altInput: true,
          altFormat: 'M j, Y',
          minDate: minDateBound,
          maxDate: maxDateBound,
          allowInput: false,
          onChange: (selectedDates, dateStr) => {
            this.updateTravelerLegDate(travelerId, legId, field, dateStr, costType);

            // Toggle filled class
            const chip = document.getElementById(chipId);
            if (chip) {
              chip.classList.toggle('date-chip--filled', !!dateStr);
            }

            // If this is a start date, handle end date logic
            if (isStartField && dateStr) {
              const endPickerKey = `${legEditId}_${endFieldId}`;
              const endPicker = this._legCostDatePickers[endPickerKey];

              if (endPicker) {
                // Update end picker's minDate to be the start date
                endPicker.set('minDate', dateStr);

                // If current end date is before new start date, clear it
                const currentEndDate = endPicker.selectedDates[0];
                if (currentEndDate && new Date(dateStr) > currentEndDate) {
                  endPicker.clear();
                  // Also clear the data
                  this.updateTravelerLegDate(travelerId, legId, endFieldId, '', costType);
                  // Update chip styling
                  const endChip = endPicker.input.parentElement;
                  if (endChip) {
                    endChip.classList.remove('date-chip--filled');
                  }
                }
              }
            }

            // If this is an end date, ensure start date picker's maxDate is updated
            if (isEndField && dateStr) {
              const startPickerKey = `${legEditId}_${startFieldId}`;
              const startPicker = this._legCostDatePickers[startPickerKey];

              if (startPicker) {
                // Update start picker's maxDate to be the end date
                startPicker.set('maxDate', dateStr);
              }
            }

            // Update custom badge visibility for this cost type
            this._updateCustomBadge(travelerId, legId, costType);
          }
        });

        // Store the instance
        const pickerKey = `${legEditId}_${field}`;
        this._legCostDatePickers[pickerKey] = fpInstance;
      });

      // Second pass: set initial constraints based on existing values
      dateInputs.forEach(input => {
        const travelerId = input.dataset.travelerId;
        const legId = input.dataset.legId;
        const field = input.dataset.field;
        const legEditId = `${travelerId}-${legId}`;

        const isStartField = field.includes('Start');

        if (isStartField) {
          const startPickerKey = `${legEditId}_${field}`;
          const endFieldId = field.replace('Start', 'End');
          const endPickerKey = `${legEditId}_${endFieldId}`;

          const startPicker = this._legCostDatePickers[startPickerKey];
          const endPicker = this._legCostDatePickers[endPickerKey];

          // If start has a value, constrain end's minDate
          if (startPicker && endPicker && startPicker.selectedDates[0]) {
            const startDate = startPicker.selectedDates[0];
            endPicker.set('minDate', startDate);
          }

          // If end has a value, constrain start's maxDate
          if (startPicker && endPicker && endPicker.selectedDates[0]) {
            const endDate = endPicker.selectedDates[0];
            startPicker.set('maxDate', endDate);
          }
        }
      });
    },

    /**
     * Update custom badge visibility after date change
     */
    _updateCustomBadge(travelerId, legId, costType) {
      const legEditId = `${travelerId}-${legId}`;
      const container = document.querySelector(`[data-leg-edit-id="${legEditId}"]`);
      if (!container) return;

      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler || !traveler.legCosts) return;

      const legCost = traveler.legCosts.find(lc => lc.legId === legId);
      if (!legCost) return;

      // Find the cost group for this type and update its custom state
      const groups = container.querySelectorAll('.review-leg-edit__cost-group');
      groups.forEach(group => {
        const icon = group.querySelector('.review-leg-edit__cost-header i');
        if (icon) {
          const isLodging = icon.classList.contains('fa-bed');
          const isMie = icon.classList.contains('fa-utensils');

          if (isLodging) {
            group.classList.toggle('review-leg-edit__cost-group--custom', legCost.lodgingUsesItineraryDates === false);
          } else if (isMie) {
            group.classList.toggle('review-leg-edit__cost-group--custom', legCost.mieUsesItineraryDates === false);
          }
        }
      });

      // Update parent container custom state
      const hasAnyCustom = legCost.lodgingUsesItineraryDates === false || legCost.mieUsesItineraryDates === false;
      container.classList.toggle('review-leg-edit--custom-dates', hasAnyCustom);
    },

    /**
     * Update traveler leg date for independent lodging/M&IE date ranges
     */
    updateTravelerLegDate(travelerId, legId, field, value, costType) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler || !traveler.legCosts) return;

      const legCost = traveler.legCosts.find(lc => lc.legId === legId);
      if (!legCost) return;

      // Handle independent date fields
      if (field === 'lodgingStartDate' || field === 'lodgingEndDate') {
        legCost[field] = value;
        legCost.lodgingUsesItineraryDates = false;
      } else if (field === 'mieStartDate' || field === 'mieEndDate') {
        legCost[field] = value;
        legCost.mieUsesItineraryDates = false;
      } else if (field === 'startDate') {
        // Legacy: update both
        legCost.lodgingStartDate = value;
        legCost.mieStartDate = value;
        legCost.lodgingUsesItineraryDates = false;
        legCost.mieUsesItineraryDates = false;
      } else if (field === 'endDate') {
        // Legacy: update both
        legCost.lodgingEndDate = value;
        legCost.mieEndDate = value;
        legCost.lodgingUsesItineraryDates = false;
        legCost.mieUsesItineraryDates = false;
      } else {
        legCost[field] = value;
      }

      console.log(`Updated ${field} for traveler ${travelerId}, leg ${legId}: ${value}`);
    },

    /**
     * Update traveler leg override
     */
    updateTravelerLegOverride(travelerId, legId, type, value) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler || !traveler.legCosts) return;

      const legCost = traveler.legCosts.find(lc => lc.legId === legId);
      if (!legCost) return;

      if (type === 'lodging') {
        const numValue = parseFloat(value);
        if (!isNaN(numValue) && numValue > 0) {
          legCost.lodgingOverride = true;
          legCost.lodgingOverrideAmount = numValue;
        } else {
          legCost.lodgingOverride = false;
          legCost.lodgingOverrideAmount = 0;
        }
      } else if (type === 'lodgingNa') {
        const isCurrentlyNa = legCost.lodgingOverride && (legCost.lodgingOverrideAmount || 0) === 0;
        if (isCurrentlyNa) {
          legCost.lodgingOverride = false;
          legCost.lodgingOverrideAmount = 0;
          legCost.lodgingOverrideReason = '';
        } else {
          legCost.lodgingOverride = true;
          legCost.lodgingOverrideAmount = 0;
          legCost.lodgingOverrideReason = 'N/A';
        }
      } else if (type === 'lodgingReason') {
        legCost.lodgingOverrideReason = value;
      } else if (type === 'mie') {
        const numValue = parseFloat(value);
        if (!isNaN(numValue) && numValue > 0) {
          legCost.mieOverride = true;
          legCost.mieOverrideAmount = numValue;
        } else {
          legCost.mieOverride = false;
          legCost.mieOverrideAmount = 0;
        }
      } else if (type === 'mieNa') {
        const isCurrentlyNa = legCost.mieOverride && (legCost.mieOverrideAmount || 0) === 0;
        if (isCurrentlyNa) {
          legCost.mieOverride = false;
          legCost.mieOverrideAmount = 0;
          legCost.mieOverrideReason = '';
        } else {
          legCost.mieOverride = true;
          legCost.mieOverrideAmount = 0;
          legCost.mieOverrideReason = 'N/A';
        }
      } else if (type === 'mieReason') {
        legCost.mieOverrideReason = value;
      }
    },

    /**
     * Update traveler commute info and recalculate all local travel legs
     */
    updateTravelerCommute(travelerId, field, value) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler) return;

      // Update the field
      if (field === 'isFullTimeTelework') {
        traveler.isFullTimeTelework = value === true || value === 'true';
        // Don't clear normalCommuteDistance/Parking on toggle. Telework means
        // "treat commute as 0 for this calc" — but we keep the original
        // values intact so an accidental toggle doesn't lose user input.
        // The effective values below apply 0 when telework is on; the saved
        // payload still sends the original numbers + the telework flag.
        const commuteFields = document.getElementById(`tcCommuteFields_${travelerId}`);
        if (commuteFields) {
          commuteFields.classList.toggle('hidden', traveler.isFullTimeTelework);
        }
      } else if (field === 'normalCommuteDistance') {
        traveler.normalCommuteDistance = parseInt(value) || 0;
      } else if (field === 'normalCommuteParking') {
        traveler.normalCommuteParking = parseFloat(value) || 0;
      }

      // Effective commute values for the recalc — telework forces them to 0
      // without mutating the stored values.
      const effectiveCommuteDistance = traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteDistance || 0);
      const effectiveCommuteParking = traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteParking || 0);

      // Recalculate ALL local travel legs for this traveler
      if (traveler.legCosts) {
        traveler.legCosts.forEach(legCost => {
          if (legCost.isLocalTravel) {
            // Recalculate with new commute values
            const mileageRate = TravelCostService.getMileageRate(legCost.wasGovVehicleAvailable ? 'gov' : 'private');
            const reimbursableMiles = Math.max(0, (legCost.localMilesDriven || 0) - effectiveCommuteDistance);
            const mileageAmount = reimbursableMiles * mileageRate;
            const excessParking = Math.max(0, (legCost.localParking || 0) - effectiveCommuteParking);
            const tollsAmount = legCost.localTolls || 0;
            legCost.localTravelTotal = mileageAmount + excessParking + tollsAmount;

            // Update UI for this leg
            const legEditId = `${travelerId}-${legCost.legId}`;
            const mileageCalcEl = document.getElementById(`tcLocalMileageCalc_${legEditId}`);
            if (mileageCalcEl) {
              mileageCalcEl.textContent = `Reimbursable: ${reimbursableMiles} mi × $${mileageRate.toFixed(3)}`;
            }
            const mileageAmtEl = document.getElementById(`tcLocalMileageAmt_${legEditId}`);
            if (mileageAmtEl) {
              mileageAmtEl.textContent = this._formatCurrency(mileageAmount);
            }
            const parkingCalcEl = document.getElementById(`tcLocalParkingCalc_${legEditId}`);
            if (parkingCalcEl) {
              parkingCalcEl.textContent = effectiveCommuteParking > 0
                ? `Excess over $${effectiveCommuteParking.toFixed(2)} commute`
                : 'Fully reimbursable';
            }
            const parkingAmtEl = document.getElementById(`tcLocalParkingAmt_${legEditId}`);
            if (parkingAmtEl) {
              parkingAmtEl.textContent = this._formatCurrency(excessParking);
            }
            const legSubtotalEl = document.getElementById(`tcLegSubtotal_${legEditId}`);
            if (legSubtotalEl) {
              legSubtotalEl.textContent = this._formatCurrency(legCost.localTravelTotal);
            }
          }
        });
      }

      console.log(`Updated commute ${field} for traveler ${travelerId}: ${value}`);
    },

    /**
     * Update traveler local travel fields and recalculate totals
     */
    updateTravelerLocalTravel(travelerId, legId, field, value) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler || !traveler.legCosts) return;

      const legCost = traveler.legCosts.find(lc => lc.legId === legId);
      if (!legCost) return;

      // Update the field
      if (field === 'localMilesDriven') {
        legCost.localMilesDriven = parseInt(value) || 0;
      } else if (field === 'wasGovVehicleAvailable') {
        legCost.wasGovVehicleAvailable = value === true || value === 'true';
      } else if (field === 'localParking') {
        legCost.localParking = parseFloat(value) || 0;
      } else if (field === 'localTolls') {
        legCost.localTolls = parseFloat(value) || 0;
      }

      // Recalculate local travel total — telework forces commute to 0 in
      // the math without mutating the stored values, so toggling on/off
      // doesn't lose user input.
      const effectiveCommuteDistance = traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteDistance || 0);
      const effectiveCommuteParking = traveler.isFullTimeTelework ? 0 : (traveler.normalCommuteParking || 0);
      const mileageRate = TravelCostService.getMileageRate(legCost.wasGovVehicleAvailable ? 'gov' : 'private');
      const reimbursableMiles = Math.max(0, (legCost.localMilesDriven || 0) - effectiveCommuteDistance);
      const mileageAmount = reimbursableMiles * mileageRate;
      const excessParking = Math.max(0, (legCost.localParking || 0) - effectiveCommuteParking);
      const tollsAmount = legCost.localTolls || 0;
      legCost.localTravelTotal = mileageAmount + excessParking + tollsAmount;

      // Update UI elements (using tc__ element IDs)
      const legEditId = `${travelerId}-${legId}`;

      // Update mileage calculation display
      const mileageCalcEl = document.getElementById(`tcLocalMileageCalc_${legEditId}`);
      if (mileageCalcEl) {
        mileageCalcEl.textContent = `Reimbursable: ${reimbursableMiles} mi × $${mileageRate.toFixed(3)}`;
      }

      // Update mileage amount
      const mileageAmtEl = document.getElementById(`tcLocalMileageAmt_${legEditId}`);
      if (mileageAmtEl) {
        mileageAmtEl.textContent = this._formatCurrency(mileageAmount);
      }

      // Update parking amount
      const parkingAmtEl = document.getElementById(`tcLocalParkingAmt_${legEditId}`);
      if (parkingAmtEl) {
        parkingAmtEl.textContent = this._formatCurrency(excessParking);
      }

      // Update tolls amount
      const tollsAmtEl = document.getElementById(`tcLocalTollsAmt_${legEditId}`);
      if (tollsAmtEl) {
        tollsAmtEl.textContent = this._formatCurrency(tollsAmount);
      }

      // Update leg subtotal
      const legSubtotalEl = document.getElementById(`tcLegSubtotal_${legEditId}`);
      if (legSubtotalEl) {
        legSubtotalEl.textContent = this._formatCurrency(legCost.localTravelTotal);
      }

      console.log(`Updated local travel ${field} for traveler ${travelerId}, leg ${legId}: ${value}`);
    },

    /**
     * Remove traveler from a specific leg
     */
    removeTravelerFromLeg(travelerId, legId) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler || !traveler.legCosts) return;

      // Find and remove the leg cost
      const legIndex = traveler.legCosts.findIndex(lc => lc.legId === legId);
      if (legIndex === -1) return;

      // Track the removal for saving
      this._removedLegCosts.push({ travelerId, legId });

      // Remove from local data
      traveler.legCosts.splice(legIndex, 1);

      // Hide the removed row visually
      const row = document.querySelector(`[data-leg-edit-id="${travelerId}-${legId}"]`);
      if (row) {
        row.classList.add('hidden', 'review-cost-matrix__leg-row--removed');
      }

      console.log(`Marked leg ${legId} for removal from traveler ${travelerId}`);
    },

    /**
     * Save all traveler leg cost changes to server
     */
    async saveTravelerLegCosts() {
      const saveBtn = document.querySelector('.review-costs-edit__actions .btn-primary');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Saving...';
      }

      try {
        // Build updates payload
        const updates = {
          requestId: this._requestData.request.requestId,
          sharedCosts: this._requestData.request.sharedCosts || {},
          travelerTransport: [],
          travelerLegCosts: [],
          removedLegCosts: this._removedLegCosts
        };

        // Collect transport and leg cost changes
        this._requestData.travelers.forEach(traveler => {
          // Transport costs and commute info
          updates.travelerTransport.push({
            travelerId: traveler.travelerId,
            transportMode: traveler.transportMode,
            ticketCost: traveler.ticketCost || 0,
            totalMiles: traveler.totalMiles || 0,
            mileageRate: traveler.mileageRate || 0,
            needsRentalCar: traveler.needsRentalCar || false,
            rentalCarCost: traveler.rentalCarCost || 0,
            transportationTotal: traveler.transportationTotal || 0,
            // Commute info for local travel calculations
            isFullTimeTelework: traveler.isFullTimeTelework || false,
            normalCommuteDistance: traveler.normalCommuteDistance || 0,
            normalCommuteParking: traveler.normalCommuteParking || 0
          });

          // Leg costs
          if (traveler.legCosts) {
            traveler.legCosts.forEach(legCost => {
              updates.travelerLegCosts.push({
                travelerId: traveler.travelerId,
                legId: legCost.legId,
                // Flag for local travel legs
                isLocalTravel: legCost.isLocalTravel || false,
                // Independent lodging dates
                lodgingStartDate: legCost.lodgingStartDate,
                lodgingEndDate: legCost.lodgingEndDate,
                lodgingUsesItineraryDates: legCost.lodgingUsesItineraryDates,
                // Independent M&IE dates
                mieStartDate: legCost.mieStartDate,
                mieEndDate: legCost.mieEndDate,
                mieUsesItineraryDates: legCost.mieUsesItineraryDates,
                // Override fields
                lodgingOverride: legCost.lodgingOverride || false,
                lodgingOverrideAmount: legCost.lodgingOverrideAmount || 0,
                lodgingOverrideReason: legCost.lodgingOverrideReason || '',
                mieOverride: legCost.mieOverride || false,
                mieOverrideAmount: legCost.mieOverrideAmount || 0,
                mieOverrideReason: legCost.mieOverrideReason || '',
                // Local travel fields
                localMilesDriven: legCost.localMilesDriven || 0,
                wasGovVehicleAvailable: legCost.wasGovVehicleAvailable || false,
                localParking: legCost.localParking || 0,
                localTolls: legCost.localTolls || 0,
                localTravelTotal: legCost.localTravelTotal || 0
              });
            });
          }
        });

        // Compute detailed field-level changes BEFORE server call overwrites data
        const detailedChanges = this._computeCostChanges(
          this._costsOriginal?.travelers || [],
          this._requestData.travelers,
          this._requestData.legs
        );

        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateCostsForReview(updates);
        });

        if (result && result.success) {
          // Merge totals from server. The client's local state already
          // reflects the user's edits (transport mode, leg cost inputs,
          // shared cost amounts) — we only need server-authoritative
          // recomputed numbers.
          const data = result.data || {};
          this._requestData.request.sharedTotal = data.sharedTotal;
          this._requestData.request.travelerTotal = data.travelerTotal;
          this._requestData.request.grandTotal = data.grandTotal;

          // Per-traveler totals: server returns a {travelerId: {totals}}
          // map. Patch onto the existing traveler objects so legCosts and
          // every other field stay intact.
          if (data.travelerSubtotals) {
            this._requestData.travelers.forEach(t => {
              const updates = data.travelerSubtotals[t.travelerId];
              if (!updates) return;
              if (updates.lodgingTotal !== undefined)        t.lodgingTotal        = updates.lodgingTotal;
              if (updates.mieTotal !== undefined)            t.mieTotal            = updates.mieTotal;
              if (updates.localTravelTotal !== undefined)    t.localTravelTotal    = updates.localTravelTotal;
              if (updates.transportationTotal !== undefined) t.transportationTotal = updates.transportationTotal;
              if (updates.otherTotal !== undefined)          t.otherTotal          = updates.otherTotal;
              if (updates.subtotal !== undefined)            t.subtotal            = updates.subtotal;
            });
          }

          // Update grand total display
          document.getElementById('reviewGrandTotal').textContent = this._formatCurrency(data.grandTotal);

          // Capture totals delta
          const originalTotals = this._costsOriginal || {};
          const removedCount = this._removedLegCosts?.length || 0;
          const oldSharedTotal = parseFloat(originalTotals.sharedTotal) || 0;
          const oldTravelerTotal = parseFloat(originalTotals.travelerTotal) || 0;
          const oldGrandTotal = parseFloat(originalTotals.grandTotal) || 0;

          const changes = {};

          // Include detailed changes
          if (detailedChanges.transportChanges.length > 0) {
            changes.transportChanges = detailedChanges.transportChanges;
          }
          if (detailedChanges.perDiemChanges.length > 0) {
            changes.perDiemChanges = detailedChanges.perDiemChanges;
          }
          if (detailedChanges.localTravelChanges.length > 0) {
            changes.localTravelChanges = detailedChanges.localTravelChanges;
          }

          // Include totals if changed
          if (oldSharedTotal !== data.sharedTotal) {
            changes.sharedTotal = { old: oldSharedTotal, new: data.sharedTotal };
          }
          if (oldTravelerTotal !== data.travelerTotal) {
            changes.travelerTotal = { old: oldTravelerTotal, new: data.travelerTotal };
          }
          if (oldGrandTotal !== data.grandTotal) {
            changes.grandTotal = { old: oldGrandTotal, new: data.grandTotal };
          }

          // Track removed legs
          if (removedCount > 0) {
            changes.removedLegCosts = removedCount;
          }

          // Reset state AFTER capturing changes
          this._costsEditMode = false;
          this._costsOriginal = null;
          this._removedLegCosts = [];
          this._cleanupLegCostDatePickers();

          // Re-render costs section
          this._renderCosts(
            this._requestData.request,
            this._requestData.travelers,
            this._requestData.legs
          );

          // Add local edit history entry if there were changes
          if (Object.keys(changes).length > 0) {
            this._addLocalEditEntry('Edit_Costs', changes);
          }

          console.log('Costs updated successfully');
        } else {
          throw new Error((result && result.error) || 'Failed to save costs');
        }

      } catch (error) {
        console.error('Error saving costs:', error);
        this._showToast('Failed to save changes: ' + (error.message || 'Unknown error'), 'error');

        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-save"></i> Save Changes';
        }
      }
    },

    /**
     * Compute detailed cost changes between original and current traveler data
     * Returns structured change data for edit history display
     */
    _computeCostChanges(originalTravelers, newTravelers, legs) {
      const changes = {
        transportChanges: [],
        perDiemChanges: [],
        localTravelChanges: []
      };

      // Helper to get traveler name
      const getTravelerName = (travelerId) => {
        const traveler = newTravelers.find(t => t.travelerId === travelerId);
        return traveler ? (traveler.employeeName || traveler.name || 'Unknown Traveler') : 'Unknown Traveler';
      };

      // Helper to get leg location
      const getLegLocation = (legId) => {
        const leg = legs?.find(l => l.legId === legId);
        return leg ? (leg.locationDisplay || leg.city || leg.destination || 'Unknown') : 'Unknown';
      };

      // Helper to format date for display
      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };

      // Compare each traveler
      originalTravelers.forEach(origTraveler => {
        const newTraveler = newTravelers.find(t => t.travelerId === origTraveler.travelerId);
        if (!newTraveler) return; // Traveler was removed, handled separately

        const travelerName = newTraveler.employeeName || newTraveler.name || 'Unknown Traveler';
        const travelerId = origTraveler.travelerId;

        // --- TRANSPORT CHANGES ---
        const origMode = origTraveler.transportMode || '';
        const newMode = newTraveler.transportMode || '';
        const modeChanged = origMode !== newMode;

        // Transport mode change
        if (modeChanged) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'transportMode',
            label: 'Transport Type',
            old: origMode || 'air',
            new: newMode || 'air'
          });
        }

        // Transportation total - always track this as it shows the actual cost impact
        const origTotal = parseFloat(origTraveler.transportationTotal) || 0;
        const newTotal = parseFloat(newTraveler.transportationTotal) || 0;
        if (Math.abs(origTotal - newTotal) > 0.01) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'transportationTotal',
            label: 'Transport Cost',
            old: origTotal,
            new: newTotal,
            format: 'currency'
          });
        }

        // Only track detailed field changes if mode didn't change (otherwise total change is sufficient)
        if (!modeChanged) {
          // Ticket cost (for AIR, RAIL, rental) - only if mode is not mileage
          const isMileageMode = newMode === 'private' || newMode === 'gov';
          if (!isMileageMode) {
            const origTicket = parseFloat(origTraveler.ticketCost) || 0;
            const newTicket = parseFloat(newTraveler.ticketCost) || 0;
            if (Math.abs(origTicket - newTicket) > 0.01) {
              const modeLabel = newMode === 'air' ? 'Airfare' :
                               newMode === 'rail' ? 'Rail Fare' :
                               newMode === 'rental' ? 'Rental Cost' : 'Ticket Cost';
              changes.transportChanges.push({
                travelerId,
                travelerName,
                field: 'ticketCost',
                label: modeLabel,
                old: origTicket,
                new: newTicket,
                format: 'currency'
              });
            }
          }

          // Mileage (for POV, GOV) - only if mode is mileage
          if (isMileageMode) {
            const origMiles = parseFloat(origTraveler.totalMiles) || 0;
            const newMiles = parseFloat(newTraveler.totalMiles) || 0;
            if (origMiles !== newMiles) {
              changes.transportChanges.push({
                travelerId,
                travelerName,
                field: 'totalMiles',
                label: 'Mileage',
                old: origMiles,
                new: newMiles,
                format: 'miles'
              });
            }
          }
        }

        // Rental car toggle
        const origRental = origTraveler.needsRentalCar || false;
        const newRental = newTraveler.needsRentalCar || false;
        if (origRental !== newRental) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'needsRentalCar',
            label: 'Rental Car',
            old: origRental ? 'Yes' : 'No',
            new: newRental ? 'Yes' : 'No'
          });
        }

        // Rental car cost
        const origRentalCost = parseFloat(origTraveler.rentalCarCost) || 0;
        const newRentalCost = parseFloat(newTraveler.rentalCarCost) || 0;
        if (origRentalCost !== newRentalCost) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'rentalCarCost',
            label: 'Rental Car Cost',
            old: origRentalCost,
            new: newRentalCost,
            format: 'currency'
          });
        }

        // --- COMMUTE INFO CHANGES (affects local travel calculations) ---
        const origTelework = origTraveler.isFullTimeTelework || false;
        const newTelework = newTraveler.isFullTimeTelework || false;
        if (origTelework !== newTelework) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'isFullTimeTelework',
            label: 'Full-Time Telework',
            old: origTelework ? 'Yes' : 'No',
            new: newTelework ? 'Yes' : 'No'
          });
        }

        const origCommuteDistance = parseFloat(origTraveler.normalCommuteDistance) || 0;
        const newCommuteDistance = parseFloat(newTraveler.normalCommuteDistance) || 0;
        if (origCommuteDistance !== newCommuteDistance) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'normalCommuteDistance',
            label: 'Normal Commute Distance',
            old: origCommuteDistance,
            new: newCommuteDistance,
            format: 'miles'
          });
        }

        const origCommuteParking = parseFloat(origTraveler.normalCommuteParking) || 0;
        const newCommuteParking = parseFloat(newTraveler.normalCommuteParking) || 0;
        if (origCommuteParking !== newCommuteParking) {
          changes.transportChanges.push({
            travelerId,
            travelerName,
            field: 'normalCommuteParking',
            label: 'Normal Commute Parking',
            old: origCommuteParking,
            new: newCommuteParking,
            format: 'currency'
          });
        }

        // --- PER DIEM / LEG COST CHANGES ---
        const origLegCosts = origTraveler.legCosts || [];
        const newLegCosts = newTraveler.legCosts || [];

        origLegCosts.forEach(origLeg => {
          const newLeg = newLegCosts.find(l => l.legId === origLeg.legId);
          if (!newLeg) return; // Leg was removed, handled separately

          const location = getLegLocation(origLeg.legId);
          const legId = origLeg.legId;

          // Check if this is local travel
          if (origLeg.isLocalTravel || newLeg.isLocalTravel) {
            // Local travel changes
            const localFields = [
              { key: 'localMilesDriven', label: 'Miles Driven', format: 'miles' },
              { key: 'localParking', label: 'Parking', format: 'currency' },
              { key: 'localTolls', label: 'Tolls', format: 'currency' },
              { key: 'wasGovVehicleAvailable', label: 'GOV Available', format: 'boolean' }
            ];

            localFields.forEach(field => {
              const oldVal = origLeg[field.key];
              const newVal = newLeg[field.key];
              if (oldVal !== newVal) {
                changes.localTravelChanges.push({
                  travelerId,
                  travelerName,
                  legId,
                  location,
                  field: field.key,
                  label: field.label,
                  old: oldVal,
                  new: newVal,
                  format: field.format
                });
              }
            });
          } else {
            // Regular leg - lodging and M&IE changes
            // Lodging dates
            if ((origLeg.lodgingStartDate || '') !== (newLeg.lodgingStartDate || '')) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'lodgingStartDate',
                label: 'Lodging Start',
                old: formatDate(origLeg.lodgingStartDate) || 'Default',
                new: formatDate(newLeg.lodgingStartDate) || 'Default'
              });
            }

            if ((origLeg.lodgingEndDate || '') !== (newLeg.lodgingEndDate || '')) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'lodgingEndDate',
                label: 'Lodging End',
                old: formatDate(origLeg.lodgingEndDate) || 'Default',
                new: formatDate(newLeg.lodgingEndDate) || 'Default'
              });
            }

            // Lodging override
            const origLodgingOverride = parseFloat(origLeg.lodgingOverrideAmount) || 0;
            const newLodgingOverride = parseFloat(newLeg.lodgingOverrideAmount) || 0;
            if (origLodgingOverride !== newLodgingOverride) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'lodgingOverrideAmount',
                label: 'Lodging Override',
                old: origLodgingOverride,
                new: newLodgingOverride,
                format: 'currency'
              });
            }

            // Lodging override reason
            const origLodgingReason = origLeg.lodgingOverrideReason || '';
            const newLodgingReason = newLeg.lodgingOverrideReason || '';
            if (origLodgingReason !== newLodgingReason) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'lodgingOverrideReason',
                label: 'Lodging Override Reason',
                old: origLodgingReason || '(none)',
                new: newLodgingReason || '(none)'
              });
            }

            // M&IE dates
            if ((origLeg.mieStartDate || '') !== (newLeg.mieStartDate || '')) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'mieStartDate',
                label: 'M&IE Start',
                old: formatDate(origLeg.mieStartDate) || 'Default',
                new: formatDate(newLeg.mieStartDate) || 'Default'
              });
            }

            if ((origLeg.mieEndDate || '') !== (newLeg.mieEndDate || '')) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'mieEndDate',
                label: 'M&IE End',
                old: formatDate(origLeg.mieEndDate) || 'Default',
                new: formatDate(newLeg.mieEndDate) || 'Default'
              });
            }

            // M&IE override
            const origMieOverride = parseFloat(origLeg.mieOverrideAmount) || 0;
            const newMieOverride = parseFloat(newLeg.mieOverrideAmount) || 0;
            if (origMieOverride !== newMieOverride) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'mieOverrideAmount',
                label: 'M&IE Override',
                old: origMieOverride,
                new: newMieOverride,
                format: 'currency'
              });
            }

            // M&IE override reason
            const origMieReason = origLeg.mieOverrideReason || '';
            const newMieReason = newLeg.mieOverrideReason || '';
            if (origMieReason !== newMieReason) {
              changes.perDiemChanges.push({
                travelerId,
                travelerName,
                legId,
                location,
                field: 'mieOverrideReason',
                label: 'M&IE Override Reason',
                old: origMieReason || '(none)',
                new: newMieReason || '(none)'
              });
            }
          }
        });
      });

      return changes;
    },

    // =========================================================================
    // SECTION 5 & 6: HISTORY (Approval + Edit)
    // =========================================================================

    // Workflow actions for Approval History
    _workflowActions: ['Submitted', 'Resubmitted',
                       'Sector_Approved', 'Sector_Needs_Info',
                       'BU_Approved', 'BU_Needs_Info',
                       'OSO_Approved', 'OSO_Needs_Info', 'FAS_Approved', 'FAS_Denied',
                       'Denied', 'Cancelled', 'Submitter_Cancelled'],

    /**
     * Add a local edit entry to the approval log and re-render edit history
     * Called after successful edit saves for immediate UI feedback
     */
    _addLocalEditEntry(action, changeDetails) {
      const newEntry = {
        logId: `local_${Date.now()}`,
        action: action,
        actionByName: this._requestData.request.submitterName || 'You',
        actionByEmail: this._requestData.request.submitterEmail || '',
        actionByRole: 'Submitter',
        timestamp: new Date().toISOString(),
        previousStatus: this._requestData.request.status,
        newStatus: this._requestData.request.status,
        comments: '',
        sectionComments: changeDetails || {}
      };

      // Add to beginning of approval log (most recent first)
      if (!this._requestData.approvalLog) {
        this._requestData.approvalLog = [];
      }
      this._requestData.approvalLog.unshift(newEntry);

      // Re-render just the edit history section
      const editEntries = this._requestData.approvalLog.filter(e => e.action.startsWith('Edit_'));
      this._renderEditHistory(editEntries);
    },

    _renderHistory(approvalLog) {
      if (!approvalLog || approvalLog.length === 0) {
        document.getElementById('historyContent').innerHTML =
          '<p class="review-empty-state">No approval history</p>';
        document.getElementById('editHistoryContent').innerHTML =
          '<p class="review-empty-state">No edit history</p>';
        document.getElementById('sectionEditHistory').classList.add('hidden');
        return;
      }

      // Split into workflow vs edit entries
      const approvalEntries = approvalLog.filter(e => this._workflowActions.includes(e.action));
      const editEntries = approvalLog.filter(e => e.action.startsWith('Edit_'));

      // Render Approval History
      this._renderApprovalHistory(approvalEntries);

      // Render Edit History
      this._renderEditHistory(editEntries);
    },

    _renderApprovalHistory(entries) {
      const countEl = document.getElementById('approvalHistoryCount');
      if (countEl) countEl.textContent = entries.length > 0 ? `(${entries.length})` : '';

      if (entries.length === 0) {
        document.getElementById('historyContent').innerHTML =
          '<p class="review-empty-state">No approval history</p>';
        return;
      }

      const html = `<div class="review-timeline">` + entries.map((entry, index) => {
        const statusClass = this._getHistoryIconClass(entry.action);
        const isLast = index === entries.length - 1;

        return `
          <div class="review-timeline__item ${isLast ? 'review-timeline__item--last' : ''}">
            <div class="review-timeline__dot review-timeline__dot--${statusClass}"></div>
            <div class="review-timeline__content">
              <div class="review-timeline__header">
                <span class="review-timeline__action">${this._formatAction(entry.action)}</span>
                <span class="review-timeline__time">${this._formatDateTime(entry.timestamp)}</span>
              </div>
              <div class="review-timeline__actor">${entry.actionByName} (${entry.actionByRole})</div>
              ${entry.comments ? `<div class="review-timeline__comment">"${this._escapeHtml(entry.comments)}"</div>` : ''}
              ${this._renderReviewerSectionComments(entry.sectionComments)}
            </div>
          </div>
        `;
      }).join('') + `</div>`;

      document.getElementById('historyContent').innerHTML = html;
    },

    _renderReviewerSectionComments(sectionComments) {
      // For workflow actions, sectionComments are reviewer feedback on sections
      if (!sectionComments || typeof sectionComments !== 'object') return '';

      // Filter out entries that look like edit change details (have 'field', 'old', 'new')
      if (sectionComments.field && sectionComments.old && sectionComments.new) return '';

      const entries = Object.entries(sectionComments).filter(([key, val]) =>
        typeof val === 'string' && val.trim().length > 0
      );

      if (entries.length === 0) return '';

      return `
        <div class="review-timeline__sections">
          ${entries.map(([section, comment]) => `
            <div class="review-timeline__section">
              <span class="review-timeline__section-label">${this._formatSectionLabel(section)}:</span>
              ${this._escapeHtml(comment)}
            </div>
          `).join('')}
        </div>
      `;
    },

    _formatSectionLabel(section) {
      const labels = {
        'trip_overview': 'Trip Overview',
        'overview': 'Overview',
        'classification': 'Classification',
        'itinerary': 'Itinerary',
        'travelers': 'Travelers',
        'costs': 'Costs',
        'documents': 'Documents'
      };
      return labels[section] || section;
    },

    _renderEditHistory(entries) {
      const sectionEl = document.getElementById('sectionEditHistory');
      const countEl = document.getElementById('editHistoryCount');

      if (entries.length === 0) {
        if (sectionEl) sectionEl.classList.add('hidden');
        return;
      }

      if (sectionEl) sectionEl.classList.remove('hidden');
      if (countEl) countEl.textContent = `(${entries.length})`;

      const html = `<div class="review-edit-history">` + entries.map((entry, index) => {
        const entryId = `editEntry_${index}`;
        const changeDetails = this._formatEditChangeDetails(entry.action, entry.sectionComments);

        return `
          <div class="review-edit-history__item" data-entry-id="${entryId}">
            <div class="review-edit-history__header" role="button" tabindex="0" aria-expanded="false" aria-label="Toggle edit history entry" onclick="TravelReview.toggleEditEntry('${entryId}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
              <i aria-hidden="true" class="fas fa-chevron-right review-edit-history__toggle" id="${entryId}_icon"></i>
              <span class="review-edit-history__action">${this._formatAction(entry.action)}</span>
              <span class="review-edit-history__time">${this._formatDateTime(entry.timestamp)}</span>
            </div>
            <div class="review-edit-history__details hidden" id="${entryId}_details">
              ${changeDetails}
            </div>
          </div>
        `;
      }).join('') + `</div>`;

      document.getElementById('editHistoryContent').innerHTML = html;
    },

    _formatEditChangeDetails(action, sectionComments) {
      if (!sectionComments || typeof sectionComments !== 'object') {
        return '<div class="review-edit-history__no-details">No details available</div>';
      }

      // Handle different edit types
      if (sectionComments.field === 'overview' && sectionComments.old && sectionComments.new) {
        return this._formatOverviewChanges(sectionComments.old, sectionComments.new);
      }

      if (sectionComments.field === 'classification' && sectionComments.old && sectionComments.new) {
        return this._formatClassificationChanges(sectionComments.old, sectionComments.new);
      }

      if (sectionComments.changes && Array.isArray(sectionComments.changes)) {
        // Itinerary changes (array of leg changes)
        return this._formatItineraryChanges(sectionComments.changes);
      }

      if (sectionComments.removedTravelerIds || sectionComments.updatedJustifications || sectionComments.updatedFundingTypes) {
        return this._formatTravelerChanges(sectionComments);
      }

      if (sectionComments.changes && !Array.isArray(sectionComments.changes) && !sectionComments.grandTotal) {
        // SharedCosts delta format
        return this._formatSharedCostChanges(sectionComments);
      }

      if (sectionComments.grandTotal !== undefined || sectionComments.travelerTotal !== undefined ||
          sectionComments.removedLegCosts !== undefined || sectionComments.transportChanges ||
          sectionComments.perDiemChanges || sectionComments.localTravelChanges ||
          sectionComments.legCostChanges || sectionComments.sharedCostChanges) {
        // Combined costs edit with detailed changes
        // Transform server format to client format if needed
        const normalizedData = this._normalizeCostChangeData(sectionComments);
        return this._formatCostTotalChanges(normalizedData);
      }

      // Generic fallback - show as JSON
      return `<pre class="review-edit-history__json">${JSON.stringify(sectionComments, null, 2)}</pre>`;
    },

    _formatOverviewChanges(oldData, newData) {
      const changes = [];
      const fields = [
        { key: 'tripName', label: 'Trip Name' },
        { key: 'locationType', label: 'Location Type', format: 'locationType' },
        { key: 'eventStartDate', label: 'Start Date', format: 'date' },
        { key: 'eventEndDate', label: 'End Date', format: 'date' },
        { key: 'bluf', label: 'BLUF', expandable: true },
        { key: 'purpose', label: 'Purpose', expandable: true }
      ];

      for (const field of fields) {
        const oldVal = oldData[field.key] || '';
        const newVal = newData[field.key] || '';
        if (oldVal !== newVal) {
          let displayOld = oldVal;
          let displayNew = newVal;

          if (field.format === 'date') {
            displayOld = this._formatDisplayDate(oldVal);
            displayNew = this._formatDisplayDate(newVal);
          } else if (field.format === 'locationType') {
            displayOld = this._formatLocationType(oldVal);
            displayNew = this._formatLocationType(newVal);
          }

          // For expandable fields (long text like BLUF/Purpose)
          if (field.expandable && (displayOld.length > 50 || displayNew.length > 50)) {
            const fieldId = `change_${field.key}_${Date.now()}`;
            const truncatedOld = displayOld.length > 50 ? displayOld.substring(0, 50) + '...' : displayOld;
            const truncatedNew = displayNew.length > 50 ? displayNew.substring(0, 50) + '...' : displayNew;

            changes.push(`
              <div class="review-edit-history__change review-edit-history__change--expandable">
                <div class="review-edit-history__change-header" role="button" tabindex="0" aria-expanded="false" aria-label="Toggle text change details" onclick="TravelReview.toggleTextChange('${fieldId}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
                  <span class="review-edit-history__field">${field.label}:</span>
                  <span class="review-edit-history__preview">
                    <span class="review-edit-history__old">${this._escapeHtml(truncatedOld) || '(empty)'}</span>
                    <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
                    <span class="review-edit-history__new">${this._escapeHtml(truncatedNew) || '(empty)'}</span>
                  </span>
                  <i aria-hidden="true" class="fas fa-chevron-down review-edit-history__expand-icon" id="${fieldId}_icon"></i>
                </div>
                <div class="review-edit-history__full-text hidden" id="${fieldId}_full">
                  <div class="review-edit-history__full-old">
                    <strong>Previous:</strong>
                    <p>${this._escapeHtml(displayOld) || '(empty)'}</p>
                  </div>
                  <div class="review-edit-history__full-new">
                    <strong>Updated:</strong>
                    <p>${this._escapeHtml(displayNew) || '(empty)'}</p>
                  </div>
                </div>
              </div>
            `);
          } else {
            changes.push(`
              <div class="review-edit-history__change">
                <span class="review-edit-history__field">${field.label}:</span>
                <span class="review-edit-history__old">${this._escapeHtml(displayOld) || '(empty)'}</span>
                <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
                <span class="review-edit-history__new">${this._escapeHtml(displayNew) || '(empty)'}</span>
              </div>
            `);
          }
        }
      }

      return changes.length > 0 ? changes.join('') : '<div class="review-edit-history__no-changes">No changes detected</div>';
    },

    _formatClassificationChanges(oldData, newData) {
      const changes = [];

      // Parse JSON if needed
      const parseArray = (val) => {
        if (Array.isArray(val)) return val;
        if (typeof val === 'string') {
          try { return JSON.parse(val); } catch { return val.split(',').filter(v => v); }
        }
        return [];
      };

      // Compute added/removed diff
      const computeDiff = (oldArr, newArr) => {
        const added = newArr.filter(item => !oldArr.includes(item));
        const removed = oldArr.filter(item => !newArr.includes(item));
        return { added, removed };
      };

      // Render chips for a diff
      const renderDiffChips = (label, diff) => {
        if (diff.added.length === 0 && diff.removed.length === 0) return '';

        const chips = [];
        diff.removed.forEach(item => {
          chips.push(`<span class="review-edit-history__chip review-edit-history__chip--removed">
            <i aria-hidden="true" class="fas fa-minus"></i> ${this._escapeHtml(item)}
          </span>`);
        });
        diff.added.forEach(item => {
          chips.push(`<span class="review-edit-history__chip review-edit-history__chip--added">
            <i aria-hidden="true" class="fas fa-plus"></i> ${this._escapeHtml(item)}
          </span>`);
        });

        return `
          <div class="review-edit-history__change review-edit-history__change--chips">
            <span class="review-edit-history__field">${label}:</span>
            <div class="review-edit-history__chips">${chips.join('')}</div>
          </div>
        `;
      };

      const oldTypes = parseArray(oldData.travelTypes);
      const newTypes = parseArray(newData.travelTypes);
      const oldMission = parseArray(oldData.missionCriticalTypes);
      const newMission = parseArray(newData.missionCriticalTypes);

      const typesDiff = computeDiff(oldTypes, newTypes);
      const missionDiff = computeDiff(oldMission, newMission);

      const typesHtml = renderDiffChips('Travel Types', typesDiff);
      const missionHtml = renderDiffChips('Mission Critical', missionDiff);

      if (typesHtml) changes.push(typesHtml);
      if (missionHtml) changes.push(missionHtml);

      return changes.length > 0 ? changes.join('') : '<div class="review-edit-history__no-changes">No changes detected</div>';
    },

    _formatItineraryChanges(changes) {
      if (!changes || changes.length === 0) {
        return '<div class="review-edit-history__no-changes">No changes detected</div>';
      }

      const fieldLabels = {
        siteName: 'Site',

        endDate: 'End Date'
      };

      return changes.map(change => {
        const icon = change.action === 'added' ? 'fa-plus' :
                     change.action === 'removed' ? 'fa-minus' : 'fa-pen';
        const actionClass = change.action === 'added' ? 'added' :
                            change.action === 'removed' ? 'removed' : 'updated';

        // For added/removed, just show the action
        if (change.action === 'added' || change.action === 'removed') {

            let newVal = change.new[field] || '(empty)';

            </div>
            ${fieldChanges.length > 0 ? `<div class="review-edit-history__leg-details">${fieldChanges.join('')}</div>` : ''}
          </div>

      }).join('');
    },

    /**
     * Normalize cost change data from server format to client display format
     * Server stores: { legCostChanges: [{ travelerId, travelerName, legId, legCity, fieldName: { old, new } }] }
     * Client expects: { perDiemChanges: [{ travelerId, travelerName, legId, location, field, label, old, new, format }] }
     */
    _normalizeCostChangeData(data) {
      // Already-normalized client format — perDiemChanges /
      // localTravelChanges only exist after this function has run.
      if (data.perDiemChanges || data.localTravelChanges) {
        return data;
      }

      const result = { ...data };
      result.perDiemChanges = [];
      result.localTravelChanges = [];

      // Field definitions for transformation
      const perDiemFields = {
        lodgingStartDate: { label: 'Lodging Start', format: 'date' },
        lodgingEndDate: { label: 'Lodging End', format: 'date' },
        mieStartDate: { label: 'M&IE Start', format: 'date' },
        mieEndDate: { label: 'M&IE End', format: 'date' },
        lodgingOverride: { label: 'Lodging Override', format: 'boolean' },
        lodgingAmount: { label: 'Lodging Override Amount', format: 'currency' },
        lodgingReason: { label: 'Lodging Reason', format: 'text' },
        mieOverride: { label: 'M&IE Override', format: 'boolean' },
        mieAmount: { label: 'M&IE Override Amount', format: 'currency' },
        mieReason: { label: 'M&IE Reason', format: 'text' }
      };

      const localTravelFields = {
        localMilesDriven: { label: 'Miles Driven', format: 'miles' },
        wasGovVehicleAvailable: { label: 'GOV Available', format: 'boolean' },
        localParking: { label: 'Parking', format: 'currency' },
        localTolls: { label: 'Tolls', format: 'currency' },
        localTravelTotal: { label: 'Local Travel Total', format: 'currency' }
      };

      // Format date for display
      const formatDate = (dateStr) => {
        if (!dateStr) return '(default)';
        try {
          const d = new Date(dateStr + 'T00:00:00');
          return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        } catch (e) {
          return dateStr;
        }
      };

      // Transform each leg cost change (when present — some edits only
      // touch transport, not per-leg costs).
      (data.legCostChanges || []).forEach(legChange => {
        const { travelerId, travelerName, legId, legCity } = legChange;
        const location = legCity || 'Unknown';

        // Process each changed field
        Object.keys(legChange).forEach(key => {
          // Skip identifier fields
          if (['travelerId', 'travelerName', 'legId', 'legCity'].includes(key)) return;

          const change = legChange[key];
          if (!change || typeof change !== 'object' || !('old' in change && 'new' in change)) return;

          // Check if it's a per diem field
          if (perDiemFields[key]) {
            const fieldDef = perDiemFields[key];
            let oldVal = change.old;
            let newVal = change.new;

            // Format dates
            if (fieldDef.format === 'date') {
              oldVal = formatDate(oldVal);
              newVal = formatDate(newVal);
            }

            result.perDiemChanges.push({
              travelerId,
              travelerName,
              legId,
              location,
              field: key,
              label: fieldDef.label,
              old: oldVal,
              new: newVal,
              format: fieldDef.format
            });
          }

          // Check if it's a local travel field
          if (localTravelFields[key]) {
            const fieldDef = localTravelFields[key];
            result.localTravelChanges.push({
              travelerId,
              travelerName,
              legId,
              location,
              field: key,
              label: fieldDef.label,
              old: change.old,
              new: change.new,
              format: fieldDef.format
            });
          }
        });
      });

      // Also normalize transportChanges if in server format
      if (data.transportChanges && data.transportChanges.length > 0) {
        const firstChange = data.transportChanges[0];
        // Check if it's server format (has any nested { old, new } objects)
        // Look for any field that has old/new structure (transportMode, commute fields, etc.)
        const hasServerFormat = Object.keys(firstChange).some(key => {
          if (['travelerId', 'name', 'travelerName'].includes(key)) return false;
          const val = firstChange[key];
          return val && typeof val === 'object' && 'old' in val && 'new' in val;
        });
        if (hasServerFormat) {
          const transportFields = {
            transportMode: { label: 'Transport Type', format: 'text' },
            ticketCost: { label: 'Ticket Cost', format: 'currency' },
            totalMiles: { label: 'Mileage', format: 'miles' },
            needsRentalCar: { label: 'Rental Car', format: 'boolean' },
            rentalCarCost: { label: 'Rental Car Cost', format: 'currency' },
            // Commute info fields (affects local travel calculations)
            isFullTimeTelework: { label: 'Full-Time Telework', format: 'boolean' },
            normalCommuteDistance: { label: 'Normal Commute Distance', format: 'miles' },
            normalCommuteParking: { label: 'Normal Commute Parking', format: 'currency' }
          };

          const normalizedTransport = [];
          data.transportChanges.forEach(tc => {
            const travelerId = tc.travelerId;
            const travelerName = tc.name || tc.travelerName || 'Unknown';

            Object.keys(tc).forEach(key => {
              if (['travelerId', 'name', 'travelerName'].includes(key)) return;
              const change = tc[key];
              if (!change || typeof change !== 'object' || !('old' in change && 'new' in change)) return;

              if (transportFields[key]) {
                const fieldDef = transportFields[key];
                normalizedTransport.push({
                  travelerId,
                  travelerName,
                  field: key,
                  label: fieldDef.label,
                  old: change.old,
                  new: change.new,
                  format: fieldDef.format
                });
              }
            });
          });

          result.transportChanges = normalizedTransport;
        }
      }

      // Remove the raw legCostChanges since we've transformed it
      delete result.legCostChanges;

      return result;
    },

    _formatCostTotalChanges(data) {
      const parts = [];

      // Helper to format value based on format type
      const formatValue = (val, format) => {
        if (format === 'currency') {
          return '$' + (parseFloat(val) || 0).toFixed(2);
        }
        if (format === 'miles') {
          return (parseFloat(val) || 0).toFixed(0) + ' mi';
        }
        if (format === 'boolean') {
          return val ? 'Yes' : 'No';
        }
        return this._escapeHtml(String(val || ''));
      };

      // Helper to get icon for change type
      const getIcon = (field) => {
        if (field.includes('lodging')) return 'fa-bed';
        if (field.includes('mie') || field.includes('MIE')) return 'fa-utensils';
        if (field.includes('transport') || field.includes('Mode') || field.includes('ticket') || field.includes('Miles')) return 'fa-plane';
        if (field.includes('rental') || field.includes('Rental')) return 'fa-car';
        if (field.includes('local') || field.includes('Local')) return 'fa-route';
        return 'fa-edit';
      };

      // --- TRANSPORT CHANGES ---
      if (data.transportChanges && data.transportChanges.length > 0) {
        // Group by traveler
        const byTraveler = {};
        data.transportChanges.forEach(change => {
          if (!byTraveler[change.travelerId]) {
            byTraveler[change.travelerId] = { name: change.travelerName, changes: [] };

          byTraveler[change.travelerId].changes.push(change);

        parts.push(`<div class="review-edit-history__section">

            const newVal = formatValue(change.new, change.format);

                <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
                <span class="review-edit-history__new">${newVal}</span>
              </div>
            `);
          });

          parts.push(`</div>`);
        });

        parts.push(`</div>`);
      }

      // --- PER DIEM CHANGES ---
      if (data.perDiemChanges && data.perDiemChanges.length > 0) {
        // Group by traveler, then by location
        const byTraveler = {};
        data.perDiemChanges.forEach(change => {
          if (!byTraveler[change.travelerId]) {
            byTraveler[change.travelerId] = { name: change.travelerName, legs: {} };
          }
          if (!byTraveler[change.travelerId].legs[change.legId]) {
            byTraveler[change.travelerId].legs[change.legId] = { location: change.location, changes: [] };
          }
          byTraveler[change.travelerId].legs[change.legId].changes.push(change);
        });

        parts.push(`<div class="review-edit-history__section">
          <div class="review-edit-history__section-title"><i aria-hidden="true" class="fas fa-calendar-alt"></i> Per Diem</div>`);

        Object.values(byTraveler).forEach(traveler => {
          parts.push(`<div class="review-edit-history__traveler-group">
            <span class="review-edit-history__traveler-name">${this._escapeHtml(traveler.name)}</span>`);

          Object.values(traveler.legs).forEach(leg => {
            parts.push(`<div class="review-edit-history__leg-group">
              <span class="review-edit-history__leg-location"><i aria-hidden="true" class="fas fa-map-marker-alt"></i> ${this._escapeHtml(leg.location)}</span>`);

            leg.changes.forEach(change => {
              const icon = getIcon(change.field);
              const oldVal = formatValue(change.old, change.format);
              const newVal = formatValue(change.new, change.format);
              parts.push(`
                <div class="review-edit-history__change">
                  <i aria-hidden="true" class="fas ${icon} review-edit-history__change-icon"></i>
                  <span class="review-edit-history__field">${this._escapeHtml(change.label)}:</span>
                  <span class="review-edit-history__old">${oldVal}</span>
                  <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
                  <span class="review-edit-history__new">${newVal}</span>
                </div>
              `);
            });

            parts.push(`</div>`);
          });

          parts.push(`</div>`);
        });

        parts.push(`</div>`);
      }

      // --- LOCAL TRAVEL CHANGES ---
      if (data.localTravelChanges && data.localTravelChanges.length > 0) {
        const byTraveler = {};
        data.localTravelChanges.forEach(change => {
          if (!byTraveler[change.travelerId]) {
            byTraveler[change.travelerId] = { name: change.travelerName, changes: [] };
          }
          byTraveler[change.travelerId].changes.push(change);
        });

        parts.push(`<div class="review-edit-history__section">
          <div class="review-edit-history__section-title"><i aria-hidden="true" class="fas fa-route"></i> Local Travel</div>`);

        Object.values(byTraveler).forEach(traveler => {
          parts.push(`<div class="review-edit-history__traveler-group">
            <span class="review-edit-history__traveler-name">${this._escapeHtml(traveler.name)}</span>`);

          traveler.changes.forEach(change => {
            const oldVal = formatValue(change.old, change.format);
            const newVal = formatValue(change.new, change.format);
            parts.push(`
              <div class="review-edit-history__change">
                <span class="review-edit-history__field">${this._escapeHtml(change.label)}:</span>
                <span class="review-edit-history__old">${oldVal}</span>
                <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
                <span class="review-edit-history__new">${newVal}</span>
              </div>
            `);
          });

          parts.push(`</div>`);

        parts.push(`</div>`);

      if (data.removedLegCosts) {
        parts.push(`
          <div class="review-edit-history__change review-edit-history__change--removed">

      // --- SHARED COST CHANGES ---

      // (combined save) — same payload shape as updateSharedCostsForReview's
      // standalone Edit_SharedCosts entries, just under a different field name.
      if (data.sharedCostChanges && Object.keys(data.sharedCostChanges).length > 0) {

          facilities: 'Facilities',

        };

        parts.push(`<div class="review-edit-history__section">
          <div class="review-edit-history__section-title"><i aria-hidden="true" class="fas fa-building"></i> Shared Costs</div>`);

        Object.entries(data.sharedCostChanges).forEach(([cat, change]) => {
          const label = sharedLabels[cat] || cat;
          const oldAmt = parseFloat(change.old?.amount) || 0;
          const newAmt = parseFloat(change.new?.amount) || 0;
          const oldDesc = change.old?.description || '';
          const newDesc = change.new?.description || '';

          if (oldAmt !== newAmt) {
            parts.push(`
              <div class="review-edit-history__change">
                <i aria-hidden="true" class="fas fa-dollar-sign review-edit-history__change-icon"></i>
                <span class="review-edit-history__field">${label}:</span>
                <span class="review-edit-history__old">$${oldAmt.toFixed(2)}</span>

          }

          if (oldDesc !== newDesc) {
            const truncOld = oldDesc.length > 40 ? oldDesc.substring(0, 40) + '...' : (oldDesc || '(none)');
            const truncNew = newDesc.length > 40 ? newDesc.substring(0, 40) + '...' : (newDesc || '(none)');
            parts.push(`
              <div class="review-edit-history__change">
                <i aria-hidden="true" class="fas fa-align-left review-edit-history__change-icon"></i>
                <span class="review-edit-history__field">${label} Note:</span>
                <span class="review-edit-history__old">${this._escapeHtml(truncOld)}</span>
                <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
                <span class="review-edit-history__new">${this._escapeHtml(truncNew)}</span>
              </div>
            `);
          }
        });

        parts.push(`</div>`);
      }

      // --- TOTALS SUMMARY ---
      const totalLabels = {
        sharedTotal: 'Shared Costs',
        travelerTotal: 'Traveler Costs',
        grandTotal: 'Grand Total'
      };

      const totalChanges = [];
      ['sharedTotal', 'travelerTotal', 'grandTotal'].forEach(key => {
        if (data[key] && typeof data[key] === 'object' && data[key].old !== undefined) {
          const oldVal = parseFloat(data[key].old) || 0;
          const newVal = parseFloat(data[key].new) || 0;
          totalChanges.push(`
            <div class="review-edit-history__change">
              <span class="review-edit-history__field">${totalLabels[key]}:</span>
              <span class="review-edit-history__old">$${oldVal.toFixed(2)}</span>
              <i aria-hidden="true" class="fas fa-arrow-right review-edit-history__arrow"></i>
              <span class="review-edit-history__new">$${newVal.toFixed(2)}</span>
            </div>
          `);
        }
      });

      if (totalChanges.length > 0) {
        parts.push(`<div class="review-edit-history__section review-edit-history__section--totals">
          <div class="review-edit-history__section-title"><i aria-hidden="true" class="fas fa-calculator"></i> Cost Impact</div>
          ${totalChanges.join('')}
        </div>`);
      }

      return parts.length > 0 ? parts.join('') : '<div class="review-edit-history__no-changes">No changes detected</div>';
    },

    _renderActionButtons(permissions) {
      const actions = permissions.availableActions || [];

      // Store available actions for later use
      this._availableActions = actions;

      // Find the actions section
      const actionsSection = document.getElementById('reviewerActionsSection');

      if (!actionsSection) {
        console.warn('Actions section not found in sidebar');
        return;
      }

      if (actions.length === 0) {
        actionsSection.classList.add('hidden');
        return;
      }

      // Determine the specific approve action type for backend
      const hasApproveAction = actions.includes('sector_approve') || actions.includes('bu_approve') ||
                               actions.includes('oso_approve') || actions.includes('fas_approve');
      if (actions.includes('sector_approve')) {
        this._approveActionType = 'sector_approve';
      } else if (actions.includes('bu_approve')) {
        this._approveActionType = 'bu_approve';
      } else if (actions.includes('oso_approve')) {
        this._approveActionType = 'oso_approve';
      } else if (actions.includes('fas_approve')) {
        this._approveActionType = 'fas_approve';
      } else {
        this._approveActionType = null;
      }

      // Determine the specific needs_info action type for backend
      if (actions.includes('sector_needs_info')) {
        this._needsInfoActionType = 'sector_needs_info';
      } else if (actions.includes('bu_needs_info')) {
        this._needsInfoActionType = 'bu_needs_info';
      } else if (actions.includes('oso_needs_info')) {
        this._needsInfoActionType = 'oso_needs_info';
      } else {
        this._needsInfoActionType = null;
      }

      // Hide the entire approve/dropdown button group if no approve action is available
      const splitBtnContainer = actionsSection.querySelector('.review-sidebar__split-button-container');
      if (splitBtnContainer) {
        splitBtnContainer.classList.toggle('hidden', !hasApproveAction);
      }

      // Show/hide dropdown options based on available actions
      const requestInfoBtn = actionsSection.querySelector('.review-sidebar__action-option--warning');
      const dangerBtns = actionsSection.querySelectorAll('.review-sidebar__action-option--danger');
      const denyBtn = dangerBtns[0]; // First danger button is Deny
      const cancelBtn = dangerBtns[1]; // Second danger button is Cancel

      // Show Request Info if any needs_info action is available
      if (requestInfoBtn) {
        const showRequestInfo = actions.includes('sector_needs_info') || actions.includes('bu_needs_info') || actions.includes('oso_needs_info');
        requestInfoBtn.classList.toggle('hidden', !showRequestInfo);
      }

      // Show Deny button if deny action is available (includes fas_deny for FAS stage)
      if (denyBtn) {
        const showDeny = actions.includes('deny') || actions.includes('fas_deny');
        if (showDeny) {
          // Track which deny action to use
          this._denyActionType = actions.includes('fas_deny') ? 'fas_deny' : 'deny';
        }
        denyBtn.classList.toggle('hidden', !showDeny);
      }

      // Show Cancel button if cancel action is available
      if (cancelBtn) {
        cancelBtn.classList.toggle('hidden', !actions.includes('cancel'));
      }

      // Only show actions section if user has at least one action
      const hasAnyReviewerAction = hasApproveAction || actions.includes('deny') || actions.includes('fas_deny') ||
                                   actions.includes('cancel') || actions.includes('sector_needs_info') ||
                                   actions.includes('bu_needs_info') || actions.includes('oso_needs_info');
      if (hasAnyReviewerAction) {
        actionsSection.classList.remove('hidden');
      } else {
        actionsSection.classList.add('hidden');
      }
    },

    /**
     * Toggle modal between form, loading, and success states
     * @param {string} modalPrefix - 'approve', 'requestInfo', 'deny', or 'cancel'
     * @param {string} state - 'form', 'loading', or 'success'
     */
    _setModalState(modalPrefix, state) {
      const formState = document.getElementById(modalPrefix + 'FormState');
      const loadingState = document.getElementById(modalPrefix + 'LoadingState');
      const successState = document.getElementById(modalPrefix + 'SuccessState');

      if (formState) formState.classList.toggle('hidden', state !== 'form');
      if (loadingState) loadingState.classList.toggle('hidden', state !== 'loading');
      if (successState) successState.classList.toggle('hidden', state !== 'success');

      // Inject thumbs feedback widget on success
      if (state === 'success' && window.TravelFeedback) {
        var slot = document.getElementById(modalPrefix + 'FeedbackSlot');
        if (slot && !slot.hasChildNodes()) {
          var actionMap = { approve: 'approve', deny: 'deny', requestInfo: 'request_info', resubmit: 'resubmit' };
          slot.innerHTML = TravelFeedback.thumbsHtml(actionMap[modalPrefix] || modalPrefix, this._requestId || '');
        }
      }
    },

    /**
     * Show error message in modal and return to form state
     * @param {string} modalPrefix - 'approve', 'requestInfo', 'deny', or 'cancel'
     * @param {string} message - Error message to display
     */
    _showModalError(modalPrefix, message) {
      this._setModalState(modalPrefix, 'form');
      // Re-enable submit button for retry
      const submitBtn = document.getElementById(modalPrefix + 'SubmitBtn');
      if (submitBtn) submitBtn.disabled = false;
      const errorEl = document.getElementById(modalPrefix + 'Error');
      if (errorEl) {
        errorEl.innerHTML = '<i aria-hidden="true" class="fas fa-exclamation-triangle"></i> ' + this._escapeHtml(message);
        errorEl.classList.remove('hidden');
      }

     */
    _resetModal(modalPrefix) {
      this._setModalState(modalPrefix, 'form');
      // Re-enable submit button when modal is reset
      const submitBtn = document.getElementById(modalPrefix + 'SubmitBtn');
      if (submitBtn) submitBtn.disabled = false;
      const errorEl = document.getElementById(modalPrefix + 'Error');
      if (errorEl) errorEl.classList.add('hidden');

    async executeApprove() {
      // Double-click protection
      const submitBtn = document.getElementById('approveSubmitBtn');
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;

      const comment = document.getElementById('approveComment').value.trim();
      const sectionComments = TravelReview._sectionComments;
      const actionType = this._approveActionType;
      if (!actionType) {
        console.error('No approve action type set — permissions may not include an approve action');
        this._showToast('Unable to determine approval action. Please refresh and try again.', 'error');
        this._setModalState('approve', 'form');
        submitBtn.disabled = false;
        return;
      }

      // Show loading state
      this._setModalState('approve', 'loading');

      try {
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .submitReviewAction(
              this._requestId,
              actionType,
              comment,
              sectionComments
            );
        });

        if (result && result.success) {
          document.getElementById('approveSuccessMessage').textContent =
            result.message || 'The request has been approved and moved to the next stage.';
          this._setModalState('approve', 'success');
        } else {
          this._showModalError('approve', result?.error || 'Failed to approve request');
        }
      } catch (error) {
        console.error('Error approving request:', error);
        this._showModalError('approve', error.message || 'An unexpected error occurred');
      }
    },
