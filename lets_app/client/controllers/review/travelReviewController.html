    /**
     * Render the international requirements bar for a traveler.
     * Single-line bar with globe icon and colored pills.
     * Only rendered for international requests.
     */
    _renderIntlBar(traveler, travelerId) {
      const isInternational = this._requestData &&
        (this._requestData.request.isInternational || this._requestData.request.isOCONUS);
      if (!isInternational) return '';

      const items = [
        { key: 'hasValidPassport', label: 'Passport' },
        { key: 'hasSecurityClearance', label: 'Clearance' },
        { key: 'isSpeaking', label: 'Speaking' },
        { key: 'eventOpenToPress', label: 'Press/Media' },
        { key: 'receivingNFS', label: 'NFS Funding' }
      ];

      const pills = items.map(function(item) {
        const checked = traveler[item.key] === true || String(traveler[item.key]).toLowerCase() === 'true';
        const cls = checked ? 'review-intl-pill--yes' : 'review-intl-pill--no';
        const icon = checked ? 'fa-check' : 'fa-minus';
        return '<span class="review-intl-pill ' + cls + '">' +
          '<i aria-hidden="true" class="fas ' + icon + '"></i> ' + item.label +
          '</span>';
      }).join('');

      return '<div class="review-intl-bar">' +
        '<i aria-hidden="true" class="fas fa-globe review-quick-stat__flag" title="International travel"></i>' +
        pills +
      '</div>';
    },

    _getInitials(name) {
      if (!name) return '?';

      // Handle "LastName,FirstName MiddleInitial" format (e.g., "Piche,James D")
      if (name.includes(',')) {
        var parts = name.split(',');
        var lastName = parts[0].trim();
        var firstNamePart = parts[1] ? parts[1].trim() : '';

        // Get first letter of first name (first word after comma)
        var firstNameWords = firstNamePart.split(/\s+/);
        var firstInitial = firstNameWords[0] ? firstNameWords[0].charAt(0).toUpperCase() : '';

        // Get first letter of last name
        var lastInitial = lastName.charAt(0).toUpperCase();

        return firstInitial + lastInitial || '?';
      }

      // Fallback for "FirstName LastName" format
      var parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    },

    _getTransportIcon(mode) {
      if (!mode) return 'fa-route';
      const normalizedMode = mode.toLowerCase().trim();

      const icons = {
        // Air travel
        'air': 'fa-plane',
        'flight': 'fa-plane',
        'plane': 'fa-plane',
        // Personal vehicle
        'pov': 'fa-car',
        'personal': 'fa-car',
        'personal vehicle': 'fa-car',
        // Rental
        'rental': 'fa-car-side',
        'rental car': 'fa-car-side',
        // Train
        'train': 'fa-train',
        'rail': 'fa-train',
        'amtrak': 'fa-train',
        // Bus
        'bus': 'fa-bus',
        // Other
        'other': 'fa-route'
      };
      return icons[normalizedMode] || 'fa-route';
    },

    _getTransportModeLabel(mode) {
      if (!mode) return 'Transport';
      const normalizedMode = mode.toLowerCase().trim();

      const labels = {
        'air': 'Air Travel',
        'flight': 'Air Travel',
        'plane': 'Air Travel',
        'private': 'Personal Vehicle',
        'pov': 'Personal Vehicle',
        'personal': 'Personal Vehicle',
        'gov': 'Gov Vehicle',
        'rental': 'Rental Car',
        'train': 'Rail',
        'rail': 'Rail',
        'amtrak': 'Rail',
        'bus': 'Bus',
        'other': 'Other'
      };
      return labels[normalizedMode] || 'Transport';
    },

    _getAttendingDestinations(attendingLegs, legs) {
      if (!attendingLegs || !legs || legs.length === 0) return '';

      // Parse attending legs (could be array, comma-separated string, or single value)
      let legIds = [];
      if (Array.isArray(attendingLegs)) {
        legIds = attendingLegs;
      } else if (typeof attendingLegs === 'string') {
        legIds = attendingLegs.split(',').map(s => s.trim());
      } else {
        legIds = [String(attendingLegs)];
      }

      // Map leg IDs to location displays
      const destinations = legIds
        .map(legId => {
          const leg = legs.find(l =>
            String(l.legId) === String(legId) ||
            String(l.legNumber) === String(legId)
          );
          return leg ? (leg.locationDisplay || this._formatLocation(leg)) : null;
        })
        .filter(Boolean);

      if (destinations.length === 0) return '';

      // If all legs, just say "All destinations"
      if (destinations.length === legs.length) {
        return 'All destinations';
      }

      // Truncate if too many destinations
      if (destinations.length > 2) {
        return `${destinations.slice(0, 2).join(' → ')} +${destinations.length - 2} more`;
      }

      return destinations.join(' → ');
    },

    _truncateFileName(fileName, maxLength) {
      if (!fileName || fileName.length <= maxLength) return fileName;
      const ext = fileName.lastIndexOf('.') > 0 ? fileName.slice(fileName.lastIndexOf('.')) : '';
      const nameWithoutExt = fileName.slice(0, fileName.lastIndexOf('.') > 0 ? fileName.lastIndexOf('.') : fileName.length);
      const truncatedName = nameWithoutExt.slice(0, maxLength - ext.length - 3) + '...';
      return truncatedName + ext;
    },

    toggleTraveler(travelerId) {
      const row = document.getElementById(`traveler-${travelerId}`);
      if (row) {
        row.classList.toggle('review-traveler-row--expanded');
        this._updateExpandToggleState();
      }
    },

    toggleAllTravelers() {
      const rows = document.querySelectorAll('.review-traveler-row');
      this._allTravelersExpanded = !this._allTravelersExpanded;

      rows.forEach(row => {
        if (this._allTravelersExpanded) {
          row.classList.add('review-traveler-row--expanded');
        } else {
          row.classList.remove('review-traveler-row--expanded');
        }
      });

      this._updateExpandToggleButton();
    },

    _updateExpandToggleState() {
      const rows = document.querySelectorAll('.review-traveler-row');
      const expandedRows = document.querySelectorAll('.review-traveler-row--expanded');
      this._allTravelersExpanded = rows.length === expandedRows.length;
      this._updateExpandToggleButton();
    },

    _updateExpandToggleButton() {
      const btn = document.getElementById('travelerExpandToggle');
      if (btn) {
        const icon = btn.querySelector('i');
        const label = btn.querySelector('span');
        if (this._allTravelersExpanded) {
          icon.className = 'fas fa-compress-alt';
          label.textContent = 'Collapse All';
        } else {
          icon.className = 'fas fa-expand-alt';
          label.textContent = 'Expand All';
        }
      }
    },

    // =========================================================================
    // SECTION 3: TRAVELERS - Edit Mode (Justification & Remove)
    // =========================================================================

    _travelersEditMode: false,
    _travelersOriginal: null,
    _travelersRemoved: [],

    /**
     * Check if user can edit travelers (submitter in editable status)
     */
    _canEditTravelers() {
      if (!this._requestData) return false;
      const { request } = this._requestData;

      if (this._mode === 'submitter') {
        const statusConfig = TravelUtils?.TRAVEL_CONFIG?.STATUS || {};
        const editableStatuses = [
          ...(statusConfig.NEEDS_INFO || ['NEEDS_INFO_SECTOR', 'NEEDS_INFO_BU', 'NEEDS_INFO_OSO']),
          'PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'PENDING_FAS', 'DRAFT'
        ];
        return editableStatuses.includes(request.status);
      }
      return false;
    },

    /**
     * Update edit button in section header
     */
    _updateTravelersEditButton(canEdit, isEditMode) {
      const headerActions = document.querySelector('#sectionTravelers .review-section__header-actions');
      if (!headerActions) return;

      // Remove existing edit button if present
      const existingBtn = headerActions.querySelector('.review-travelers__edit-btn');
      if (existingBtn) {
        existingBtn.remove();
      }

      // Add edit button if allowed and not in edit mode
      if (canEdit && !isEditMode) {
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'review-travelers__edit-btn';
        editBtn.innerHTML = '<i aria-hidden="true" class="fas fa-pencil-alt"></i><span>Edit</span>';
        editBtn.onclick = () => TravelReview.Controller.toggleTravelersEdit();

        // Insert at the beginning of header actions
        headerActions.insertBefore(editBtn, headerActions.firstChild);
      }
    },

    /**
     * Toggle travelers edit mode
     */
    toggleTravelersEdit() {
      if (!this._travelersEditMode) {
        // Entering edit mode - save original state
        this._travelersOriginal = JSON.parse(JSON.stringify(this._requestData.travelers));
        this._travelersRemoved = [];
      }
      this._travelersEditMode = !this._travelersEditMode;
      this._renderTravelers(
        this._requestData.travelers,
        this._requestData.attachments,
        this._requestData.legs
      );
    },

    /**
     * Cancel travelers edit mode
     */
    cancelTravelersEdit() {
      if (this._travelersOriginal) {
        this._requestData.travelers = this._travelersOriginal;
      }
      this._travelersRemoved = [];
      this._travelersEditMode = false;
      this._travelersOriginal = null;
      this._renderTravelers(
        this._requestData.travelers,
        this._requestData.attachments,
        this._requestData.legs
      );
    },

    /**
     * Remove a traveler from the trip
     */
    removeTraveler(travelerId) {
      const travelers = this._requestData.travelers;

      // Must keep at least 1 traveler
      if (travelers.length <= 1) {
        this._showToast('Cannot remove the last traveler. A trip must have at least one traveler.', 'warning');
        return;
      }

      const traveler = travelers.find(t => t.travelerId === travelerId);
      if (!traveler) return;

      // Show confirmation modal
      document.getElementById('removeTravelerName').textContent = traveler.employeeName;
      const modal = new bootstrap.Modal(document.getElementById('removeTravelerModal'));

      // Set up confirm button handler (remove previous handler first)
      const confirmBtn = document.getElementById('confirmRemoveTravelerBtn');
      const newConfirmBtn = confirmBtn.cloneNode(true);
      confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);

      newConfirmBtn.addEventListener('click', () => {
        // Track removed traveler for server update
        this._travelersRemoved.push(travelerId);

        // Remove from local data
        this._requestData.travelers = travelers.filter(t => t.travelerId !== travelerId);

        // Re-render
        this._renderTravelers(
          this._requestData.travelers,
          this._requestData.attachments,
          this._requestData.legs
        );

        // Close modal
        modal.hide();
      });

      modal.show();
    },

    /**
     * Update justification text as user types
     */
    updateTravelerJustification(travelerId, value) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (traveler) {
        traveler.roleJustification = value;
      }
    },

    /**
     * Flip a traveler's funding type (Overhead ↔ Client-Paid) in edit mode.
     * Mutates local state and re-renders the travelers section so the badge
     * reflects the change. Persisted on Save via saveTravelers().
     */
    toggleTravelerFundingType(travelerId) {
      const traveler = this._requestData.travelers.find(t => t.travelerId === travelerId);
      if (!traveler) return;
      const isCurrentlyClient = String(traveler.isClientPaid || '').toLowerCase().includes('client');
      traveler.isClientPaid = isCurrentlyClient ? 'overhead' : 'client';
      // Re-render preserves edit mode (since _travelersEditMode is still true)
      this._renderTravelers(
        this._requestData.travelers,
        this._requestData.attachments,
        this._requestData.legs
      );
    },

    /**
     * Save travelers changes to server
     */
    async saveTravelers() {
      const saveBtn = document.querySelector('.review-travelers-edit__actions .btn-primary');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Saving...';
      }

      try {
        // Collect updated data
        const updates = {
          requestId: this._requestData.request.requestId,
          travelers: this._requestData.travelers.map(t => ({
            travelerId: t.travelerId,
            roleJustification: t.roleJustification || '',
            isClientPaid: t.isClientPaid || ''
          })),
          removedTravelerIds: this._travelersRemoved
        };

        // Call server
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateTravelersForReview(updates);
        });

        if (result && result.success) {
          // Capture changes for edit history BEFORE clearing original
          const removedTravelerIds = this._travelersRemoved || [];
          const travelerUpdates = updates.travelers || [];
          const originalTravelers = this._travelersOriginal || [];
          const changedJustifications = [];
          const changedFundingTypes = [];

          const _normFunding = (v) => String(v || '').toLowerCase().includes('client') ? 'client' : 'overhead';

          travelerUpdates.forEach(update => {
            const original = originalTravelers.find(t => t.travelerId === update.travelerId);
            if (!original) return;
            if (original.roleJustification !== update.roleJustification) {
              changedJustifications.push({
                travelerId: update.travelerId,
                name: original.employeeName || original.email,
                old: original.roleJustification || '',
                new: update.roleJustification || ''
              });
            }
            const oldFunding = _normFunding(original.isClientPaid);
            const newFunding = _normFunding(update.isClientPaid);
            if (oldFunding !== newFunding) {
              changedFundingTypes.push({
                travelerId: update.travelerId,
                name: original.employeeName || original.email,
                old: oldFunding,
                new: newFunding
              });
            }
          });

          // Merge totals from server. Local traveler state already
          // reflects user's justification/funding edits + any removals
          // (mutated in-place earlier), so we don't replace the array.
          const data = result.data || {};
          if (data.travelerTotal !== undefined) {
            this._requestData.request.travelerTotal = data.travelerTotal;
          }
          if (data.grandTotal !== undefined) {
            this._requestData.request.grandTotal = data.grandTotal;
            document.getElementById('reviewGrandTotal').textContent = this._formatCurrency(data.grandTotal);
          }

          // Exit edit mode
          this._travelersEditMode = false;
          this._travelersOriginal = null;
          this._travelersRemoved = [];

          // Re-render travelers (always — list shape may have changed).
          // Re-render costs only when a traveler was removed, since their
          // subtotal drops out of the breakdown. Funding-type and
          // justification edits don't change the cost numbers, so leaving
          // the existing cost render in place avoids any risk of garbage
          // data clobbering correct values.
          this._renderTravelers(
            this._requestData.travelers,
            this._requestData.attachments,
            this._requestData.legs
          );
          if (removedTravelerIds.length > 0) {
            this._renderCosts(
              this._requestData.request,
              this._requestData.travelers,
              this._requestData.legs
            );
          }

          // Add local edit history entry - only if there were actual changes
          if (removedTravelerIds.length > 0 || changedJustifications.length > 0 || changedFundingTypes.length > 0) {
            this._addLocalEditEntry('Edit_Travelers', {
              removedTravelerIds: removedTravelerIds,
              updatedJustifications: changedJustifications,
              updatedFundingTypes: changedFundingTypes
            });
          }

          console.log('Travelers updated successfully');
        } else {
          throw new Error((result && result.error) || 'Failed to save travelers');
        }

      } catch (error) {
        console.error('Error saving travelers:', error);
        this._showToast('Failed to save changes: ' + (error.message || 'Unknown error'), 'error');

        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-save"></i> Save Changes';
        }
      }
    },

    // =========================================================================
    // SECTION 2: ITINERARY - Form-style editing with autocompletes
    // =========================================================================

    _itineraryEditMode: false,
    _itineraryOriginal: null,
    _itineraryDatePickers: {},
    _itineraryRemovedIds: [],

    /**
     * Check if user can edit itinerary (submitter in editable status)
     */
    _canEditItinerary() {
      if (!this._requestData) return false;
      const { request } = this._requestData;

      if (this._mode === 'submitter') {
        const statusConfig = TravelUtils?.TRAVEL_CONFIG?.STATUS || {};
        const editableStatuses = [
          ...(statusConfig.NEEDS_INFO || ['NEEDS_INFO_SECTOR', 'NEEDS_INFO_BU', 'NEEDS_INFO_OSO']),
          'PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'PENDING_FAS', 'DRAFT'
        ];
        return editableStatuses.includes(request.status);
      }
      return false;
    },

    /**
     * Update edit button in itinerary section header
     */
    _updateItineraryEditButton(canEdit, isEditMode) {
      const headerActions = document.querySelector('#sectionItinerary .review-section__header-actions');

      // Create header-actions if it doesn't exist
      if (!headerActions) {
        const sectionHeader = document.querySelector('#sectionItinerary .review-section__header');
        if (sectionHeader) {
          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'review-section__header-actions';
          sectionHeader.appendChild(actionsDiv);
        }
      }

      const container = document.querySelector('#sectionItinerary .review-section__header-actions');
      if (!container) return;

      // Remove existing edit button if present
      const existingBtn = container.querySelector('.review-itinerary__edit-btn');
      if (existingBtn) {
        existingBtn.remove();
      }

      // Add edit button if allowed and not in edit mode
      if (canEdit && !isEditMode) {
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'review-itinerary__edit-btn';
        editBtn.innerHTML = '<i aria-hidden="true" class="fas fa-pencil-alt"></i><span>Edit</span>';
        editBtn.onclick = () => TravelReview.Controller.toggleItineraryEdit();
        container.insertBefore(editBtn, container.firstChild);
      }
    },

    _renderItinerary(legs) {
      if (!legs || legs.length === 0) {
        document.getElementById('itineraryContent').innerHTML =
          '<p class="review-empty-state">No destinations specified</p>';
        return;
      }

      const isEditMode = this._itineraryEditMode;
      const canEdit = this._canEditItinerary();

      // Manage edit button in section header
      this._updateItineraryEditButton(canEdit, isEditMode);

      let html = '';

      if (isEditMode) {
        // Edit mode - form-style leg cards
        html += `<div class="review-leg-cards" id="reviewLegCards">`;

        legs.forEach((leg, index) => {
          html += this._renderLegCard(leg, index, legs.length);
        });

        html += `
          </div>
          <div class="review-itinerary-edit__actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="TravelReview.Controller.cancelItineraryEdit()">
              Cancel
            </button>
            <button type="button" class="btn btn-sm btn-primary" onclick="TravelReview.Controller.saveItinerary()">
              <i aria-hidden="true" class="fas fa-save"></i> Save Changes
            </button>
          </div>
        `;
      } else {
        // View mode - compact table
        html += `
          <div class="review-itinerary-table">
            <div class="review-itinerary-table__header">
              <div class="review-itinerary-table__cell review-itinerary-table__cell--leg">Leg</div>
              <div class="review-itinerary-table__cell review-itinerary-table__cell--location">Location</div>
              <div class="review-itinerary-table__cell review-itinerary-table__cell--dates">Dates</div>
              <div class="review-itinerary-table__cell review-itinerary-table__cell--duration">Duration</div>
            </div>
        `;

        legs.forEach(leg => {
          const duration = this._calculateLegDuration(leg.startDate, leg.endDate);
          const isInternational = leg.locationType === 'International' || leg.locationType === 'OCONUS';
          const locationIcon = isInternational ? 'fa-globe' : 'fa-map-marker-alt';
          const locationClass = isInternational ? 'review-itinerary-table__location--international' : '';

          html += `
            <div class="review-itinerary-table__row">
              <div class="review-itinerary-table__cell review-itinerary-table__cell--leg">
                <span class="review-itinerary-table__leg-number">${leg.legNumber}</span>
              </div>
              <div class="review-itinerary-table__cell review-itinerary-table__cell--location ${locationClass}">
                <i aria-hidden="true" class="fas ${locationIcon}"></i>
                <span>${this._escapeHtml(leg.locationDisplay || this._formatLocation(leg))}</span>
                ${isInternational ? '<span class="review-itinerary-table__intl-badge">International</span>' : ''}
              </div>
              <div class="review-itinerary-table__cell review-itinerary-table__cell--dates">
                ${TravelDateService.formatDateRange(leg.startDate, leg.endDate)}
              </div>
              <div class="review-itinerary-table__cell review-itinerary-table__cell--duration">
                <span class="review-itinerary-table__duration-badge">${duration}d</span>
              </div>
            </div>
          `;
        });

        html += '</div>';
      }

      document.getElementById('itineraryContent').innerHTML = html;

      // Initialize inputs if in edit mode
      if (isEditMode) {
        legs.forEach((leg, index) => {
          this._initLegInputs(leg, index);
        });
      }
    },

    /**
     * Render a single leg card (form-style)
     */
    _renderLegCard(leg, index, totalLegs) {
      const isInternational = leg.isInternational || leg.locationType === 'International' || leg.locationType === 'OCONUS';
      const canRemove = totalLegs > 1;
      const legId = leg.legId || `new_${index}`;
      // Mirror the form: site name only applies to client-site and
      // contractor-site location types. If the request's locationType
      // changes via Overview edit later, re-rendering the itinerary
      // picks up the new value.
      const requestLocationType = this._requestData?.request?.locationType || '';
      const showSiteName = requestLocationType === 'client-site' || requestLocationType === 'contractor-site';

      return `
        <div class="leg-card leg-card--compact" data-leg-id="${legId}" data-leg-index="${index}">
          <div class="leg-card__row">
            <!-- Stop number -->
            <div class="leg-card__stop">
              <span class="leg-card__number">${index + 1}</span>
            </div>

            <!-- Dates group -->
            <div class="leg-card__dates">
              <div class="leg-card__field leg-card__field--date">
                <label>Start</label>
                <input type="text" class="form-control form-control-sm" id="legStart_${index}"
                       value="${leg.startDate || ''}" placeholder="Start date" data-leg-index="${index}">
              </div>
              <span class="leg-card__separator">→</span>
              <div class="leg-card__field leg-card__field--date">
                <label>End</label>
                <input type="text" class="form-control form-control-sm" id="legEnd_${index}"
                       value="${leg.endDate || ''}" placeholder="End date" data-leg-index="${index}">
              </div>
            </div>

            <!-- Divider -->
            <div class="leg-card__divider"></div>

            <!-- Location group -->
            <div class="leg-card__location">
              <div class="leg-card__field leg-card__field--country">
                <label>Country</label>
                <input type="text" class="form-control form-control-sm leg-country-locked" id="legCountry_${index}"
                       value="${this._escapeHtml(leg.country || 'United States')}" readonly disabled
                       title="Country cannot be changed. To change destination country, please submit a new request."
                       data-leg-index="${index}">
              </div>
              <div class="leg-card__field leg-card__field--state ${isInternational ? 'hidden' : ''}" id="legStateCol_${index}">
                <label>State</label>
                <input type="text" class="form-control form-control-sm" id="legState_${index}"
                       value="${this._escapeHtml(leg.state || '')}" placeholder="ST" maxlength="2"
                       autocomplete="off" data-leg-index="${index}">
              </div>
              <div class="leg-card__field leg-card__field--city">
                <label>City</label>
                <div class="city-input-wrapper">
                  <input type="text" class="form-control form-control-sm" id="legCity_${index}"
                         value="${this._escapeHtml(leg.city || '')}" placeholder="${isInternational ? 'Type city...' : 'Select state'}"
                         autocomplete="off" data-leg-index="${index}">
                  <div class="city-loading hidden" id="legCityLoading_${index}">
                    <i aria-hidden="true" class="fas fa-spinner fa-spin"></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Site name (only relevant for client-site / contractor-site location types) -->
            ${showSiteName ? `
            <div class="leg-card__field leg-card__field--site">
              <label>Site</label>
              <input type="text" class="form-control form-control-sm" id="legSite_${index}"
                     value="${this._escapeHtml(leg.siteName || '')}" placeholder="Site name" data-leg-index="${index}">
            </div>
            ` : ''}

            <!-- Remove button -->
            ${canRemove ? `
              <button type="button" class="btn btn-sm btn-link leg-card__remove"
                      onclick="TravelReview.Controller.removeItineraryLeg(${index})" title="Remove stop">
                <i aria-hidden="true" class="fas fa-times"></i>
              </button>
            ` : '<div class="leg-card__remove-placeholder"></div>'}
          </div>

          <!-- International notice -->
          <div class="leg-card__notice ${isInternational ? '' : 'hidden'}" id="legIntlNotice_${index}">
            <i aria-hidden="true" class="fas fa-globe me-2"></i>
            <span>International travel</span>
          </div>

          ${leg.isNew ? '<div class="leg-card__new-badge">New</div>' : ''}
        </div>
      `;
    },

    /**
     * Initialize inputs for a leg (date pickers and autocompletes)
     * Note: Country field is locked - no autocomplete for country
     */
    _initLegInputs(leg, index) {
      this._initLegDatePickers(index, leg);
      // Country is locked - skip country autocomplete
      // this._initLegCountryAutocomplete(index);

      // Only init state autocomplete for US legs
      if (!leg.isInternational) {
        this._initLegStateAutocomplete(index);
      }

      // If leg has location, load cities using unified service
      if (leg.state && !leg.isInternational) {
        this._loadLegCities(index, { country: 'United States', state: leg.state });
      } else if (leg.isInternational && leg.country) {
        this._loadLegCities(index, { country: leg.country });
      }
    },

    /**
     * Initialize date pickers for a leg
     */
    _initLegDatePickers(index, leg) {
      const self = this;
      const startInput = document.getElementById(`legStart_${index}`);
      const endInput = document.getElementById(`legEnd_${index}`);

      if (startInput && window.flatpickr) {
        this._itineraryDatePickers[`start_${index}`] = flatpickr(startInput, {
          dateFormat: 'Y-m-d',
          altInput: true,
          altFormat: 'M j, Y',
          allowInput: true,
          defaultDate: leg.startDate || null,
          onChange: function(selectedDates, dateStr) {
            // Update end date min
            const endPicker = self._itineraryDatePickers[`end_${index}`];
            if (endPicker && selectedDates[0]) {
              endPicker.set('minDate', selectedDates[0]);
            }
          }
        });
      }

      if (endInput && window.flatpickr) {
        this._itineraryDatePickers[`end_${index}`] = flatpickr(endInput, {
          dateFormat: 'Y-m-d',
          altInput: true,
          altFormat: 'M j, Y',
          allowInput: true,
          defaultDate: leg.endDate || null,
          minDate: leg.startDate || null
        });
      }
    },

    /**
     * Initialize country autocomplete for a leg using TravelLocationService
     */
    async _initLegCountryAutocomplete(index) {
      const self = this;
      const countryInput = document.getElementById(`legCountry_${index}`);
      if (!countryInput || !window.Awesomplete) return;

      // Destroy existing instance
      const instanceKey = `country_${index}`;
      if (this._autocompleteInstances[instanceKey]) {
        this._autocompleteInstances[instanceKey].destroy();
        delete this._autocompleteInstances[instanceKey];
      }

      // Use TravelLocationService for country autocomplete setup
      const awInstance = await TravelLocationService.setupCountryAutocomplete(countryInput, {
        onSelect: function(country) {
          self._handleLegCountryChange(index, country);
        }
      });

      if (awInstance) {
        this._autocompleteInstances[instanceKey] = awInstance;

        // Float dropdown to prevent clipping
        this._floatAwesomplete(awInstance, { minWidth: 200 });

        // Only add additional event listeners if not already added
        if (!countryInput._countryEventsAttached) {
          countryInput._countryEventsAttached = true;

          // Handle blur for manual entry
          countryInput.addEventListener('blur', function() {
            const country = this.value.trim();
            if (country) {
              self._handleLegCountryChange(index, country);
            }
          });

          // Auto-select on focus
          countryInput.addEventListener('focus', function() {
            this.select();
          });
        }
      }
    },

    /**
     * Handle country change for a leg
     */
    _handleLegCountryChange(index, country) {
      const isInternational = country !== 'United States' && country !== 'USA';

      // Update UI
      const stateCol = document.getElementById(`legStateCol_${index}`);
      const intlNotice = document.getElementById(`legIntlNotice_${index}`);
      const cityInput = document.getElementById(`legCity_${index}`);
      const stateInput = document.getElementById(`legState_${index}`);

      if (stateCol) {
        stateCol.classList.toggle('hidden', isInternational);
      }

      if (intlNotice) {
        intlNotice.classList.toggle('hidden', !isInternational);
      }

      if (cityInput) {
        if (isInternational) {
          cityInput.placeholder = 'Type city...';
          this._loadLegCities(index, { country: country });
        } else {
          cityInput.placeholder = 'Select state';
          this._resetLegCityAutocomplete(index);
        }
      }

      // Clear state if international
      if (isInternational && stateInput) {
        stateInput.value = '';
      }
    },

    /**
     * Initialize state autocomplete for a leg using TravelLocationService
     */
    _initLegStateAutocomplete(index) {
      const self = this;
      const stateInput = document.getElementById(`legState_${index}`);
      if (!stateInput || !window.Awesomplete) return;

      // Destroy existing instance
      const instanceKey = `state_${index}`;
      if (this._autocompleteInstances[instanceKey]) {
        this._autocompleteInstances[instanceKey].destroy();
        delete this._autocompleteInstances[instanceKey];
      }

      // Use TravelLocationService for state autocomplete setup
      const awInstance = TravelLocationService.setupStateAutocomplete(stateInput, {
        onSelect: function(stateAbbr) {
          self._handleLegStateChange(index, stateAbbr);
        },
        showFullName: true
      });

      if (awInstance) {
        this._autocompleteInstances[instanceKey] = awInstance;

        // Float dropdown to prevent clipping
        this._floatAwesomplete(awInstance, { minWidth: 180 });
      }
    },

    /**
     * Handle state change for a leg
     */
    _handleLegStateChange(index, stateAbbr) {
      this._loadLegCities(index, {
        country: 'United States',
        state: stateAbbr
      });
    },

    /**
     * Load cities for a location using TravelLocationService
     * Unified handler for GSA (CONUS), DoD (OCONUS), and DOS (International)
     */
    async _loadLegCities(index, location) {
      const self = this;
      const cityInput = document.getElementById(`legCity_${index}`);
      const loadingEl = document.getElementById(`legCityLoading_${index}`);

      if (!cityInput) return;

      // Show loading
      if (loadingEl) loadingEl.classList.remove('hidden');
      cityInput.placeholder = 'Loading cities...';

      try {
        // Use shared TravelLocationService
        const result = await TravelLocationService.loadCities(location);

        if (loadingEl) loadingEl.classList.add('hidden');

        if (result.success && result.cities.length > 0) {
          self._setupLegCityAutocomplete(index, result.cities, result.source);
        } else {
          cityInput.placeholder = 'Type any city...';
        }
      } catch (error) {
        if (loadingEl) loadingEl.classList.add('hidden');
        cityInput.placeholder = 'Type any city...';
        console.error('Failed to load cities:', error);
      }
    },

    /**
     * Set up city autocomplete using TravelLocationService
     */
    _setupLegCityAutocomplete(index, cities, source) {
      const self = this;
      const cityInput = document.getElementById(`legCity_${index}`);
      if (!cityInput || !window.Awesomplete) return;

      // Destroy existing
      if (this._autocompleteInstances[`city_${index}`]) {
        this._autocompleteInstances[`city_${index}`].destroy();
      }

      cityInput.placeholder = 'Type any city...';

      // Use TravelLocationService for autocomplete setup (cities already processed)
      const awInstance = TravelLocationService.setupCityAutocomplete(cityInput, cities, {
        onSelect: function(city) {
          // The city value is stored when saving the itinerary
        }
      });

      if (awInstance) {
        this._autocompleteInstances[`city_${index}`] = awInstance;

        // Float dropdown to prevent clipping
        this._floatAwesomplete(awInstance, { minWidth: 200 });
      }
    },

    /**
     * Reset city autocomplete for a leg
     */
    _resetLegCityAutocomplete(index) {
      const cityInput = document.getElementById(`legCity_${index}`);

      if (this._autocompleteInstances[`city_${index}`]) {
        this._autocompleteInstances[`city_${index}`].destroy();
        delete this._autocompleteInstances[`city_${index}`];
      }

      if (cityInput) {
        cityInput.value = '';
        cityInput.placeholder = 'Select state';
      }
    },

    /**
     * Clean up autocomplete instances for a leg
     */
    _cleanupLegAutocomplete(index) {
      ['country', 'state', 'city'].forEach(type => {
        const key = `${type}_${index}`;
        if (this._autocompleteInstances[key]) {
          this._autocompleteInstances[key].destroy();
          delete this._autocompleteInstances[key];
        }
      });

      ['start', 'end'].forEach(type => {
        const key = `${type}_${index}`;
        if (this._itineraryDatePickers[key]) {
          this._itineraryDatePickers[key].destroy();
          delete this._itineraryDatePickers[key];
        }
      });
    },

    /**
     * Toggle itinerary edit mode
     */
    toggleItineraryEdit() {
      if (!this._requestData) return;
      const { legs } = this._requestData;

      this._itineraryOriginal = legs.map(leg => ({ ...leg }));
      this._itineraryRemovedIds = [];
      this._itineraryEditMode = true;
      this._renderItinerary(legs);
    },

    /**
     * Add a new leg in edit mode
     */
    addItineraryLeg() {
      if (!this._requestData) return;
      const { legs } = this._requestData;

      this._syncItineraryFormToData();

      const newLeg = {
        legId: null,
        legNumber: legs.length + 1,
        siteName: '',
        city: '',
        state: '',
        country: 'United States',
        startDate: '',
        endDate: '',
        locationType: 'CONUS',
        isInternational: false,
        isNew: true
      };

      legs.push(newLeg);
      this._renderItinerary(legs);
    },

    /**
     * Remove a leg in edit mode
     */
    removeItineraryLeg(index) {
      if (!this._requestData) return;
      const { legs } = this._requestData;

      if (legs.length <= 1) {
        this._showToast('At least one destination is required', 'warning');
        return;
      }

      this._syncItineraryFormToData();
      this._cleanupLegAutocomplete(index);

      const removedLeg = legs[index];
      if (removedLeg.legId && !removedLeg.isNew) {
        this._itineraryRemovedIds.push(removedLeg.legId);
      }

      legs.splice(index, 1);
      this._renderItinerary(legs);
    },

    /**
     * Sync form values to legs data
     */
    _syncItineraryFormToData() {
      if (!this._requestData) return;
      const { legs } = this._requestData;

      legs.forEach((leg, index) => {
        const siteName = document.getElementById(`legSite_${index}`);
        const city = document.getElementById(`legCity_${index}`);
        const state = document.getElementById(`legState_${index}`);
        const country = document.getElementById(`legCountry_${index}`);
        const startPicker = this._itineraryDatePickers[`start_${index}`];
        const endPicker = this._itineraryDatePickers[`end_${index}`];

        if (siteName) leg.siteName = siteName.value.trim();
        if (city) leg.city = city.value.trim();
        if (state) leg.state = state.value.trim().toUpperCase();
        if (country) {
          leg.country = country.value.trim() || 'United States';
          const isIntl = leg.country !== 'United States' && leg.country !== 'USA';
          leg.isInternational = isIntl;
          leg.locationType = isIntl ? 'International' : 'CONUS';
        }
        if (startPicker) leg.startDate = startPicker.selectedDates[0] ? startPicker.formatDate(startPicker.selectedDates[0], 'Y-m-d') : '';
        if (endPicker) leg.endDate = endPicker.selectedDates[0] ? endPicker.formatDate(endPicker.selectedDates[0], 'Y-m-d') : '';
      });
    },

    /**
     * Cancel itinerary edit
     */
    cancelItineraryEdit() {
      // Cleanup all autocompletes and pickers
      Object.keys(this._autocompleteInstances).forEach(key => {
        if (this._autocompleteInstances[key] && this._autocompleteInstances[key].destroy) {
          this._autocompleteInstances[key].destroy();
        }
      });
      this._autocompleteInstances = {};

      Object.keys(this._itineraryDatePickers).forEach(key => {
        if (this._itineraryDatePickers[key] && this._itineraryDatePickers[key].destroy) {
          this._itineraryDatePickers[key].destroy();
        }
      });
      this._itineraryDatePickers = {};

      if (this._itineraryOriginal && this._requestData) {
        this._requestData.legs = this._itineraryOriginal.map(leg => ({ ...leg }));
      }

      this._itineraryEditMode = false;
      this._itineraryOriginal = null;
      this._itineraryRemovedIds = [];
      this._renderItinerary(this._requestData.legs);
    },

    /**
     * Save itinerary changes
     */
    async saveItinerary() {
      if (!this._requestData) return;
      const { request, legs, travelers } = this._requestData;

      // Sync form to data first
      this._syncItineraryFormToData();

      // Build updated legs
      const updatedLegs = legs.map((leg, index) => ({
        legId: leg.legId,
        legNumber: index + 1,
        siteName: leg.siteName || '',
        city: leg.city || '',
        state: leg.state || '',
        country: leg.country || 'United States',
        startDate: leg.startDate || '',
        endDate: leg.endDate || '',
        isInternational: leg.isInternational || false,
        locationType: leg.locationType || 'CONUS',
        isNew: leg.isNew || false
      }));

      // Validate
      for (let i = 0; i < updatedLegs.length; i++) {
        const leg = updatedLegs[i];
        if (!leg.city) {
          this._showToast(`Leg ${i + 1}: City is required`, 'warning');
          return;
        }
        if (!leg.isInternational && !leg.state) {
          this._showToast(`Leg ${i + 1}: State is required for US destinations`, 'warning');
          return;
        }
        if (!leg.startDate || !leg.endDate) {
          this._showToast(`Leg ${i + 1}: Start and end dates are required`, 'warning');
          return;
        }
        if (new Date(leg.startDate) > new Date(leg.endDate)) {
          this._showToast(`Leg ${i + 1}: End date must be after start date`, 'warning');
          return;
        }
      }

      // Check for travelers with custom dates that need to be shifted
      const originalLegs = this._itineraryOriginal || [];
      const dateShifts = this._calculateDateShiftsForItineraryChange(travelers, originalLegs, updatedLegs);

      // If there are date shifts, show confirmation modal and wait for user
      if (dateShifts.length > 0) {
        const confirmed = await this._showDateShiftConfirmModal(dateShifts, travelers, updatedLegs);
        if (!confirmed) {
          // User cancelled - don't save
          return;
        }
        // User confirmed - dateShifts array has been updated with confirmed values
      }

      const saveBtn = document.querySelector('.review-itinerary-edit__actions .btn-primary');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Saving...';
      }

      // Show loading state on cost-affected areas
      this._setCostAreasLoading(true);

      try {
        // Include confirmed date shifts in the request
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateRequestItinerary(request.requestId, updatedLegs, this._itineraryRemovedIds || [], dateShifts);
        });

        console.log('Itinerary save result:', result);

        // Defensive: handle null/undefined result
        if (!result) {
          console.error('Server returned null/undefined result');
          throw new Error('Server returned empty response - please try again');
        }

        if (result && result.success) {
          const data = result.data || {};
          const newLegsMap = {};
          if (data.newLegs) {
            data.newLegs.forEach(leg => {
              newLegsMap[leg.legNumber] = leg;
            });
          }

          this._requestData.legs = updatedLegs.map((updated, index) => {
            const newLegData = newLegsMap[index + 1];
            if (updated.isNew && newLegData) {
              return { ...newLegData, locationDisplay: this._formatLocation(newLegData) };
            }
            return {
              ...updated,
              legNumber: index + 1,
              locationDisplay: this._formatLocation(updated)
            };
          });

          // Cleanup autocomplete instances
          Object.keys(this._autocompleteInstances).forEach(key => {
            if (this._autocompleteInstances[key]?.destroy) this._autocompleteInstances[key].destroy();
          });
          this._autocompleteInstances = {};

          Object.keys(this._itineraryDatePickers).forEach(key => {
            if (this._itineraryDatePickers[key]?.destroy) this._itineraryDatePickers[key].destroy();
          });
          this._itineraryDatePickers = {};

          // Build change summary for edit history
          const itineraryChanges = [];
          const originalLegs = this._itineraryOriginal || [];
          const removedIds = this._itineraryRemovedIds || [];

          // Track removed legs
          if (removedIds.length > 0) {
            removedIds.forEach(id => {
              const removedLeg = originalLegs.find(l => l.legId === id);
              itineraryChanges.push({
                action: 'removed',
                legId: id,
                city: removedLeg?.city || 'Unknown'
              });
            });
          }

          // Helper to normalize dates for comparison
          const normalizeDateStr = (val) => {
            if (!val) return '';
            const d = new Date(val);
            if (isNaN(d.getTime())) return String(val);
            return d.toISOString().split('T')[0];
          };

          // Track added and updated legs
          updatedLegs.forEach((leg, idx) => {
            if (leg.isNew) {
              itineraryChanges.push({ action: 'added', legNumber: idx + 1, city: leg.city });
            } else {
              // Check if existing leg was modified - compute delta
              const originalLeg = originalLegs.find(o => o.legId === leg.legId);
              if (originalLeg) {
                const fieldsToCompare = ['siteName', 'city', 'state', 'country', 'startDate', 'endDate'];
                const deltaOld = {};
                const deltaNew = {};

                fieldsToCompare.forEach(field => {
                  let oldVal = originalLeg[field] || '';
                  let newVal = leg[field] || '';

                  // Normalize dates
                  if (field === 'startDate' || field === 'endDate') {
                    oldVal = normalizeDateStr(oldVal);
                    newVal = normalizeDateStr(newVal);
                  }

                  if (oldVal !== newVal) {
                    deltaOld[field] = oldVal;
                    deltaNew[field] = newVal;
                  }
                });

                if (Object.keys(deltaNew).length > 0) {
                  itineraryChanges.push({
                    action: 'updated',
                    legNumber: idx + 1,
                    city: leg.city,
                    legId: leg.legId,
                    old: deltaOld,
                    new: deltaNew
                  });
                }
              }
            }
          });

          this._itineraryEditMode = false;
          this._itineraryOriginal = null;
          this._itineraryRemovedIds = [];
          this._renderItinerary(this._requestData.legs);
          this._renderTripOverview(request, this._requestData.legs, this._requestData.travelers, this._requestData.attachments);

          // Add local edit history entry
          if (itineraryChanges.length > 0) {
            this._addLocalEditEntry('Edit_Itinerary', { changes: itineraryChanges });
          }

          // Apply server-recalculated costs (server already updated DB)
          if (data.costRecalculation) {
            console.log('Applying costRecalculation:', data.costRecalculation);
            this._applyServerRecalculatedCosts(data.costRecalculation);
          } else {
            // Fallback to client-side recalculation if server didn't return costs
            console.warn('Server did not return costRecalculation, falling back to client-side');
            await this._recalculateCostsAfterItineraryChange();
          }

          // Remove loading state from cost areas
          this._setCostAreasLoading(false);

          this._showToast('Itinerary updated successfully', 'success');
        } else {
          throw new Error(result.error || 'Failed to save itinerary');
        }
      } catch (error) {
        console.error('Error saving itinerary:', error);
        this._showToast('Failed to save itinerary: ' + error.message, 'error');
        this._setCostAreasLoading(false);
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-save"></i> Save Changes';
        }
      }
    },

    /**
     * Show/hide loading state on cost-affected areas during itinerary save
     */
    _setCostAreasLoading(isLoading) {
      // Grand total in header
      const grandTotalEl = document.getElementById('reviewGrandTotal');
      if (grandTotalEl) {
        grandTotalEl.classList.toggle('cost-updating', isLoading);
      }

      // Traveler cost rows
      document.querySelectorAll('.review-traveler-row__cost').forEach(el => {
        el.classList.toggle('cost-updating', isLoading);
      });

      // Cost section container
      const costsContent = document.getElementById('costsContent');
      if (costsContent) {
        costsContent.classList.toggle('cost-updating', isLoading);
      }
    },

    _calculateLegDuration(startDate, endDate) {
      if (!startDate || !endDate) return 0;
      const start = new Date(startDate);
      const end = new Date(endDate);
      const diffTime = Math.abs(end - start);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays + 1;
    },

    /**
     * Recalculate costs after itinerary changes
     * Fetches new per diem rates and updates traveler costs
     */
    async _recalculateCostsAfterItineraryChange() {
      if (!this._requestData) return;

      const { request, legs, travelers } = this._requestData;
      if (!travelers || travelers.length === 0) return;

      try {
        // Show loading indicator on cost section
        const costsContent = document.getElementById('costsContent');
        if (costsContent) {
          const existingContent = costsContent.innerHTML;
          costsContent.innerHTML = `
            <div class="text-center py-4">
              <i aria-hidden="true" class="fas fa-spinner fa-spin fa-2x text-primary"></i>
              <p class="mt-2 text-muted">Recalculating costs based on itinerary changes...</p>
            </div>
          `;
        }

        // Fetch per diem rates for each leg
        // Per diem services now return pre-calculated totals with day-by-day rate handling
        const legRates = {};
        for (const leg of legs) {
          try {
            const rates = await TravelCostService.getPerDiemRates({
              country: leg.country || 'United States',
              state: leg.state,
              city: leg.city,
              startDate: leg.startDate,
              endDate: leg.endDate
            });

            legRates[leg.legId] = {
              // Rates for display
              lodgingRate: rates?.lodgingRate || rates?.lodging || 0,
              mieRate: rates?.mieRate || rates?.mie || 0,
              // Pre-calculated totals (accounts for seasonal/monthly rate changes)
              lodgingTotal: rates?.lodgingTotal || 0,
              mieTotal: rates?.mieTotal || 0,
              // Duration
              nights: rates?.nights || 0,
              days: rates?.days || 0,
              // Rate variation info for display
              ratesVaried: rates?.ratesVaried || false,
              breakdown: rates?.breakdown || null,
              // Source
              source: rates?.source || 'GSA'
            };
          } catch (error) {
            console.warn(`Failed to get rates for leg ${leg.legId}:`, error);
            const nights = this._calculateLegDuration(leg.startDate, leg.endDate) - 1;
            legRates[leg.legId] = {
              lodgingRate: 0, mieRate: 0,
              lodgingTotal: 0, mieTotal: 0,
              nights, days: nights + 1
            };
          }
        }

        // Update each traveler's leg costs
        for (const traveler of travelers) {
          if (!traveler.legCosts) traveler.legCosts = {};

          // Get legs this traveler is attending
          const attendingLegIds = traveler.attendingLegs || legs.map(l => l.legId);

          for (const legId of attendingLegIds) {
            const rates = legRates[legId];
            if (!rates) continue;

            const legCost = traveler.legCosts[legId] || {};
            const isLocalTravel = legCost.isLocalTravel || false;

            if (!isLocalTravel) {
              // Use pre-calculated totals from per diem service
              // These already account for seasonal/monthly rate variations
              legCost.lodgingRate = rates.lodgingRate;
              legCost.lodgingNights = rates.nights;
              legCost.lodgingCalculated = rates.lodgingTotal;
              legCost.lodgingTotal = rates.lodgingTotal;  // No override - use calculated
              legCost.mieRate = rates.mieRate;
              legCost.mieDays = rates.days;
              legCost.mieCalculated = rates.mieTotal;
              legCost.mieTotal = rates.mieTotal;  // No override - use calculated
              legCost.legSubtotal = rates.lodgingTotal + rates.mieTotal;

              // Clear any existing overrides since dates/city changed
              // Reviewer can re-override later if needed
              legCost.lodgingOverride = false;
              legCost.lodgingOverrideAmount = null;
              legCost.lodgingOverrideReason = null;
              legCost.mieOverride = false;
              legCost.mieOverrideAmount = null;
              legCost.mieOverrideReason = null;

              // Store rate variation info for display
              legCost.ratesVaried = rates.ratesVaried;
              legCost.lodgingBreakdown = rates.breakdown;
            }

            traveler.legCosts[legId] = legCost;
          }

          // Recalculate traveler totals
          const totals = TravelCostService.calculateTravelerTotals(traveler, attendingLegIds);
          traveler.lodgingTotal = totals.lodgingTotal;
          traveler.mieTotal = totals.mieTotal;
          traveler.transportationTotal = totals.transportationTotal;
          traveler.otherTotal = totals.otherTotal;
          traveler.subtotal = totals.subtotal;
        }

        // Calculate new grand total
        const newGrandTotal = TravelCostService.calculateGrandTotal(travelers, request.sharedCosts);
        request.grandTotal = newGrandTotal;

        // Update the header grand total
        const reviewGrandTotal = document.getElementById('reviewGrandTotal');
        if (reviewGrandTotal) {
          reviewGrandTotal.textContent = this._formatCurrency(newGrandTotal);
        }

        // Re-render the cost section
        this._renderCosts(request, travelers, legs);

        // Save updated costs to server
        await this._saveUpdatedCosts(request.requestId, travelers, newGrandTotal);

      } catch (error) {
        console.error('Error recalculating costs:', error);
        this._showToast('Warning: Costs may not reflect itinerary changes', 'warning');
        // Still render the cost section with existing data
        this._renderCosts(request, travelers, legs);
      }
    },

    /**
     * Save updated traveler costs to server
     */
    async _saveUpdatedCosts(requestId, travelers, grandTotal) {
      try {
        const travelerCosts = travelers.map(t => ({
          travelerId: t.travelerId,
          lodgingTotal: t.lodgingTotal || 0,
          mieTotal: t.mieTotal || 0,
          transportationTotal: t.transportationTotal || 0,
          otherTotal: t.otherTotal || 0,
          subtotal: t.subtotal || 0,
          legCosts: t.legCosts || {}
        }));

        await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateTravelerCosts(requestId, travelerCosts, grandTotal);
        });
      } catch (error) {
        console.warn('Failed to save updated costs:', error);
        // Don't show error toast - the costs are already updated in the UI
      }
    },

    /**
     * Apply server-recalculated costs to the UI
     * Called after saveItinerary when server returns costRecalculation
     *
     * @param {Object} costRecalculation - Server response with travelers and totals
     */
    _applyServerRecalculatedCosts(costRecalculation) {
      if (!this._requestData || !costRecalculation) return;

      const { request, travelers, legs } = this._requestData;
      const { travelers: updatedTravelers, totals, dateShifts } = costRecalculation;

      console.log('Applying server-recalculated costs:', totals);
      if (dateShifts && dateShifts.length > 0) {
        console.log('Date shifts detected:', dateShifts);
      }

      // Update each traveler's costs from server data
      if (updatedTravelers && updatedTravelers.length > 0) {
        for (const serverTraveler of updatedTravelers) {
          const localTraveler = travelers.find(t => t.travelerId === serverTraveler.travelerId);
          if (localTraveler) {
            // Update totals
            localTraveler.lodgingTotal = serverTraveler.lodgingTotal || 0;
            localTraveler.mieTotal = serverTraveler.mieTotal || 0;
            localTraveler.localTravelTotal = serverTraveler.localTravelTotal || 0;
            localTraveler.transportationTotal = serverTraveler.transportationTotal || 0;
            localTraveler.otherTotal = serverTraveler.otherTotal || 0;
            localTraveler.subtotal = serverTraveler.subtotal || 0;

            // Update leg costs if provided (server returns object, local is array)
            if (serverTraveler.legCosts) {
              if (!localTraveler.legCosts) localTraveler.legCosts = [];

              for (const [legId, serverLegCost] of Object.entries(serverTraveler.legCosts)) {
                // Find the matching leg cost in the array
                const localLegCostIndex = localTraveler.legCosts.findIndex(lc => lc.legId === legId);
                if (localLegCostIndex >= 0) {
                  // Update existing leg cost
                  localTraveler.legCosts[localLegCostIndex] = {
                    ...localTraveler.legCosts[localLegCostIndex],
                    ...serverLegCost
                  };
                } else {
                  // Add new leg cost (shouldn't happen normally)
                  localTraveler.legCosts.push({ legId, ...serverLegCost });
                }
              }
            }
          }
        }
      }

      // Update request totals
      if (totals) {
        request.travelerTotal = totals.travelerTotal || 0;
        request.grandTotal = totals.grandTotal || 0;
        // Keep sharedTotal as-is (shouldn't change from itinerary edits)
      }

      // Update the header grand total display
      const reviewGrandTotal = document.getElementById('reviewGrandTotal');
      if (reviewGrandTotal) {
        reviewGrandTotal.textContent = this._formatCurrency(request.grandTotal);
      }

      // Update traveler row costs (in Travelers section)
      for (const traveler of travelers) {
        const travelerRow = document.getElementById(`traveler-${traveler.travelerId}`);
        if (travelerRow) {
          const costEl = travelerRow.querySelector('.review-traveler-row__cost');
          if (costEl) {
            costEl.textContent = this._formatCurrency(traveler.subtotal);
          }
        }
      }

      // Re-render the cost section with updated data
      this._renderCosts(request, travelers, legs);

      // Note: Date shift notification removed - we now confirm BEFORE saving
    },

    /**
     * Calculate date shifts for travelers with custom dates when itinerary changes
     * Called client-side BEFORE saving to show confirmation modal
     */
    _calculateDateShiftsForItineraryChange(travelers, originalLegs, updatedLegs) {
      const shifts = [];

      // Build maps for easy lookup
      const oldLegsMap = {};
      originalLegs.forEach(leg => {
        oldLegsMap[leg.legId] = { startDate: leg.startDate, endDate: leg.endDate };
      });

      const newLegsMap = {};
      updatedLegs.forEach(leg => {
        newLegsMap[leg.legId] = { startDate: leg.startDate, endDate: leg.endDate, city: leg.city };
      });

      // Helper to compute day offset
      const getDayOffset = (dateStr, baseStr) => {
        if (!dateStr || !baseStr) return 0;
        const date = new Date(dateStr);
        const base = new Date(baseStr);
        return Math.round((date - base) / (1000 * 60 * 60 * 24));
      };

      // Helper to shift date by offset
      const shiftDate = (baseStr, offsetDays) => {
        if (!baseStr) return '';
        const base = new Date(baseStr);
        base.setDate(base.getDate() + offsetDays);
        return base.toISOString().split('T')[0];
      };

      for (const traveler of travelers) {
        if (!traveler.legCosts) continue;

        const travelerShifts = [];

        for (const legCost of traveler.legCosts) {
          const legId = legCost.legId;
          const oldLeg = oldLegsMap[legId];
          const newLeg = newLegsMap[legId];

          if (!oldLeg || !newLeg) continue;

          // Check if itinerary dates actually changed for this leg
          if (oldLeg.startDate === newLeg.startDate && oldLeg.endDate === newLeg.endDate) {
            continue; // No change
          }

          let lodgingShift = null;
          let mieShift = null;

          // Check lodging custom dates
          if (legCost.lodgingUsesItineraryDates === false && legCost.lodgingStartDate && legCost.lodgingEndDate) {
            const startOffset = getDayOffset(legCost.lodgingStartDate, oldLeg.startDate);
            const endOffset = getDayOffset(legCost.lodgingEndDate, oldLeg.endDate);

            const newStart = shiftDate(newLeg.startDate, startOffset);
            const newEnd = shiftDate(newLeg.endDate, endOffset);

            if (newStart !== legCost.lodgingStartDate || newEnd !== legCost.lodgingEndDate) {
              lodgingShift = {
                from: { start: legCost.lodgingStartDate, end: legCost.lodgingEndDate },
                to: { start: newStart, end: newEnd }
              };
            }
          }

          // Check M&IE custom dates
          if (legCost.mieUsesItineraryDates === false && legCost.mieStartDate && legCost.mieEndDate) {
            const startOffset = getDayOffset(legCost.mieStartDate, oldLeg.startDate);
            const endOffset = getDayOffset(legCost.mieEndDate, oldLeg.endDate);

            const newStart = shiftDate(newLeg.startDate, startOffset);
            const newEnd = shiftDate(newLeg.endDate, endOffset);

            if (newStart !== legCost.mieStartDate || newEnd !== legCost.mieEndDate) {
              mieShift = {
                from: { start: legCost.mieStartDate, end: legCost.mieEndDate },
                to: { start: newStart, end: newEnd }
              };
            }
          }

          if (lodgingShift || mieShift) {
            travelerShifts.push({
              legId,
              legCost,  // Reference to update when confirmed
              location: newLeg.city || 'Unknown',
              itineraryDates: { start: newLeg.startDate, end: newLeg.endDate },
              lodgingShift,
              mieShift
            });
          }
        }

        if (travelerShifts.length > 0) {
          shifts.push({
            travelerId: traveler.travelerId,
            travelerName: traveler.employeeName || 'Unknown Traveler',
            shifts: travelerShifts
          });
        }
      }

      return shifts;
    },

    /**
     * Show confirmation modal for date shifts BEFORE saving
     * Returns Promise that resolves to true (confirmed) or false (cancelled)
     */
    _showDateShiftConfirmModal(dateShifts, travelers, updatedLegs) {
      return new Promise((resolve) => {
        const formatDateShort = (dateStr) => {
          if (!dateStr) return '?';
          return TravelDateService.formatDate(dateStr, 'shortMonth') || '?';
        };

        const formatDateInput = (dateStr) => {
          if (!dateStr) return '';
          return dateStr; // Already in YYYY-MM-DD format
        };

        // Check if dates match itinerary
        const datesMatchItinerary = (startVal, endVal, itinStart, itinEnd) => {
          return startVal === itinStart && endVal === itinEnd;
        };

        // Build editable form for each shift
        let formHtml = '';
        let shiftIndex = 0;

        for (const travelerShift of dateShifts) {
          formHtml += `<div class="date-shift-traveler">
            <div class="date-shift-traveler__name"><i aria-hidden="true" class="fas fa-user"></i> ${this._escapeHtml(travelerShift.travelerName)}</div>`;

          for (const shift of travelerShift.shifts) {
            const itinStart = shift.itineraryDates.start;
            const itinEnd = shift.itineraryDates.end;
            const itinHint = `${formatDateShort(itinStart)} – ${formatDateShort(itinEnd)}`;

            formHtml += `<div class="date-shift-leg" data-shift-index="${shiftIndex}" data-itin-start="${itinStart}" data-itin-end="${itinEnd}">
              <div class="date-shift-leg__header">
                <span class="date-shift-leg__location"><i aria-hidden="true" class="fas fa-map-marker-alt"></i> ${this._escapeHtml(shift.location)}</span>
                <span class="date-shift-leg__itinerary">${itinHint}</span>
              </div>`;

            if (shift.lodgingShift) {
              const lodgingMatchesItin = datesMatchItinerary(shift.lodgingShift.to.start, shift.lodgingShift.to.end, itinStart, itinEnd);
              formHtml += `
                <div class="date-shift-row" data-category="lodging">
                  <span class="date-shift-row__label"><i aria-hidden="true" class="fas fa-bed"></i> Lodging</span>
                  <span class="date-shift-row__from">${formatDateShort(shift.lodgingShift.from.start)} – ${formatDateShort(shift.lodgingShift.from.end)}</span>

          const startInput = row.querySelector(`input[data-type="${category}Start"]`);
          const endInput = row.querySelector(`input[data-type="${category}End"]`);
          const matchIcon = row.querySelector('.date-shift-row__match');
          const useItinBtn = row.querySelector('.date-shift-row__use-itin');

          if (startInput && endInput && matchIcon && useItinBtn) {

          const category = row.dataset.category;

          const endInput = row.querySelector(`input[data-type="${category}End"]`);
          const warning = row.querySelector('.date-shift-row__warning');

          if (!startInput || !endInput || !warning) return;

          const startVal = startInput.value;
          const endVal = endInput.value;
          const warnings = [];

          // Check if start is after end
          if (startVal && endVal && startVal > endVal) {
            warnings.push('Start date is after end date');
          }

          // Check if dates are outside itinerary range
          if (startVal && startVal < itinStart) {
            warnings.push('Start date is before itinerary begins');
          }
          if (endVal && endVal > itinEnd) {
            warnings.push('End date is after itinerary ends');
          }

          if (warnings.length > 0) {
            warning.querySelector('span').textContent = warnings.join('; ');
            warning.classList.remove('hidden');

            const itinStart = leg.dataset.itinStart;
            const itinEnd = leg.dataset.itinEnd;

              const startInput = row.querySelector(`input[data-type="${category}Start"]`);
              const endInput = row.querySelector(`input[data-type="${category}End"]`);
              if (startInput) startInput.value = itinStart;
              if (endInput) endInput.value = itinEnd;

              updateRowIndicators(row);
              validateRowDates(row);

          });

        // Handle input changes for validation and indicators
        modal.querySelectorAll('.date-shift-input').forEach(input => {
          input.addEventListener('change', () => {

            updateRowIndicators(row);
            validateRowDates(row);

        // Handle Cancel
        modal.querySelector('#dateShiftCancel').addEventListener('click', () => {
          modal.remove();
          resolve(false);
        });

        // Handle Confirm - collect values and update the shift objects
        modal.querySelector('#dateShiftConfirm').addEventListener('click', () => {
          // Read values from inputs and update the shift objects
          modal.querySelectorAll('.date-shift-input').forEach(input => {

            const type = input.dataset.type;
            const value = input.value;
            const shift = flatShifts[idx];

            if (type === 'lodgingStart' && shift.lodgingShift) {
              shift.lodgingShift.to.start = value;
              shift.legCost.lodgingStartDate = value;
              // If dates now match itinerary, reset the flag
              const leg = input.closest('.date-shift-leg');
              if (value === leg.dataset.itinStart) {
                const endInput = input.closest('.date-shift-row').querySelector('input[data-type="lodgingEnd"]');
                if (endInput && endInput.value === leg.dataset.itinEnd) {
                  shift.legCost.lodgingUsesItineraryDates = true;
                }
              }
            } else if (type === 'lodgingEnd' && shift.lodgingShift) {
              shift.lodgingShift.to.end = value;
              shift.legCost.lodgingEndDate = value;
              // If dates now match itinerary, reset the flag
              const leg = input.closest('.date-shift-leg');
              if (value === leg.dataset.itinEnd) {
                const startInput = input.closest('.date-shift-row').querySelector('input[data-type="lodgingStart"]');
                if (startInput && startInput.value === leg.dataset.itinStart) {
                  shift.legCost.lodgingUsesItineraryDates = true;
                }
              }
            } else if (type === 'mieStart' && shift.mieShift) {
              shift.mieShift.to.start = value;
              shift.legCost.mieStartDate = value;
              // If dates now match itinerary, reset the flag
              const leg = input.closest('.date-shift-leg');
              if (value === leg.dataset.itinStart) {
                const endInput = input.closest('.date-shift-row').querySelector('input[data-type="mieEnd"]');
                if (endInput && endInput.value === leg.dataset.itinEnd) {
                  shift.legCost.mieUsesItineraryDates = true;
                }
              }
            } else if (type === 'mieEnd' && shift.mieShift) {
              shift.mieShift.to.end = value;
              shift.legCost.mieEndDate = value;
              // If dates now match itinerary, reset the flag
              const leg = input.closest('.date-shift-leg');
              if (value === leg.dataset.itinEnd) {
                const startInput = input.closest('.date-shift-row').querySelector('input[data-type="mieStart"]');
                if (startInput && startInput.value === leg.dataset.itinStart) {
                  shift.legCost.mieUsesItineraryDates = true;
                }
              }
            }
          });

          modal.remove();
          resolve(true);
        });

        // Close on overlay click
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            modal.remove();
            resolve(false);
          }
        });
      });
    },

    // =========================================================================
    // SECTION 4: COSTS - Hybrid Cards + Matrix Design
