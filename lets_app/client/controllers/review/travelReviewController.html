    // =========================================================================

    _calculateTripDuration(legs) {
      if (!legs || legs.length === 0) return 0;

      const startDates = legs.map(leg => new Date(leg.startDate)).filter(d => !isNaN(d));
      const endDates = legs.map(leg => new Date(leg.endDate)).filter(d => !isNaN(d));

      if (startDates.length === 0 || endDates.length === 0) return 0;

      const earliest = new Date(Math.min(...startDates));
      const latest = new Date(Math.max(...endDates));

      const diffTime = Math.abs(latest - earliest);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      return diffDays + 1; // Include both start and end days
    },

    _getDocumentIcon(fileType) {
      if (!fileType) return 'fa-file';
      if (fileType.includes('pdf')) return 'fa-file-pdf';
      if (fileType.includes('image')) return 'fa-file-image';
      if (fileType.includes('word') || fileType.includes('document')) return 'fa-file-word';
      if (fileType.includes('excel') || fileType.includes('spreadsheet')) return 'fa-file-excel';
      return 'fa-file';
    },

    _formatDocumentCategory(category) {
      const categoryMap = {
        'supporting_doc': 'Supporting Document',
        'nfs_worksheet': 'NFS Worksheet',
        'other': 'Other'
      };
      return categoryMap[category] || category || 'Document';
    },

    _truncate(str, length) {
      if (!str) return '';
      return str.length > length ? str.substring(0, length) + '...' : str;
    },

    /**
     * Float Awesomplete dropdown (prevent clipping) and auto-scroll for visibility
     * Delegates to TravelLocationService.floatAwesomplete()
     * @param {Awesomplete} awInstance - The Awesomplete instance
     * @param {Object} options - Optional configuration
     */
    _floatAwesomplete(awInstance, options = {}) {
      if (window.TravelLocationService) {
        TravelLocationService.floatAwesomplete(awInstance, options);
      }
    },

    // =========================================================================
    // FORMATTING HELPERS
    // =========================================================================

    _formatCurrency(amount) {
      // Delegate to shared utility
      return TravelUtils?.formatCurrency?.(amount) ||
        new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    },

    _formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return dateStr;
      }
    },

    /**
     * Format ISO date (yyyy-MM-dd) to display format (Jan 29, 2026)
     */
    _formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      // Handle ISO format yyyy-MM-dd
      const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) {
        const [, year, month, day] = match;
        const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }
      // Fallback to _formatDate for other formats
      return this._formatDate(dateStr);
    },

    _formatDateTime(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
      } catch (e) {
        return dateStr;
      }
    },

    _formatLocationType(type) {
      const types = {
        'conference': 'Conference',
        'client-site': 'Client Site',
        'contractor-site': 'Contractor Site',
        'teb': 'TEB',
        'other': 'Other'
      };
      return types[type] || type || 'N/A';
    },

    _formatTransportMode(mode) {
      const modes = {
        'air': 'Air Travel',
        'private': 'Private Vehicle',
        'gov': 'Government Vehicle',
        'rental': 'Rental Car',
        'other': 'Other'
      };
      return modes[mode] || mode || 'N/A';
    },

    _formatAttendingLegs(attendingLegIds, legs) {
      if (!attendingLegIds || attendingLegIds.length === 0 || !legs || legs.length === 0) {
        return '<span class="review-leg-badge review-leg-badge--all">All Destinations</span>';
      }

      // Map leg IDs to location badges
      const badges = attendingLegIds.map(legId => {
        const leg = legs.find(l => l.legId === legId);
        if (!leg) return null;

        // Use Location_Display if available, otherwise construct from parts
        let locationText = '';
        if (leg.locationDisplay) {
          locationText = leg.locationDisplay;
        } else if (leg.city) {
          if (leg.state) {
            locationText = `${leg.city}, ${leg.state}`;
          } else if (leg.country && leg.country !== 'United States') {
            locationText = `${leg.city}, ${leg.country}`;
          } else {
            locationText = leg.city;
          }
        } else {
          locationText = leg.siteName || 'Unknown';
        }

        return `<span class="review-leg-badge">${this._escapeHtml(locationText)}</span>`;
      }).filter(badge => badge !== null);

      return badges.length > 0 ? badges.join('') : '<span class="review-leg-badge review-leg-badge--all">All Destinations</span>';
    },

    _formatLocation(leg) {
      const parts = [];

      // Site name is a separate part (for client-site/contractor-site locations)
      if (leg.siteName) {
        parts.push(leg.siteName);
      }

      // Build city/state/country as one part
      let locationPart = '';
      if (leg.city) {
        locationPart = leg.city;
        if (!leg.isInternational && leg.state) {
          locationPart += ', ' + leg.state;
        } else if (leg.isInternational && leg.country) {
          locationPart += ', ' + leg.country;
        }
      }

      if (locationPart) {
        parts.push(locationPart);
      }

      // Join with dash: "Site Name - City, State"
      return parts.join(' - ') || 'Unknown Location';
    },

    _formatAction(action) {
      const actions = {
        // Workflow actions
        'Submitted': 'Request Submitted',
        'Resubmitted': 'Request Resubmitted',
        'Sector_Approved': 'Approved by Sector Director',
        'Sector_Needs_Info': 'Returned for More Info (SD)',
        'BU_Approved': 'Approved by BU Reviewer',
        'BU_Needs_Info': 'Returned for More Info (BU)',
        'OSO_Approved': 'Approved by AAS FO',
        'OSO_Needs_Info': 'Returned for More Info (AAS FO)',
        'FAS_Approved': 'Approved by FAS',
        'FAS_Denied': 'Denied by FAS',
        'Denied': 'Request Denied',
        'Cancelled': 'Request Cancelled',
        'Submitter_Cancelled': 'Cancelled by Submitter',
        // Edit actions
        'Edit_Overview': 'Trip Details Updated',
        'Edit_Classification': 'Travel Type Updated',
        'Edit_Itinerary': 'Itinerary Updated',
        'Edit_Travelers': 'Travelers Updated',
        'Edit_SharedCosts': 'Shared Costs Updated',
        'Edit_Costs': 'Costs Updated'
      };
      return actions[action] || action;
    },

    _getStatusInfo(status) {
      const statuses = {
        'PENDING_SECTOR': { label: 'Pending Sector Review', class: 'pending' },
        'NEEDS_INFO_SECTOR': { label: 'Needs Info (Sector)', class: 'needs-info' },
        'PENDING_BU': { label: 'Pending BU Review', class: 'pending' },
        'NEEDS_INFO_BU': { label: 'Needs Info (BU)', class: 'needs-info' },
        'PENDING_OSO': { label: 'Pending AAS FO Review', class: 'pending' },
        'NEEDS_INFO_OSO': { label: 'Needs Info (AAS FO)', class: 'needs-info' },
        'PENDING_FAS': { label: 'Pending FAS', class: 'pending' },
        'APPROVED_GOGOV': { label: 'Approved (Go.gov)', class: 'approved' },
        'COMPLETED': { label: 'Completed', class: 'approved' },
        'CANCELLED': { label: 'Cancelled', class: 'cancelled' },
        'DENIED': { label: 'Denied', class: 'denied' }
      };
      return statuses[status] || { label: status, class: 'pending' };
    },

    _getHistoryIcon(action) {
      if (action.includes('Approved')) return 'fa-check';
      if (action.includes('Needs_Info')) return 'fa-question';
      if (action.includes('Denied') || action.includes('Cancelled')) return 'fa-times';
      if (action.includes('Submitted')) return 'fa-paper-plane';
      return 'fa-circle';
    },

    _getHistoryIconClass(action) {
      if (action.includes('Approved')) return 'approved';
      if (action.includes('Needs_Info')) return 'needs-info';
      if (action.includes('Denied')) return 'denied';
      if (action.includes('Cancelled')) return 'cancelled';
      return 'submitted';
    },

    _escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    },

    _escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    /**
     * Show toast notification
     * Delegates to TravelUtils.showToast()
     */
    _showToast(message, type = 'info') {
      if (window.TravelUtils && TravelUtils.showToast) {
        TravelUtils.showToast(message, type);
      }
    }
  };

})();
</script>
