<!-- Controller for the Travel Request Review page -->
<script>
(function() {
  'use strict';

  // Create namespace
  window.TravelReview = window.TravelReview || {};

  // =========================================================================
  // NAVIGATION
  // =========================================================================

  TravelReview.navigateBack = function() {
    // Show the plane loader and navigate to portal
    if (typeof showNavLoader === 'function') {
      showNavLoader(0, 'Returning to Portal');
    }
    const scriptUrl = TravelReview._scriptUrl || window._travelScriptUrl || '';
    safeTopNavigate(scriptUrl + '?mode=travel');
  };

  TravelReview.toggleHistory = function() {
    const content = document.getElementById('historyContent');
    const icon = document.getElementById('historyToggleIcon');
    const isHidden = content.classList.contains('hidden');
    content.classList.toggle('hidden');
    icon.classList.toggle('review-section__toggle-icon--open', isHidden);
  };

  TravelReview.toggleEditHistory = function() {
    const content = document.getElementById('editHistoryContent');
    const icon = document.getElementById('editHistoryToggleIcon');
    if (content && icon) {
      const isHidden = content.classList.contains('hidden');
      content.classList.toggle('hidden');
      icon.classList.toggle('review-section__toggle-icon--open', isHidden);
    }
  };

  TravelReview.toggleEditEntry = function(entryId) {
    const details = document.getElementById(`${entryId}_details`);
    const icon = document.getElementById(`${entryId}_icon`);
    if (details && icon) {
      const isHidden = details.classList.contains('hidden');
      details.classList.toggle('hidden');
      icon.classList.toggle('fa-chevron-right', !isHidden);
      icon.classList.toggle('fa-chevron-down', isHidden);
    }
  };

  TravelReview.toggleTextChange = function(fieldId) {
    const fullText = document.getElementById(`${fieldId}_full`);
    const icon = document.getElementById(`${fieldId}_icon`);
    if (fullText && icon) {
      const isHidden = fullText.classList.contains('hidden');
      fullText.classList.toggle('hidden');
      icon.classList.toggle('fa-chevron-down', !isHidden);
      icon.classList.toggle('fa-chevron-up', isHidden);
    }
  };

  // =========================================================================
  // FEEDBACK TRACKING
  // =========================================================================

  TravelReview._sectionComments = {
    trip_overview: '',
    itinerary: '',
    travelers: '',
    costs: ''
  };

  TravelReview._updateFeedbackSummary = function() {
    // Count non-empty comments
    const commentCount = Object.values(this._sectionComments).filter(c => c.trim().length > 0).length;

    // Update count display
    const numberEl = document.querySelector('.review-sidebar__feedback-number');
    const labelEl = document.querySelector('.review-sidebar__feedback-label');
    if (numberEl) numberEl.textContent = commentCount;
    if (labelEl) labelEl.textContent = commentCount === 1 ? 'section comment' : 'section comments';

    // Update list
    const listEl = document.getElementById('feedbackList');
    if (!listEl) return;

    if (commentCount === 0) {
      listEl.innerHTML = '<div style="color: var(--color-slate-400); font-size: 0.6875rem; font-style: italic;">No comments added yet</div>';
    } else {
      const sectionNames = {
        trip_overview: 'Trip Overview',
        itinerary: 'Itinerary',
        travelers: 'Travelers',
        costs: 'Costs & Budget'
      };

      const items = Object.entries(this._sectionComments)
        .filter(([key, value]) => value.trim().length > 0)
        .map(([key, value]) => `
          <div class="review-sidebar__feedback-item">
            <i aria-hidden="true" class="fas fa-check-circle"></i>
            <span class="review-sidebar__feedback-item-text">${sectionNames[key]}</span>
          </div>
        `).join('');

      listEl.innerHTML = items;
    }
  };

  // =========================================================================
  // CONTROLLER
  // =========================================================================

  TravelReview.Controller = {
    _requestId: null,
    _userEmail: null,
    _userName: null,
    _scriptUrl: null,
    _requestData: null,
    _sectionComments: {},
    _pendingAction: null,
    _mode: 'reviewer', // 'reviewer' or 'submitter'

    // Itinerary edit resources
    // Note: Foreign countries and city caching are now handled by TravelLocationService
    _autocompleteInstances: {},

    // =========================================================================
    // INITIALIZATION
    // =========================================================================

    async init(options = {}) {
      this._requestId = options.requestId || '';
      this._userEmail = options.userEmail || '';
      this._userName = options.userName || '';
      this._scriptUrl = options.scriptUrl || '';
      this._mode = options.mode || 'reviewer';
      TravelReview._scriptUrl = this._scriptUrl;

      if (!this._requestId) {
        this._showError('No request ID provided');
        return;
      }

      // Load mileage rates from server (for transport cost calculations)
      if (TravelCostService && TravelCostService.loadMileageRates) {
        TravelCostService.loadMileageRates();
      }

      // Bind comment textarea listeners
      this._bindCommentListeners();

      // Bind document card click listeners
      this._bindDocumentCardListeners();

      // Load foreign countries for itinerary editing (if submitter mode)
      if (this._mode === 'submitter') {
        this._loadForeignCountries();
      }

      // Load request data
      await this._loadRequest();
    },

    // =========================================================================
    // DATA LOADING
    // =========================================================================

    async _loadRequest() {
      try {
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getRequestForReview(this._requestId);
        });

        if (!result || !result.success) {
          const errorMsg = result?.error || 'Server returned no data';
          this._showError(errorMsg);
          return;
        }

        this._requestData = result.data || {};
        this._renderRequest();

      } catch (error) {
        console.error('Error loading request:', error);
        this._showError(error.message || 'Network or server error');
      }
    },

    /**
     * Preload location data for itinerary editing
     * Uses TravelPerDiem for IndexedDB cache and TravelLocationService for country list
     */
    async _loadForeignCountries() {
      try {
        // Preload per diem data (DOS + DoD) via TravelPerDiem
        if (window.TravelPerDiem) {
          await window.TravelPerDiem.preloadAll();
        }
        // Preload countries via TravelLocationService (async, non-blocking)
        if (window.TravelLocationService) {
          TravelLocationService.getCountries();
        }
      } catch (error) {
        console.warn('Failed to preload location data:', error);
      }
    },

    // =========================================================================
    // RENDERING
    // =========================================================================

    _renderRequest() {
      const { request, legs, travelers, attachments, approvalLog, permissions } = this._requestData;

      // Hide loading, show content and fixed elements
      document.getElementById('reviewLoading').classList.add('hidden');
      document.getElementById('reviewContent').classList.remove('hidden');
      document.getElementById('reviewInfoBar').classList.remove('hidden');
      document.getElementById('reviewSidebar').classList.remove('hidden');

      // Info bar - basic elements (trip-specific data populated in _renderTripOverview)
      document.getElementById('reviewRequestId').textContent = request.requestId;
      document.getElementById('reviewGrandTotal').textContent = this._formatCurrency(request.grandTotal);

      // Status badge
      const statusEl = document.getElementById('reviewStatus');
      const statusInfo = this._getStatusInfo(request.status);
      statusEl.textContent = statusInfo.label;
      statusEl.className = `review-info-bar__status review-info-bar__status--${statusInfo.class}`;

      // FAS review: filter to overhead travelers only
      const isFasReview = request.status === 'PENDING_FAS';
      const displayTravelers = isFasReview
        ? travelers.filter(t => {
            const val = String(t.isClientPaid || '').toLowerCase();
            return !val || val === 'overhead';
          })
        : travelers;

      // Render sections
      this._renderTripOverview(request, legs, travelers, attachments);
      this._renderItinerary(legs);
      this._renderFasBanner(isFasReview, travelers.length, displayTravelers.length);
      this._renderTravelers(displayTravelers, attachments, legs);
      this._renderCosts(request, travelers, legs);
      this._renderHistory(approvalLog);

      // Submitter info in sidebar
      document.getElementById('submitterName').textContent = request.submitterName;
      document.getElementById('submitterEmail').textContent = request.submitterEmail;
      document.getElementById('submittedDate').innerHTML =
        `<i aria-hidden="true" class="fas fa-calendar-alt"></i> ${this._formatDate(request.submittedAt)}`;

      // Handle submitter vs reviewer mode
      if (this._mode === 'submitter') {
        this._renderSubmitterMode(request, approvalLog);
      } else {
        // Render action buttons based on permissions (reviewer mode)
        this._renderActionButtons(permissions);
      }
    },

    /**
     * Render submitter mode UI (for viewing/editing requests that need info)
     */
    _renderSubmitterMode(request, approvalLog) {
      // Hide reviewer actions section, show submitter actions section
      const reviewerActionsSection = document.getElementById('reviewerActionsSection');
      const submitterActionsSection = document.getElementById('submitterActionsSection');

      if (reviewerActionsSection) {
        reviewerActionsSection.classList.add('hidden');
      }
      if (submitterActionsSection) {
        submitterActionsSection.classList.remove('hidden');
      }

      // Hide all reviewer comment boxes (those are for reviewers, not submitters)
      document.querySelectorAll('.review-comment-box').forEach(box => {
        box.classList.add('hidden');
      });

      const status = request.status;
      const statusConfig = TravelUtils?.TRAVEL_CONFIG?.STATUS || {};
      const isNeedsInfo = (statusConfig.NEEDS_INFO || ['NEEDS_INFO_SECTOR', 'NEEDS_INFO_BU', 'NEEDS_INFO_OSO']).includes(status);
      const isTerminal = (statusConfig.TERMINAL || ['APPROVED_GOGOV', 'COMPLETED', 'DENIED', 'CANCELLED', 'SUBMITTER_CANCELLED']).includes(status);
      const canCancel = !['COMPLETED', 'CANCELLED', 'DENIED', 'SUBMITTER_CANCELLED'].includes(status);

      // Get sidebar sections
      const submitterInfoSection = document.querySelectorAll('.review-sidebar__section')[0];
      const feedbackSection = document.querySelectorAll('.review-sidebar__section')[1];

      if (isNeedsInfo && approvalLog && approvalLog.length > 0) {
        // NEEDS_INFO: Show full feedback with resubmit option
        const needsInfoEntry = approvalLog.find(entry =>
          entry.action === 'Sector_Needs_Info' || entry.action === 'BU_Needs_Info' || entry.action === 'OSO_Needs_Info'
        );

        if (needsInfoEntry) {
          this._renderReviewerInfoSection(needsInfoEntry);
          this._renderFeedbackBanner(needsInfoEntry);
          this._renderInlineSectionFeedback(needsInfoEntry);
          this._renderSidebarFeedbackSummary(needsInfoEntry);
        }
        // Show resubmit + cancel
        this._showSubmitterActions(true, canCancel);

      } else if (isTerminal && approvalLog && approvalLog.length > 0) {
        // APPROVED/DENIED/CANCELLED: Show final reviewer comment
        const finalEntry = this._findFinalLogEntry(approvalLog, status);

        if (finalEntry && finalEntry.comments) {
          this._renderReviewerInfoSection(finalEntry);
          this._renderFinalStatusBanner(finalEntry, status);
          if (feedbackSection) {
            const heading = feedbackSection.querySelector('.review-sidebar__heading');
            if (heading) heading.innerHTML = '<i aria-hidden="true" class="fas fa-comment-dots"></i> Reviewer Comment';
            const feedbackList = document.getElementById('feedbackList');
            if (feedbackList) feedbackList.innerHTML = `<p class="text-muted small mb-0">${this._escapeHtml(finalEntry.comments)}</p>`;
          }
        } else {
          // No comments - hide feedback sections
          if (submitterInfoSection) submitterInfoSection.classList.add('hidden');
          if (feedbackSection) feedbackSection.classList.add('hidden');
        }
        // No resubmit for terminal states, maybe cancel if still allowed
        this._showSubmitterActions(false, canCancel);

      } else {
        // PENDING states: No feedback yet, just show cancel option
        if (submitterInfoSection) submitterInfoSection.classList.add('hidden');
        if (feedbackSection) feedbackSection.classList.add('hidden');
        // No resubmit, just cancel
        this._showSubmitterActions(false, canCancel);
      }
    },

    /**
     * Show/hide submitter action buttons
     */
    _showSubmitterActions(showResubmit, showCancel) {
      const resubmitBtn = document.getElementById('resubmitBtn');
      const dropdownBtn = document.getElementById('submitterDropdownBtn');
      const dropdown = document.getElementById('submitterDropdown');
      const actionSection = document.getElementById('submitterActionsSection');

      if (!showResubmit && !showCancel) {
        // Hide entire action section
        if (actionSection) actionSection.classList.add('hidden');
        return;
      }

      if (resubmitBtn) resubmitBtn.classList.toggle('hidden', !showResubmit);
      if (dropdownBtn) dropdownBtn.classList.toggle('hidden', !showCancel);
      if (dropdown) dropdown.classList.add('hidden'); // Always start collapsed

      // If only cancel is shown, make it the primary button
      if (!showResubmit && showCancel && actionSection) {
        const container = actionSection.querySelector('.review-sidebar__split-button-container');
        if (container) {
          container.innerHTML = `
            <button class="review-sidebar__split-btn review-sidebar__split-btn--cancel-only" onclick="TravelReview.Controller.showCancelModal()">
              <i aria-hidden="true" class="fas fa-ban"></i>
              <span>Cancel Request</span>
            </button>
          `;
        }
      }
    },

    /**
     * Find the final log entry for terminal statuses
     */
    _findFinalLogEntry(approvalLog, status) {
      const actionMap = {
        'APPROVED_GOGOV': ['FAS_Approved', 'OSO_Approved', 'BU_Approved'],
        'DENIED': ['Denied', 'FAS_Denied'],
        'CANCELLED': ['Submitter_Cancelled', 'Cancelled']
      };

      const relevantActions = actionMap[status] || [];
      return approvalLog.find(entry => relevantActions.includes(entry.action));
    },

    /**
     * Render banner for final status (approved/denied)
     */
    _renderFinalStatusBanner(logEntry, status) {
      const existingBanner = document.querySelector('.feedback-banner');
      if (existingBanner) existingBanner.remove();

      const isApproved = status.includes('APPROVED');
      const bannerClass = isApproved ? 'feedback-banner--success' : 'feedback-banner--danger';
      const icon = isApproved ? 'fa-check-circle' : 'fa-times-circle';
      const title = isApproved ? 'Request Approved' : 'Request Denied';

      const bannerHtml = `
        <div class="feedback-banner ${bannerClass}">
          <div class="feedback-banner__header">
            <i aria-hidden="true" class="fas ${icon}"></i>
            <span class="feedback-banner__title">${title}</span>
          </div>
          ${logEntry.comments ? `<p class="feedback-banner__general">${logEntry.comments}</p>` : ''}
        </div>
      `;

      const mainContent = document.querySelector('.review-main');
      if (mainContent) {
        mainContent.insertAdjacentHTML('afterbegin', bannerHtml);
      }
    },

    /**
     * Repurpose the submitter info section to show reviewer info in submitter mode
     */
    _renderReviewerInfoSection(logEntry) {
      const stage = logEntry.action.includes('OSO') ? 'OSO' : 'BU';
      const stageLabel = stage === 'OSO' ? 'OSO' : 'BU';

      // Update heading with badge
      const heading = document.querySelector('.review-sidebar__section:first-child .review-sidebar__heading');
      if (heading) {
        heading.innerHTML = `<i aria-hidden="true" class="fas fa-user-edit"></i> Feedback From <span class="review-sidebar__role-badge">${stageLabel}</span>`;
      }

      // Update content
      document.getElementById('submitterName').textContent = logEntry.actionByName || 'Reviewer';
      document.getElementById('submitterEmail').textContent = ''; // Clear email field
      document.getElementById('submittedDate').innerHTML = `<i aria-hidden="true" class="fas fa-calendar-alt"></i> ${this._formatDate(logEntry.timestamp)}`;
    },

    /**
     * Render feedback summary in sidebar for submitter mode
     */
    _renderSidebarFeedbackSummary(logEntry) {
      const feedbackCount = document.getElementById('feedbackCount');
      const feedbackList = document.getElementById('feedbackList');

      if (!feedbackCount || !feedbackList) return;

      const sectionComments = logEntry.sectionComments || {};

      // Define sections in form order
      const sectionOrder = [
        { key: 'trip_overview', label: 'Trip Overview', id: 'sectionTripOverview' },
        { key: 'itinerary', label: 'Itinerary', id: 'sectionItinerary' },
        { key: 'travelers', label: 'Travelers', id: 'sectionTravelers' },
        { key: 'costs', label: 'Costs', id: 'sectionCosts' }
      ];

      // Filter to only sections with feedback, maintaining order
      const sectionsWithFeedback = sectionOrder.filter(s => sectionComments[s.key]);
      const count = sectionsWithFeedback.length;

      // Update count display
      const countNumber = feedbackCount.querySelector('.review-sidebar__feedback-number');
      const countLabel = feedbackCount.querySelector('.review-sidebar__feedback-label');
      if (countNumber) countNumber.textContent = count;
      if (countLabel) countLabel.textContent = count === 1 ? 'section needs update' : 'sections need updates';

      // Build list of sections - clickable to jump (in form order)
      let listHtml = '';
      for (const section of sectionsWithFeedback) {
        listHtml += `<button type="button" class="review-sidebar__feedback-item review-sidebar__feedback-item--clickable" onclick="TravelReview.Controller.scrollToSection('${section.id}')">
          <i aria-hidden="true" class="fas fa-comment-dots"></i>
          <span>${section.label}</span>
          <i aria-hidden="true" class="fas fa-chevron-right"></i>
        </button>`;
      }
      feedbackList.innerHTML = listHtml;
    },

    /**
     * Render compact feedback banner (general comments only - reviewer info is in sidebar)
     */
    _renderFeedbackBanner(logEntry) {
      const bannerContainer = document.getElementById('feedbackBannerContainer');
      if (!bannerContainer) return;

      // Only show banner if there are general comments
      if (!logEntry.comments) {
        bannerContainer.classList.add('hidden');
        return;
      }

      bannerContainer.innerHTML = `
        <div class="feedback-banner">
          <div class="feedback-banner__icon">
            <i aria-hidden="true" class="fas fa-comment-dots"></i>
          </div>
          <div class="feedback-banner__body">
            <div class="feedback-banner__label">Overall Feedback</div>
            <div class="feedback-banner__text">${this._escapeHtml(logEntry.comments)}</div>
          </div>
        </div>
      `;
      bannerContainer.classList.remove('hidden');
    },

    /**
     * Render inline feedback on sections that have comments
     */
    _renderInlineSectionFeedback(logEntry) {
      if (!logEntry.sectionComments) return;

      const sectionConfig = {
        trip_overview: 'sectionTripOverview',
        itinerary: 'sectionItinerary',
        travelers: 'sectionTravelers',
        costs: 'sectionCosts'
      };

      for (const [section, comment] of Object.entries(logEntry.sectionComments)) {
        if (comment && sectionConfig[section]) {
          const sectionEl = document.getElementById(sectionConfig[section]);
          if (sectionEl) {
            // Add feedback indicator to section header
            const header = sectionEl.querySelector('.review-section__header');
            if (header) {
              header.classList.add('review-section__header--has-feedback');
            }

            // Insert inline feedback after section header
            const feedbackEl = document.createElement('div');
            feedbackEl.className = 'section-feedback';
            feedbackEl.innerHTML = `
              <div class="section-feedback__icon"><i aria-hidden="true" class="fas fa-comment-alt"></i></div>
              <div class="section-feedback__content">
                <span class="section-feedback__label">Reviewer Feedback:</span>
                <span class="section-feedback__text">${this._escapeHtml(comment)}</span>
              </div>
            `;

            // Insert after header, before body
            const body = sectionEl.querySelector('.review-section__body');
            if (body) {
              sectionEl.insertBefore(feedbackEl, body);
            }
          }
        }
      }
    },

    /**
     * Scroll to a section smoothly (targets header content so feedback is visible below)
     */
    scrollToSection(sectionId) {
      const section = document.getElementById(sectionId);
      if (section) {
        // Target the header content - feedback shows right below it
        const headerContent = section.querySelector('.review-section__header-content');
        const target = headerContent || section;

        // Account for fixed info bar height + some padding
        const infoBar = document.getElementById('reviewInfoBar');
        const offset = infoBar ? infoBar.offsetHeight + 16 : 80;

        const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
      }
    },

    /**
     * Open the resubmit modal for editing request
     */
    openResubmitModal() {
      // Reset modal state and clear input
      this._resetModal('resubmit');
      document.getElementById('resubmitComment').value = '';

      // Show modal
      const modal = new bootstrap.Modal(document.getElementById('resubmitModal'));
      modal.show();
    },

    async executeResubmit() {
      // Double-click protection
      const submitBtn = document.getElementById('resubmitSubmitBtn');
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;

      const comment = document.getElementById('resubmitComment').value.trim();

      // Show loading state
      this._setModalState('resubmit', 'loading');

      try {
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .submitReviewAction(
              this._requestId,
              'resubmit',
              comment,
              {} // No section comments for resubmit
            );
        });

        if (result && result.success) {
          this._setModalState('resubmit', 'success');
        } else {
          this._showModalError('resubmit', result?.error || 'Failed to resubmit request');
        }
      } catch (error) {
        console.error('Error resubmitting request:', error);
        this._showModalError('resubmit', error.message || 'An unexpected error occurred');
      }
    },

    // =========================================================================
    // SECTION 1: TRIP OVERVIEW
    // =========================================================================

    _renderTripOverview(request, legs, travelers, attachments) {
      // Update info bar with event details
      document.getElementById('eventName').textContent = request.tripName || 'Unnamed Trip';
      document.getElementById('eventDates').querySelector('span').textContent =
        TravelDateService.formatDateRange(request.eventStartDate, request.eventEndDate);
      document.getElementById('locationType').querySelector('span').textContent =
        this._formatLocationType(request.locationType);

      // Quick stats with international flag
      const duration = this._calculateTripDuration(legs);
      const hasInternational = request.isInternational || request.isOCONUS;

      const quickStatsHtml = `
        <div class="review-quick-stat">
          <div class="review-quick-stat__value">${travelers.length}</div>
          <div class="review-quick-stat__label">Traveler${travelers.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="review-quick-stat">
          <div class="review-quick-stat__value">
            ${legs.length}
            ${hasInternational ? '<i aria-hidden="true" class="fas fa-globe review-quick-stat__flag" title="International travel"></i>' : ''}
          </div>
          <div class="review-quick-stat__label">Destination${legs.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="review-quick-stat">
          <div class="review-quick-stat__value">${duration}</div>
          <div class="review-quick-stat__label">Days</div>
        </div>
        <div class="review-quick-stat">
          <div class="review-quick-stat__value">${this._formatCurrency(request.grandTotal)}</div>
          <div class="review-quick-stat__label">Total Cost</div>
        </div>
      `;
      document.getElementById('quickStats').innerHTML = quickStatsHtml;

      // BLUF & Purpose - editable section
      this._renderOverviewFields(request);

      // Trip details grid - Travel Classification
      this._renderTravelClassification(request);

      // Request-level documents
      const requestDocs = attachments.filter(att => !att.travelerId);
      if (requestDocs.length > 0) {
        document.getElementById('requestDocuments').classList.remove('hidden');
        const docsHtml = requestDocs.map(doc => this._renderDocumentCard(doc)).join('');
        document.getElementById('requestDocumentsList').innerHTML = docsHtml;
      } else {
        document.getElementById('requestDocuments').classList.add('hidden');
      }
    },

    // =========================================================================
    // TRAVEL CLASSIFICATION - View & Edit Mode
    // =========================================================================

    // Classification options configuration
    _travelTypeOptions: [
      { value: 'Local Travel', label: 'Local Travel' },
      { value: 'Internal Travel', label: 'Internal Travel' },
      { value: 'Customer Meeting', label: 'Customer Meeting' },
      { value: 'Vendor Meeting', label: 'Vendor Meeting' },
      { value: 'International - Travel Between CONUS and OCONUS', label: 'International (CONUS → OCONUS)' },
      { value: 'Overseas Employee - Travel within OCONUS', label: 'Overseas Employee (within OCONUS)' },
      { value: 'Speaking Engagement', label: 'Speaking Engagement' },
      { value: 'GSA Sponsored Conference', label: 'GSA Sponsored Conference' },
      { value: 'Non-GSA Sponsored Conference Attendance (including training)', label: 'Non-GSA Conference / Training' }
    ],

    _missionCriticalOptions: [
      { value: 'Acquisition activities conducted in a Sensitive Compartmented Information Facility (SCIF)', label: 'SCIF Acquisition Activities' },
      { value: 'Physical oversight of inventory/deliverables required explicitly by contract, or regulation', label: 'Physical Oversight (Inventory/Deliverables)' },
      { value: 'Physical inspection and acceptance of motor vehicles at manufacturing plants', label: 'Vehicle Inspection at Plants' },
      { value: 'Oversight of retail operations facilities', label: 'Retail Operations Oversight' },
      { value: 'Industry engagement related to acquisition activities', label: 'Industry Engagement (Acquisitions)' },
      { value: 'Technical Evaluation Boards that cannot be conducted virtually', label: 'Technical Evaluation Boards' }
    ],

    _classificationEditMode: false,
    _classificationOriginal: null,

    /**
     * Render Travel Classification section in trip details grid
     */
    _renderTravelClassification(request) {
      const travelTypes = request.travelTypes || [];
      const missionCriticalTypes = request.missionCriticalTypes || [];
      const isEditMode = this._classificationEditMode;
      const canEdit = this._canEditClassification();

      const renderCheckboxList = (options, selectedValues, columnType, editMode) => {
        if (!editMode) {
          // View mode - only show selected items
          const selected = options.filter(opt => selectedValues.includes(opt.value));

      // Update local state from checkboxes
      const travelTypes = [];
      const missionCritical = [];

      document.querySelectorAll('#travelTypesBody input[type="checkbox"]:checked').forEach(cb => {
        travelTypes.push(cb.value);
      });

      document.querySelectorAll('#missionCriticalBody input[type="checkbox"]:checked').forEach(cb => {
        missionCritical.push(cb.value);
      });

      // Update request data (temporary, not saved yet)
      this._requestData.request.travelTypes = travelTypes;
      this._requestData.request.missionCriticalTypes = missionCritical;

      // Hide validation if user fixed the issue
      const validation = document.getElementById('classificationValidation');
      if (validation && travelTypes.length > 0 && missionCritical.length > 0) {
        validation.classList.add('hidden');
      }

    /**
     * Save classification changes
     */
    async saveClassification() {
      // Get current selections
      const travelTypes = this._requestData.request.travelTypes || [];
      const missionCriticalTypes = this._requestData.request.missionCriticalTypes || [];

      // Validate
      if (travelTypes.length === 0 || missionCriticalTypes.length === 0) {
        const validation = document.getElementById('classificationValidation');
        if (validation) {
          validation.classList.remove('hidden');
          document.getElementById('classificationValidationText').textContent =
            travelTypes.length === 0 && missionCriticalTypes.length === 0
              ? 'Please select at least one option in each column.'
              : travelTypes.length === 0
                ? 'Please select at least one Type of Travel.'
                : 'Please select at least one Mission-Critical Travel type.';
        }
        return;
      }

      // Show loading state
      const saveBtn = document.getElementById('saveClassificationBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Saving...';
      }

      try {
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateRequestClassification(
              this._requestId,
              travelTypes,
              missionCriticalTypes
            );
        });

        if (result && result.success) {
          // Capture original values before clearing for edit history
          const originalValues = this._classificationOriginal || {};

          // Update local data with server response
          this._requestData.request.travelTypes = travelTypes;
          this._requestData.request.missionCriticalTypes = missionCriticalTypes;

          // Exit edit mode and re-render
          this._classificationEditMode = false;
          this._classificationOriginal = null;
          this._renderTravelClassification(this._requestData.request);

          // Add local edit history entry - only include changed fields (delta)
          const deltaOld = {};
          const deltaNew = {};

          // Compare arrays by stringifying
          const oldTravelTypes = JSON.stringify(originalValues.travelTypes || []);
          const newTravelTypes = JSON.stringify(travelTypes || []);
          if (oldTravelTypes !== newTravelTypes) {
            deltaOld.travelTypes = originalValues.travelTypes || [];
            deltaNew.travelTypes = travelTypes;
          }

          const oldMissionCritical = JSON.stringify(originalValues.missionCriticalTypes || []);
          const newMissionCritical = JSON.stringify(missionCriticalTypes || []);
          if (oldMissionCritical !== newMissionCritical) {
            deltaOld.missionCriticalTypes = originalValues.missionCriticalTypes || [];
            deltaNew.missionCriticalTypes = missionCriticalTypes;
          }

          // Only add entry if something actually changed
          if (Object.keys(deltaNew).length > 0) {
            this._addLocalEditEntry('Edit_Classification', {
              field: 'classification',
              old: deltaOld,
              new: deltaNew
            });
          }

          console.log('Classification updated successfully');
        } else {
          throw new Error((result && result.error) || 'Failed to save classification');
        }
      } catch (error) {
        console.error('Error saving classification:', error);

        // Show error
        const validation = document.getElementById('classificationValidation');
        if (validation) {
          validation.classList.remove('hidden');
          document.getElementById('classificationValidationText').textContent =
            error.message || 'Failed to save. Please try again.';
        }

        // Reset button
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-check"></i> Save';
        }
      }
    },

    /**
     * Format date for input[type="date"] field (YYYY-MM-DD)
     */
    _formatDateForInput(dateValue) {
      if (!dateValue) return '';
      // If already in YYYY-MM-DD format, return as-is
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
        return dateValue;
      }
      // Try to parse and format
      try {
        const date = new Date(dateValue);
        if (isNaN(date.getTime())) return '';
        return date.toISOString().split('T')[0];
      } catch (e) {
        return '';
      }
    },

    /**
     * Check if user can edit overview fields
     */
    _canEditOverview() {
      if (!this._requestData) return false;
      const { request } = this._requestData;

      // Allow edit if in submitter mode and status allows edits
      if (this._mode === 'submitter') {
        const statusConfig = TravelUtils?.TRAVEL_CONFIG?.STATUS || {};
        const editableStatuses = [
          ...(statusConfig.NEEDS_INFO || ['NEEDS_INFO_SECTOR', 'NEEDS_INFO_BU', 'NEEDS_INFO_OSO']),
          'PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'PENDING_FAS', 'DRAFT'
        ];
        return editableStatuses.includes(request.status);
      }

      return false;
    },

    /**
     * Initialize flatpickr date pickers for overview edit mode
     */
    _initOverviewDatePickers(startDate, endDate) {
      const self = this;

      // Destroy existing pickers if any
      if (this._overviewStartPicker) {
        this._overviewStartPicker.destroy();
        this._overviewStartPicker = null;
      }
      if (this._overviewEndPicker) {
        this._overviewEndPicker.destroy();
        this._overviewEndPicker = null;
      }

      // Start date picker
      const startChip = document.getElementById('editEventStartChip');
      if (startChip) {
        this._overviewStartPicker = TravelDateService.initDateChip(startChip, {
          dateFormat: 'M j, Y',
          displayFormat: 'M j, Y',
          defaultDate: startDate ? new Date(startDate) : null,
          onChange: function(selectedDates, dateStr) {
            // Update end date min if needed
            if (self._overviewEndPicker && selectedDates.length > 0) {
              self._overviewEndPicker.set('minDate', selectedDates[0]);
            }
            self._onOverviewChange();
          }
        });
      }

      // End date picker
      const endChip = document.getElementById('editEventEndChip');
      if (endChip) {
        this._overviewEndPicker = TravelDateService.initDateChip(endChip, {
          dateFormat: 'M j, Y',
          displayFormat: 'M j, Y',
          defaultDate: endDate ? new Date(endDate) : null,
          minDate: startDate ? new Date(startDate) : null,
          onChange: function(selectedDates, dateStr) {
            self._onOverviewChange();
          }
        });
      }
    },

      const validation = document.getElementById('overviewValidation');
      if (validation && tripNameEl && locationTypeEl && blufEl && purposeEl) {

        const endDate = document.getElementById('editEventEndDate');

    /**
     * Save overview changes
     */
    async saveOverview() {
      // Get values from form
      const tripName = document.getElementById('editTripName')?.value?.trim() || '';
      const locationType = document.getElementById('editLocationType')?.value || '';
      const bluf = document.getElementById('editBluf')?.value?.trim() || '';
      const purpose = document.getElementById('editPurpose')?.value?.trim() || '';

      // Get dates from flatpickr instances
      const startDates = this._overviewStartPicker?.selectedDates || [];
      const endDates = this._overviewEndPicker?.selectedDates || [];
      const startDateObj = startDates.length > 0 ? startDates[0] : null;
      const endDateObj = endDates.length > 0 ? endDates[0] : null;

      // Format dates for server (YYYY-MM-DD)
      const formatDateForServer = (date) => {
        if (!date) return '';
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const eventStartDate = formatDateForServer(startDateObj);
      const eventEndDate = formatDateForServer(endDateObj);

      // Validate
      const errors = [];
      if (!tripName) errors.push('Trip Name is required');
      if (!locationType) errors.push('Location Type is required');
      if (!eventStartDate) errors.push('Event Start Date is required');
      if (!eventEndDate) errors.push('Event End Date is required');
      if (!bluf) errors.push('BLUF is required');
      if (!purpose) errors.push('Purpose is required');

      // Check date order (flatpickr should handle this but double-check)
      if (startDateObj && endDateObj && startDateObj > endDateObj) {
        errors.push('End date must be on or after start date');
      }

      if (errors.length > 0) {
        const validation = document.getElementById('overviewValidation');
        if (validation) {
          validation.classList.remove('hidden');
          document.getElementById('overviewValidationText').textContent = errors.join('. ');
        }
        return;
      }

      // Show loading state
      const saveBtn = document.getElementById('saveOverviewBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Saving...';
      }

      try {
        const result = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .updateRequestOverview(
              this._requestId,
              tripName,
              locationType,
              eventStartDate,
              eventEndDate,
              bluf,
              purpose
            );
        });

        if (result && result.success) {
          // Destroy flatpickr instances
          if (this._overviewStartPicker) {
            this._overviewStartPicker.destroy();
            this._overviewStartPicker = null;
          }
          if (this._overviewEndPicker) {
            this._overviewEndPicker.destroy();
            this._overviewEndPicker = null;
          }

          // Update local data
          this._requestData.request.tripName = tripName;
          this._requestData.request.locationType = locationType;
          this._requestData.request.eventStartDate = eventStartDate;
          this._requestData.request.eventEndDate = eventEndDate;
          this._requestData.request.bluf = bluf;
          this._requestData.request.purpose = purpose;

          // Update info bar display
          document.getElementById('eventName').textContent = tripName || 'Unnamed Trip';
          document.getElementById('eventDates').querySelector('span').textContent =
            TravelDateService.formatDateRange(eventStartDate, eventEndDate);
          const locationTypeEl = document.getElementById('locationType');
          if (locationTypeEl) {
            locationTypeEl.querySelector('span').textContent = this._formatLocationType(locationType);
          }

          // Capture original values before clearing for edit history
          const originalValues = this._overviewOriginal || {};

          // Exit edit mode
          this._overviewEditMode = false;
          this._overviewOriginal = null;
          this._renderOverviewFields(this._requestData.request);

          // Add local edit history entry - only include changed fields (delta)
          const newValues = { tripName, locationType, eventStartDate, eventEndDate, bluf, purpose };
          const deltaOld = {};
          const deltaNew = {};
          const dateFields = ['eventStartDate', 'eventEndDate'];

          // Helper to normalize dates for comparison (convert to yyyy-MM-dd string)
          const normalizeDate = (val) => {
            if (!val) return '';
            const d = new Date(val);
            if (isNaN(d.getTime())) return String(val).trim();
            return d.toISOString().split('T')[0];
          };

          Object.keys(newValues).forEach(key => {
            let oldVal = originalValues[key] || '';
            let newVal = newValues[key] || '';

            // Normalize dates for comparison
            if (dateFields.includes(key)) {
              if (normalizeDate(oldVal) === normalizeDate(newVal)) return;
            } else {
              // For non-date fields, do simple string comparison
              if (String(oldVal).trim() === String(newVal).trim()) return;
            }

            deltaOld[key] = oldVal;
            deltaNew[key] = newVal;
          });

          // Only add entry if something actually changed
          if (Object.keys(deltaNew).length > 0) {
            this._addLocalEditEntry('Edit_Overview', {
              field: 'overview',
              old: deltaOld,
              new: deltaNew
            });
          }

          console.log('Overview updated successfully');
        } else {
          throw new Error((result && result.error) || 'Failed to save overview');
        }
      } catch (error) {
        console.error('Error saving overview:', error);

        // Show error
        const validation = document.getElementById('overviewValidation');
        if (validation) {
          validation.classList.remove('hidden');
          document.getElementById('overviewValidationText').textContent =
            error.message || 'Failed to save. Please try again.';
        }

        // Reset button
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i aria-hidden="true" class="fas fa-check"></i> Save';
        }
      }
    },
