<style>
/* ============================================================================
   TRAVEL REVIEW PAGE - Executive Dashboard Aesthetic
   Design: Editorial precision meets data clarity
   ============================================================================ */

/* CSS Variables — consolidated into client/styles/tokens.html as of
   Chunk 16.2 (2026-05-21). The :root block that lived here defined
   --color-primary, --color-success, slate / green / red scales,
   --font-primary, spacing, shadows, borders, transitions — all of
   which now live in tokens.html as Layer 5 aliases (so existing
   var(--foo) references in this stylesheet keep resolving). Resolves
   OPEN_QUESTIONS Q23 (three-token-system cleanup). */

/* ============================================================================
   UTILITY CLASSES
   ============================================================================ */
.hidden { display: none !important; }
.visible { display: block !important; }
.visible-flex { display: flex !important; }
.visible-inline { display: inline !important; }
.visible-inline-block { display: inline-block !important; }

/* ============================================================================
   BASE OVERRIDES
   ============================================================================ */

html, body {
  height: auto !important;
  overflow: auto !important;
  overflow-x: hidden !important;
  /* Hide scrollbar but keep scroll functionality */
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* IE/Edge */
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  width: 0;
  display: none;
}

.travel-review-body {
  font-family: var(--font-primary);
  background: var(--color-slate-50);
  min-height: 100vh;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============================================================================
   HEADER - Fixed, minimal height
   ============================================================================ */
.portal-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-3);
  z-index: 1000;
  box-shadow: var(--shadow-md);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.portal-header__left {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.portal-header__divider {
  width: 1px;
  height: 24px;
  background: rgba(255, 255, 255, 0.2);
}

.portal-header__title {
  font-size: 0.8125rem;
  font-weight: 600;
  color: white;
  margin: 0;
  display: flex;
  align-items: center;
  gap: var(--space-1);
  letter-spacing: -0.01em;
}

.portal-header__title i {
  font-size: 0.75rem;
  opacity: 0.9;
}

.portal-header__right {
  display: flex;
  align-items: center;
  gap: 1rem;
}


.portal-header__user {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 0.8125rem;
  color: rgba(255, 255, 255, 0.9);
  font-weight: 500;
}

.portal-header__user i {
  font-size: 1.125rem;
  opacity: 0.8;
}

/* ============================================================================
   INFO BAR - Key request metadata
   ============================================================================ */
.review-info-bar {
  position: fixed;
  top: 48px;
  left: 0;
  right: 0;
  height: 60px;
  background: white;
  display: flex;
  align-items: stretch;
  padding: 0;
  z-index: 999;
  border-bottom: 1px solid var(--color-slate-200);
  box-shadow: var(--shadow-sm);
}

/* Back link - vertical element on far left */
.review-info-bar__back {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
  padding: 0 var(--space-4);
  color: var(--color-primary);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-right: 1px solid var(--color-slate-200);
  background: var(--color-slate-50);
  transition: all var(--transition-fast);
  min-width: 70px;
}

.review-info-bar__back:hover {
  background: var(--color-primary);
  color: white;
}

.review-info-bar__back i {
  font-size: 0.875rem;
  transition: transform var(--transition-fast);
}

.review-info-bar__back:hover i {
  transform: translateX(-3px);
}

.review-info-bar__back span {
  line-height: 1;
}

/* Center content - title and meta stacked */
.review-info-bar__center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.25rem;
  padding: 0 var(--space-3);
  min-width: 0;
}

.review-info-bar__title {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--color-slate-900);
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.review-info-bar__meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.review-info-bar__id {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  color: var(--color-slate-600);
  background: var(--color-slate-100);
  padding: 0.25rem 0.5rem;
  border-radius: var(--border-radius-sm);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.review-info-bar__status {
  font-size: 0.6875rem;
  font-weight: 600;
  padding: 0.25rem 0.625rem;
  border-radius: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.review-info-bar__status--pending {
  background: var(--color-warning-light);
  color: #92400e;
}

.review-info-bar__status--approved {
  background: var(--color-success-light);
  color: var(--color-success);
}

.review-info-bar__status--needs-info {
  background: var(--color-warning-light);
  color: var(--color-warning);
}

.review-info-bar__status--denied,
.review-info-bar__status--cancelled {
  background: var(--color-error-light);
  color: var(--color-error);
}

.review-info-bar__right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  text-align: right;
  padding: 0 var(--space-4);
}

.review-info-bar__total-label {
  display: block;
  font-size: 0.6875rem;
  color: var(--color-slate-500);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.review-info-bar__total-amount {
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--color-primary);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

/* Event details in info bar */
.review-info-bar__dates,
.review-info-bar__location-type {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.6875rem;
  color: var(--color-slate-600);
  background: var(--color-slate-100);
  padding: 0.25rem 0.5rem;
  border-radius: var(--border-radius-sm);
}

.review-info-bar__dates i,
.review-info-bar__location-type i {
  font-size: 0.625rem;
  opacity: 0.7;
}

/* ============================================================================
   MAIN LAYOUT
   ============================================================================ */
.review-main {
  margin-top: 108px; /* 48px header + 60px info bar */
  min-height: calc(100vh - 108px);
  padding: var(--space-3);
  padding-left: var(--space-3);
  padding-bottom: var(--space-4);
  max-width: 1440px;
  margin-left: auto;
  margin-right: auto;
}

.review-content {
  max-width: 960px;
  margin-left: auto;
  margin-right: 300px; /* Space for sidebar */
}

@media (max-width: 1600px) {
  .review-content {
    margin-right: 290px;
  }
}

/* Loading & Error States */
.review-loading,
.review-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  color: var(--color-slate-500);
}

.review-error i {
  font-size: 3rem;
  color: var(--color-warning);
  margin-bottom: var(--space-2);
}

.review-error h2 {
  font-size: 1.25rem;
  color: var(--color-slate-800);
  margin: 0 0 var(--space-1) 0;
  font-weight: 600;
}

.review-error p {
  font-size: 0.9375rem;
  margin: 0 0 var(--space-3) 0;
  color: var(--color-slate-600);
}

/* ============================================================================
   SECTIONS - Card-based editorial layout
   ============================================================================ */
.review-section {
  background: white;
  border-radius: var(--border-radius-base);
  margin-bottom: var(--space-2);
  box-shadow: var(--shadow-base);
  overflow: hidden;
  transition: box-shadow var(--transition-base);
  border: 1px solid var(--color-slate-200);
}

.review-section:hover {
  box-shadow: var(--shadow-md);
}

.review-section__header {
  padding: var(--space-2);
  background: linear-gradient(180deg, var(--color-slate-50) 0%, white 100%);
  border-bottom: 1px solid var(--color-slate-200);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.review-section__header-content {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1;
}

.review-section__header-meta {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 0.6875rem;
  color: var(--color-slate-500);
  font-weight: 500;
}

.review-section__header h2 {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--color-slate-900);
  margin: 0;
  display: flex;
  align-items: center;
  gap: var(--space-1);
  letter-spacing: -0.01em;
}

.review-section__header h2 i {
  color: var(--color-primary);
  font-size: 0.6875rem;
  width: 16px;
  text-align: center;
}

.review-section__body {
  padding: var(--space-3);
}

/* Section animations */
.review-section {
  animation: fadeInUp 0.4s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Stagger animation for multiple sections */
.review-section:nth-child(1) { animation-delay: 0.05s; }
.review-section:nth-child(2) { animation-delay: 0.1s; }
.review-section:nth-child(3) { animation-delay: 0.15s; }
.review-section:nth-child(4) { animation-delay: 0.2s; }
.review-section:nth-child(5) { animation-delay: 0.25s; }

/* Collapsible sections */
.review-section--collapsible .review-section__header {
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}

.review-section__header--clickable:hover {
  background: linear-gradient(180deg, var(--color-slate-100) 0%, var(--color-slate-50) 100%);
}

.review-section__toggle-icon {
  color: var(--color-slate-400);
  font-size: 0.875rem;
  transition: transform var(--transition-base);
}

.review-section__toggle-icon--open {
  transform: rotate(180deg);
}

/* ============================================================================
   FIELD GROUPS - Clean data presentation
   ============================================================================ */
.review-field-group {
  margin-bottom: var(--space-4);
}

.review-field-group:last-child {
  margin-bottom: 0;
}

.review-field-label {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--color-slate-500);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: var(--space-1);
}

.review-field-label i {
  font-size: 0.6875rem;
  color: var(--color-primary);
}

.review-field-value {
  font-size: 0.9375rem;
  color: var(--color-slate-800);
  line-height: 1.6;
}

.review-field-value--bluf {
  font-size: 0.875rem;
  line-height: 1.6;
  color: var(--color-slate-900);
  font-weight: 500;
  padding: var(--space-2);
  background: var(--color-slate-50);
  border-left: 3px solid var(--color-primary);
  border-radius: var(--border-radius-sm);
}

.review-field-value--multiline {
  white-space: pre-wrap;
  line-height: 1.7;
}

/* Clickable text field - click to open focus modal */
.review-field-value--clickable {
  position: relative;
  cursor: pointer;
  border-radius: var(--border-radius-sm);
  padding: var(--space-2);
  margin: calc(-1 * var(--space-2));
  transition: background-color 0.15s ease, box-shadow 0.15s ease;
}

.review-field-value--clickable:hover {
  background: var(--color-slate-50);
}

.review-field-value--clickable:active {
  background: var(--color-slate-100);
}

/* Truncated state for long text */
.review-field-value--clickable.truncated {
  max-height: 5.5em; /* ~3-4 lines */
  overflow: hidden;
}

.review-field-value--clickable.truncated::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2em;
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.9));
  pointer-events: none;
  transition: background 0.15s ease;
}

.review-field-value--clickable.truncated:hover::after {
  background: linear-gradient(to bottom, rgba(248, 250, 252, 0), rgba(248, 250, 252, 0.95));
}

/* Click hint icon */
.review-field-value--clickable.truncated::before {
  content: '\f065'; /* fa-expand-alt */
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  bottom: 0.5rem;
  right: 0.5rem;
  font-size: 0.7rem;
  color: var(--color-slate-400);
  opacity: 0;
  transition: opacity 0.15s ease;
  z-index: 1;
}

.review-field-value--clickable.truncated:hover::before {
  opacity: 1;
}

/* Non-truncated clickable still has hover effect */
.review-field-value--clickable:not(.truncated):hover {
  background: var(--color-slate-50);
}

/* Purpose focus modal */
.purpose-focus-content {
  font-size: 1rem;
  line-height: 1.7;
  color: var(--color-slate-800);
  white-space: pre-wrap;
}

/* ============================================================================
   QUICK STATS BAR - At-a-glance metrics
   ============================================================================ */
.review-quick-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.review-quick-stat {
  text-align: center;
  padding: var(--space-2);
  background: var(--color-slate-50);
  border: 1px solid var(--color-slate-200);
  border-radius: var(--border-radius-sm);
  transition: all var(--transition-fast);
}

.review-quick-stat:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-sm);
}

.review-quick-stat__value {
  display: block;
  font-size: 1rem;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 0.125rem;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.review-quick-stat__label {
  display: block;
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--color-slate-600);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* International flag in destinations stat */
.review-quick-stat__flag {
  font-size: 0.75em;
  margin-left: 0.25rem;
  color: var(--color-warning);
  opacity: 0.9;
}

/* Empty state messaging */
.review-empty-state {
  text-align: center;
  padding: var(--space-6);
  color: var(--color-slate-400);
  font-style: italic;
  font-size: 0.875rem;
}

.review-empty-state i {
  font-size: 2rem;
  color: var(--color-slate-300);
  margin-bottom: var(--space-2);
  display: block;
}

/* ============================================================================
   DETAIL GRID - Two-column metadata
   ============================================================================ */
.review-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3);
  padding-top: var(--space-5);
  padding-bottom: var(--space-4);
  margin-top: var(--space-3);
  border-top: 1px solid var(--color-slate-200);
}

@media (max-width: 768px) {
  .review-detail-grid {
    grid-template-columns: 1fr;
  }
}

/* ============================================================================
   TRAVEL CLASSIFICATION - Two-column checkbox display
   ============================================================================ */
.review-classification-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
}

@media (max-width: 768px) {
  .review-classification-grid {
    grid-template-columns: 1fr;
  }
}

.review-classification-column {
  background: var(--color-slate-50);
  border: 1px solid var(--color-slate-200);
  border-radius: var(--border-radius-sm);
  overflow: hidden;
}

.review-classification-column__header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: white;
  font-weight: 600;
  font-size: 0.75rem;
}

.review-classification-column__header i {
  font-size: 0.8125rem;
  opacity: 0.9;
}

.review-classification-column__body {
  display: flex;
  flex-direction: column;
}

.review-classification__option {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.5rem 0.875rem;
  margin: 0;
  border-bottom: 1px solid var(--color-slate-200);
  background: rgba(0, 79, 135, 0.04);
}

.review-classification__option:last-child {
  border-bottom: none;
}

.review-classification__option input[type="checkbox"] {
  width: 0.875rem;
  height: 0.875rem;
  margin-top: 0.125rem;
  flex-shrink: 0;
  accent-color: var(--color-primary);
  pointer-events: none;
}

.review-classification__text {
  font-size: 0.8125rem;
  color: var(--color-primary-dark);
  font-weight: 500;
  line-height: 1.4;
}

.review-classification__empty {
  padding: 0.75rem;
  font-size: 0.75rem;
  color: var(--color-slate-400);
  font-style: italic;
  text-align: center;
}

/* Classification Wrapper & Header */
.review-classification-wrapper {
  grid-column: 1 / -1;
}

.review-classification__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}

.review-classification__title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--color-slate-700);
}

.review-classification__title i {
  color: var(--color-primary);
}

.review-classification__edit-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-slate-50);
  border: 1px solid var(--color-slate-300);
  border-radius: 4px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.review-classification__edit-btn:hover {
  background: var(--color-slate-100);
  border-color: var(--color-primary);
}

.review-classification__edit-btn i {
  font-size: 0.6875rem;
}

.review-classification__header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* Edit mode wrapper styling */
.review-classification-wrapper--editing {
  padding: var(--space-3);
  background: var(--color-slate-50);
  border: 2px solid var(--color-primary);
  border-radius: var(--border-radius-sm);
}

.review-classification-wrapper--editing .review-classification-column {
  border-color: var(--color-primary-light);
}

/* Editable checkbox options */
.review-classification__option--editable {
  cursor: pointer;
  background: white;
}

.review-classification__option--editable:hover {
  background: var(--color-slate-100);
}

.review-classification__option--editable input[type="checkbox"] {
  pointer-events: auto;
  cursor: pointer;
}

.review-classification__option--editable:has(input:checked) {
  background: rgba(0, 79, 135, 0.08);
}

/* Validation message */
.review-classification__validation {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding: var(--space-2) var(--space-3);
  font-size: 0.75rem;
  color: var(--color-warning);
  background: var(--color-warning-light);
  border: 1px solid var(--color-warning);
  border-radius: var(--border-radius-sm);
}

.review-classification__validation i {
  flex-shrink: 0;
}

/* ============================================================================
   OVERVIEW FIELDS - BLUF & Purpose Edit Mode
   ============================================================================ */

.review-overview-wrapper {
  margin-bottom: var(--space-4);
}

.review-overview__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--color-slate-200);
}

.review-overview__title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--color-slate-700);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.review-overview__title i {
  color: var(--color-primary);
}

.review-overview__edit-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--color-slate-600);
  background: white;
  border: 1px solid var(--color-slate-300);
  border-radius: var(--border-radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.review-overview__edit-btn:hover {
  background: var(--color-slate-100);
  border-color: var(--color-primary);
}

.review-overview__edit-btn i {
  font-size: 0.6875rem;
}

.review-overview__header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* Edit mode wrapper styling */
.review-overview-wrapper--editing {
  padding: var(--space-4);
  background: var(--color-slate-50);
  border: 2px solid var(--color-primary);
  border-radius: var(--border-radius-base);
}

.review-overview__field {
  margin-bottom: var(--space-3);
}

.review-overview__field:last-child {
  margin-bottom: 0;
}

.review-overview__field-row {
  display: flex;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}

.review-overview__field--half {
  flex: 1;
  margin-bottom: 0;
}

.review-overview__field--grow {
  flex: 1;
  margin-bottom: 0;
}

.review-overview__field--date {
  flex: 0 0 auto;
  margin-bottom: 0;
}

.review-overview__field--select {
  flex: 0 0 160px;
  margin-bottom: 0;
}

.review-overview__select {
  height: 36px;
  font-size: 0.875rem;
  border-radius: var(--border-radius-sm);
  border: 1px solid var(--color-slate-300);
}

.review-overview__select:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(0, 79, 135, 0.6);
  outline: none;
}

.review-overview__field-label {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--color-slate-600);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: var(--space-1);
}

.review-overview__field-label i {
  font-size: 0.6875rem;
  color: var(--color-primary);
}

.review-overview__input,
.review-overview__textarea {
  font-size: 0.875rem;
  border: 1px solid var(--color-slate-300);
  border-radius: var(--border-radius-sm);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.review-overview__input:focus,
.review-overview__textarea:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(0, 79, 135, 0.6);
  outline: none;
}

.review-overview__textarea {
  resize: vertical;
  min-height: 80px;
}

.review-overview__char-count {
  text-align: right;
  font-size: 0.6875rem;
  color: var(--color-slate-400);
  margin-top: var(--space-1);
}

.review-overview__validation {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  margin-bottom: var(--space-3);
  font-size: 0.75rem;
  color: var(--color-error);
  background: var(--color-error-light);
  border-radius: var(--border-radius-sm);
}

.review-overview__validation i {
  flex-shrink: 0;
}

/* Date chip styling for flatpickr integration */
.date-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.5rem 0.75rem;
  background: white;
  border: 1px solid var(--color-slate-300);
  border-radius: var(--border-radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
  min-width: 140px;
}

.date-chip:hover {
  background: var(--color-slate-50);
  border-color: var(--color-primary);
}

.date-chip:focus-within {
  background: white;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(0, 79, 135, 0.6);
}

.date-chip__icon {
  color: var(--color-slate-400);
  font-size: 0.875rem;
  flex-shrink: 0;
  transition: color var(--transition-fast);
}

.date-chip:hover .date-chip__icon,
.date-chip:focus-within .date-chip__icon {
  color: var(--color-primary);
}

.date-chip__input {
  border: none !important;
  background: transparent !important;
  padding: 0 !important;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--color-slate-700);
  width: 100%;
  cursor: pointer;
  outline: none;
}

.date-chip__input::placeholder {
  color: var(--color-slate-400);
  font-weight: 400;
}

/* When date is selected */
.date-chip--filled {
  background: rgba(0, 79, 135, 0.05);
  border-color: rgba(0, 79, 135, 0.3);
}

.date-chip--filled .date-chip__icon {
  color: var(--color-primary);
}

.date-chip--filled .date-chip__input {
  color: var(--color-primary-dark);
  font-weight: 600;
}

/* Compact variant for itinerary editing */
.date-chip--compact {
  padding: 0.375rem 0.5rem;
  min-width: 100px;
}

.date-chip--compact .date-chip__icon {
  font-size: 0.75rem;
}

.date-chip--compact .date-chip__input {
  font-size: 0.8125rem;
}

/* ============================================================================
   FLATPICKR CALENDAR STYLING - Branded blue theme
   ============================================================================ */

.flatpickr-calendar {
  font-family: var(--font-sans);
  border-radius: 10px;
  border: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  width: 280px;
  padding: 0;
}

.flatpickr-calendar.open {
  z-index: 10000;
}

.flatpickr-months {
  padding: 8px 8px 4px;
  background: var(--color-primary);
  border-radius: 10px 10px 0 0;
}

.flatpickr-months .flatpickr-month {
  height: 32px;
}

.flatpickr-current-month {
  font-size: 0.875rem;
  font-weight: 600;
  color: white;
  padding-top: 4px;
}

.flatpickr-current-month .flatpickr-monthDropdown-months {
  background: transparent;
  color: white;
  font-weight: 600;
  border: none;
}

.flatpickr-current-month .flatpickr-monthDropdown-months option {
  color: var(--color-slate-700);
  background: white;
}

.flatpickr-current-month .flatpickr-monthDropdown-months:hover {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

.flatpickr-current-month input.cur-year {
  color: white;
  font-weight: 600;
}

.flatpickr-months .flatpickr-prev-month,
.flatpickr-months .flatpickr-next-month {
  fill: white;
  color: white;
  padding: 6px 10px;
  transition: background 0.15s ease;
}

.flatpickr-months .flatpickr-prev-month:hover,
.flatpickr-months .flatpickr-next-month:hover {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

.flatpickr-months .flatpickr-prev-month svg,
.flatpickr-months .flatpickr-next-month svg {
  width: 12px;
  height: 12px;
}

.flatpickr-innerContainer {
  padding: 8px;
}

.flatpickr-rContainer {
  width: 100%;
}

.flatpickr-weekdays {
  width: 100%;
  display: flex;
}

.flatpickr-weekdaycontainer {
  display: flex;
  width: 100%;
}

.flatpickr-weekday {
  flex: 1;
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--color-slate-500);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.flatpickr-days {
  width: 100% !important;
}

.dayContainer {
  width: 100%;
  min-width: 100%;
  max-width: 100%;
  display: flex;
  flex-wrap: wrap;
}

.flatpickr-day {
  flex: 1 0 calc(100% / 7);
  max-width: calc(100% / 7);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--color-slate-700);
  border-radius: 6px;
  border: 1px solid transparent;
  line-height: 36px;
  height: 36px;
  transition: all 0.15s ease;
}

.flatpickr-day:hover {
  background: rgba(0, 79, 135, 0.1);
  border-color: transparent;
  color: var(--color-primary);
}

.flatpickr-day.today {
  border-color: var(--color-primary);
  background: transparent;
  color: var(--color-primary);
  font-weight: 600;
}

.flatpickr-day.today:hover {
  background: rgba(0, 79, 135, 0.1);
  color: var(--color-primary);
}

.flatpickr-day.selected,
.flatpickr-day.selected:hover,
.flatpickr-day.selected:focus {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
  font-weight: 600;
}

.flatpickr-day.flatpickr-disabled,
.flatpickr-day.flatpickr-disabled:hover {
  color: var(--color-slate-300);
  background: transparent;
}

.flatpickr-day.prevMonthDay,
.flatpickr-day.nextMonthDay {
  color: var(--color-slate-300);
}

.flatpickr-day.prevMonthDay:hover,
.flatpickr-day.nextMonthDay:hover {
  background: var(--color-slate-100);
  color: var(--color-slate-400);
}

/* ============================================================================
   TRAVELER ROWS - Smart Accordion Cards
   ============================================================================ */

/* Section header expand toggle button */
.review-section__header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.review-section__expand-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.75rem;
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-slate-50);
  border: 1px solid var(--color-slate-200);
  border-radius: var(--border-radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.review-section__expand-toggle:hover {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.review-section__expand-toggle i {
  font-size: 0.625rem;
}

/* Traveler row container */
.review-traveler-row {
  background: white;
  border: 1px solid var(--color-slate-200);
  border-radius: var(--border-radius-base);
  margin-bottom: var(--space-2);
  overflow: hidden;
  transition: all var(--transition-base);
}

.review-traveler-row:last-child {
  margin-bottom: 0;
}

.review-traveler-row:hover {
  border-color: var(--color-slate-300);
  box-shadow: var(--shadow-sm);
}

/* Missing justification warning state */
.review-traveler-row--missing-justification {
  border-left: 3px solid var(--color-warning);
}

.review-traveler-row--missing-justification .review-traveler-row__avatar {
  background: linear-gradient(135deg, var(--color-warning) 0%, #e55a1f 100%);
}

/* Collapsed header row */
.review-traveler-row__header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3);
  cursor: pointer;
  transition: background var(--transition-fast);
}

.review-traveler-row__header:hover {
  background: var(--color-slate-50);
}

/* Initials avatar */
.review-traveler-row__avatar {
  width: 2.25rem;
  height: 2.25rem;
  background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}

/* Name and meta info */
.review-traveler-row__info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
}

.review-traveler-row__name {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-slate-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.review-traveler-row__meta {
  font-size: 0.75rem;
  color: var(--color-slate-500);
  display: flex;
  align-items: center;
  gap: 0.25rem;
  flex-wrap: wrap;
}

.review-traveler-row__meta i {
  font-size: 0.625rem;
  color: var(--color-slate-400);
}

.review-traveler-row__separator {
  color: var(--color-slate-300);
  margin: 0 0.125rem;
}

.review-traveler-row__destinations {
  color: var(--color-slate-600);
  font-weight: 500;
  max-width: 320px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-block;
  vertical-align: middle;
}

/* Cost display */
.review-traveler-row__cost {
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--color-primary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Expand/collapse toggle */
.review-traveler-row__toggle {
  width: 1.5rem;
  height: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-slate-400);
  transition: transform var(--transition-fast);
}

.review-traveler-row__toggle i {
  font-size: 0.75rem;
}

.review-traveler-row--expanded .review-traveler-row__toggle {
  transform: rotate(180deg);
}

/* Expandable body */
.review-traveler-row__body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease-out, padding 0.3s ease-out;
  padding: 0 var(--space-3);
  background: var(--color-slate-50);
  border-top: 0 solid var(--color-slate-200);
}

.review-traveler-row--expanded .review-traveler-row__body {
  max-height: 500px;
  padding: var(--space-3);
  border-top-width: 1px;
}

/* Justification */
.review-traveler-row__justification {
  padding: var(--space-2) var(--space-3);
  background: white;
  border-radius: var(--border-radius-sm);
  border: 1px solid var(--color-slate-200);
}

.review-traveler-row__justification-text {
  font-size: 0.8125rem;
  line-height: 1.6;
  color: var(--color-slate-700);
  margin: 0;
}

/* Clickable justification for long text */
.review-traveler-row__justification-text--clickable {
  position: relative;
  cursor: pointer;
  border-radius: var(--border-radius-sm);
  padding: var(--space-1);
  margin: calc(-1 * var(--space-1));
  transition: background-color 0.15s ease;
}

.review-traveler-row__justification-text--clickable:hover {
  background: var(--color-slate-50);
}

.review-traveler-row__justification-text--clickable.truncated {
  max-height: 4em;
  overflow: hidden;
}

.review-traveler-row__justification-text--clickable.truncated::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1.5em;
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  pointer-events: none;
}

.review-traveler-row__justification-text--clickable.truncated:hover::after {
  background: linear-gradient(to bottom, rgba(248, 250, 252, 0), rgba(248, 250, 252, 0.95));
}

.review-traveler-row__justification-text--clickable.truncated::before {
  content: '\f065';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  bottom: 0.25rem;
  right: 0.25rem;
  font-size: 0.6rem;
  color: var(--color-slate-400);
  opacity: 0;
  transition: opacity 0.15s ease;
  z-index: 1;
}

.review-traveler-row__justification-text--clickable.truncated:hover::before {
  opacity: 1;
}

/* No justification warning */
.review-traveler-row__no-justification {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8125rem;
  color: var(--color-warning);
  margin: 0;
  font-weight: 500;
}

.review-traveler-row__no-justification i {
  font-size: 0.875rem;
}

/* Document chips */
.review-traveler-row__documents {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.review-traveler-row__doc-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--color-slate-600);
  background: white;
  border: 1px solid var(--color-slate-200);
  border-radius: 20px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.review-traveler-row__doc-chip:hover {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.review-traveler-row__doc-chip i {
  font-size: 0.625rem;
}

/* Travelers Edit Button (in section header actions) */
.review-travelers__edit-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.75rem;
  background: white;
  border: 1px solid var(--color-slate-300);
  border-radius: var(--border-radius-sm);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--color-slate-600);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.review-travelers__edit-btn:hover {
  background: var(--color-slate-50);
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.review-travelers__edit-btn i {
  font-size: 0.625rem;
}

/* Traveler Row in Edit Mode */
.review-traveler-row--editing {
  border-color: var(--color-primary-light);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.6);
}

.review-traveler-row--editing .review-traveler-row__header {
  cursor: default;
  background: var(--color-slate-50);
  border-bottom: 1px solid var(--color-slate-200);
}

.review-traveler-row--editing .review-traveler-row__header:hover {
  background: var(--color-slate-50);
}

.review-traveler-row--editing .review-traveler-row__body {
  max-height: none;
  padding: var(--space-4);
  background: white;
}

/* Remove Traveler Button */
.review-traveler-row__remove-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  margin-left: var(--space-2);
  background: transparent;
  border: 1px solid var(--color-slate-200);
  border-radius: var(--border-radius-sm);
  color: var(--color-slate-400);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.review-traveler-row__remove-btn:hover {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: white;
}

.review-traveler-row__remove-btn--disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}

.review-traveler-row__remove-btn i {
  font-size: 0.75rem;
}

/* Justification Edit Mode */
.review-traveler-row__justification-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--color-slate-700);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.review-traveler-row__justification-label i {
  color: var(--color-primary);
  font-size: 0.875rem;
}

.review-traveler-row__justification-input {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--color-slate-300);
  border-radius: var(--border-radius-sm);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--color-slate-700);
  resize: vertical;
  min-height: 80px;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.review-traveler-row__justification-input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.6);
}

.review-traveler-row__justification-input::placeholder {
  color: var(--color-slate-400);
}

.review-traveler-row__justification-hint {
  margin-top: 0.375rem;
  font-size: 0.6875rem;
  color: var(--color-slate-500);
  font-style: italic;
}

/* Travelers Edit Actions */
.review-travelers-edit__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-slate-200);
}

/* Mobile responsive */
@media (max-width: 640px) {
  .review-traveler-row__header {
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .review-traveler-row__info {
    flex: 1 1 calc(100% - 3.5rem);
    order: 1;
  }

  .review-traveler-row__avatar {
    order: 0;
  }

  .review-traveler-row__cost {
    order: 2;
    margin-left: 2.75rem;
  }

  .review-traveler-row__toggle {
    order: 3;
    margin-left: auto;
  }

  .review-section__header-actions {
    flex-direction: column;
    align-items: flex-end;
    gap: var(--space-1);
  }
}

.review-leg-badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.5rem;
  background: var(--color-primary);
  color: white;
  border-radius: 12px;
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  transition: all var(--transition-fast);
}

.review-leg-badge:hover {
  background: var(--color-primary-dark);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.review-leg-badge--all {
  background: var(--color-slate-600);
}

/* ============================================================================
   ITINERARY/LEG CARDS - Compact horizontal layout
   ============================================================================ */
/* Compact itinerary table */
.review-itinerary-table {
  background: white;
  border: 1px solid var(--color-slate-200);
  border-radius: var(--border-radius-sm);
  overflow: hidden;
}

.review-itinerary-table__header {
  display: grid;
  grid-template-columns: 60px 1fr 200px 100px;
  background: var(--color-slate-50);
  border-bottom: 2px solid var(--color-slate-200);
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-slate-600);
}

.review-itinerary-table__row {
  display: grid;
  grid-template-columns: 60px 1fr 200px 100px;
  border-bottom: 1px solid var(--color-slate-100);
  transition: background 0.15s ease;
}

.review-itinerary-table__row:last-child {
  border-bottom: none;
}

.review-itinerary-table__row:hover {
  background: var(--color-slate-50);
}

.review-itinerary-table__cell {
  padding: var(--space-2);
  display: flex;
  align-items: center;
  font-size: 0.8125rem;
}

.review-itinerary-table__cell--leg {
  justify-content: center;
  border-right: 1px solid var(--color-slate-100);
}

.review-itinerary-table__cell--location {
  gap: var(--space-1);
  font-weight: 500;
  color: var(--color-slate-900);
  flex-wrap: wrap;
}

.review-itinerary-table__cell--location i {
  color: var(--color-primary);
  font-size: 0.75rem;
  flex-shrink: 0;
}
