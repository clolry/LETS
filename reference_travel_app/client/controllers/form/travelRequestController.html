    /**
     * Render travelers for review with detailed cost breakdown
     */
    _renderTravelersReview() {
      const state = window.TravelRequest.State;
      const travelers = state.getTravelers();

      if (travelers.length === 0) {
        return '<p class="text-muted">No travelers added</p>';
      }

      const self = this;
      return travelers.map(traveler => {
        const transportCost = traveler.transportationTotal || traveler.ticketCost || 0;
        const lodgingCost = traveler.lodgingTotal || 0;
        const mieCost = traveler.mieTotal || 0;
        const localTravelCost = traveler.localTravelTotal || 0;
        const otherCost = traveler.otherTotal || 0;

        // Subtotal already includes local travel from state calculation
        const subtotal = traveler.subtotal || 0;

        // Build breakdown - only show categories with values > 0
        const breakdownParts = [];
        if (transportCost > 0) {
          breakdownParts.push(`<span><i aria-hidden="true" class="fas fa-plane-departure"></i> Transport: ${state.formatCurrency(transportCost)}</span>`);
        }
        if (lodgingCost > 0) {
          breakdownParts.push(`<span><i aria-hidden="true" class="fas fa-bed"></i> Lodging: ${state.formatCurrency(lodgingCost)}</span>`);
        }
        if (mieCost > 0) {
          breakdownParts.push(`<span><i aria-hidden="true" class="fas fa-utensils"></i> M&IE: ${state.formatCurrency(mieCost)}</span>`);
        }
        if (localTravelCost > 0) {
          breakdownParts.push(`<span><i aria-hidden="true" class="fas fa-car"></i> Local: ${state.formatCurrency(localTravelCost)}</span>`);
        }
        if (otherCost > 0) {
          breakdownParts.push(`<span><i aria-hidden="true" class="fas fa-plus-circle"></i> +15%: ${state.formatCurrency(otherCost)}</span>`);
        }

        // Build NFS status indicator
        let nfsStatus = '';
        if (traveler.receivingNFS) {
          if (traveler.nfsFileId) {
            nfsStatus = `
              <div class="review-traveler-card__nfs review-traveler-card__nfs--complete">
                <i aria-hidden="true" class="fas fa-check-circle"></i>
                <span>NFS Worksheet: ${self._escapeHtml(traveler.nfsFileName || 'Uploaded')}</span>
              </div>
            `;
          } else {
            nfsStatus = `
              <div class="review-traveler-card__nfs review-traveler-card__nfs--missing">
                <i aria-hidden="true" class="fas fa-exclamation-triangle"></i>
                <span>NFS Worksheet required</span>
              </div>
            `;
          }
        }

        return `
          <div class="review-traveler-card">
            <div class="review-traveler-card__header">
              <strong>${self._escapeHtml(traveler.employeeName) || 'Unknown'}</strong>
              <span class="review-traveler-card__total">${state.formatCurrency(subtotal)}</span>
            </div>
            <div class="review-traveler-card__breakdown">
              ${breakdownParts.join('\n              ')}
            </div>
            ${nfsStatus}
          </div>
        `;
      }).join('');
    },

    /**
     * Render documents for review
     */
    _renderDocumentsReview() {
      const documents = this._uploadedDocuments || [];

      if (documents.length === 0) {
        return '<p class="text-muted">No documents uploaded</p>';
      }

      const self = this;
      return `
        <div class="review-documents">
          ${documents.map(doc => `
            <div class="review-document">
              <i aria-hidden="true" class="fas ${self._getFileIcon(doc.fileName || doc.name)}"></i>
              <span class="review-document__name">${self._escapeHtml(doc.fileName || doc.name)}</span>
              <span class="review-document__size">${self._formatFileSize(doc.fileSize || doc.size)}</span>
            </div>
          `).join('')}
        </div>
      `;
    },

    /**
     * Get icon class for file type
     */
    _getFileIcon(filename) {
      if (!filename) return 'fa-file';
      const ext = filename.split('.').pop().toLowerCase();
      const iconMap = {
        pdf: 'fa-file-pdf',
        doc: 'fa-file-word',
        docx: 'fa-file-word',
        xls: 'fa-file-excel',
        xlsx: 'fa-file-excel',
        png: 'fa-file-image',
        jpg: 'fa-file-image',
        jpeg: 'fa-file-image',
        gif: 'fa-file-image'
      };
      return iconMap[ext] || 'fa-file';
    },

    /**
     * Format file size
     */
    _formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    },

    // =========================================================================
    // DOCUMENT UPLOAD (Google Drive Integration)
    // =========================================================================

    /**
     * Initialize document upload functionality
     * Files are uploaded to Google Drive immediately for draft persistence
     */
    _initDocumentUpload() {
      const self = this;
      this._uploadedDocuments = [];  // Array of { fileId, fileName, fileUrl, fileSize, mimeType, travelerId?, uploading? }
      this._maxFileSize = 10 * 1024 * 1024; // 10MB
      // Restrict to PDF and images only
      this._allowedTypes = [
        'application/pdf',
        'image/png',
        'image/jpeg'
      ];

      const uploadZone = this._elements.docUploadZone;
      const fileInput = this._elements.docFileInput;
      const browseBtn = this._elements.docBrowseBtn;

      if (!uploadZone || !fileInput) return;

      // Browse button click
      if (browseBtn) {
        browseBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          fileInput.click();
        });
      }

      // File input change
      fileInput.addEventListener('change', function() {
        self._handleFileSelect(this.files);
        this.value = ''; // Reset for same file selection
      });

      // Drag and drop events (drop zone is drag-only, not clickable)
      uploadZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.stopPropagation();
        this.classList.add('doc-upload-zone--dragover');
      });

      uploadZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        e.stopPropagation();
        this.classList.remove('doc-upload-zone--dragover');
      });

      uploadZone.addEventListener('drop', function(e) {
        e.preventDefault();
        e.stopPropagation();
        this.classList.remove('doc-upload-zone--dragover');
        self._handleFileSelect(e.dataTransfer.files);
      });

    },

    /**
     * Handle file selection - uploads immediately to Google Drive
     */
    _handleFileSelect(files) {
      const self = this;

      Array.from(files).forEach(function(file) {
        // Validate file type (PDF and images only)
        if (!self._allowedTypes.includes(file.type)) {
          self._showToast(`${file.name}: Only PDF, PNG, and JPG files are allowed`, 'error');
          return;
        }

        // Validate file size
        if (file.size > self._maxFileSize) {
          self._showToast(`${file.name}: File exceeds 10MB limit`, 'error');
          return;
        }

        // Check for duplicates by name
        if (self._uploadedDocuments.some(function(doc) { return doc.fileName === file.name; })) {
          self._showToast(`${file.name}: Already added`, 'warning');
          return;
        }

        // Add placeholder with uploading state
        const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const placeholder = {
          tempId: tempId,
          fileName: file.name,
          fileSize: file.size,
          mimeType: file.type,
          uploading: true
        };
        self._uploadedDocuments.push(placeholder);
        self._renderUploadedDocuments();

        // Read file as base64 and upload to Drive
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(',')[1];

          google.script.run
            .withSuccessHandler(function(result) {
              // Find and update the placeholder
              const index = self._uploadedDocuments.findIndex(function(d) { return d.tempId === tempId; });
              if (index === -1) return; // Already removed

              if (result.success) {
                // Replace placeholder with actual file data
                self._uploadedDocuments[index] = {
                  fileId: result.fileId,
                  fileName: result.fileName,
                  fileUrl: result.fileUrl,
                  fileSize: result.fileSize,
                  mimeType: result.mimeType,
                  uploading: false
                };
                self._renderUploadedDocuments();
                self._renderReviewStep();
                self._triggerAutoSave(); // Save draft with new file
              } else {
                // Remove failed upload
                self._uploadedDocuments.splice(index, 1);
                self._renderUploadedDocuments();
                self._showToast(`${file.name}: Upload failed - ${result.error}`, 'error');
              }
            })
            .withFailureHandler(function(error) {
              // Remove failed upload
              const index = self._uploadedDocuments.findIndex(function(d) { return d.tempId === tempId; });
              if (index !== -1) {
                self._uploadedDocuments.splice(index, 1);
                self._renderUploadedDocuments();
              }
              self._showToast(`${file.name}: Upload failed`, 'error');
              console.error('File upload error:', error);
            })
            .uploadTravelDraftFile({
              name: file.name,
              type: file.type,
              data: base64Data,
              draftId: self._currentDraftId || self._generateDraftId()
            });
        };
        reader.readAsDataURL(file);
      });
    },

    /**
     * Render uploaded documents list
     */
    _renderUploadedDocuments() {
      const self = this;
      const listContainer = this._elements.docUploadList;
      const countEl = this._elements.docUploadCount;
      if (!listContainer) return;

      // Update count
      const uploadedCount = this._uploadedDocuments.filter(function(d) { return !d.uploading; }).length;
      if (countEl) {
        countEl.textContent = uploadedCount > 0 ? uploadedCount + ' file' + (uploadedCount !== 1 ? 's' : '') : '';
      }

      // Show empty state if no documents
      if (this._uploadedDocuments.length === 0) {
        listContainer.innerHTML = `
          <div class="doc-upload-list__empty">
            <i aria-hidden="true" class="fas fa-inbox"></i>
            <span>No documents uploaded yet</span>
          </div>
        `;
        this._updateSubmitButtonState();
        return;
      }

      listContainer.innerHTML = this._uploadedDocuments.map(function(doc) {
        const isUploading = doc.uploading;
        const docId = doc.fileId || doc.tempId;

        return `
          <div class="doc-upload-item ${isUploading ? 'doc-upload-item--uploading' : ''}" data-doc-id="${docId}">
            <div class="doc-upload-item__icon">
              ${isUploading
                ? '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i>'
                : '<i aria-hidden="true" class="fas ' + self._getFileIcon(doc.fileName) + '"></i>'}
            </div>
            <div class="doc-upload-item__info">
              <span class="doc-upload-item__name">${self._escapeHtml(doc.fileName)}</span>
              <span class="doc-upload-item__size">${isUploading ? 'Uploading...' : self._formatFileSize(doc.fileSize)}</span>
            </div>
            ${isUploading ? '' : `
              <a href="${doc.fileUrl}" target="_blank" class="doc-upload-item__link" title="Open file">
                <i aria-hidden="true" class="fas fa-external-link-alt"></i>
              </a>
              <button type="button" class="doc-upload-item__remove" data-file-id="${doc.fileId}" title="Remove">
                <i aria-hidden="true" class="fas fa-times"></i>
              </button>
            `}
          </div>
        `;
      }).join('');

      // Bind remove handlers
      listContainer.querySelectorAll('.doc-upload-item__remove').forEach(function(btn) {
        btn.addEventListener('click', function() {
          self._removeDocument(this.dataset.fileId);
        });
      });

      // Update submit button state based on upload status
      this._updateSubmitButtonState();
    },

    // =========================================================================
    // CUSTOM DRIVE BROWSER (No GCP Picker API Required)
    // =========================================================================

    /**
     * Format a date string for display
     */
    _formatDate(dateStr) {
      try {
        const date = new Date(dateStr);
        const now = new Date();
        const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return 'Yesterday';
        if (diffDays < 7) return diffDays + ' days ago';

        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return '';
      }
    },

    /**
     * Remove a document - also deletes from Google Drive
     */
    _removeDocument(fileId) {
      const self = this;
      const doc = this._uploadedDocuments.find(function(d) { return d.fileId === fileId; });

      if (!doc) return;

      // Remove from local array immediately for responsive UI
      this._uploadedDocuments = this._uploadedDocuments.filter(function(d) {
        return d.fileId !== fileId;
      });
      this._renderUploadedDocuments();
      this._renderReviewStep();
      this._triggerAutoSave();

      // Delete from Drive in background
      google.script.run
        .withFailureHandler(function(error) {
          console.warn('Failed to delete file from Drive:', error);
          // File is already removed from UI, don't restore it
        })
        .deleteTravelDraftFile(fileId);
    },

    /**
     * Get uploaded document file IDs for submission
     * @returns {string[]} Array of Google Drive file IDs
     */
    _getUploadedDocumentIds() {
      return this._uploadedDocuments
        .filter(function(doc) { return doc.fileId && !doc.uploading; })
        .map(function(doc) { return doc.fileId; });
    },

    /**
     * Get uploaded documents data for draft storage
     * @returns {Array} Array of { fileId, fileName, fileSize, mimeType }
     */
    _getUploadedDocumentsForDraft() {
      return this._uploadedDocuments
        .filter(function(doc) { return doc.fileId && !doc.uploading; })
        .map(function(doc) {
          return {
            fileId: doc.fileId,
            fileName: doc.fileName,
            fileUrl: doc.fileUrl,
            fileSize: doc.fileSize,
            mimeType: doc.mimeType
          };
        });
    },

    /**
     * Restore uploaded documents from draft data
     * @param {Array} documents - Array of { fileId, fileName, ... } from draft
     */
    _restoreUploadedDocuments(documents) {
      if (!documents || !Array.isArray(documents) || documents.length === 0) {
        this._uploadedDocuments = [];
        this._renderUploadedDocuments();
        return;
      }

      // Set documents directly (they're already in Drive)
      this._uploadedDocuments = documents.map(function(doc) {
        return {
          fileId: doc.fileId,
          fileName: doc.fileName,
          fileUrl: doc.fileUrl,
          fileSize: doc.fileSize,
          mimeType: doc.mimeType,
          uploading: false
        };
      });
      this._renderUploadedDocuments();
    },

    /**
     * Update review totals
     */
    _updateReviewTotals() {
      const state = window.TravelRequest.State;

      if (this._elements.reviewTravelerTotal) {
        this._elements.reviewTravelerTotal.textContent = state.formatCurrency(state.getTravelerTotal());
      }
      if (this._elements.reviewSharedCosts) {
        this._elements.reviewSharedCosts.textContent = state.formatCurrency(state.getSharedCostsTotal());
      }
      if (this._elements.reviewGrandTotal) {
        this._elements.reviewGrandTotal.textContent = state.formatCurrency(state.getGrandTotal());
      }
    },

    // =========================================================================
    // AUTO-SAVE & DRAFT MANAGEMENT
    // =========================================================================

    /**
     * Initialize auto-save functionality
     * Watches for form changes and saves to IndexedDB with debouncing
     */
    _initAutoSave() {
      const self = this;

      // Watch for form field changes via event delegation
      document.addEventListener('input', (e) => {
        // Only trigger auto-save for form inputs
        if (e.target.matches('input, textarea, select')) {
          self._triggerAutoSave();
        }
      });

      // Watch for significant state changes (add/remove legs, travelers)
      // These are triggered by button clicks, not input events
      document.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('[data-action]');
        if (actionBtn) {
          const action = actionBtn.dataset.action;
          // Trigger auto-save after actions that modify state
          if (['add-leg', 'remove-leg', 'add-traveler', 'remove-traveler'].includes(action)) {
            // Slight delay to let state update first
            setTimeout(() => self._triggerAutoSave(), 100);
          }
        }
      });
    },

    /**
     * Trigger auto-save with debouncing (saves 2 seconds after last change)
     */
    _triggerAutoSave() {
      // Clear existing timer
      if (this._autoSaveTimer) {
        clearTimeout(this._autoSaveTimer);
      }

      // Set new timer - save after 2 seconds of inactivity
      this._autoSaveTimer = setTimeout(() => {
        this._saveToIndexedDB(true); // silent save
      }, 2000);
    },

    /**
     * Generate a new draft ID if one doesn't exist
     * Used when uploading files before the draft has been saved to IndexedDB
     */
    _generateDraftId() {
      if (!this._currentDraftId) {
        this._currentDraftId = 'draft_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      }
      return this._currentDraftId;
    },

    /**
     * Save form data to IndexedDB
     * @param {boolean} silent - If true, don't show toast notification
     */
    async _saveToIndexedDB(silent = false) {
      if (!window.TravelDraft) {
        if (!silent) this._showToast('Draft storage not available', 'warning');
        return;
      }

      const state = window.TravelRequest.State;
      const formData = state.getFormData();

      // Add current step for restoration
      formData.currentStep = state.getCurrentStep();
      formData.highestCompletedStep = state.getHighestCompletedStep();

      // Add uploaded documents (file references, not base64 data)
      formData.uploadedDocuments = this._getUploadedDocumentsForDraft();

      // Only save if there's meaningful data
      if (!formData.tripName && !formData.legs?.length && !formData.travelers?.length) {
        return; // Nothing worth saving yet
      }

      try {
        const result = await window.TravelDraft.saveDraft(formData, this._currentDraftId);

        if (result.success) {
          // Store the draft ID for future updates
          this._currentDraftId = result.draftId;
          state.updateField('draftId', result.draftId);

          if (!silent) {
            this._showToast('Draft saved', 'success');
          }
        } else {
          if (!silent) {
            this._showToast('Failed to save draft: ' + (result.error || 'Unknown error'), 'error');
          }
        }
      } catch (error) {
        if (!silent) {
          this._showToast('Failed to save draft: ' + error.message, 'error');
        }
      }
    },

    /**
     * Load a draft from IndexedDB and restore form state
     * @param {string} draftId - The draft ID to load
     */
    async _loadDraft(draftId) {
      if (!window.TravelDraft) {
        console.warn('Draft storage not available');
        return;
      }

      try {
        const draft = await window.TravelDraft.getDraft(draftId);

        if (!draft || !draft.formData) {
          this._showToast('Draft not found', 'warning');
          return;
        }

        // Store the draft ID
        this._currentDraftId = draftId;

        // Restore form data to state
        const state = window.TravelRequest.State;
        const formData = draft.formData;

        // Restore basic fields
        state.updateField('tripName', formData.tripName || '');
        state.updateField('locationType', formData.locationType || '');
        state.updateField('eventStartDate', formData.eventStartDate || '');
        state.updateField('eventEndDate', formData.eventEndDate || '');
        state.updateField('bluf', formData.bluf || '');
        state.updateField('purpose', formData.purpose || '');
        state.updateField('travelTypes', formData.travelTypes || []);
        state.updateField('missionCriticalTypes', formData.missionCriticalTypes || []);
        state.updateField('draftId', draftId);

        // Clear existing legs (from auto-init) before restoring
        const existingLegs = state.getLegs() || [];
        existingLegs.forEach(leg => {
          // Remove from DOM
          const legCard = document.querySelector(`.leg-card[data-leg-id="${leg.id}"]`);
          if (legCard) legCard.remove();
        });
        // Clear state legs array directly
        state._formData.legs = [];

        // Restore legs
        if (formData.legs && formData.legs.length > 0) {
          formData.legs.forEach(leg => {
            state.addLeg(leg);
          });
        }

        // Clear existing travelers before restoring
        const existingTravelers = state.getTravelers() || [];
        existingTravelers.forEach(traveler => {
          // Remove from DOM
          const travelerCard = document.querySelector(`.traveler-card[data-traveler-id="${traveler.id}"]`);
          if (travelerCard) travelerCard.remove();
        });
        // Clear state travelers array directly
        state._formData.travelers = [];

        // Restore travelers
        if (formData.travelers && formData.travelers.length > 0) {
          formData.travelers.forEach(traveler => {
            state.addTraveler(traveler);
          });
        }

        // Restore shared costs
        if (formData.sharedCosts) {
          Object.keys(formData.sharedCosts).forEach(category => {
            const cost = formData.sharedCosts[category];
            state.updateSharedCost(category, 'amount', cost.amount || 0);
            state.updateSharedCost(category, 'description', cost.description || '');
          });
        }

        // Update UI with restored data
        this._restoreFormUI(formData);

        // Restore step position
        if (formData.highestCompletedStep) {
          state._highestCompletedStep = formData.highestCompletedStep;
        }
        const targetStep = formData.currentStep || 1;
        this._expandStep(targetStep);

        this._showToast('Draft loaded', 'success');

        // Mark that we've loaded a draft (so init doesn't reset to step 1)
        this._draftLoaded = true;

      } catch (error) {
        console.error('Error loading draft:', error);
        this._showToast('Failed to load draft', 'error');
      }
    },

    /**
     * Restore form UI elements from loaded data
     */
    _restoreFormUI(formData) {
      // Step 1: Trip Overview
      if (this._elements.tripName) {
        this._elements.tripName.value = formData.tripName || '';
      }
      if (this._elements.locationType) {
        this._elements.locationType.value = formData.locationType || '';
      }
      if (this._elements.eventStartDate) {
        this._elements.eventStartDate.value = formData.eventStartDate || '';
        const startChip = document.getElementById('eventStartChip');
        if (startChip && formData.eventStartDate) {
          startChip.classList.add('date-chip--filled');
        }
      }
      if (this._elements.eventEndDate) {
        this._elements.eventEndDate.value = formData.eventEndDate || '';
        const endChip = document.getElementById('eventEndChip');
        if (endChip && formData.eventEndDate) {
          endChip.classList.add('date-chip--filled');
        }
      }
      // Update event date range display
      this._updateEventDateRangeDisplay();

      if (this._elements.justificationBluf) {
        this._elements.justificationBluf.value = formData.bluf || '';
        if (this._elements.blufCharCount) {
          this._updateCharCount(this._elements.justificationBluf, this._elements.blufCharCount, 500);
        }
      }
      if (this._elements.justificationPurpose) {
        this._elements.justificationPurpose.value = formData.purpose || '';
        if (this._elements.purposeCharCount) {
          this._updateCharCount(this._elements.justificationPurpose, this._elements.purposeCharCount, 2000);
        }
      }

      // Step 2: Itinerary - render leg cards (use state objects, not raw formData)
      const state = window.TravelRequest.State;
      const stateLegs = state.getLegs() || [];
      if (stateLegs.length > 0 && this._renderLegCard) {
        stateLegs.forEach(leg => {
          this._renderLegCard(leg);
        });
        this._updateItineraryEmptyState();
      }

      // Step 3: Travelers - render traveler cards (use state objects, not raw formData)
      const stateTravelers = state.getTravelers() || [];
      if (stateTravelers.length > 0 && this._renderTravelerCard) {
        stateTravelers.forEach(traveler => {
          this._renderTravelerCard(traveler);
        });
        this._updateTravelersEmptyState();
        this._updateTravelersTotal();
      }

      // Step 4: Classification - check appropriate boxes
      if (formData.travelTypes && this._elements.travelTypesContainer) {
        formData.travelTypes.forEach(type => {
          const checkbox = this._elements.travelTypesContainer.querySelector(`input[value="${type}"]`);
          if (checkbox) checkbox.checked = true;
        });
      }
      if (formData.missionCriticalTypes && this._elements.missionCriticalContainer) {
        formData.missionCriticalTypes.forEach(type => {
          const checkbox = this._elements.missionCriticalContainer.querySelector(`input[value="${type}"]`);
          if (checkbox) checkbox.checked = true;
        });
      }

      // Step 5: Shared Costs
      if (formData.sharedCosts && this._elements.sharedCostsList) {
        Object.keys(formData.sharedCosts).forEach(category => {
          const cost = formData.sharedCosts[category];
          const row = this._elements.sharedCostsList.querySelector(`[data-category="${category}"]`);
          if (row) {
            const amountInput = row.querySelector('.shared-cost-amount');
            const descInput = row.querySelector('.shared-cost-desc');
            if (amountInput && cost.amount) amountInput.value = cost.amount;
            if (descInput && cost.description) descInput.value = cost.description;
          }
        });
        this._updateSharedCostsTotal();
      }

      // Step 6: Restore uploaded documents
      if (formData.uploadedDocuments && formData.uploadedDocuments.length > 0) {
        this._restoreUploadedDocuments(formData.uploadedDocuments);
      }
    },

    // =========================================================================
    // SAVE & SUBMIT
    // =========================================================================

    /**
     * Handle save draft button click (manual save)
     * Saves the draft and navigates back to the portal
     */
    async _handleSaveDraft() {
      const state = window.TravelRequest.State;
      const formData = state.getFormData();

      // Check if there's anything to save
      if (!formData.tripName && !formData.legs?.length && !formData.travelers?.length) {
        this._showToast('Nothing to save yet - add some data first', 'warning');
        return;
      }

      await this._saveToIndexedDB(false); // Show toast notification

      // Navigate back to the portal after a brief delay to show the toast
      setTimeout(() => {
        this._navigateToPortal();
      }, 800);
    },

    /**
     * Navigate back to the travel portal
     */
    _navigateToPortal() {
      const scriptUrl = this._scriptUrl || '';
      if (scriptUrl) {
        safeTopNavigate(scriptUrl + '?mode=travel');
      } else {
        // Fallback: try to construct URL from current location
        try {
          const baseUrl = window.top.location.href.split('?')[0];
          safeTopNavigate(baseUrl + '?mode=travel');
        } catch (e) {
          console.error('Cannot navigate to portal:', e);
          this._showToast('Draft saved! Go to Portal to see it.', 'success');
        }
      }
    },

    /**
     * Check if any file uploads are in progress
     */
    _hasUploadsInProgress() {
      return this._uploadedDocuments.some(function(doc) { return doc.uploading === true; });
    },

    /**
     * Update submit button state based on upload status
     */
    _updateSubmitButtonState() {
      const uploading = this._hasUploadsInProgress();

      // Update both the accordion submit button and fixed footer submit button
      const submitButtons = document.querySelectorAll('[data-action="submit"]');
      submitButtons.forEach(function(btn) {
        btn.disabled = uploading;
        if (uploading) {
          btn.classList.add('disabled');
          btn.title = 'Please wait for uploads to complete';
        } else {
          btn.classList.remove('disabled');
          btn.title = '';
        }
      });

      // Also update fixed footer submit if it exists
      if (this._elements.fixedFooterSubmit) {
        this._elements.fixedFooterSubmit.disabled = uploading;
        if (uploading) {
          this._elements.fixedFooterSubmit.classList.add('disabled');
        } else {
          this._elements.fixedFooterSubmit.classList.remove('disabled');
        }
      }
    },

    /**
     * Handle submit
     */
    async _handleSubmit() {
      const self = this;
      const state = window.TravelRequest.State;

      // Check if uploads are still in progress
      if (this._hasUploadsInProgress()) {
        this._showToast('Please wait for file uploads to complete', 'warning');
        return;
      }

      // Wait for any in-flight local-travel distance checks to settle before
      // reading form data. Without this gate, a user fast enough to click
      // Submit while geocoding is still in flight would submit with
      // isLocalTravel=false (the stale default) when the eventual result
      // would have been true. Background detail in Controller's
      // _pendingLocalTravelChecks JSDoc + git history for REQ-2026-0166 fix.
      if (window.TravelRequest &&
          window.TravelRequest.Controller &&
          Array.isArray(window.TravelRequest.Controller._pendingLocalTravelChecks) &&
          window.TravelRequest.Controller._pendingLocalTravelChecks.length > 0) {
        this._showToast('Verifying trip distances...', 'info');
        try {
          await Promise.all(window.TravelRequest.Controller._pendingLocalTravelChecks);
        } catch (e) {
          // Individual checks already swallow their errors and resolve to
          // "not local travel" — Promise.all should never reject in practice.
          // If it does, log and continue; submission still gets the latest
          // state (whatever resolved) which is no worse than pre-fix behavior.
          console.warn('Local-travel check awaited at submit threw:', e);
        }
      }

      // Snapshot form data AFTER all local-travel checks have settled so we
      // submit the correct isLocalTravel flags.
      const formData = state.getFormData();

      // Final validation
      for (let step = 1; step <= 5; step++) {
        if (!this._validateStep(step)) {
          this._expandStep(step);
          this._showToast('Please complete all required fields', 'error');
          return;
        }
      }

      // Validate NFS worksheets
      const travelers = state.getTravelers();
      const missingNfs = travelers.filter(t => t.receivingNFS && !t.nfsFileId);
      if (missingNfs.length > 0) {
        this._expandStep(3); // Travelers step
        const names = missingNfs.map(t => t.employeeName || 'Unknown').join(', ');
        this._showToast(`NFS worksheet required for: ${names}`, 'error');
        return;
      }

      this._isLoading = true;

      // Show nav loader with submitting text
      if (window.showNavLoader) {
        window.showNavLoader(0, 'Submitting');
      }

      // Add attachment file IDs to form data
      formData.attachmentFileIds = this._getUploadedDocumentIds();

      google.script.run
        .withSuccessHandler(function(result) {
          self._isLoading = false;
          if (window.hideNavLoader) window.hideNavLoader();

          if (result.success) {
            // Delete the draft from IndexedDB after successful submission
            if (self._currentDraftId && window.TravelDraft) {
              window.TravelDraft.deleteDraft(self._currentDraftId)
                .then(function() {
                  console.log('Draft deleted after successful submission:', self._currentDraftId);
                })
                .catch(function(err) {
                  console.warn('Could not delete draft:', err);
                });
            }

            var newRequestId = (result.data && result.data.requestId) || result.requestId;
            self._showSuccessPage(newRequestId, formData);
          } else {
            self._showToast('Submission failed: ' + (result.error || 'Unknown error'), 'error');
          }
        })
        .withFailureHandler(function(error) {
          self._isLoading = false;
          if (window.hideNavLoader) window.hideNavLoader();
          self._showToast('Submission failed: ' + error, 'error');
        })
        .submitTravelRequestV2(formData);
    },

    /**
     * Show success page after submission
     */
    _showSuccessPage(requestId, formData) {
      const container = document.querySelector('.travel-container');
      if (!container) return;

      const total = window.TravelRequest.State.formatCurrency(window.TravelRequest.State.getGrandTotal());

      container.innerHTML = `
        <div class="success-page">
          <div class="success-page__icon">
            <i aria-hidden="true" class="fas fa-check-circle"></i>
          </div>
          <h2>Request Submitted!</h2>
          <div class="success-page__details">
            <div class="success-page__detail-row">
              <span class="success-page__label">Request ID</span>
              <span class="success-page__value">${requestId}</span>
            </div>
            <div class="success-page__detail-row">
              <span class="success-page__label">Event</span>
              <span class="success-page__value">${this._escapeHtml(formData.tripName || 'Travel Request')}</span>
            </div>
            <div class="success-page__detail-row">
              <span class="success-page__label">Total</span>
              <span class="success-page__value">${total}</span>
            </div>
          </div>
          ${window.TravelFeedback ? window.TravelFeedback.thumbsHtml('submission', requestId) : ''}
          <div class="success-page__actions">
            <button type="button" class="btn btn-primary" id="returnToPortalBtn" onclick="TravelRequest.Controller._navigateToPortal()">
              <i aria-hidden="true" class="fas fa-home me-2"></i>Return to Portal
            </button>
          </div>
        </div>
      `;

      // Hide fixed footer
      if (this._elements.fixedFooter) {
        this._elements.fixedFooter.classList.add('hidden');
      }
    },

    // =========================================================================
    // UTILITIES
    // =========================================================================

    /**
     * Show toast notification
     * Delegates to TravelUtils.showToast()
     */
    _showToast(message, type = 'info') {
      if (window.TravelUtils && TravelUtils.showToast) {
        TravelUtils.showToast(message, type);
      }
    },

    /**
     * Escape HTML to prevent XSS
     */
    _escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    },

    /**
     * Format location type for display
     */
    _formatLocationType(locationType) {
      const typeLabels = {
        'conference': 'Conference',
        'client-site': 'Client Site',
        'contractor-site': 'Contractor Site',
        'teb': 'TEB',
        'other': 'Other'
      };
      return typeLabels[locationType] || locationType || '-';
    },

    /**
     * Format a single date to display format (e.g., "Jan 29, 2026")
     * Handles both ISO format (yyyy-mm-dd) and already-formatted dates
     */
    _formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      // If already in display format (contains month name), return as-is
      if (/^[A-Za-z]{3}\s/.test(dateStr)) {
        return dateStr;
      }
      // Convert ISO format (yyyy-mm-dd) to display format
      if (/^\d{4}-\d{2}-\d{2}/.test(dateStr)) {
        const date = new Date(dateStr + 'T00:00:00');
        if (!isNaN(date.getTime())) {
          return date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });
        }
      }
      return dateStr;
    },

    /**
     * Float Awesomplete dropdown (prevent clipping) and auto-scroll for visibility
     * Delegates to TravelLocationService.floatAwesomplete()
     * @param {Awesomplete} awInstance - The Awesomplete instance
     * @param {Object} options - Optional configuration
     */
    _floatAwesomplete(awInstance, options = {}) {
      if (window.TravelLocationService) {
        TravelLocationService.floatAwesomplete(awInstance, options);
      }
    },

    /**
     * Ensure flatpickr calendar is visible in viewport when opened
     * Delegates to TravelDateService.ensureFlatpickrVisible()
     * @param {Element} inputElement - The input element that triggered the calendar
     */
    _ensureFlatpickrVisible(inputElement) {
      if (window.TravelDateService && TravelDateService.ensureFlatpickrVisible) {
        TravelDateService.ensureFlatpickrVisible(inputElement);
      }
    }

  }; // End Controller

})();
</script>
