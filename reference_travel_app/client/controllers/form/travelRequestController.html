<!-- client/controllers/form/travelRequestController.html -->
<!-- Core Controller for the Travel Request multi-step form -->
<!-- Additional modules: travelRequestItinerary.html, travelRequestTravelers.html, travelRequestPerDiem.html -->
<script>
(function() {
  'use strict';

  window.TravelRequest = window.TravelRequest || {};

  /**
   * Core Controller for Travel Request Form
   * Handles initialization, step navigation, validation framework, and submission
   *
   * Module Architecture:
   * - Core (this file): Init, navigation, validation, save/submit
   * - Itinerary: Leg management, location autocomplete
   * - Travelers: Traveler CRUD, costs, employee picker
   * - PerDiem: GSA/DoD/DOS rate fetching
   */
  window.TravelRequest.Controller = {
    // =========================================================================
    // PROPERTIES
    // =========================================================================

    // DOM element references
    _elements: {},

    // Flatpickr instances
    _datePickers: {},

    // Awesomplete instances (for cleanup)
    _autocompleteInstances: {},

    // Track if a date picker is currently open
    _datePickerOpen: false,

    // Staffing data for employee autocomplete
    _staffingData: null,

    // Note: Foreign countries and city caching are now handled by TravelLocationService

    // Loading state
    _isLoading: false,

    // =========================================================================
    // INITIALIZATION
    // =========================================================================

    // Auto-save debounce timer
    _autoSaveTimer: null,

    // Current draft ID
    _currentDraftId: null,

    // Script URL for navigation
    _scriptUrl: '',

    /**
     * Initialize the controller
     */
    async init(options = {}) {

      // Store script URL for navigation
      this._scriptUrl = options.scriptUrl || '';

      // Initialize state with user info and submitter BU
      if (window.TravelRequest.State) {
        window.TravelRequest.State.init(options.userEmail, options.userName, {
          buCode: options.submitterBU || '',
          buName: options.submitterBUName || '',
          orgCode: options.submitterOrgCode || ''
        });
      }

      // Cache DOM elements
      this._cacheElements();

      // Set up core event listeners
      this._bindCoreEvents();

      // Initialize date pickers (for justification step)
      this._initDatePickers();

      // Initialize character counters
      this._initCharCounters();

      // Initialize focus-expand textareas
      this._initFocusExpand();

      // Initialize JS-based tooltips (escape overflow containers)
      this._initTooltips();

      // Load staffing data for employee autocomplete
      this._loadStaffingData();

      // Preload foreign countries via TravelLocationService (async, non-blocking)
      if (window.TravelLocationService) {
        TravelLocationService.getCountries();
      }

      // Load mileage rates from server (stored in Script Properties)
      if (window.TravelRequest.loadMileageRates) {
        window.TravelRequest.loadMileageRates();
      }

      // Initialize module-specific functionality
      if (this._initItinerary) this._initItinerary();
      if (this._initTravelers) this._initTravelers();
      if (this._initSharedCosts) this._initSharedCosts();

      // Initialize document upload
      this._initDocumentUpload();

      // Initialize auto-save
      this._initAutoSave();

      // Load draft if provided
      if (options.draftId) {
        await this._loadDraft(options.draftId);
      }

      // Hydrate from a duplicate-blueprint (server inlined when ?duplicateFrom=...)
      // Mutually exclusive with draft load — only one can be the source of truth.
      if (!this._draftLoaded && options.duplicateBlueprint) {
        this._loadFromDuplicateBlueprint(options.duplicateBlueprint);
      } else if (options.duplicateError) {
        // Server tried to fetch a duplicate template but failed — toast it
        // and let the user start blank.
        this._showToast(options.duplicateError, 'warning');
      }

      // Expand initial step (unless draft or duplicate was loaded — those handle their own step)
      if (!this._draftLoaded && !this._duplicateLoaded) {
        this._expandStep(1);
      }
    },

    /**
     * Hydrate the form from a duplicate blueprint produced by
     * getRequestForDuplication on the server. Same shape as a draft, but
     * marks the form as "templated" so a banner can render and the submit
     * path knows this isn't a draft resume.
     *
     * @param {Object} payload - { blueprint, sourceRequestId, sourceTripName, droppedTravelers }
     */
    _loadFromDuplicateBlueprint(payload) {
      try {
        if (!payload || !payload.blueprint) return;
        const bp = payload.blueprint;
        const state = window.TravelRequest && window.TravelRequest.State;
        if (!state) {
          console.warn('Cannot load duplicate blueprint — TravelRequest.State unavailable');
          return;
        }

        // Top-level fields — same approach as _loadDraft
        state.updateField('tripName', bp.tripName || '');
        state.updateField('locationType', bp.locationType || '');
        state.updateField('eventStartDate', '');  // RESET — submitter sets new dates
        state.updateField('eventEndDate', '');    // RESET
        state.updateField('bluf', bp.bluf || '');
        state.updateField('purpose', bp.purpose || '');
        state.updateField('travelTypes', bp.travelTypes || []);
        state.updateField('missionCriticalTypes', bp.missionCriticalTypes || []);
        state.updateField('isInternational', !!bp.isInternational);
        state.updateField('isOCONUS', !!bp.isOCONUS);

        // Clear any auto-init legs, then add blueprint legs
        const existingLegs = state.getLegs() || [];
        existingLegs.forEach(leg => {
          const legCard = document.querySelector(`.leg-card[data-leg-id="${leg.id}"]`);
          if (legCard) legCard.remove();
        });
        state._formData.legs = [];
        (bp.legs || []).forEach(leg => state.addLeg(leg));

        // Travelers — push raw, then initialize per-leg cost shells so
        // downstream per-diem fetch / cost updates can write into them.
        // updateTravelerLegPerDiem early-returns when legCosts[legId] is
        // missing, which would silently drop the per-diem rates fetched
        // after the user enters dates.
        state._formData.travelers = [];
        (bp.travelers || []).forEach(t => state._formData.travelers.push(t));
        (bp.travelers || []).forEach(t => {
          if (t && t.id && Array.isArray(t.attendingLegs)) {
            state.updateTravelerLegs(t.id, t.attendingLegs);
          }
        });

        // Shared costs
        if (bp.sharedCosts) {
          state._formData.sharedCosts = bp.sharedCosts;
        }

        // Mark as duplicate-loaded so banner can render and downstream init
        // logic skips the blank-start path.
        this._duplicateLoaded = true;
        this._duplicateSource = {
          requestId: payload.sourceRequestId || '',
          tripName: payload.sourceTripName || '',
          droppedTravelers: payload.droppedTravelers || []
        };

        // Re-render full form from the blueprint. _restoreFormUI is the
        // same helper _loadDraft uses to hydrate UI from a saved draft —
        // the blueprint shape mirrors a draft, so it just works.
        if (typeof this._restoreFormUI === 'function') {
          this._restoreFormUI(bp);
        }

        // Show the banner (the markup is in the page; we just toggle visibility)
        this._renderDuplicateBanner();

        // Surface dropped-traveler warnings as toasts (one summary toast)
        const dropped = this._duplicateSource.droppedTravelers;
        if (dropped && dropped.length > 0) {
          const names = dropped.map(d => d.employeeName || d.email || 'Unknown').join(', ');
          this._showToast(
            dropped.length + ' traveler' + (dropped.length === 1 ? '' : 's') +
              ' could not be re-resolved and ' + (dropped.length === 1 ? 'was' : 'were') +
              ' removed: ' + names,
            'warning'
          );
        }

        // Open at step 1 so user starts at the top of the pre-filled form
        this._expandStep(1);
      } catch (err) {
        console.error('_loadFromDuplicateBlueprint error:', err);
        this._showToast('Failed to apply duplicate template — starting blank', 'error');
      }
    },

    /**
     * Render the "Templated from..." banner at the top of the form.
     * Banner markup expected in the page template (id="duplicateBanner").
     */
    _renderDuplicateBanner() {
      const banner = document.getElementById('duplicateBanner');
      if (!banner || !this._duplicateSource) return;
      const sourceLabel = this._duplicateSource.tripName
        ? `${this._duplicateSource.requestId} (${this._duplicateSource.tripName})`
        : this._duplicateSource.requestId;
      const labelEl = document.getElementById('duplicateBannerSource');
      if (labelEl) labelEl.textContent = sourceLabel;
      banner.classList.remove('hidden');
    },

    /**
     * Discard the duplicate template — confirm, then redirect to a blank form.
     */
    discardDuplicateTemplate() {
      if (!confirm('Discard the templated data and start a blank request?')) return;
      const baseUrl = (window._travelScriptUrl || '').split('?')[0];
      if (typeof safeTopNavigate === 'function') {
        safeTopNavigate(baseUrl + '?mode=form');
      } else {
        window.top.location.href = baseUrl + '?mode=form';
      }
    },

    /**
     * Load staffing data for employee autocomplete.
     * Uses HCDataCenter (already auto-initialized on page load via indexModern.html).
     * Maps HC bundle positions to the flat shape downstream code expects.
     */
    _loadStaffingData() {
      const self = this;

      if (!window.HCDataCenter) {
        console.error('HCDataCenter not available');
        self._staffingData = [];
        return;
      }

      // HCDataCenter.init() is idempotent — returns immediately if already loaded
      HCDataCenter.init().then(function() {
        const staffed = HCDataCenter.getStaffed();

        // Drop positions with no employee name. Some "staffed" entries
        // from HC (rare DETAIL / TEMP PROMOTION states) come back with
        // an empty employeeName field; without this filter they appear
        // in the autocomplete as " (QFAA)" — just an org code in parens.
        self._staffingData = staffed
          .filter(function(pos) {
            return pos && pos.employeeName && String(pos.employeeName).trim().length > 0;
          })
          .map(function(pos) {
          // Walk supervisor chain to find GS-15 Division Director
          var dd = HCDataCenter.findSupervisorAtGrade(pos.positionNumber, '15');
          var loc = pos.location || {};

          return {
            employeeId: pos.employeeId || '',
            employeeName: pos.employeeName || '',
            email: pos.emailAddress || '',
            orgCode: pos.orgCode || '',
            bu: (pos.org && pos.org.businessUnit) || '',
            lcat: pos.lcat || '',
            dutyLocation: [loc.city, loc.state].filter(Boolean).join(', '),
            supervisorPN: pos.reportsToPositionNumber || '',
            ddName: dd ? (dd.employeeName || '') : '',
            ddEmail: dd ? (dd.emailAddress || '') : '',
            locationCode: pos.locationCode || '',
            dutyStationAddress: loc.address1 || '',
            dutyStationCity: loc.city || '',
            dutyStationState: loc.state || '',
            positionNumber: pos.positionNumber || ''
          };
        });

        console.log('Loaded ' + self._staffingData.length + ' employees from HCDataCenter');
      }).catch(function(error) {
        console.error('Failed to load staffing data from HCDataCenter:', error);
        self._staffingData = [];
      });
    },

    // =========================================================================
    // ELEMENT CACHING
    // =========================================================================

    /**
     * Cache DOM element references
     */
    _cacheElements() {
      this._elements = {
        // Accordion Stepper
        accordionStepper: document.querySelector('.accordion-stepper'),
        accordionSteps: document.querySelectorAll('.accordion-step'),

        // Step summaries (6 steps)
        step1Summary: document.getElementById('step1Summary'),
        step2Summary: document.getElementById('step2Summary'),
        step3Summary: document.getElementById('step3Summary'),
        step4Summary: document.getElementById('step4Summary'),
        step5Summary: document.getElementById('step5Summary'),
        step6Summary: document.getElementById('step6Summary'),

        // Step 1: Trip Overview (includes Justification)
        tripName: document.getElementById('tripName'),
        locationType: document.getElementById('locationType'),
        eventStartDate: document.getElementById('eventStartDate'),
        eventEndDate: document.getElementById('eventEndDate'),
        justificationBluf: document.getElementById('justificationBluf'),
        justificationPurpose: document.getElementById('justificationPurpose'),
        blufCharCount: document.getElementById('blufCharCount'),
        purposeCharCount: document.getElementById('purposeCharCount'),

        // Step 2: Itinerary
        eventDateRange: document.getElementById('eventDateRange'),
        eventDateRangeText: document.getElementById('eventDateRangeText'),
        itineraryLegsContainer: document.getElementById('itineraryLegsContainer'),
        itineraryEmptyState: document.getElementById('itineraryEmptyState'),
        emptyStateAddLeg: document.getElementById('emptyStateAddLeg'),
        btnAddLeg: document.getElementById('btnAddLeg'),
        itinerarySummary: document.getElementById('itinerarySummary'),
        itineraryRouteText: document.getElementById('itineraryRouteText'),
        itineraryDatesText: document.getElementById('itineraryDatesText'),

        // Step 3: Travelers
        travelersContainer: document.getElementById('travelersContainer'),
        travelersEmptyState: document.getElementById('travelersEmptyState'),
        btnAddTraveler: document.getElementById('btnAddTraveler'),
        emptyStateAddTraveler: document.getElementById('emptyStateAddTraveler'),
        travelersTotal: document.getElementById('travelersTotal'),

        // Step 4: Classification
        travelTypesContainer: document.getElementById('travelTypesContainer'),
        missionCriticalContainer: document.getElementById('missionCriticalContainer'),

        // Step 5: Shared Costs
        sharedCostsList: document.getElementById('sharedCostsList'),
        sharedCostsTotal: document.getElementById('sharedCostsTotal'),

        // Step 6: Review & Document Upload
        docUploadZone: document.getElementById('docUploadZone'),
        docFileInput: document.getElementById('docFileInput'),
        docBrowseBtn: document.getElementById('docBrowseBtn'),
        docUploadList: document.getElementById('docUploadList'),
        docUploadCount: document.getElementById('docUploadCount'),
        reviewSummary: document.getElementById('reviewSummary'),
        reviewTravelerTotal: document.getElementById('reviewTravelerTotal'),
        reviewSharedCosts: document.getElementById('reviewSharedCosts'),
        reviewGrandTotal: document.getElementById('reviewGrandTotal'),

        // Fixed Footer
        fixedFooter: document.getElementById('travelFixedFooter'),
        fixedFooterSaveDraft: document.getElementById('fixedFooterSaveDraft'),
        fixedFooterBack: document.getElementById('fixedFooterBack'),
        fixedFooterContinue: document.getElementById('fixedFooterContinue'),
        fixedFooterSubmit: document.getElementById('fixedFooterSubmit')
      };
    },

    // =========================================================================
    // CORE EVENT BINDING
    // =========================================================================

    /**
     * Bind core event listeners
     */
    _bindCoreEvents() {
      const self = this;

      // Accordion step navigation (Continue, Back, Submit, Save Draft buttons)
      if (this._elements.accordionStepper) {
        this._elements.accordionStepper.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;

          const action = btn.dataset.action;
          if (action === 'continue') {
            self._handleContinue();
          } else if (action === 'back') {
            self._handleBack();
          } else if (action === 'submit') {
            self._handleSubmit();
          } else if (action === 'save-draft') {
            self._handleSaveDraft();
          }
        });

        // Accordion header click (for jumping to any previously visited step)
        this._elements.accordionStepper.addEventListener('click', (e) => {
          const header = e.target.closest('.accordion-step__header');
          if (!header) return;

          const stepNum = parseInt(header.dataset.step, 10);
          const state = window.TravelRequest.State;
          const currentStep = state.getCurrentStep();
          const highestCompletedStep = state.getHighestCompletedStep();

          // Allow jumping to any previously visited step (up to highestCompletedStep)
          // or back from a higher step to a lower one
          if (stepNum !== currentStep && stepNum <= Math.max(highestCompletedStep, currentStep)) {
            self._expandStep(stepNum);
          }
        });
      }

      // Step 1: Location Type dropdown
      if (this._elements.locationType) {
        this._elements.locationType.addEventListener('change', function() {
          const locationType = this.value;
          window.TravelRequest.State.updateField('locationType', locationType);
          self._clearFieldError(this);
          // Refresh existing leg cards to show/hide site name field
          if (self._refreshLegSiteNameFields) {
            self._refreshLegSiteNameFields();
          }
        });
      }

      // Step 1: Trip name input
      if (this._elements.tripName) {
        this._elements.tripName.addEventListener('blur', function() {
          window.TravelRequest.State.updateField('tripName', this.value.trim());
          self._clearFieldError(this);
        });
      }

      // Fixed footer events
      this._bindFixedFooterEvents();

      // Step 4: Classification checkboxes
      this._bindClassificationEvents();

      // Step 5: Justification textarea events
      this._bindJustificationEvents();
    },

    /**
     * Bind fixed footer button events
     */
    _bindFixedFooterEvents() {
      const self = this;

      if (this._elements.fixedFooterSaveDraft) {
        this._elements.fixedFooterSaveDraft.addEventListener('click', () => self._handleSaveDraft());
      }
      if (this._elements.fixedFooterBack) {
        this._elements.fixedFooterBack.addEventListener('click', () => self._handleBack());
      }
      if (this._elements.fixedFooterContinue) {
        this._elements.fixedFooterContinue.addEventListener('click', () => self._handleContinue());
      }
      if (this._elements.fixedFooterSubmit) {
        this._elements.fixedFooterSubmit.addEventListener('click', () => self._handleSubmit());
      }
    },

    /**
     * Update fixed footer based on current step
     */
    _updateFixedFooter(stepNumber) {
      const isFirstStep = stepNumber === 1;
      const isLastStep = stepNumber === 6;

      if (this._elements.fixedFooterBack) {
        this._elements.fixedFooterBack.classList.toggle('hidden', isFirstStep);
      }
      if (this._elements.fixedFooterContinue) {
        this._elements.fixedFooterContinue.classList.toggle('hidden', isLastStep);
      }
      if (this._elements.fixedFooterSubmit) {
        this._elements.fixedFooterSubmit.classList.toggle('hidden', !isLastStep);
      }
    },

    /**
     * Bind classification checkbox events
     */
    _bindClassificationEvents() {
      const self = this;

      // Travel types
      if (this._elements.travelTypesContainer) {
        this._elements.travelTypesContainer.addEventListener('change', (e) => {
          if (e.target.type === 'checkbox') {
            const values = self._collectCheckboxValues('travelTypes', self._elements.travelTypesContainer);
            window.TravelRequest.State.updateField('travelTypes', values);
          }
        });
      }

      // Mission critical
      if (this._elements.missionCriticalContainer) {
        this._elements.missionCriticalContainer.addEventListener('change', (e) => {
          if (e.target.type === 'checkbox') {
            const values = self._collectCheckboxValues('missionCriticalTypes', self._elements.missionCriticalContainer);
            window.TravelRequest.State.updateField('missionCriticalTypes', values);
          }
        });
      }
    },

    /**
     * Bind justification textarea events
     */
    _bindJustificationEvents() {
      const self = this;

      if (this._elements.justificationBluf) {
        this._elements.justificationBluf.addEventListener('input', function() {
          window.TravelRequest.State.updateField('bluf', this.value);
          self._updateCharCount(this, self._elements.blufCharCount, 500);
        });
        this._elements.justificationBluf.addEventListener('blur', function() {
          self._clearFieldError(this);
        });
      }

      if (this._elements.justificationPurpose) {
        this._elements.justificationPurpose.addEventListener('input', function() {
          window.TravelRequest.State.updateField('purpose', this.value);
          self._updateCharCount(this, self._elements.purposeCharCount, 2000);
        });
        this._elements.justificationPurpose.addEventListener('blur', function() {
          self._clearFieldError(this);
        });
      }
    },

    // =========================================================================
    // DATE PICKERS
    // =========================================================================

    /**
     * Initialize Flatpickr date pickers for Trip Overview
     * Uses wrap mode for date chip integration
     */
    _initDatePickers() {
      const self = this;
      const state = window.TravelRequest.State;

      // Event Start Date - wrap mode for chip integration
      const startChip = document.getElementById('eventStartChip');
      if (startChip) {
        flatpickr(startChip, {
          dateFormat: 'M j, Y',
          allowInput: true,
          wrap: true,
          onOpen: function() {
            self._datePickerOpen = true;
          },
          onClose: function() {
            self._datePickerOpen = false;
          },
          onChange: function(selectedDates, dateStr) {
            state.updateField('eventStartDate', dateStr);
            // Toggle filled state on chip
            startChip.classList.toggle('date-chip--filled', !!dateStr);
            // Clear error if date is now filled
            if (dateStr) {
              self._clearDateChipError('eventStartChip');
            }
            // Update end date min if needed
            if (self._eventEndPicker && dateStr) {
              self._eventEndPicker.set('minDate', selectedDates[0]);
            }
            // Update event date range display
            self._updateEventDateRangeDisplay();
          }
        });
      }

      // Event End Date - use wrap mode for chip integration
      const endChip = document.getElementById('eventEndChip');
      if (endChip) {
        this._eventEndPicker = flatpickr(endChip, {
          dateFormat: 'M j, Y',
          allowInput: true,
          wrap: true,
          onOpen: function() {
            self._datePickerOpen = true;
          },
          onClose: function() {
            self._datePickerOpen = false;
          },
          onChange: function(selectedDates, dateStr) {
            state.updateField('eventEndDate', dateStr);
            // Toggle filled state on chip
            endChip.classList.toggle('date-chip--filled', !!dateStr);
            // Clear error if date is now filled
            if (dateStr) {
              self._clearDateChipError('eventEndChip');
            }
            // Update event date range display
            self._updateEventDateRangeDisplay();
          }
        });
      }
    },

    // =========================================================================
    // CHARACTER COUNTERS
    // =========================================================================

    /**
     * Initialize character counters
     */
    _initCharCounters() {
      if (this._elements.justificationBluf && this._elements.blufCharCount) {
        this._updateCharCount(this._elements.justificationBluf, this._elements.blufCharCount, 500);
      }
      if (this._elements.justificationPurpose && this._elements.purposeCharCount) {
        this._updateCharCount(this._elements.justificationPurpose, this._elements.purposeCharCount, 2000);
      }
    },

    /**
     * Update character count display
     */
    _updateCharCount(textarea, counterEl, maxLength) {
      if (!textarea || !counterEl) return;
      const count = textarea.value.length;
      counterEl.textContent = count;
      counterEl.classList.toggle('text-danger', count > maxLength);
    },

    /**
     * Initialize focus-expand textareas with auto-resize on input
     */
    _initFocusExpand() {
      const self = this;
      const textareas = document.querySelectorAll('textarea.focus-expand');

      textareas.forEach(textarea => {
        self._initFocusExpandSingle(textarea);
      });
    },

    /**
     * Auto-resize textarea to fit content (with optional max height)
     */
    _autoResizeTextarea(textarea, minHeight, maxHeight = 400) {
      textarea.style.height = 'auto';
      let newHeight = Math.max(textarea.scrollHeight, minHeight);
      if (maxHeight && newHeight > maxHeight) {
        newHeight = maxHeight;
        textarea.style.overflowY = 'auto';
      } else {
        textarea.style.overflowY = 'hidden';
      }
      textarea.style.height = newHeight + 'px';
    },

    /**
     * Collapse textarea to preview height
     */
    _collapseTextarea(textarea, previewHeight, minHeight) {
      if (textarea.value.trim()) {
        textarea.style.height = previewHeight + 'px';
        textarea.style.overflowY = 'hidden';
      } else {
        textarea.style.height = minHeight + 'px';
        textarea.style.overflowY = 'hidden';
      }
    },

    /**
     * Initialize focus-expand for a single textarea (for dynamically added elements)
     */
    _initFocusExpandSingle(textarea) {
      if (!textarea || textarea._focusExpandInitialized) return;
      textarea._focusExpandInitialized = true;

      const self = this;
      const ROW_HEIGHT = 22;
      const PADDING = 10;

      const minRows = parseInt(textarea.dataset.rowsMin) || 1;
      const previewRows = parseInt(textarea.dataset.rowsPreview) || 3;
      const minHeight = minRows * ROW_HEIGHT + PADDING;
      const previewHeight = previewRows * ROW_HEIGHT + PADDING;

      // Set initial collapsed state
      this._collapseTextarea(textarea, previewHeight, minHeight);

      // On focus: expand to fit content
      textarea.addEventListener('focus', () => {
        self._autoResizeTextarea(textarea, minHeight);
      });

      // On input: auto-resize as they type
      textarea.addEventListener('input', () => {
        self._autoResizeTextarea(textarea, minHeight);
      });

      // On blur: collapse to preview
      textarea.addEventListener('blur', () => {
        self._collapseTextarea(textarea, previewHeight, minHeight);
      });
    },

    // =========================================================================
    // TOOLTIPS (JS-based to escape overflow containers)
    // =========================================================================

    /**
     * Initialize JS-based tooltips for elements with data-tooltip attribute
     * Uses event delegation and creates tooltip in document body
     */
    _initTooltips() {
      const self = this;

      // Create tooltip element once
      if (!this._tooltipEl) {
        this._tooltipEl = document.createElement('div');
        this._tooltipEl.className = 'js-tooltip';
        this._tooltipEl.innerHTML = '<div class="js-tooltip__content"></div><div class="js-tooltip__arrow"></div>';
        document.body.appendChild(this._tooltipEl);
      }

      // Event delegation for mouseenter/mouseleave on .field-tooltip elements
      document.addEventListener('mouseenter', (e) => {
        if (!e.target || !e.target.closest) return;
        const trigger = e.target.closest('.field-tooltip[data-tooltip]');
        if (trigger) self._showTooltip(trigger);
      }, true);

      document.addEventListener('mouseleave', (e) => {
        if (!e.target || !e.target.closest) return;
        const trigger = e.target.closest('.field-tooltip[data-tooltip]');
        if (trigger) self._hideTooltip();
      }, true);
    },

    /**
     * Show tooltip above the trigger element
     */
    _showTooltip(trigger) {
      const tooltip = this._tooltipEl;
      const content = tooltip.querySelector('.js-tooltip__content');
      const arrow = tooltip.querySelector('.js-tooltip__arrow');

      content.textContent = trigger.dataset.tooltip;
      tooltip.classList.add('js-tooltip--visible');

      // Position above the trigger
      const rect = trigger.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();

      let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
      let top = rect.top - tooltipRect.height - 8;

      // Keep within viewport horizontally
      const padding = 8;
      if (left < padding) left = padding;
      if (left + tooltipRect.width > window.innerWidth - padding) {
        left = window.innerWidth - tooltipRect.width - padding;
      }

      // If not enough room above, show below
      if (top < padding) {
        top = rect.bottom + 8;
        tooltip.classList.add('js-tooltip--below');
      } else {
        tooltip.classList.remove('js-tooltip--below');
      }

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    },

    /**
     * Hide tooltip
     */
    _hideTooltip() {
      this._tooltipEl.classList.remove('js-tooltip--visible');
    },

    // =========================================================================
    // STEP NAVIGATION
    // =========================================================================

    /**
     * Collect checkbox values from a container
     */
    _collectCheckboxValues(fieldName, container) {
      const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
      return Array.from(checkboxes).map(cb => cb.value);
    },

    /**
     * Expand a step (collapse others)
     */
    _expandStep(stepNumber) {
      const state = window.TravelRequest.State;
      state.setStep(stepNumber);

      // Get highest step ever completed for navigation
      const highestCompletedStep = state.getHighestCompletedStep();

      // Update all step accordions
      this._elements.accordionSteps.forEach((step, index) => {
        const stepNum = index + 1;
        const indicator = step.querySelector('.stepper-indicator');
        const body = step.querySelector('.accordion-step__body');

        if (stepNum === stepNumber) {
          // Active step
          step.classList.add('active');
          step.classList.remove('completed');
          indicator.classList.add('active');
          indicator.classList.remove('completed');
          if (body) body.classList.remove('hidden');
        } else if (stepNum <= highestCompletedStep) {
          // Previously visited step - keep as completed for navigation
          step.classList.remove('active');
          step.classList.add('completed');
          indicator.classList.remove('active');
          indicator.classList.add('completed');
          if (body) body.classList.add('hidden');
          // Update summary
          this._updateStepSummary(stepNum);
        } else {
          // Future step (not yet visited)
          step.classList.remove('active', 'completed');
          indicator.classList.remove('active', 'completed');
          if (body) body.classList.add('hidden');
        }
      });

      // Update fixed footer
      this._updateFixedFooter(stepNumber);

      // Scroll to step header with offset (account for fixed header + padding)
      const stepElement = document.getElementById(`accordionStep${stepNumber}`);
      if (stepElement) {
        setTimeout(() => {
          const fixedHeaderHeight = 52; // Height of .travel-header
          const extraPadding = 16; // Breathing room below header
          const totalOffset = fixedHeaderHeight + extraPadding;

          const elementPosition = stepElement.getBoundingClientRect().top;
          const offsetPosition = elementPosition + window.pageYOffset - totalOffset;

          window.scrollTo({
            top: offsetPosition,
            behavior: 'smooth'
          });
        }, 100);
      }

      // Step-specific initialization
      if (stepNumber === 3 && this._refreshTravelerCards) {
        // Refresh traveler cards to show any new/removed legs
        this._refreshTravelerCards();
      }
      if (stepNumber === 6) {
        this._renderReviewStep();
      }
    },

    /**
     * Update step summary text
     */
    _updateStepSummary(stepNumber) {
      const state = window.TravelRequest.State;
      const formData = state.getFormData();
      let summaryText = '';

      switch (stepNumber) {
        case 1:
          const tripName = formData.tripName || 'Untitled';
          const locType = this._formatLocationType(formData.locationType);
          const dates = TravelDateService.formatDateRangeCompact(formData.eventStartDate, formData.eventEndDate);
          summaryText = `${tripName}${locType ? ' · ' + locType : ''}${dates ? ' · ' + dates : ''}`;
          break;
        case 2:
          summaryText = state.getFormattedItinerary() || 'No destinations';
          break;
        case 3:
          const travelerCount = state.getTravelerCount();
          const travelerTotal = state.formatCurrency(state.getTravelerTotal());
          summaryText = `${travelerCount} traveler(s) - ${travelerTotal}`;
          break;
        case 4:
          const types = formData.travelTypes || [];
          summaryText = types.length > 0 ? `${types.length} type(s) selected` : 'No types selected';
          break;
        case 5:
          const sharedTotal = state.formatCurrency(state.getSharedCostsTotal());
          summaryText = `Shared costs: ${sharedTotal}`;
          break;
      }

      const summaryEl = this._elements[`step${stepNumber}Summary`];
      if (summaryEl) {
        summaryEl.textContent = summaryText;
      }
    },

    /**
     * Handle Back button
     */
    _handleBack() {
      const state = window.TravelRequest.State;
      if (state.prevStep()) {
        this._expandStep(state.getCurrentStep());
      }
    },

    /**
     * Handle Continue button
     */
    _handleContinue() {
      const state = window.TravelRequest.State;
      const currentStep = state.getCurrentStep();

      if (this._validateStep(currentStep)) {
        if (state.nextStep()) {
          this._expandStep(state.getCurrentStep());
        }
      }
    },

    // =========================================================================
    // VALIDATION
    // =========================================================================

    /**
     * Validate current step
     */
    _validateStep(stepNumber) {
      const stepElement = document.getElementById(`accordionStep${stepNumber}`);
      if (stepElement) {
        this._clearValidationErrors(stepElement);
      }

      switch (stepNumber) {
        case 1:
          return this._validateTripOverview();
        case 2:
          return this._validateItinerary();
        case 3:
          return this._validateTravelers();
        case 4:
          return this._validateClassification();
        case 5:
          return true; // Shared costs are optional
        default:
          return true;
      }
    },

    /**
     * Clear validation errors in step
     */
    _clearValidationErrors(stepElement) {
      if (!stepElement) return;

      stepElement.querySelectorAll('.is-invalid').forEach(el => {
        el.classList.remove('is-invalid');
      });
      stepElement.querySelectorAll('.invalid-feedback').forEach(el => {
        el.remove();
      });
      stepElement.querySelectorAll('.segmented-control--error').forEach(el => {
        el.classList.remove('segmented-control--error');
      });
      stepElement.querySelectorAll('.alert-danger').forEach(el => {
        if (!el.id) el.remove(); // Don't remove permanent alerts
      });
      // Clear date chip errors
      stepElement.querySelectorAll('.date-chip--error').forEach(el => {
        el.classList.remove('date-chip--error');
      });
      stepElement.querySelectorAll('.date-chip-error').forEach(el => {
        el.remove();
      });
    },

    /**
     * Show field error
     */
    _showFieldError(field, message) {
      if (!field) return;
      field.classList.add('is-invalid');

      // Remove existing feedback
      const existingFeedback = field.parentElement.querySelector('.invalid-feedback');
      if (existingFeedback) existingFeedback.remove();

      // Add new feedback
      const feedback = document.createElement('div');
      feedback.className = 'invalid-feedback d-block';
      feedback.textContent = message;
      field.parentElement.appendChild(feedback);
    },

    /**
     * Clear field error
     */
    _clearFieldError(field) {
      if (!field) return;
      field.classList.remove('is-invalid');
      const feedback = field.parentElement.querySelector('.invalid-feedback');
      if (feedback) feedback.remove();
    },

    /**
     * Show segmented control error
     */
    _showSegmentedControlError(control, message) {
      if (!control) return;
      control.classList.add('segmented-control--error');

      const feedback = document.createElement('div');
      feedback.className = 'invalid-feedback d-block';
      feedback.textContent = message;
      control.parentElement.appendChild(feedback);
    },

    /**
     * Show general error at top of step
     */
    _showGeneralError(stepElement, message) {
      const alert = document.createElement('div');
      alert.className = 'alert alert-danger alert-sm mb-3';
      alert.innerHTML = `<i aria-hidden="true" class="fas fa-exclamation-circle me-2"></i>${this._escapeHtml(message)}`;

      const body = stepElement.querySelector('.accordion-step__body');
      if (body) {
        body.insertBefore(alert, body.firstChild);
      }
    },

    // =========================================================================
    // STEP VALIDATION IMPLEMENTATIONS
    // =========================================================================

    /**
     * Validate Step 1: Trip Overview (includes Justification)
     */
    _validateTripOverview() {
      const state = window.TravelRequest.State;
      let isValid = true;

      // Trip name required
      const tripName = this._elements.tripName?.value?.trim();
      if (!tripName) {
        this._showFieldError(this._elements.tripName, 'Event/Meeting name is required');
        isValid = false;
      } else {
        state.updateField('tripName', tripName);
      }

      // Location type required
      const locationType = this._elements.locationType?.value;
      if (!locationType) {
        this._showFieldError(this._elements.locationType, 'Please select a location type');
        isValid = false;
      } else {
        state.updateField('locationType', locationType);
      }

      // BLUF required
      const bluf = this._elements.justificationBluf?.value?.trim();
      if (!bluf) {
        this._showFieldError(this._elements.justificationBluf, 'BLUF is required');
        isValid = false;
      } else if (bluf.length > 500) {
        this._showFieldError(this._elements.justificationBluf, 'BLUF must be 500 characters or less');
        isValid = false;
      } else {
        state.updateField('bluf', bluf);
      }

      // Purpose required
      const purpose = this._elements.justificationPurpose?.value?.trim();
      if (!purpose) {
        this._showFieldError(this._elements.justificationPurpose, 'Detailed justification is required');
        isValid = false;
      } else if (purpose.length > 2000) {
        this._showFieldError(this._elements.justificationPurpose, 'Justification must be 2000 characters or less');
        isValid = false;
      } else {
        state.updateField('purpose', purpose);
      }

      // Event dates required
      const eventStartDate = this._elements.eventStartDate?.value?.trim();
      const eventEndDate = this._elements.eventEndDate?.value?.trim();

      if (!eventStartDate) {
        this._showDateChipError('eventStartChip', 'Start date required');
        isValid = false;
      }

      if (!eventEndDate) {
        this._showDateChipError('eventEndChip', 'End date required');
        isValid = false;
      }

      // Validate end date is not before start date
      // Dates are stored as "M j, Y" format (e.g., "Jan 12, 2026")
      if (eventStartDate && eventEndDate) {
        const parseDate = (dateStr) => {
          // Parse "Jan 12, 2026" format
          const parsed = Date.parse(dateStr);
          return isNaN(parsed) ? null : new Date(parsed);
        };
        const start = parseDate(eventStartDate);
        const end = parseDate(eventEndDate);
        if (start && end && end < start) {
          this._showDateChipError('eventEndChip', 'End date must be after start date');
          isValid = false;
        }
      }

      return isValid;
    },

    /**
     * Show error on date chip
     */
    _showDateChipError(chipId, message) {
      const chip = document.getElementById(chipId);
      if (!chip) return;

      chip.classList.add('date-chip--error');

      // Add error message AFTER the date-range-group (as sibling, not child)
      const rangeGroup = chip.closest('.date-range-group');
      if (rangeGroup) {
        // Check if error already exists after the range group
        let errorEl = rangeGroup.nextElementSibling;
        if (!errorEl || !errorEl.classList.contains('date-chip-error')) {
          errorEl = document.createElement('div');
          errorEl.className = 'date-chip-error';
          rangeGroup.parentNode.insertBefore(errorEl, rangeGroup.nextSibling);
        }
        // Append message if not already there
        if (!errorEl.textContent.includes(message)) {
          if (errorEl.textContent) errorEl.textContent += ' | ';
          errorEl.textContent += message;
        }
      }
    },

    /**
     * Clear error on date chip
     */
    _clearDateChipError(chipId) {
      const chip = document.getElementById(chipId);
      if (!chip) return;

      chip.classList.remove('date-chip--error');

      // Check if both chips are now valid, then remove the error message
      const rangeGroup = chip.closest('.date-range-group');
      if (rangeGroup) {
        const hasErrors = rangeGroup.querySelector('.date-chip--error');
        if (!hasErrors) {
          const errorEl = rangeGroup.nextElementSibling;
          if (errorEl && errorEl.classList.contains('date-chip-error')) {
            errorEl.remove();
          }
        }
      }
    },

    /**
     * Update the event date range display above the itinerary
     */
    _updateEventDateRangeDisplay() {
      const state = window.TravelRequest.State;
      const startDate = state.getField('eventStartDate');
      const endDate = state.getField('eventEndDate');

      const container = this._elements.eventDateRange;
      const textEl = this._elements.eventDateRangeText;

      if (!container || !textEl) return;

      if (startDate && endDate) {
        textEl.textContent = TravelDateService.formatDateRange(startDate, endDate);
        container.classList.remove('hidden');
      } else if (startDate) {
        textEl.textContent = TravelDateService.formatDate(startDate) + ' - (end date pending)';
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    },

    /**
     * Validate Step 2: Itinerary
     */
    _validateItinerary() {
      const state = window.TravelRequest.State;
      const legs = state.getLegs();
      const locationType = state.getField('locationType');
      const requiresSiteName = locationType === 'client-site' || locationType === 'contractor-site';

      if (legs.length === 0) {
        const stepElement = document.getElementById('accordionStep2');
        this._showGeneralError(stepElement, 'Please add at least one destination');
        return false;
      }

      // Validate each leg has required fields
      let isValid = true;
      let missingFields = [];

      legs.forEach((leg, index) => {
        const legNum = index + 1;

        // Validate city
        if (!leg.city) {
          isValid = false;
          const cityInput = document.getElementById(`legCity_${leg.id}`);
          if (cityInput) {
            cityInput.classList.add('is-invalid');
          }
        }

        // Validate dates - use date chip error styling
        if (!leg.startDate) {
          isValid = false;
          const startChip = document.getElementById(`legStartChip_${leg.id}`);
          if (startChip) {
            startChip.classList.add('date-chip--error');
          }
        }

        if (!leg.endDate) {
          isValid = false;
          const endChip = document.getElementById(`legEndChip_${leg.id}`);
          if (endChip) {
            endChip.classList.add('date-chip--error');
          }
        }

        // Validate site name if client-site or contractor-site location type
        if (requiresSiteName && !leg.siteName) {
          isValid = false;
          if (!missingFields.includes('site name')) {
            missingFields.push('site name');
          }
          const siteInput = document.getElementById(`legSite_${leg.id}`);
          if (siteInput) {
            siteInput.classList.add('is-invalid');
          }
        }
      });

      if (!isValid) {
        const stepElement = document.getElementById('accordionStep2');
        let errorMsg = 'Please complete all destination details (city and dates)';
        if (missingFields.includes('site name')) {
          errorMsg = 'Please complete all destination details including site name for each stop';
        }
        this._showGeneralError(stepElement, errorMsg);
        return false;
      }

      // Validate leg date sequence (each leg's start >= previous leg's end)
      if (legs.length > 1 && window.TravelDateService?.validateLegDateSequence) {
        const sequenceValidation = window.TravelDateService.validateLegDateSequence(legs);
        if (!sequenceValidation.valid) {
          const stepElement = document.getElementById('accordionStep2');
          const errorMessages = sequenceValidation.errors.map(err =>
            `Leg ${err.leg}: ${err.error}`
          ).join('. ');
          this._showGeneralError(stepElement, `Date sequence error: ${errorMessages}`);
          return false;
        }
      }

      return isValid;
    },

    /**
     * Validate Step 3: Travelers
     * Ensures at least one traveler exists and all travelers have required fields
     */
    _validateTravelers() {
      const state = window.TravelRequest.State;
      const travelers = state.getTravelers();
      const stepElement = document.getElementById('accordionStep3');

      if (travelers.length === 0) {
        this._showGeneralError(stepElement, 'Please add at least one traveler');
        return false;
      }

      // Validate all travelers have required fields using the existing validation
      if (this._validateAllTravelers) {
        const incomplete = this._validateAllTravelers();
        if (incomplete) {
          const { traveler, missing } = incomplete;

          // Build user-friendly message
          const fieldNames = {
            'employee': 'employee name',
            'funding': 'funding source',
            'justification': 'function & role justification',
            'transport': 'transportation costs'
          };
          const missingNames = missing.map(m => fieldNames[m] || m).join(', ');

          this._showGeneralError(stepElement, `Please complete all traveler information. Missing: ${missingNames}`);

          // Expand the incomplete traveler and highlight missing fields
          if (!traveler.isExpanded && this._toggleTravelerExpanded) {
            this._toggleTravelerExpanded(traveler.id);
          }
          if (this._highlightIncompleteFields) {
            this._highlightIncompleteFields(traveler.id, missing);
          }
          return false;
        }
      }

      return true;
    },

    /**
     * Validate Step 4: Classification
     * Both travel types and mission-critical types require at least one selection
     */
    _validateClassification() {
      const state = window.TravelRequest.State;
      const travelTypes = state.getField('travelTypes') || [];
      const missionCriticalTypes = state.getField('missionCriticalTypes') || [];
      const stepElement = document.getElementById('accordionStep4');

      if (travelTypes.length === 0) {
        this._showGeneralError(stepElement, 'Please select at least one Type of Travel');
        return false;
      }

      if (missionCriticalTypes.length === 0) {
        this._showGeneralError(stepElement, 'Please select at least one Mission-Critical Travel type');
        return false;
      }

      return true;
    },

    // SHARED COSTS (kept in core for simplicity)
    // =========================================================================

    /**
     * Initialize shared costs
     */
    _initSharedCosts() {
      const self = this;

      // Bind events on shared cost category cards
      this._bindSharedCostRowEvents();
    },

    /**
     * Bind events on shared cost categories
     */
    _bindSharedCostRowEvents() {
      const self = this;

      if (this._elements.sharedCostsList) {
        this._elements.sharedCostsList.addEventListener('input', (e) => {
          const row = e.target.closest('.sc-row');
          if (!row) return;

          const category = row.dataset.category;
          const state = window.TravelRequest.State;

          if (e.target.classList.contains('shared-cost-amount')) {
            state.updateSharedCost(category, 'amount', parseFloat(e.target.value) || 0);
            self._updateSharedCostsTotal();
          } else if (e.target.classList.contains('shared-cost-desc')) {
            state.updateSharedCost(category, 'description', e.target.value);
          }
        });
      }
    },

    /**
     * Update shared costs total display
     */
    _updateSharedCostsTotal() {
      const state = window.TravelRequest.State;
      const total = state.getSharedCostsTotal();
      const totalEl = this._elements.sharedCostsTotal?.querySelector('.sc-total__value');
      if (totalEl) {
        totalEl.textContent = state.formatCurrency(total);
      }
    },

    /**
     * Render itinerary for review with dates
     */
    _renderItineraryReview() {
      const state = window.TravelRequest.State;
      const legs = state.getLegs() || [];

      }
