            var newRole = res.data && res.data.role;
            var currentUser = self._findUser(user.userId);
            if (currentUser && newRole) {
              var exists = false;
              for (var ri = 0; ri < (currentUser.roles || []).length; ri++) {
                if (currentUser.roles[ri].roleId === newRole.roleId) { exists = true; break; }
              }
              if (!exists) {
                currentUser.roles = currentUser.roles || [];
                currentUser.roles.push(newRole);
              }
              self._renderSlideinBody(currentUser);
            } else {
              // Edge: missing currentUser — fall back to the old reload path
              self._restoreSubmit(submitBtn, origLabel);
              self._reloadAndKeepSlideinOpen();
              return;
            }

            // primary on a different AAS FO when this is the new primary)
            self._announceReassignment((res.data && res.data.reassignedCount) || 0, 'reassigned to new primary');
            self._silentReconcile();
          })
          .withFailureHandler(function(err) {
            self._restoreSubmit(submitBtn, origLabel);
            self._showSlideinError('Add role failed: ' + (err && err.message));
          })

          .addRoleToUser(user.userId, {

            scope: scope,
            notes: notes

    _populateBUOptions: function(select, ensureName) {

     * first BU that resolves to that name. Cross-BU disambiguation needs

    _populateSectorOptions: function(select, ensureName) {
      if (!select) return;
      var aas = this._deriveAasScope();

        if (ensureName && e.name === ensureName) ensureFound = true;

    /**
     * Find a role in the currently-loaded user list by Role_ID.
     * Returns { user, role } or null.
     */
    _findRole: function(roleId) {
      for (var i = 0; i < this._users.length; i++) {
        var u = this._users[i];
        for (var j = 0; j < (u.roles || []).length; j++) {
          if (u.roles[j].roleId === roleId) return { user: u, role: u.roles[j] };

    /**
     * Optimistic toggle with routing-impact gating.
     *
     * Re-activate (nextActive=true) → fires immediately, no checks.
     * Deactivate (nextActive=false) → routes through _routingImpactOfDeactivation:
     *   silent  → fires immediately, optimistic
     *   inform  → fires immediately + toast after success
     *   warn    → expands the role row inline; admin must confirm or cancel
     *   block   → expands the row inline with no proceed option (last admin)
     */
    _toggleRoleActive: function(roleId, nextActive) {
      var loc = this._findRole(roleId);
      if (!loc) return;
      if (nextActive) {
        // Re-activation never gates — fire directly
        return this._executeToggleRoleActive(roleId, true);
      }
      var impact = this._routingImpactOfDeactivation(roleId);
      if (impact.level === 'silent') {
        return this._executeToggleRoleActive(roleId, false);
      }
      if (impact.level === 'inform') {
        var self2 = this;
        this._executeToggleRoleActive(roleId, false, function() {
          self2._showToast(self2._informMessageFor(loc.role, impact), 'success');
        });
        return;
      }
      // 'warn' or 'block' — expand the row
      this._showRoleWarnPanel(loc.user, loc.role, impact);
    },

    /** Pulls the actual RPC into its own function so the gate decides
     *  whether/when to call it. onAfterSuccess optional — runs after
     *  successful round-trip + reconcile.
     *
     *  Server may auto-promote the backup to primary when a routing-pair
     *  primary is deactivated; res.promoted carries the promoted role's
     *  id + userId. Apply that to local state too so the UI reflects
     *  the swap immediately.
     */
    _executeToggleRoleActive: function(roleId, nextActive, onAfterSuccess) {
      var loc = this._findRole(roleId);
      if (!loc) return;
      var user = loc.user, role = loc.role;
      var prevActive = role.isActive;
      var prevPrimary = role.isPrimary;

      role.isActive = nextActive;
      role._pending = true;
      this._renderSlideinBody(user);

      google.script.run
        .withSuccessHandler(function(res) {
          role._pending = false;
          if (!res || !res.success) {
            role.isActive = prevActive;
            role.isPrimary = prevPrimary;
            self._renderSlideinBody(user);
            self._showSlideinError('Toggle failed: ' + (res && res.error));
            return;
          }
          // Apply server's response: deactivated role gets isPrimary=false
          // when a partner was promoted; the partner gets isPrimary=true.
          var resData = res.data || {};
          if (resData.role && typeof resData.role.isPrimary === 'boolean') {
            role.isPrimary = resData.role.isPrimary;
          }
          if (resData.promoted) {
            var promotedLoc = self._findRole(resData.promoted.roleId);
            if (promotedLoc) promotedLoc.role.isPrimary = true;
          }
          self._renderSlideinBody(user);
          var verb = resData.promoted ? 'reassigned to backup' : 'orphaned (no backup)';
          self._announceReassignment(resData.reassignedCount || 0, verb);
          self._silentReconcile();
          if (typeof onAfterSuccess === 'function') {
            try { onAfterSuccess(); } catch (e) { /* harmless */ }
          }
        })
        .withFailureHandler(function(err) {
          role._pending = false;
          role.isActive = prevActive;
          role.isPrimary = prevPrimary;
          self._renderSlideinBody(user);
          self._showSlideinError('Toggle failed: ' + (err && err.message));
        })
        .setRoleActive(roleId, nextActive);
    },

    /**

        if (impact.gap) {

          actionsHtml =

      var panel = document.createElement('div');

    /** Build a short toast message for inform-level deactivations. */
    _informMessageFor: function(role, impact) {

        return 'Sector override deactivated. Routing for ' +
          (role.scope || 'this sector') + ' reverts to the synced default director.';

    _confirmDeleteRole: function(roleId, roleType, scope) {
      // Inline two-step confirm in the role row instead of native confirm().
      // The first click on the trash icon turns the row into a "Confirm
      // delete?" prompt with explicit yes/no; second click commits.
      var btn = document.querySelector(
        '[data-role-action="delete"][data-role-id="' + roleId + '"]'
      );
      if (!btn) {
        // Fallback if the button isn't in DOM (race) — just commit
        self._executeDeleteRole(roleId);
        return;
      }
      var row = btn.closest('.users-role-row');
      if (!row) { self._executeDeleteRole(roleId); return; }
      if (row.classList.contains('users-role-row--confirm-delete')) {
        // Already armed — this click is the confirm
        self._executeDeleteRole(roleId);
        return;
      }
      // Arm the confirm state. Auto-disarm after 5s.
      row.classList.add('users-role-row--confirm-delete');
      var origInner = btn.innerHTML;
      btn.innerHTML = '<i aria-hidden="true" class="fas fa-check"></i>';
      btn.title = 'Confirm delete';
      var disarm = function() {
        row.classList.remove('users-role-row--confirm-delete');
        btn.innerHTML = origInner;
        btn.title = 'Delete role';
        document.removeEventListener('click', outsideClickHandler, true);
      };
      var outsideClickHandler = function(e) {
        if (!row.contains(e.target)) disarm();
      };
      setTimeout(function() {
        document.addEventListener('click', outsideClickHandler, true);
      }, 0);
      setTimeout(disarm, 5000);
    },

    /**
     * Optimistic delete — removes the role locally, fires RPC. On failure
     * restores it. Server may auto-promote a backup to primary if the
     * deleted role was an active primary in a routing pair; res.promoted
     * applied to local state on success.
     */
    _executeDeleteRole: function(roleId) {
      var loc = this._findRole(roleId);
      if (!loc) return;
      var user = loc.user, role = loc.role;
      var roleIdx = user.roles.indexOf(role);
      if (roleIdx === -1) return;

      var snapshot = user.roles.slice();
      user.roles.splice(roleIdx, 1);
      this._renderSlideinBody(user);

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            user.roles = snapshot;
            self._renderSlideinBody(user);
            self._showSlideinError('Delete failed: ' + (res && res.error));
            return;
          }
          // Apply auto-promote to local state if server swapped a backup
          var deleteResData = res.data || {};
          if (deleteResData.promoted) {
            var promotedLoc = self._findRole(deleteResData.promoted.roleId);
            if (promotedLoc) {
              promotedLoc.role.isPrimary = true;
              self._renderSlideinBody(promotedLoc.user);
            }
          }
          self._silentReconcile();
        })
        .withFailureHandler(function(err) {
          user.roles = snapshot;
          self._renderSlideinBody(user);
          self._showSlideinError('Delete failed: ' + (err && err.message));
        })
        .deleteRole(roleId);
    },

    /**
     * Optimistic primary swap — flips Is_Primary locally on the target role
     * AND demotes any other active aas_fo_reviewer to non-primary in the
     * SAME local update so the UI matches what the server will do
     * atomically. On failure: revert all touched rows.
     */
    _makeRolePrimary: function(userId, roleType, scope) {
      // Snapshot every aas_fo_reviewer Is_Primary across all users so we
      // can revert on failure
      var touched = [];
      var matched = false;
      for (var i = 0; i < this._users.length; i++) {
        var u = this._users[i];
        for (var j = 0; j < (u.roles || []).length; j++) {
          var r = u.roles[j];
          if (r.roleType !== roleType) continue;
          if ((r.scope || '') !== (scope || '')) continue;
          touched.push({ role: r, prevPrimary: r.isPrimary });
          if (u.userId === userId && r.isActive) {
            r.isPrimary = true;
            r._pending = true;
            matched = true;
          } else if (r.isActive) {
            r.isPrimary = false;
          }
        }
      }
      if (!matched) {
        self._showSlideinError('Cannot promote: no active role for that user');
        return;
      }
      // Re-render whatever slidein is open (likely the target user)
      var current = this._findUser(this._selectedUserId);
      if (current) this._renderSlideinBody(current);

      google.script.run
        .withSuccessHandler(function(res) {
          // Clear pending markers
          for (var t = 0; t < touched.length; t++) touched[t].role._pending = false;
          if (!res || !res.success) {
            // Revert all
            for (var rt = 0; rt < touched.length; rt++) touched[rt].role.isPrimary = touched[rt].prevPrimary;
            if (current) self._renderSlideinBody(current);
            self._renderRouting();
            self._showSlideinError('Promote failed: ' + (res && res.error));
            return;
          }
          if (current) self._renderSlideinBody(current);
          self._announceReassignment((res.data && res.data.reassignedCount) || 0, 'reassigned to new primary');
          self._silentReconcile();
        })
        .withFailureHandler(function(err) {
          for (var t2 = 0; t2 < touched.length; t2++) {
            touched[t2].role.isPrimary = touched[t2].prevPrimary;
            touched[t2].role._pending = false;
          }
          if (current) self._renderSlideinBody(current);
          self._renderRouting();
          self._showSlideinError('Promote failed: ' + (err && err.message));
        })
        .setRolePrimary(userId, roleType, scope || '');
    },

    /**
     * Toast the bulk-reassignment result. Server returns reassignedCount
     * after every routing-affecting role write. Silent if zero.
     */
    _announceReassignment: function(count, verb) {
      if (!count || count <= 0) return;
      var msg = count + ' pending request' + (count === 1 ? '' : 's') + ' ' + (verb || 'reassigned');
      try { this._showToast(msg, 'success'); } catch (e) { /* toast helper missing — silent */ }
    },

    /**
     * Background reconcile after optimistic mutations succeed. Pulls fresh
     * data into self._users + updates the table render, but DOES NOT
     * re-render the slidein body. The slidein is the admin's active
     * workspace — auto-rendering it on every reconcile blows away any
     * in-progress UI state (warn panels, add-role form, confirm-delete
     * arming, scroll position, in-flight typing).
     *
     * Stale slidein rendering refreshes on the next deliberate action
     * (close/reopen, save, delete, add) since those paths re-render via
     * _renderSlideinBody anyway. The 30s polling catches cross-admin
     * changes for the table view; the slidein view is owned by whoever
     * has it open until they leave.
     */
    _silentReconcile: function() {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) return;
          self._users = (res.data && res.data.users) || [];
          if (res.data && res.data.version) self._knownVersion = res.data.version;
          self._render();
        })
        .withFailureHandler(function() { /* harmless */ })
        .listTravelUsers();
    },

    // ----------------------------------------------------------------------
    // ADD USER — state-driven slidein (search → preview → create, or manual)
    // ----------------------------------------------------------------------
    //
    // States:
    //   'search'     — hero search input, inline results, "add manually" link
    //   'hc-picked'  — HC verified preview card + notes + create
    //   'manual'     — external user form (name, email, ext_<slug>) + create
    //
    // Each state renders the slidein header subtitle + body to match.
    // Submit always goes through addTravelUser; HC-picked state lets the
    // server re-resolve User_ID from HC by email so we never pass a
    // userIdOverride for HC users.

    _addUserState: null,    // current state
    _addUserPicked: null,   // HC record once chosen

    _openAddUser: function(prefill) {
      this._selectedUserId = null;
      this._addUserState = 'search';
      this._addUserPicked = null;
      this._addUserPrefill = prefill || null;
      this._renderAddUserView();

      var sl = document.getElementById('usersSlidein');
      var bd = document.getElementById('usersSlideinBackdrop');
      if (sl) sl.classList.add('users-slidein--open');
      if (bd) bd.classList.add('users-slidein__backdrop--open');
    },

    _renderAddUserView: function() {
      var nameEl = document.getElementById('usersSlideinName');
      var metaEl = document.getElementById('usersSlideinMeta');
      var body = document.getElementById('usersSlideinBody');
      if (!body) return;

      // Prefill context banner — present when the slidein was opened from
      // a routing-dashboard CTA. Tells admin what they're configuring so
      // the role + scope pre-fills don't feel arbitrary.
      var prefillBanner = '';
      if (this._addUserPrefill) {
        var pf = this._addUserPrefill;
        prefillBanner =
          '<div class="users-add__prefill-banner">' +
            '<i aria-hidden="true" class="fas fa-bullseye"></i>' +
            '<span class="users-add__prefill-banner-action">' + _esc(pf.ctaCopy || 'Adding') + '</span>' +
            '<span class="users-add__prefill-banner-context">' + _esc(pf.contextLabel || '') + '</span>' +
            '<button type="button" class="users-add__prefill-banner-clear" id="addUserPrefillClear" title="Clear and add a different role">' +
              '<i aria-hidden="true" class="fas fa-times"></i>' +
            '</button>' +
          '</div>';
      }

      if (this._addUserState === 'hc-picked' && this._addUserPicked) {
        var p = this._addUserPicked;
        if (nameEl) nameEl.textContent = p.employeeName || 'AAS staff member';
        if (metaEl) {
          var headerBits = [];
          if (p.emailAddress) headerBits.push(_esc(p.emailAddress));
          headerBits.push('Synced');
          if (p.employeeId) headerBits.push('<code>' + _esc(p.employeeId) + '</code>');
          metaEl.innerHTML = headerBits.join(' · ');
        }
        body.innerHTML = prefillBanner + this._renderAddHcPickedHtml(p);
        this._wireAddHcPicked(body);
      } else if (this._addUserState === 'manual') {
        if (nameEl) nameEl.textContent = 'Add user manually';
        if (metaEl) metaEl.textContent = 'For FAS reviewers, consultants, testers, or others outside the AAS staffing data';
        body.innerHTML = prefillBanner + this._renderAddManualHtml();
        this._wireAddManual(body);
      } else {
        if (nameEl) nameEl.textContent = 'Add user';
        if (metaEl) {
          metaEl.textContent = this._addUserPrefill
            ? 'Search AAS staff or existing TRIP users — first match wins'
            : 'Search AAS staff, or add a user manually';
        }
        body.innerHTML = prefillBanner + this._renderAddSearchHtml();
        this._wireAddSearch(body);
      }

      // Wire the prefill banner clear button (clears prefill + re-renders).
      var clearBtn = body.querySelector('#addUserPrefillClear');
      if (clearBtn) {
        clearBtn.addEventListener('click', function() {
          self._addUserPrefill = null;
          self._renderAddUserView();
        });
      }
    },

    // ---- STATE: search ---------------------------------------------------

    _renderAddSearchHtml: function() {
      // No HTML autofocus attribute — Chromium blocks it inside cross-origin
      // iframes (GAS web apps). _wireAddSearch focuses programmatically
      // after mount; that path is allowed because the +Add User click is
      // the user gesture that opens the slidein.
      return (
        '<div class="users-add">' +
          '<div class="users-add__hero">' +
            '<i aria-hidden="true" class="fas fa-search users-add__hero-icon"></i>' +
            '<input type="text" id="addUserSearch" placeholder="Search by name or email" autocomplete="off">' +
          '</div>' +
          '<div class="users-add__results" id="addUserResults">' +
            '<p class="users-add__hint">Type at least 2 characters to search AAS staff.</p>' +
          '</div>' +
          '<div class="users-add__divider"><span>or</span></div>' +
          '<button type="button" class="users-add__manual-link" id="addUserManualLink">' +
            '<i aria-hidden="true" class="fas fa-user-plus"></i>' +
            '<span>Add user manually</span>' +
            '<span class="users-add__manual-link-hint">For FAS reviewers, consultants, testers, or others outside AAS staffing data</span>' +
          '</button>' +
        '</div>'
      );
    },

    _wireAddSearch: function(body) {
      var searchInp = body.querySelector('#addUserSearch');
      var resultsEl = body.querySelector('#addUserResults');
      var manualLink = body.querySelector('#addUserManualLink');

      if (manualLink) {
        manualLink.addEventListener('click', function() {
          self._addUserState = 'manual';
          self._renderAddUserView();
        });
      }

      if (!searchInp || !resultsEl) return;
      var debounce = null;
      searchInp.addEventListener('input', function() {
        if (debounce) clearTimeout(debounce);
        debounce = setTimeout(function() {
          self._renderAddSearchResults(searchInp.value || '', resultsEl);
        }, 100);
      });
      // Render once on mount with whatever's there (empty)
      this._renderAddSearchResults(searchInp.value || '', resultsEl);
      // Programmatic focus AFTER mount — allowed because the +Add User
      // click counted as the user gesture. Wrapped in setTimeout(0) to
      // run after the slidein open animation starts.
      setTimeout(function() {
        try { searchInp.focus(); } catch (e) { /* harmless if blocked */ }
      }, 0);
    },

    _renderAddSearchResults: function(query, resultsEl) {
      var q = (query || '').trim();
      if (!q || q.length < 2) {
        resultsEl.innerHTML = '<p class="users-add__hint">Type at least 2 characters to search AAS staff.</p>';
        return;
      }
      if (!window.HCDataCenter || !window.HCDataCenter.isLoaded()) {
        resultsEl.innerHTML = '<p class="users-add__hint">Staff data still loading…</p>';
        return;
      }
      var matches = window.HCDataCenter.search(q) || [];
      var seen = {};
      var picked = [];
      for (var i = 0; i < matches.length && picked.length < 8; i++) {
        var p = matches[i];
        if (!p || !p.employeeId || !p.emailAddress) continue;
        if (seen[p.employeeId]) continue;
        seen[p.employeeId] = true;
        // Annotate with existing-user info so the renderer can mark
        // duplicates and the click handler redirects to edit mode.
        var existing = self._findUserByEmail(p.emailAddress);
        p._existingUserId = existing ? existing.userId : null;
        picked.push(p);
      }
      if (!picked.length) {
        resultsEl.innerHTML =
          '<p class="users-add__hint users-add__hint--empty">' +
            'No AAS staff matches for &quot;' + _esc(q) + '&quot;. Try fewer characters, or add manually below.' +
          '</p>';
        return;
      }
      var html = '<ul class="users-add__list">';
      for (var j = 0; j < picked.length; j++) {
        var p2 = picked[j];
        var existingTag = p2._existingUserId
          ? '<span class="users-add__result-existing">Already added</span>'
          : '';
        var liClasses = 'users-add__result' + (p2._existingUserId ? ' users-add__result--existing' : '');
        html +=
          '<li class="' + liClasses + '" data-pick-idx="' + j + '">' +
            '<div class="users-add__result-name">' +
              _esc(p2.employeeName || '—') + existingTag +
            '</div>' +
            '<div class="users-add__result-meta">' +
              _esc(p2.emailAddress) +
              (p2.officeTitle ? ' · ' + _esc(p2.officeTitle) : '') +
            '</div>' +
          '</li>';
      }
      html += '</ul>';
      resultsEl.innerHTML = html;

      Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-pick-idx]'), function(li) {
        li.addEventListener('click', function() {
          var idx = parseInt(li.getAttribute('data-pick-idx'), 10);
          if (isNaN(idx) || !picked[idx]) return;
          // Already-added user → close the Add User flow and open the
          // existing user's slidein. If a routing-dashboard CTA seeded
          // a prefill, forward it so the slidein opens with the Add Role
          // form expanded and the role + scope filled in (one-click
          // promotion path: approved_user → BU reviewer).
          if (picked[idx]._existingUserId) {
            var existingId = picked[idx]._existingUserId;
            var prefill = self._addUserPrefill;
            self._addUserState = 'search';
            self._addUserPicked = null;
            self._addUserPrefill = null;
            if (prefill) self._openSlideinWithRolePrefill(existingId, prefill);
            else self._openSlidein(existingId);
            return;
          }
          self._addUserPicked = picked[idx];
          self._addUserState = 'hc-picked';
          self._renderAddUserView();
        });
      });
    },

    // ---- STATE: hc-picked ------------------------------------------------

    _renderAddHcPickedHtml: function(p) {
      // Body strips the duplicated identity (name/email/HC-verified badge
      // already in the slidein header). What's left is the metadata that
      // gives admin context for the decision: title + BU name. Codes are
      // hidden here — admin sees plain language. The User_ID (employee
      // number) lives in the slidein header for traceability.
      var contextBits = [];
      if (p.officeTitle) contextBits.push(_esc(p.officeTitle));
      var buName = (p.org && p.org.businessUnit) ? p.org.businessUnit : '';
      if (buName) {
        contextBits.push(_esc(buName));
      } else if (p.orgCode) {
        // Fallback when HC didn't populate businessUnit on this position
        contextBits.push(_esc(p.orgCode));
      }
      var contextLine = contextBits.length
        ? '<span class="users-add__context-text">' + contextBits.join(' · ') + '</span>'
        : '<span class="users-add__context-text users-add__context-text--muted">No additional staff context</span>';

      return (
        '<div class="users-add">' +
          '<div class="users-add__context">' +
            '<i aria-hidden="true" class="fas fa-id-badge"></i>' +
            contextLine +
            '<button type="button" class="users-add__change-link" id="addUserChange">Change selection</button>' +
          '</div>' +

          this._renderInitialRoleHtml() +

          '<label class="users-slidein__field" style="margin-top:14px;">' +
            '<span>Note for this role assignment</span>' +
            '<input type="text" id="addUserNotes" placeholder="e.g. New BU reviewer for Army">' +
            '<span class="users-slidein__hint">Optional. Shown on the role record after creation.</span>' +
          '</label>' +

          '<div class="users-add__footer">' +
            '<button type="button" class="users-btn users-btn--primary" id="addUserSubmit">' +
              '<i aria-hidden="true" class="fas fa-check"></i> Create user' +
            '</button>' +
          '</div>' +
        '</div>'
      );
    },

    _wireAddHcPicked: function(body) {
      var changeBtn = body.querySelector('#addUserChange');
      var submitBtn = body.querySelector('#addUserSubmit');
      var notesInp = body.querySelector('#addUserNotes');

      if (changeBtn) changeBtn.addEventListener('click', function() {
        self._addUserPicked = null;
        self._addUserState = 'search';
        self._renderAddUserView();
      });
      this._wireInitialRoleSelector(body);
      if (submitBtn) submitBtn.addEventListener('click', function() {
        if (!self._addUserPicked) return;
        var p = self._addUserPicked;
        var role = self._collectInitialRole(body);
        if (!role) return; // _collectInitialRole already showed the error
        var notes = (notesInp && notesInp.value || '').trim();
        if (notes) role.notes = notes;
        self._submitAddUser({
          email: p.emailAddress,
          name: p.employeeName || '',
          initialRole: role
          // No userIdOverride — server resolves from HC by email
        }, submitBtn);
      });
    },

    /**
     * Required Initial Role picker. Layout collapses to a single 2-column
     * row when the picked role has scope (Role type | BU/Sector); single
     * column otherwise. No primary checkbox — server applies smart default
     * (first one of a scope = primary, else backup; admin swaps via star
     * later). No default role — admin picks explicitly.
     */
    _renderInitialRoleHtml: function() {
      var typeOptions = _buildGrantableRoleOptions(true);
      return (
        '<div class="users-slidein__form" style="margin-top:8px;">' +
          '<div class="users-slidein__field-group-label">Grant role · required</div>' +
          '<div class="users-form-row" id="addUserRoleRow">' +
            '<label class="users-slidein__field">' +
              '<span>Role</span>' +
              '<select id="addUserRoleType">' + typeOptions + '</select>' +
            '</label>' +
            '<label class="users-slidein__field hidden" id="addUserRoleScopeWrap">' +
              '<span id="addUserRoleScopeLabel">Scope</span>' +
              '<select id="addUserRoleScope"><option value="">— select —</option></select>' +
            '</label>' +
          '</div>' +
        '</div>'
      );
    },

    /**
     * Wire the role-type onchange so Scope appears only when needed, and
     * pre-fill BU/Sector based on the picked HC user's org code (the
     * common case is "review your own BU"). Manual mode has no picked
     * user, so no pre-fill there.
     */
    _wireInitialRoleSelector: function(body) {
      var typeSel = body.querySelector('#addUserRoleType');
      var scopeWrap = body.querySelector('#addUserRoleScopeWrap');
      var scopeLabel = body.querySelector('#addUserRoleScopeLabel');
      var scopeSel = body.querySelector('#addUserRoleScope');
      var roleRow = body.querySelector('#addUserRoleRow');
      if (!typeSel || !scopeWrap || !scopeSel) return;

      // Routing-dashboard prefill takes priority. When set, role + scope
      // are forced to the prefill values and locked (admin chose this CTA
      // explicitly; switching role here would defeat the context).
      var prefill = self._addUserPrefill;

      // Pre-fill from the picked HC user's BU + sector NAMES directly.
      // No prefix slicing — names are the canonical scope identifier.
      var picked = self._addUserPicked;
      var pickedBUName = (picked && picked.org && picked.org.businessUnit) || '';
      var pickedSectorName = (picked && picked.org && picked.org.sector) || '';

      // Apply prefill: force role select to the prefill value and disable
      // it so admin can't switch away from the routing CTA they invoked.
      if (prefill && prefill.roleType) {
        typeSel.value = prefill.roleType;
        typeSel.disabled = true;
      }

      function refresh() {
        var roleType = typeSel.value;
        var meta = ROLE_META[roleType] || {};
        if (roleType && meta.hasScope) {
          scopeWrap.classList.remove('hidden');
          if (roleRow) roleRow.classList.add('users-form-row--2col');
          if (roleType === 'bu_reviewer') {
            scopeLabel.textContent = 'Business unit';
            self._populateBUOptions(scopeSel, prefill && prefill.scope ? prefill.scope : pickedBUName);
            if (prefill && prefill.scope) {
              scopeSel.value = prefill.scope;
              scopeSel.disabled = true;
            } else if (pickedBUName && !scopeSel.value) {
              scopeSel.value = pickedBUName;
            }
          } else if (roleType === 'sector_override') {
            scopeLabel.textContent = 'Sector';
            self._populateSectorOptions(scopeSel, prefill && prefill.scope ? prefill.scope : pickedSectorName);
            if (prefill && prefill.scope) {
              scopeSel.value = prefill.scope;
              scopeSel.disabled = true;
            } else if (pickedSectorName && !scopeSel.value) {
              scopeSel.value = pickedSectorName;
            }
          }
        } else {
          scopeWrap.classList.add('hidden');
          if (roleRow) roleRow.classList.remove('users-form-row--2col');
        }
      }
      typeSel.addEventListener('change', refresh);
      refresh();
    },

    /**
     * Validate + collect the initial role. Scope holds the BU or sector
     * NAME (e.g. "Army" or "Sector 1"), preserving HC's casing. No
     * isPrimary in the payload — server applies smart default.
     */
    _collectInitialRole: function(body) {
      var typeSel = body.querySelector('#addUserRoleType');
      var scopeSel = body.querySelector('#addUserRoleScope');
      if (!typeSel) return null;
      var roleType = (typeSel.value || '').trim();
      if (!roleType) {
        self._showSlideinError('Pick a role to grant.');
        try { typeSel.focus(); } catch (e) {}
        return null;
      }
      var meta = ROLE_META[roleType] || {};
      var scope = '';
      if (meta.hasScope) {
        scope = ((scopeSel && scopeSel.value) || '').trim();
        if (!scope) {
          self._showSlideinError('Pick a ' + (roleType === 'bu_reviewer' ? 'business unit' : 'sector') + '.');
          try { scopeSel.focus(); } catch (e) {}
          return null;
        }
      }
      return { roleType: roleType, scope: scope };
    },

    // ---- STATE: manual ---------------------------------------------------

    _renderAddManualHtml: function() {
      return (
        '<div class="users-add">' +
          '<div class="users-slidein__form">' +
            '<label class="users-slidein__field">' +
              '<span>Name</span>' +
              '<input type="text" id="addUserName" placeholder="Jane Smith">' +
            '</label>' +
            '<label class="users-slidein__field">' +
              '<span>Email</span>' +
              '<input type="email" id="addUserEmail" placeholder="jane.smith@gsa.gov">' +
            '</label>' +
            // User_ID with non-editable ext_ prefix adornment. The input
            // value is just the slug (e.g. "smith"); the controller
            // prepends ext_ on submit.
            '<label class="users-slidein__field">' +
              '<span>User_ID</span>' +
              '<div class="users-input-with-prefix">' +
                '<span class="users-input-with-prefix__prefix">ext_</span>' +
                '<input type="text" id="addUserIdSlug" placeholder="smith" autocomplete="off">' +
              '</div>' +
              '<span class="users-slidein__hint">2–40 letters, numbers, hyphens or underscores. Used as the stable ID for manually added users.</span>' +
            '</label>' +
          '</div>' +

          this._renderInitialRoleHtml() +

          '<label class="users-slidein__field" style="margin-top:12px;">' +
            '<span>Notes</span>' +
            '<input type="text" id="addUserNotes" placeholder="e.g. Contractor on the QFAA project">' +
            '<span class="users-slidein__hint">Optional.</span>' +
          '</label>' +

          '<div class="users-add__footer">' +
            '<button type="button" class="users-btn" id="addUserBack"><i aria-hidden="true" class="fas fa-arrow-left"></i> Back to search</button>' +
            '<button type="button" class="users-btn users-btn--primary" id="addUserSubmit">' +
              '<i aria-hidden="true" class="fas fa-check"></i> Create user' +
            '</button>' +
          '</div>' +
        '</div>'
      );
    },

    _wireAddManual: function(body) {
      var backBtn = body.querySelector('#addUserBack');
      var submitBtn = body.querySelector('#addUserSubmit');
      var nameInp = body.querySelector('#addUserName');
      var emailInp = body.querySelector('#addUserEmail');
      var slugInp = body.querySelector('#addUserIdSlug');
      var notesInp = body.querySelector('#addUserNotes');

      if (backBtn) backBtn.addEventListener('click', function() {
        self._addUserState = 'search';
        self._renderAddUserView();
      });

      this._wireInitialRoleSelector(body);

      if (submitBtn) submitBtn.addEventListener('click', function() {
        var name = (nameInp.value || '').trim();
        var email = (emailInp.value || '').trim();
        var slug = (slugInp.value || '').trim();
        if (!name) { self._showSlideinError('Name required'); return; }
        if (!email) { self._showSlideinError('Email required'); return; }
        if (!/^[A-Za-z0-9_-]{2,40}$/.test(slug)) {
          self._showSlideinError('User_ID slug must be 2-40 letters, numbers, hyphens, or underscores.');
          return;
        }
        var role = self._collectInitialRole(body);
        if (!role) return; // _collectInitialRole already showed the error
        var notes = (notesInp && notesInp.value || '').trim();
        if (notes) role.notes = notes;
        var uid = 'ext_' + slug;
        self._submitAddUser({
          email: email,
          name: name,
          userIdOverride: uid,
          initialRole: role
        }, submitBtn);
      });
    },

    // ---- shared submit ---------------------------------------------------

    _submitAddUser: function(payload, submitBtn) {
      var origLabel = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i aria-hidden="true" class="fas fa-spinner fa-spin"></i> Creating…';
      }
      google.script.run
        .withSuccessHandler(function(res) {
          self._restoreSubmit(submitBtn, origLabel);
          if (!res || !res.success) {
            self._showSlideinError('Create failed: ' + (res && res.error));
            return;
          }
          // Use the server's response data directly to switch the slidein
          // into detail mode IMMEDIATELY. We don't wait for listTravelUsers
          // round-trip — the user object returned from addTravelUser has
          // everything _renderSlideinBody needs ({userId, email, name,
          // source, isActive, roles: []}). This makes the post-create
          // transition feel instant AND avoids the "stuck on create form"
          // case where _findUser couldn't locate the just-added user
          // because of a race or coercion issue.
          var newUser = res.data && res.data.user;
          if (!newUser || !newUser.userId) {
            self._showSlideinError('Create succeeded but server returned no user data — try refreshing.');
            return;
          }
          // Optimistically add to local list so the table reflects the new
          // row right away (sorted by name on next _render).
          self._users.push(newUser);
          self._users.sort(function(a, b) {
            return (a.name || a.email || '').localeCompare(b.name || b.email || '');
          });
          self._selectedUserId = newUser.userId;
          // Clear the routing-CTA prefill — the role has been created.
          self._addUserPrefill = null;
          self._renderSlideinHeader(newUser);
          self._renderSlideinBody(newUser);
          self._render();
          self._announceReassignment((res.data && res.data.reassignedCount) || 0, 'reassigned to new primary');
          // Background reconcile — picks up any other admins' concurrent
          // changes and refreshes our knownVersion to match the server.
          setTimeout(function() {
            google.script.run
              .withSuccessHandler(function(listRes) {
                if (!listRes || !listRes.success) return;
                self._users = (listRes.data && listRes.data.users) || [];
                if (listRes.data && listRes.data.version) self._knownVersion = listRes.data.version;
                self._render();
                // If the slidein still shows our new user, refresh its body
                // so any concurrent edits (someone added a role to them?)
                // appear without a manual refresh.
                var current = self._findUser(self._selectedUserId);
                if (current) {
                  self._renderSlideinHeader(current);
                  self._renderSlideinBody(current);
                }
              })
              .withFailureHandler(function() { /* harmless — user is in slidein */ })
              .listTravelUsers();
          }, 0);
        })
        .withFailureHandler(function(err) {
          self._restoreSubmit(submitBtn, origLabel);
          self._showSlideinError('Create failed: ' + (err && err.message));
        })
        .addTravelUser(payload);
    }
  };

  function _esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------------------------------------------------------------------------
  // ERROR / TOAST UI — replaces window.alert across the module.
  //   _showSlideinError → in-slidein banner above body content. Auto-fades.
  //   _showToast        → page-level toast bottom-right when slidein not open.
  // ---------------------------------------------------------------------------

  self._showSlideinError = function(message) {
    var body = document.getElementById('usersSlideinBody');
    if (!body) {
      self._showToast(message, 'error');
      return;
    }
    var banner = document.getElementById('usersSlideinError');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'usersSlideinError';
      banner.className = 'users-slidein__error';
      body.insertBefore(banner, body.firstChild);
    }
    banner.innerHTML =
      '<i aria-hidden="true" class="fas fa-exclamation-triangle"></i>' +
      '<span class="users-slidein__error-msg">' + _esc(message) + '</span>' +
      '<button type="button" class="users-slidein__error-close" aria-label="Dismiss">' +
        '<i aria-hidden="true" class="fas fa-times"></i>' +
      '</button>';
    banner.classList.add('users-slidein__error--visible');
    var closeBtn = banner.querySelector('.users-slidein__error-close');
    if (closeBtn) closeBtn.addEventListener('click', function() {
      banner.classList.remove('users-slidein__error--visible');
    });
    if (self._slideinErrorTimer) clearTimeout(self._slideinErrorTimer);
    self._slideinErrorTimer = setTimeout(function() {
      if (banner) banner.classList.remove('users-slidein__error--visible');
    }, 7000);
  };

  self._showToast = function(message, kind) {
    var holder = document.getElementById('usersToastHolder');
    if (!holder) {
      holder = document.createElement('div');
      holder.id = 'usersToastHolder';
      holder.className = 'users-toast-holder';
      // Mount on documentElement (the <html> root) instead of body so any
      // transform/filter on body or layout grid can't make our
      // position:fixed snap to a parent containing block.
      document.documentElement.appendChild(holder);
    }
    var toast = document.createElement('div');
    toast.className = 'users-toast users-toast--' + (kind || 'error');
    toast.innerHTML =
      '<i aria-hidden="true" class="fas ' + (kind === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle') + '"></i>' +
      '<span>' + _esc(message) + '</span>';
    holder.appendChild(toast);
    setTimeout(function() { toast.classList.add('users-toast--visible'); }, 16);
    setTimeout(function() {
      toast.classList.remove('users-toast--visible');
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
    }, 5000);
  };

  /**
   * Restore a submit button to its original label/disabled state. Use this
   * in EVERY success-with-error and failure handler — guarantees spinner
   * state never stays stuck on a failed write.
   */
  self._restoreSubmit = function(btn, origHtml) {
    if (!btn) return;
    btn.disabled = false;
    if (origHtml !== undefined && origHtml !== null) btn.innerHTML = origHtml;
  };

  window.TravelUsers.Controller = self;
})();
</script>
