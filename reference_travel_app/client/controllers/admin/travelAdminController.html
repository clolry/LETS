      var backdrop = document.getElementById('slideinBackdrop');
      var panel = document.getElementById('slideinPanel');
      var loadingEl = document.getElementById('slideinLoading');
      var contentEl = document.getElementById('slideinContent');

      if (backdrop) backdrop.classList.add('open');
      if (panel) panel.classList.add('open');
      if (loadingEl) loadingEl.classList.remove('hidden');
      if (contentEl) contentEl.classList.add('hidden');

      // Clear header
      var ridEl = document.getElementById('slideinRequestId');
      var tripEl = document.getElementById('slideinTripName');
      var subEl = document.getElementById('slideinSubmitter');
      if (ridEl) ridEl.textContent = requestId;
      if (tripEl) tripEl.textContent = 'Loading...';
      if (subEl) subEl.textContent = '';

      try {
        var result = await this._serverCall('getRequestSummary', requestId);

        if (!result || !result.success) {
          if (loadingEl) loadingEl.classList.add('hidden');
          if (contentEl) {
            contentEl.classList.remove('hidden');
            contentEl.innerHTML = '<div class="admin-empty" style="padding:var(--space-5);">' +
              '<i aria-hidden="true" class="fas fa-exclamation-triangle"></i>' +
              '<p>' + this._escapeHtml((result && result.error) || 'Failed to load request details') + '</p></div>';
          }
          return;
        }

        var rdata = result.data || {};
        var data = rdata.request || rdata;
        data.approvalLog = rdata.approvalLog || data.approvalLog || [];
        data.allClientPaid = rdata.allClientPaid === true;
        this._slideinData = data;
        this._renderSlideIn(data);

        if (loadingEl) loadingEl.classList.add('hidden');
        if (contentEl) contentEl.classList.remove('hidden');

      } catch (error) {
        console.error('Error loading request summary:', error);
        if (loadingEl) loadingEl.classList.add('hidden');
        if (contentEl) {
          contentEl.classList.remove('hidden');
          contentEl.innerHTML = '<div class="admin-empty" style="padding:var(--space-5);">' +
            '<i aria-hidden="true" class="fas fa-exclamation-triangle"></i>' +
            '<p>' + this._escapeHtml(error.message || 'Failed to load request') + '</p></div>';
        }
      }
    },

    _closeSlideIn() {
      var backdrop = document.getElementById('slideinBackdrop');
      var panel = document.getElementById('slideinPanel');
      if (backdrop) backdrop.classList.remove('open');
      if (panel) panel.classList.remove('open');
      this._slideinRequestId = null;
      this._slideinData = null;
    },

    _renderSlideIn(data) {
      var self = this;

      // Header
      var ridEl = document.getElementById('slideinRequestId');
      var tripEl = document.getElementById('slideinTripName');
      var subEl = document.getElementById('slideinSubmitter');

      if (ridEl) ridEl.textContent = data.requestId || '';
      if (tripEl) tripEl.textContent = data.tripName || 'Untitled';
      if (subEl) subEl.textContent = data.submitterName || '';

      var contentEl = document.getElementById('slideinContent');
      if (!contentEl) return;

      var statusDisplay = this._getStatusDisplay(data.status);
      var isTerminal = this._isTerminalStatus(data.status);
      var days = this._getDaysAtStage(data.updatedAt);
      var daysClass = this._getDaysClass(days);
      var travelChip = this._buildTravelChip(data.eventStartDate, data.eventEndDate);

      var html = '';

      // Status row
      html += '<div class="slidein__status-row">' +
        '<span class="status-badge status-badge--' + statusDisplay.class + '">' + statusDisplay.label + '</span>';
      // Days-at-stage is meaningless for terminal-state requests.
      if (!isTerminal) {
        html += '<span class="slidein__days-indicator days-cell--' + daysClass + '">' +
          '<i aria-hidden="true" class="fas fa-clock"></i> ' + days + ' days at stage' +
        '</span>';
      }
      if (travelChip) html += travelChip;
      html += '</div>';

      // Details grid
      var locationTypeLabels = {
        'client-site': 'Client Site',
        'conference': 'Conference',
        'contractor-site': 'Contractor Site',
        'teb': 'TEB',
        'other': 'Other'
      };
      var locationDisplay = locationTypeLabels[data.locationType] || data.locationType || data.locationDisplay || '';
      var travelDates = '';
      if (data.eventStartDate) {
        travelDates = this._formatDate(data.eventStartDate);
        if (data.eventEndDate) {
          travelDates += ' - ' + this._formatDate(data.eventEndDate);
        }
      }

      html += '<div class="slidein__details">' +
        '<div class="slidein__detail">' +
          '<div class="slidein__detail-label">Destination</div>' +
          '<div class="slidein__detail-value">' + this._escapeHtml(locationDisplay) + '</div>' +
        '</div>' +
        '<div class="slidein__detail">' +
          '<div class="slidein__detail-label">Travel Dates</div>' +
          '<div class="slidein__detail-value">' + (travelDates || 'Not set') + '</div>' +
        '</div>' +
        '<div class="slidein__detail">' +
          '<div class="slidein__detail-label">Amount</div>' +
          '<div class="slidein__detail-value">' + this._formatCurrency(data.grandTotal) + '</div>' +
        '</div>' +
        '<div class="slidein__detail">' +
          '<div class="slidein__detail-label">BU</div>' +
          '<div class="slidein__detail-value">' + this._escapeHtml(data.buCode || data.submitterBU || '') + '</div>' +
        '</div>' +
        '<div class="slidein__detail">' +
          '<div class="slidein__detail-label">Funding Source</div>' +
          '<div class="slidein__detail-value">' + this._escapeHtml(data.fundingSource || 'Overhead') + '</div>' +
        '</div>' +
        '<div class="slidein__detail">' +
          '<div class="slidein__detail-label">Travelers</div>' +
          '<div class="slidein__detail-value">' + (data.travelerCount || 1) + '</div>' +
        '</div>' +
      '</div>';

      // Denied/Cancelled callout — derive from approval log
      if (data.status === 'DENIED' || data.status === 'CANCELLED' || data.status === 'SUBMITTER_CANCELLED') {
        var log = data.approvalLog || [];
        var lastEntry = log.length > 0 ? log[log.length - 1] : null;
        var actionBy = lastEntry ? (lastEntry.actorName || lastEntry.actorEmail || 'Unknown') : 'Unknown';
        var actionAt = lastEntry ? lastEntry.timestamp : '';
        var actionReason = lastEntry ? (lastEntry.notes || lastEntry.comments || '') : '';

        if (data.status === 'DENIED') {
          html += '<div class="slidein__callout slidein__callout--denied">' +
            '<div class="slidein__callout-title"><i aria-hidden="true" class="fas fa-ban"></i> Denied</div>' +
            '<div class="slidein__callout-text">' +
              'By: ' + this._escapeHtml(actionBy) +
              (actionAt ? ' on ' + this._formatDate(actionAt) : '') +
            '</div>' +
            (actionReason ?
              '<div class="slidein__callout-text" style="margin-top:4px;">' +
                this._escapeHtml(actionReason) +
              '</div>' : '') +
          '</div>';
        } else {
          html += '<div class="slidein__callout slidein__callout--cancelled">' +
            '<div class="slidein__callout-title"><i aria-hidden="true" class="fas fa-times-circle"></i> Cancelled</div>' +
            '<div class="slidein__callout-text">' +
              'By: ' + this._escapeHtml(actionBy) +
              (actionAt ? ' on ' + this._formatDate(actionAt) : '') +
            '</div>' +
            (actionReason ?
              '<div class="slidein__callout-text" style="margin-top:4px;">' +
                this._escapeHtml(actionReason) +
              '</div>' : '') +
          '</div>';
        }
      }

      // Approval Timeline
      html += this._renderApprovalTimeline(data);

      contentEl.innerHTML = html;
    },

    _renderApprovalTimeline(data) {
      var self = this;
      var approvalLog = data.approvalLog || [];
      var currentStatus = data.status || '';

      // Define approval stages — hide FAS for client-paid requests
      var isClientPaid = data.allClientPaid === true;
      var stages = [
        { status: 'PENDING_SECTOR', label: 'Sector Review' },
        { status: 'PENDING_BU', label: 'BU Review' },
        { status: 'PENDING_OSO', label: 'AAS FO Review' }
      ];
      if (!isClientPaid) {
        stages.push({ status: 'PENDING_FAS', label: 'FAS Review' });
      }

      // Order of statuses for timeline
      var statusOrder = isClientPaid
        ? ['PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'APPROVED_GOGOV', 'COMPLETED']
        : ['PENDING_SECTOR', 'PENDING_BU', 'PENDING_OSO', 'PENDING_FAS', 'APPROVED_GOGOV', 'COMPLETED'];
      var currentIdx = statusOrder.indexOf(currentStatus);

      var html = '<div class="slidein__timeline-title">Approval Timeline</div>';
      html += '<div class="approval-timeline">';

      // Render each stage
      stages.forEach(function(stage, idx) {
        var stageIdx = statusOrder.indexOf(stage.status);
        var stepClass = '';
        var dotContent = '';
        var actionText = stage.label;
        var actorText = '';
        var dateText = '';

        // Find matching log entry
        var logEntry = null;
        for (var i = 0; i < approvalLog.length; i++) {
          var entry = approvalLog[i];
          if (entry.previousStatus === stage.status || entry.prevStatus === stage.status) {
            logEntry = entry;
            break;
          }
        }

        if (currentStatus === 'DENIED' && logEntry && (logEntry.action === 'DENY' || logEntry.newStatus === 'DENIED')) {
          // Denied at this stage
          stepClass = 'timeline-step--denied';
          dotContent = '<i aria-hidden="true" class="fas fa-times"></i>';
          actionText = 'Denied at ' + stage.label;
          actorText = logEntry.actorName || logEntry.reviewerName || '';
          dateText = logEntry.timestamp ? self._formatDate(logEntry.timestamp) : '';
        } else if (stageIdx < currentIdx || currentStatus === 'APPROVED_GOGOV' || currentStatus === 'COMPLETED') {
          // Completed stage
          if (logEntry) {
            stepClass = 'timeline-step--completed';
            dotContent = '<i aria-hidden="true" class="fas fa-check"></i>';
            actionText = stage.label + ' Approved';
            actorText = logEntry.actorName || logEntry.reviewerName || '';
            dateText = logEntry.timestamp ? self._formatDate(logEntry.timestamp) : '';
          } else if (stageIdx < currentIdx) {
            stepClass = 'timeline-step--completed';
            dotContent = '<i aria-hidden="true" class="fas fa-check"></i>';
            actionText = stage.label + ' Approved';
          }
        } else if (stageIdx === currentIdx || currentStatus === stage.status) {
          // Current stage
          stepClass = 'timeline-step--current';
          dotContent = '<i aria-hidden="true" class="fas fa-hourglass-half"></i>';
          actionText = 'Awaiting ' + stage.label;
          actorText = data.currentReviewerName ? 'Awaiting review by ' + self._escapeHtml(data.currentReviewerName) + '...' : 'Awaiting reviewer assignment...';
        }
        // Future stage: default styling (empty dot)

        html += '<div class="timeline-step ' + stepClass + '">' +
          '<div class="timeline-step__dot">' + dotContent + '</div>' +
          '<div class="timeline-step__content">' +
            '<div class="timeline-step__action">' + self._escapeHtml(actionText) + '</div>' +
            (actorText ? '<div class="timeline-step__actor">' + self._escapeHtml(actorText) + '</div>' : '') +
            (dateText ? '<div class="timeline-step__date">' + dateText + '</div>' : '');

        // Show note if there's a comment
        if (logEntry && (logEntry.notes || logEntry.comments)) {
          html += '<div class="timeline-step__note">' + self._escapeHtml(logEntry.notes || logEntry.comments) + '</div>';
        }

        html += '</div></div>';
      });

      // Add final "Approved" step if applicable
      if (currentStatus === 'APPROVED_GOGOV' || currentStatus === 'COMPLETED') {
        html += '<div class="timeline-step timeline-step--completed">' +
          '<div class="timeline-step__dot"><i aria-hidden="true" class="fas fa-check"></i></div>' +
          '<div class="timeline-step__content">' +
            '<div class="timeline-step__action">Approved</div>' +
          '</div>' +
        '</div>';
      }

      html += '</div>';
      return html;
    },

    // =========================================================================
    // BULK SELECTION & DELETE
    // =========================================================================

    _setupBulkActions() {
      var self = this;

      var selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) {
        selectAllCb.addEventListener('change', function() {
          var checkboxes = document.querySelectorAll('#requestsTableBody .row-checkbox');
          checkboxes.forEach(function(cb) {
            cb.checked = selectAllCb.checked;
            var rid = cb.dataset.rid;
            var row = cb.closest('tr');
            if (selectAllCb.checked) {
              self._bulkSelectedIds.add(rid);
              if (row) row.classList.add('is-selected');
            } else {
              self._bulkSelectedIds.delete(rid);
              if (row) row.classList.remove('is-selected');
            }
          });
          self._updateBulkActionBar();
        });
      }

      // Deselect-all is handled by the table header's selectAllCheckbox
      // (toggling it off clears the selection), so we no longer need a
      // separate button in the bulk action bar.

      var bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
      if (bulkDeleteBtn) {
        bulkDeleteBtn.addEventListener('click', function() {
          if (self._bulkSelectedIds.size > 0) {
            self.promptDeleteRequests(Array.from(self._bulkSelectedIds));
          }
        });
      }
    },

    _updateBulkActionBar() {
      var bar = document.getElementById('bulkActionBar');
      var countEl = document.getElementById('bulkSelectedCount');
      var selectAllCb = document.getElementById('selectAllCheckbox');

      var count = this._bulkSelectedIds ? this._bulkSelectedIds.size : 0;

      if (bar) {
        if (count > 0) {
          bar.classList.remove('hidden');
        } else {
          bar.classList.add('hidden');
        }
      }

      if (countEl) {
        countEl.textContent = count;
      }

      // Update Select All checkbox state
      if (selectAllCb) {
        var totalCheckboxes = document.querySelectorAll('#requestsTableBody .row-checkbox').length;
        if (totalCheckboxes === 0 || count === 0) {
          selectAllCb.checked = false;
          selectAllCb.indeterminate = false;
        } else if (count === totalCheckboxes) {
          selectAllCb.checked = true;
          selectAllCb.indeterminate = false;
        } else {
          selectAllCb.checked = false;
          selectAllCb.indeterminate = true;
        }
      }
    },

    promptDeleteRequests(requestIds) {
      var self = this;

      var modal = new bootstrap.Modal(document.getElementById('deleteRequestModal'));
      var loadingEl = document.getElementById('deletePreviewLoading');
      var contentEl = document.getElementById('deletePreviewContent');
      var errorEl = document.getElementById('deletePreviewError');
      var confirmBtn = document.getElementById('deleteConfirmBtn');

      // Store the IDs for confirmation step
      this._deleteRequestIds = requestIds;

      // Reset modal state
      if (loadingEl) loadingEl.classList.remove('hidden');
      if (contentEl) contentEl.classList.add('hidden');
      if (errorEl) errorEl.classList.add('hidden');
      if (confirmBtn) confirmBtn.disabled = true;

      modal.show();

      // Fetch preview
      this._serverCall('getDeletePreview', requestIds)
        .then(function(result) {
          if (loadingEl) loadingEl.classList.add('hidden');

          if (!result || !result.success) {
            if (errorEl) {
              errorEl.classList.remove('hidden');
              var errMsg = document.getElementById('deletePreviewErrorMsg');
              if (errMsg) errMsg.textContent = (result && result.error) || 'Failed to load preview';
            }
            return;
          }

          var p = (result.data && result.data.preview) || {};

          // Populate request summaries
          var reqList = document.getElementById('deletePreviewRequests');
          if (reqList) {
            var html = '';
            (p.requestSummaries || []).forEach(function(r) {
              var statusDisplay = self._getStatusDisplay(r.status);
              html += '<div class="delete-preview__request-item">' +
                '<code>' + self._escapeHtml(r.requestId) + '</code>' +
                '<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + self._escapeHtml(r.tripName) + '</span>' +
                '<span class="status-badge status-badge--' + statusDisplay.class + '">' + statusDisplay.label + '</span>' +
              '</div>';
            });
            reqList.innerHTML = html;
          }

          // Populate row counts
          document.getElementById('dpCountRequests').textContent = p.requests;
          document.getElementById('dpCountLegs').textContent = p.requestLegs;
          document.getElementById('dpCountTravelers').textContent = p.requestTravelers;
          document.getElementById('dpCountCosts').textContent = p.travelerLegCosts;
          document.getElementById('dpCountAttachments').textContent = p.attachments;
          document.getElementById('dpCountLog').textContent = p.approvalLog;
          document.getElementById('dpCountTotal').textContent = p.totalRows;

          // Show/hide Drive folder option
          var driveEl = document.getElementById('deletePreviewDrive');
          if (driveEl) {
            if (p.attachmentFolders && p.attachmentFolders.length > 0) {
              driveEl.classList.remove('hidden');
            } else {
              driveEl.classList.add('hidden');
            }
          }

          if (contentEl) contentEl.classList.remove('hidden');
          if (confirmBtn) confirmBtn.disabled = false;
        })
        .catch(function(error) {
          if (loadingEl) loadingEl.classList.add('hidden');
          if (errorEl) {
            errorEl.classList.remove('hidden');
            var errMsg = document.getElementById('deletePreviewErrorMsg');
            if (errMsg) errMsg.textContent = error.message || 'Failed to load preview';
          }
        });
    },

    async confirmDeleteRequests() {
      var self = this;
      var requestIds = this._deleteRequestIds;
      if (!requestIds || requestIds.length === 0) return;

      var driveCb = document.getElementById('deleteTrashDriveFolder');
      var trashDrive = driveCb ? driveCb.checked : false;

      var confirmBtn = document.getElementById('deleteConfirmBtn');
      this._setSaveButtonLoading(confirmBtn, true);

      try {
        var result = await this._serverCall('deleteTravelRequests', requestIds, trashDrive);

        if (result && result.success) {
          // Close modal
          var modalEl = document.getElementById('deleteRequestModal');
          var modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();

          this._showToast('Success', (result.data && result.data.message) || 'Requests deleted', 'success');

          // Clear bulk selection
          this._bulkSelectedIds.clear();
          this._updateBulkActionBar();

          // Remove from local dataset and re-render
          this._removeLocalRequests(requestIds);

          // Refresh dashboard if it was loaded (stats are now stale)
          this._dashboardLoaded = false;
          if (this._currentView === 'dashboard') {
            this.refreshDashboard();
          }
        } else {
          this._showToast('Error', (result && result.error) || 'Failed to delete requests', 'error');
        }
      } catch (error) {
        console.error('Error deleting requests:', error);
        this._showToast('Error', error.message || 'Failed to delete requests', 'error');
      } finally {
        this._setSaveButtonLoading(confirmBtn, false);
      }
    },

    // =========================================================================
    // ADMIN ACTIONS (Override / Reassign)
    // =========================================================================

    /**
     * Show a small action menu anchored beneath a row's kebab button.
     * One menu DOM at a time; spawned on demand, torn down on close.
     */
    _openActionMenu(triggerBtn) {
      var self = this;
      this._closeActionMenu();

      var rid = triggerBtn.dataset.rid;
      var status = triggerBtn.dataset.status;
      var reviewer = triggerBtn.dataset.reviewer;
      var isTerminal = triggerBtn.dataset.terminal === '1';
      var rect = triggerBtn.getBoundingClientRect();

      var menu = document.createElement('div');
      menu.className = 'action-menu';
      menu.setAttribute('role', 'menu');
      // Terminal requests (Approved/Completed/Denied/Cancelled) collapse
      // to View only — Override Status and Reassign Reviewer don't apply
      // once the request is finalized. If admin truly needs to revive a
      // terminal request, they can do it from the full review page.
      var menuHtml = '<button type="button" class="action-menu__item" data-act="view">' +
        '<i aria-hidden="true" class="fas fa-eye"></i><span>View Request</span>' +
      '</button>';
      if (!isTerminal) {
        menuHtml +=
          '<button type="button" class="action-menu__item" data-act="override">' +
            '<i aria-hidden="true" class="fas fa-exchange-alt"></i><span>Override Status</span>' +
          '</button>' +
          '<button type="button" class="action-menu__item" data-act="reassign">' +
            '<i aria-hidden="true" class="fas fa-user-edit"></i><span>Reassign Reviewer</span>' +
          '</button>';
      }
      menu.innerHTML = menuHtml;

      // Position fixed beneath the trigger, right-aligned to it.
      menu.style.position = 'fixed';
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.right = (window.innerWidth - rect.right) + 'px';
      menu.style.zIndex = '9999';

      document.body.appendChild(menu);
      this._activeActionMenu = menu;
      triggerBtn.setAttribute('aria-expanded', 'true');
      this._activeActionTrigger = triggerBtn;

      menu.querySelectorAll('.action-menu__item').forEach(function(item) {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          var act = item.dataset.act;
          self._closeActionMenu();
          if (act === 'view') {
            window.TravelAdmin.navigateTo('review', { requestId: rid });
          } else if (act === 'override') {
            self.showOverrideModal(rid, status);
          } else if (act === 'reassign') {
            self.showReassignModal(rid, reviewer);
          }
        });
      });

      // Close on outside click / Escape. Defer the click listener to
      // the next tick so the spawning click doesn't immediately close.
      setTimeout(function() {
        self._actionMenuOutsideClick = function(e) {
          if (!menu.contains(e.target)) self._closeActionMenu();
        };
        self._actionMenuKeyHandler = function(e) {
          if (e.key === 'Escape') self._closeActionMenu();
        };
        document.addEventListener('click', self._actionMenuOutsideClick);
        document.addEventListener('keydown', self._actionMenuKeyHandler);
      }, 0);
    },

    _closeActionMenu() {
      if (this._activeActionMenu) {
        this._activeActionMenu.remove();
        this._activeActionMenu = null;
      }
      if (this._activeActionTrigger) {
        this._activeActionTrigger.setAttribute('aria-expanded', 'false');
        this._activeActionTrigger = null;
      }
      if (this._actionMenuOutsideClick) {
        document.removeEventListener('click', this._actionMenuOutsideClick);
        this._actionMenuOutsideClick = null;
      }
      if (this._actionMenuKeyHandler) {
        document.removeEventListener('keydown', this._actionMenuKeyHandler);
        this._actionMenuKeyHandler = null;
      }
    },

    showOverrideModal(requestId, currentStatus) {
      var ridEl = document.getElementById('overrideRequestId');
      var curEl = document.getElementById('overrideCurrentStatus');
      var newEl = document.getElementById('overrideNewStatus');
      var reasonEl = document.getElementById('overrideReason');

      if (ridEl) ridEl.value = requestId || '';
      if (curEl) curEl.value = currentStatus || '';
      if (newEl) newEl.value = '';
      if (reasonEl) reasonEl.value = '';

      // Hide "Pending FAS" option for client-paid requests
      var fasOption = newEl ? newEl.querySelector('option[value="PENDING_FAS"]') : null;
      if (fasOption) {
        var isClientPaid = this._slideinData && this._slideinRequestId === requestId && this._slideinData.allClientPaid === true;
        fasOption.style.display = isClientPaid ? 'none' : '';
        fasOption.disabled = isClientPaid;
      }

      var modal = new bootstrap.Modal(document.getElementById('overrideStatusModal'));
      modal.show();
    },

    async submitOverrideStatus() {
      var requestId = document.getElementById('overrideRequestId').value;
      var newStatus = document.getElementById('overrideNewStatus').value;
      var reason = document.getElementById('overrideReason').value.trim();

      if (!newStatus) {
        this._showToast('Validation', 'Please select a new status', 'error');
        return;
      }
      if (!reason) {
        this._showToast('Validation', 'Reason is required', 'error');
        return;
      }

      var btn = document.querySelector('#overrideStatusModal .btn-primary');
      this._setSaveButtonLoading(btn, true);

      try {
        var result = await this._serverCall('adminOverrideStatus', requestId, newStatus, reason);

        if (result && result.success) {
          bootstrap.Modal.getInstance(document.getElementById('overrideStatusModal')).hide();
          this._showToast('Success', (result.data && result.data.message) || 'Status overridden', 'success');
          // Patch local data instead of full reload
          this._patchLocalRequest(requestId, { status: newStatus });
          this._dashboardLoaded = false; // Stats are stale
          if (this._currentView === 'dashboard') this.refreshDashboard();
        } else {
          this._showToast('Error', (result && result.error) || 'Failed to override status', 'error');
        }
      } catch (error) {
        console.error('Error overriding status:', error);
        this._showToast('Error', error.message || 'Failed to override status', 'error');
      } finally {
        this._setSaveButtonLoading(btn, false);
      }
    },

    showReassignModal(requestId, currentReviewer) {
      var ridEl = document.getElementById('reassignRequestId');
      var curEl = document.getElementById('reassignCurrentReviewer');
      var newEl = document.getElementById('reassignNewEmail');
      var reasonEl = document.getElementById('reassignReason');

      if (ridEl) ridEl.value = requestId || '';
      if (curEl) curEl.value = currentReviewer || 'None';
      if (newEl) newEl.value = '';
      if (reasonEl) reasonEl.value = '';

      var modal = new bootstrap.Modal(document.getElementById('reassignModal'));
      modal.show();
    },

    async submitReassign() {
      var requestId = document.getElementById('reassignRequestId').value;
      var newEmail = document.getElementById('reassignNewEmail').value.trim();
      var reason = document.getElementById('reassignReason').value.trim();

      if (!newEmail) {
        this._showToast('Validation', 'Please enter a new reviewer email', 'error');
        return;
      }
      if (!reason) {
        this._showToast('Validation', 'Reason is required', 'error');
        return;
      }

      var btn = document.querySelector('#reassignModal .btn-primary');
      this._setSaveButtonLoading(btn, true);

      try {
        var result = await this._serverCall('adminReassignReviewer', requestId, newEmail, reason);

        if (result && result.success) {
          bootstrap.Modal.getInstance(document.getElementById('reassignModal')).hide();
          this._showToast('Success', (result.data && result.data.message) || 'Reviewer reassigned', 'success');
          // Patch local data instead of full reload
          this._patchLocalRequest(requestId, {
            currentReviewerEmail: newEmail,
            currentReviewerName: newEmail // Server may return proper name — use email as fallback
          });
          this._dashboardLoaded = false;
          if (this._currentView === 'dashboard') this.refreshDashboard();
        } else {
          this._showToast('Error', (result && result.error) || 'Failed to reassign', 'error');
        }
      } catch (error) {
        console.error('Error reassigning:', error);
        this._showToast('Error', error.message || 'Failed to reassign', 'error');
      } finally {
        this._setSaveButtonLoading(btn, false);
      }
    },

    // =========================================================================
    // REVIEWERS MANAGEMENT (Phase 5)
    // =========================================================================

    // --- Subtab switching (Reviewers | Admin Access) ---

    // --- Save button spinner helpers ---

    _setSaveButtonLoading(btnSelector, loading) {
      var btn = typeof btnSelector === 'string'
        ? document.querySelector(btnSelector)
        : btnSelector;
      if (!btn) return;

      if (loading) {
        btn.classList.add('btn--saving');
        btn.dataset.originalText = btn.innerHTML;
        var btnText = btn.textContent.trim().toLowerCase();
        var label = (btnText.indexOf('delete') >= 0) ? 'Deleting...' : 'Saving...';
        btn.innerHTML = label;
      } else {
        btn.classList.remove('btn--saving');
        if (btn.dataset.originalText) {
          btn.innerHTML = btn.dataset.originalText;
          delete btn.dataset.originalText;
        }
      }
    },

    async _loadReports() {
      var self = this;

      // Wire subview tabs (Quick Reports / Data Export / Feedback).
      this._setupReportTabs();

      // Populate BU + Status filter dropdowns from server.
      try {
        var opts = await this._serverCall('reportGetFilterOptions');
        if (opts && opts.success) {
          var optsData = opts.data || {};
          // Column catalog is owned by the server (Reporting.js _RB_FIELD_CATALOG)
          // and delivered on this same call — no separate round-trip. Adopt it
          // before _initReportBuilder() builds the picker below.
          if (optsData.catalog && optsData.catalog.length) {
            self._RB_FIELD_CATALOG = optsData.catalog;
          }
          var buSelect = document.getElementById('rbFilterBU');
          if (buSelect) {
            buSelect.innerHTML = '<option value="">All BUs</option>';
            (optsData.buList || []).forEach(function(bu) {
              buSelect.innerHTML += '<option value="' + self._escapeHtml(bu) + '">' + self._escapeHtml(bu) + '</option>';
            });
          }
          var statusSelect = document.getElementById('rbFilterStatus');
          if (statusSelect) {
            statusSelect.innerHTML = '<option value="">All Statuses</option>';
            (optsData.statusList || []).forEach(function(st) {
              var display = self._getStatusDisplay(st);
              statusSelect.innerHTML += '<option value="' + self._escapeHtml(st) + '">' + self._escapeHtml(display.label) + '</option>';
            });
          }
        }
      } catch (error) {
        console.error('Error loading report filter options:', error);
        this._showToast('Error', 'Failed to load report filters', 'error');
      }

      // Bring up the Data Export builder UI (picker, columns, flatpickr).
      this._initReportBuilder();

      // Load user-saved presets — renders the bookmark cards in Quick Reports.
      await this._rbLoadPresets();

      this._reportsLoaded = true;
    },

    _setupReportTabs() {
      var self = this;
      var tabContainer = document.getElementById('reportTabs');
      if (!tabContainer) return;

      tabContainer.querySelectorAll('.report-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          var viewName = tab.dataset.reportView;
          if (!viewName) return;

          tabContainer.querySelectorAll('.report-tab').forEach(function(t) {
            t.classList.remove('report-tab--active');
          });
          tab.classList.add('report-tab--active');

          var quickEl = document.getElementById('quickReportsSubview');
          var exportEl = document.getElementById('dataExportSubview');
          var feedbackEl = document.getElementById('feedbackSubview');

          if (quickEl) quickEl.classList.toggle('hidden', viewName !== 'quickReports');
          if (exportEl) exportEl.classList.toggle('hidden', viewName !== 'dataExport');
          if (feedbackEl) feedbackEl.classList.toggle('hidden', viewName !== 'feedback');

          if (viewName === 'feedback' && !self._feedbackLoaded) {
            self._loadFeedbackEntries();
          }

          self._reportSubview = viewName;
        });
      });
    },

    async _loadFeedbackEntries() {
      var loadingEl = document.getElementById('feedbackLoading');
      var emptyEl = document.getElementById('feedbackEmpty');
      var listEl = document.getElementById('feedbackList');
      var emptyText = document.getElementById('feedbackEmptyText');

      this._wireFeedbackToolbar();

      if (loadingEl) loadingEl.classList.remove('hidden');
      if (emptyEl) emptyEl.classList.add('hidden');
      if (listEl) listEl.innerHTML = '';

      try {
        // Fetch the full set once (no type filter) — type/text filtering is
        // applied client-side for instant chip + search response.
        var result = await this._serverCall('getRecentFeedback', { limit: 500, type: '' });
        if (loadingEl) loadingEl.classList.add('hidden');

        var entries = (result && result.success && result.data && Array.isArray(result.data.feedback))
          ? result.data.feedback : [];

        this._feedbackEntries = entries;
        this._feedbackLoaded = true;
        this._renderFeedbackStats();
        this._renderFeedbackList();

        if (!entries.length) {
          if (emptyText) emptyText.textContent = 'No feedback entries yet.';
          if (emptyEl) emptyEl.classList.remove('hidden');
        }
      } catch (error) {
        if (loadingEl) loadingEl.classList.add('hidden');
        if (emptyText) emptyText.textContent = 'Error loading feedback.';
        if (emptyEl) emptyEl.classList.remove('hidden');
        console.error('Error loading feedback:', error);
      }
    },

    _wireFeedbackToolbar() {
      if (this._feedbackToolbarWired) return;
      var self = this;

      var chips = document.getElementById('feedbackChips');
      if (chips) {
        chips.addEventListener('click', function(e) {
          var btn = e.target.closest('.feedback-chip');
          if (!btn) return;
          self._feedbackTypeFilter = btn.dataset.type || '';
          chips.querySelectorAll('.feedback-chip').forEach(function(c) {
            c.classList.toggle('feedback-chip--active', c === btn);
          });
          self._renderFeedbackList();
        });
      }

      var search = document.getElementById('feedbackSearch');
      if (search) {
        var debounce;
        search.addEventListener('input', function() {
          clearTimeout(debounce);
          debounce = setTimeout(function() {
            self._feedbackSearch = (search.value || '').trim().toLowerCase();
            self._renderFeedbackList();
          }, 120);
        });
      }

      var refresh = document.getElementById('feedbackRefreshBtn');
      if (refresh) {
        refresh.addEventListener('click', function() {
          self._loadFeedbackEntries();
        });
      }

      var list = document.getElementById('feedbackList');
      if (list) {
        list.addEventListener('click', function(e) {
          // Don't collapse the card if the user is selecting text (e.g.
          // dragging across the request ID code block to copy it).
          if (window.getSelection && window.getSelection().toString()) return;
          var card = e.target.closest('.feedback-card');
          if (!card) return;
          card.classList.toggle('feedback-card--expanded');
          var commentEl = card.querySelector('.feedback-card__comment');
          var expandEl = card.querySelector('.feedback-card__expand');
          if (commentEl && commentEl.dataset.clampable === '1') {
            commentEl.classList.toggle('feedback-card__comment--clamped');
          }
          if (expandEl) {
            expandEl.textContent = card.classList.contains('feedback-card--expanded') ? 'Show less' : 'Show more';
          }
        });
      }

      this._feedbackToolbarWired = true;
    },

    _renderFeedbackStats() {
      var statsEl = document.getElementById('feedbackStats');
      if (!statsEl) return;

      var counts = { thumbs_up: 0, thumbs_down: 0, nps: 0, bug_report: 0, feature_request: 0 };
      var npsSum = 0;
      var npsCount = 0;

      this._feedbackEntries.forEach(function(fb) {
        var t = fb.Feedback_Type;
        if (counts[t] !== undefined) counts[t]++;
        if (t === 'nps' && fb.NPS_Score !== '' && fb.NPS_Score != null) {
          var n = Number(fb.NPS_Score);
          if (!isNaN(n)) { npsSum += n; npsCount++; }
        }
      });

      var avgNps = npsCount ? (npsSum / npsCount).toFixed(1) : '—';
      var total = this._feedbackEntries.length;

      statsEl.innerHTML =
        this._feedbackStatCard('total', 'fa-comments', total, 'Total') +
        this._feedbackStatCard('up',    'fa-thumbs-up', counts.thumbs_up, 'Thumbs Up') +
        this._feedbackStatCard('down',  'fa-thumbs-down', counts.thumbs_down, 'Thumbs Down') +
        this._feedbackStatCard('bug',   'fa-bug', counts.bug_report, 'Bug Reports') +
        this._feedbackStatCard('feat',  'fa-lightbulb', counts.feature_request, 'Features') +
        this._feedbackStatCard('nps',   'fa-chart-line', avgNps, 'Avg NPS (' + npsCount + ')');

      // Update chip counts
      var chips = document.getElementById('feedbackChips');
      if (chips) {
        chips.querySelectorAll('.feedback-chip__count').forEach(function(el) {
          var key = el.getAttribute('data-count-for') || '';
          el.textContent = key === '' ? total : (counts[key] || 0);
        });
      }
    },

    _feedbackStatCard(variant, icon, value, label) {
      return '<div class="feedback-stat">' +
        '<div class="feedback-stat__icon feedback-stat__icon--' + variant + '"><i aria-hidden="true" class="fas ' + icon + '"></i></div>' +
        '<div class="feedback-stat__body">' +
          '<div class="feedback-stat__value">' + this._escapeHtml(value) + '</div>' +
          '<div class="feedback-stat__label">' + this._escapeHtml(label) + '</div>' +
        '</div>' +
      '</div>';
    },

    _renderFeedbackList() {
      var listEl = document.getElementById('feedbackList');
      var emptyEl = document.getElementById('feedbackEmpty');
      var emptyText = document.getElementById('feedbackEmptyText');
      var metaEl = document.getElementById('feedbackMeta');
      if (!listEl) return;

      var self = this;
      var type = this._feedbackTypeFilter;
      var q = this._feedbackSearch;

      var filtered = this._feedbackEntries.filter(function(fb) {
        if (type && fb.Feedback_Type !== type) return false;
        if (q) {
          var hay = ((fb.Comment || '') + ' ' + (fb.User_Name || '') + ' ' + (fb.User_Email || '')).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      if (metaEl) {
        var total = this._feedbackEntries.length;
        metaEl.textContent = filtered.length === total
          ? 'Showing ' + total + ' ' + (total === 1 ? 'entry' : 'entries')
          : 'Showing ' + filtered.length + ' of ' + total + ' entries';
      }

      if (!filtered.length) {
        listEl.innerHTML = '';
        if (emptyEl) {
          if (emptyText) {
            emptyText.textContent = this._feedbackEntries.length
              ? 'No feedback matches the current filters.'
              : 'No feedback entries yet.';
          }
          emptyEl.classList.remove('hidden');
        }
        return;
      }

      if (emptyEl) emptyEl.classList.add('hidden');

      listEl.innerHTML = filtered.map(function(fb) {
        return self._feedbackCardHtml(fb);
      }).join('');
    },

    _feedbackCardHtml(fb) {
      var self = this;
      var type = fb.Feedback_Type || '';
      var typeLabels = {
        thumbs_up: { icon: 'fa-thumbs-up', label: 'Thumbs Up' },
        thumbs_down: { icon: 'fa-thumbs-down', label: 'Thumbs Down' },
        nps: { icon: 'fa-chart-line', label: 'NPS' },
        bug_report: { icon: 'fa-bug', label: 'Bug Report' },
        feature_request: { icon: 'fa-lightbulb', label: 'Feature Request' }
      };
      var typeInfo = typeLabels[type] || { icon: 'fa-comment', label: type };

      var name = fb.User_Name || '';
      var email = fb.User_Email || '';
      var userBlock = name
        ? '<div class="feedback-card__user">' + self._escapeHtml(name) +
            (email ? ' <span class="feedback-card__user-email">&lt;' + self._escapeHtml(email) + '&gt;</span>' : '') +
          '</div>'
        : '<div class="feedback-card__user">' + self._escapeHtml(email || 'Anonymous') + '</div>';

      var whenStr = self._formatFeedbackWhen(fb.Timestamp);

      var npsBlock = '';
      if (type === 'nps' && fb.NPS_Score !== '' && fb.NPS_Score != null) {
        var n = Number(fb.NPS_Score);
        if (!isNaN(n)) {
          var npsClass = n >= 9 ? 'promoter' : (n >= 7 ? 'passive' : 'detractor');
          npsBlock = '<div class="feedback-card__nps feedback-card__nps--' + npsClass + '" title="NPS score">' + n + '</div>';
        }
      }

      var comment = fb.Comment || '';
      var commentBlock;
      if (comment) {
        var clampable = comment.length > 240 || (comment.match(/\n/g) || []).length >= 3;
        commentBlock = '<div class="feedback-card__comment' + (clampable ? ' feedback-card__comment--clamped' : '') +
          '" data-clampable="' + (clampable ? '1' : '0') + '">' + self._escapeHtml(comment) + '</div>' +
          (clampable ? '<span class="feedback-card__expand">Show more</span>' : '');
      } else {
        commentBlock = '<div class="feedback-card__comment-empty">(no comment)</div>';
      }

      var metaItems = [];
      if (fb.Context_Page) {
        metaItems.push('<span class="feedback-card__meta-item"><i aria-hidden="true" class="fas fa-file-lines"></i>Page: <span class="feedback-card__meta-value">' + self._escapeHtml(fb.Context_Page) + '</span></span>');
      }
      if (fb.Context_Action) {
        metaItems.push('<span class="feedback-card__meta-item"><i aria-hidden="true" class="fas fa-bolt"></i>Action: <span class="feedback-card__meta-value">' + self._escapeHtml(fb.Context_Action) + '</span></span>');
      }
      if (fb.Request_ID) {
        metaItems.push('<span class="feedback-card__meta-item"><i aria-hidden="true" class="fas fa-hashtag"></i>Request: <span class="feedback-card__meta-value"><code>' + self._escapeHtml(fb.Request_ID) + '</code></span></span>');
      }
      if (fb.Category) {
        metaItems.push('<span class="feedback-card__meta-item"><i aria-hidden="true" class="fas fa-tag"></i>' + self._escapeHtml(fb.Category) + '</span>');
      }
      var metaBlock = metaItems.length
        ? '<div class="feedback-card__meta">' + metaItems.join('') + '</div>'
        : '';

      var detailRows = [];
      if (fb.Page_URL) {
        detailRows.push('<div class="feedback-card__detail-row"><span class="feedback-card__detail-label">URL</span><span class="feedback-card__detail-value">' + self._escapeHtml(fb.Page_URL) + '</span></div>');
      }
      if (fb.Browser_Info) {
        detailRows.push('<div class="feedback-card__detail-row"><span class="feedback-card__detail-label">Browser</span><span class="feedback-card__detail-value">' + self._escapeHtml(fb.Browser_Info) + '</span></div>');
      }
      if (fb.Feedback_ID) {
        detailRows.push('<div class="feedback-card__detail-row"><span class="feedback-card__detail-label">ID</span><span class="feedback-card__detail-value"><code>' + self._escapeHtml(fb.Feedback_ID) + '</code></span></div>');
      }
      var detailBlock = detailRows.length
        ? '<div class="feedback-card__detail">' + detailRows.join('') + '</div>'
        : '';

      return '<div class="feedback-card">' +
        '<div class="feedback-card__head">' +
          '<span class="feedback-card__badge feedback-card__badge--' + self._escapeHtml(type) + '">' +
            '<i aria-hidden="true" class="fas ' + typeInfo.icon + '"></i>' + self._escapeHtml(typeInfo.label) +
          '</span>' +
          userBlock +
          '<div class="feedback-card__head-spacer"></div>' +
          npsBlock +
          '<span class="feedback-card__when" title="' + self._escapeHtml(fb.Timestamp || '') + '">' + self._escapeHtml(whenStr) + '</span>' +
        '</div>' +
        commentBlock +
        metaBlock +
        detailBlock +
      '</div>';
    },

    _formatFeedbackWhen(tsStr) {
      if (!tsStr) return '';
      var d = new Date(tsStr);
      if (isNaN(d.getTime())) return '';
      var now = Date.now();
      var diffMs = now - d.getTime();
      var diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      var diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hour ago' : ' hours ago');
      var diffDay = Math.floor(diffHr / 24);
      if (diffDay < 7) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    },

    async runPresetReport(type, btnElement) {
      var card = btnElement ? btnElement.closest('.report-card') : null;
      var periodSelect = card ? card.querySelector('.report-card__period') : null;
      var period = periodSelect ? periodSelect.value : '30d';
      var config = { type: type, filters: { period: period } };

      var loadingEl = document.getElementById('reportLoading');
      if (loadingEl) loadingEl.classList.remove('hidden');

      try {
        var result = await this._serverCall('reportExportToSheets', config);
        if (!result || !result.success) {
          this._showToast('Error', (result && result.error) || 'Failed to generate report', 'error');
          return;
        }
        if (result.data && result.data.spreadsheetUrl) window.open(result.data.spreadsheetUrl, '_blank');
        this._showToast('Success', 'Report exported to Google Sheets', 'success');
      } catch (error) {
        console.error('Error exporting to Sheets:', error);
        this._showToast('Error', error.message || 'Failed to export report', 'error');
      } finally {
        if (loadingEl) loadingEl.classList.add('hidden');
      }
    },

    // =========================================================================
    // REPORT BUILDER — Initialization
    // =========================================================================

    _initReportBuilder() {
      var self = this;

      // Set default columns
      this._rbColumns = this._RB_DEFAULT_COLUMNS.slice();
      this._rbFilters = {};

      // Render picker
      this._renderPickerCategories();

      // Render selected list
      this._renderSelectedColumns();

      // Initialize flatpickr on date range
      var dateEl = document.getElementById('rbFilterDateRange');
      if (dateEl && typeof flatpickr !== 'undefined') {
        flatpickr(dateEl, {
          mode: 'range',
          dateFormat: 'Y-m-d',
          onChange: function() { self._onRbFiltersChange(); }
        });
      }

      // Bind filter change events
      var statusEl = document.getElementById('rbFilterStatus');
      if (statusEl) {
        statusEl.addEventListener('change', function() { self._onRbFiltersChange(); });
      }

      var buEl = document.getElementById('rbFilterBU');
      if (buEl) {
        buEl.addEventListener('change', function() { self._onRbFiltersChange(); });
      }

      // Bind search
      var searchEl = document.getElementById('rbPickerSearch');
      if (searchEl) {
        searchEl.addEventListener('input', function() {
          self._filterPickerSearch(searchEl.value);
        });
      }

      // Initial preview fetch
      this._fetchPreviewData();
    },

    // =========================================================================
    // REPORT BUILDER — Column Picker
    // =========================================================================

    _renderPickerCategories() {
      var self = this;
      var container = document.getElementById('rbPickerCategories');
      if (!container) return;

      var html = '';
      this._RB_FIELD_CATALOG.forEach(function(cat, catIdx) {
        var totalFields = cat.fields.length;
        var commonFields = cat.fields.filter(function(f) { return f.common; });
        var advancedFields = cat.fields.filter(function(f) { return !f.common; });
        var selectedInCat = cat.fields.filter(function(f) { return self._rbColumns.indexOf(f.key) >= 0; }).length;
        var allSelected = selectedInCat === totalFields;
        var expanded = catIdx === 0;

        html += '<div class="rb-category' + (expanded ? ' rb-category--expanded' : '') + '" data-cat="' + catIdx + '">';
        html += '<div class="rb-category__header" role="button" tabindex="0" aria-expanded="' + (expanded ? 'true' : 'false') + '" onclick="TravelAdmin.Controller._toggleCategory(' + catIdx + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}">';
        html += '<i aria-hidden="true" class="fas fa-chevron-right rb-category__chevron"></i>';
        html += '<span class="rb-category__name">' + self._escapeHtml(cat.category) + '</span>';
        html += '<span class="rb-category__count">(' + totalFields + ')</span>';
        html += '<input type="checkbox" class="rb-category__select-all" ' +
                (allSelected ? 'checked' : '') +
                ' onclick="event.stopPropagation(); TravelAdmin.Controller._toggleCategoryAll(' + catIdx + ', this.checked)">';
        html += '</div>';
        html += '<div class="rb-category__body">';

        commonFields.forEach(function(field) {
          var checked = self._rbColumns.indexOf(field.key) >= 0;
          html += '<div class="rb-field' + (checked ? ' rb-field--checked' : '') + '" data-key="' + field.key + '">';
          html += '<input type="checkbox" ' + (checked ? 'checked' : '') +
                  ' onclick="TravelAdmin.Controller._toggleColumn(\'' + field.key + '\')">';
          html += '<span class="rb-field__label">' + self._escapeHtml(field.label) + '</span>';
          html += '</div>';
        });

        advancedFields.forEach(function(field) {
          var checked = self._rbColumns.indexOf(field.key) >= 0;
          html += '<div class="rb-field rb-field--advanced' + (checked ? ' rb-field--checked' : '') + '" data-key="' + field.key + '">';
          html += '<input type="checkbox" ' + (checked ? 'checked' : '') +
                  ' onclick="TravelAdmin.Controller._toggleColumn(\'' + field.key + '\')">';
          html += '<span class="rb-field__label">' + self._escapeHtml(field.label) + '</span>';
          html += '</div>';
        });

        if (advancedFields.length > 0) {
          html += '<span class="rb-category__show-more" role="button" tabindex="0" onclick="TravelAdmin.Controller._toggleShowMore(' + catIdx + ', this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}">Show ' + advancedFields.length + ' more</span>';
        }

        html += '</div></div>';
      });

      container.innerHTML = html;
    },

    _toggleCategory(catIdx) {
      var catEl = document.querySelector('.rb-category[data-cat="' + catIdx + '"]');
      if (catEl) catEl.classList.toggle('rb-category--expanded');
    },

    _toggleCategoryAll(catIdx, checked) {
      var self = this;
      var cat = this._RB_FIELD_CATALOG[catIdx];
      if (!cat) return;

      cat.fields.forEach(function(field) {
        var idx = self._rbColumns.indexOf(field.key);
        if (checked && idx < 0) {
          self._rbColumns.push(field.key);
        } else if (!checked && idx >= 0) {
          self._rbColumns.splice(idx, 1);
        }
      });

      this._renderPickerCategories();
      this._renderSelectedColumns();
      this._onRbColumnsChange();
    },

    _toggleShowMore(catIdx, linkEl) {
      var catEl = document.querySelector('.rb-category[data-cat="' + catIdx + '"]');
      if (!catEl) return;

      var isShowing = catEl.classList.toggle('rb-category--show-more');
      var advancedCount = this._RB_FIELD_CATALOG[catIdx].fields.filter(function(f) { return !f.common; }).length;
      if (linkEl) {
        linkEl.textContent = isShowing ? 'Show fewer' : 'Show ' + advancedCount + ' more';
      }
    },

    _toggleColumn(key) {
      var idx = this._rbColumns.indexOf(key);
      if (idx >= 0) {
        this._rbColumns.splice(idx, 1);
      } else {
        this._rbColumns.push(key);
      }

      var fieldEl = document.querySelector('.rb-field[data-key="' + key + '"]');
      if (fieldEl) {
        var cb = fieldEl.querySelector('input[type="checkbox"]');
        if (cb) cb.checked = (idx < 0);
        fieldEl.classList.toggle('rb-field--checked', idx < 0);
      }

      this._updateCategorySelectAll(key);
      this._renderSelectedColumns();
      this._onRbColumnsChange();
    },

    _updateCategorySelectAll(key) {
      var self = this;
      for (var c = 0; c < this._RB_FIELD_CATALOG.length; c++) {
        var cat = this._RB_FIELD_CATALOG[c];
        var hasKey = cat.fields.some(function(f) { return f.key === key; });
        if (!hasKey) continue;

        var allChecked = cat.fields.every(function(f) { return self._rbColumns.indexOf(f.key) >= 0; });
        var catEl = document.querySelector('.rb-category[data-cat="' + c + '"]');
        if (catEl) {
          var selectAllCb = catEl.querySelector('.rb-category__select-all');
          if (selectAllCb) selectAllCb.checked = allChecked;
        }
        break;
      }
    },

    _removeColumn(key) {
      var idx = this._rbColumns.indexOf(key);
      if (idx >= 0) this._rbColumns.splice(idx, 1);

      var fieldEl = document.querySelector('.rb-field[data-key="' + key + '"]');
      if (fieldEl) {
        var cb = fieldEl.querySelector('input[type="checkbox"]');
        if (cb) cb.checked = false;
        fieldEl.classList.remove('rb-field--checked');
      }

      this._updateCategorySelectAll(key);
      this._renderSelectedColumns();
      this._onRbColumnsChange();
    },

    _rbClearAll() {
      this._rbColumns = [];
      this._renderPickerCategories();
      this._renderSelectedColumns();
      this._onRbColumnsChange();
    },

    _filterPickerSearch(query) {
      query = (query || '').toLowerCase().trim();
      var allFieldEls = document.querySelectorAll('.rb-field');

      allFieldEls.forEach(function(el) {
        var key = el.dataset.key;
        var label = el.querySelector('.rb-field__label');
        var text = label ? label.textContent.toLowerCase() : '';

        if (!query || text.indexOf(query) >= 0 || key.toLowerCase().indexOf(query) >= 0) {
          el.classList.remove('rb-field--hidden');
        } else {
          el.classList.add('rb-field--hidden');
        }
      });

      var categories = document.querySelectorAll('.rb-category');
      categories.forEach(function(cat) {
        if (query) {
          cat.classList.add('rb-category--expanded');
          cat.classList.add('rb-category--show-more');
        }
      });
    },

    // =========================================================================
    // REPORT BUILDER — Selected Columns List (with drag & drop)
    // =========================================================================

    _renderSelectedColumns() {
      var self = this;
      var container = document.getElementById('rbSelectedList');
      var emptyEl = document.getElementById('rbSelectedEmpty');
      var countEl = document.getElementById('rbSelectedCount');

      if (countEl) {
        var totalFields = 0;
        this._RB_FIELD_CATALOG.forEach(function(c) { totalFields += c.fields.length; });
        countEl.textContent = this._rbColumns.length + ' of ' + totalFields + ' columns selected';
      }

      if (this._rbColumns.length === 0) {
        if (container) container.innerHTML = '';
        if (emptyEl) emptyEl.classList.remove('hidden');
        return;
      }

      if (emptyEl) emptyEl.classList.add('hidden');

      var labelMap = {};
      this._RB_FIELD_CATALOG.forEach(function(cat) {
        cat.fields.forEach(function(f) { labelMap[f.key] = f.label; });
      });

      var html = '';
      this._rbColumns.forEach(function(key, idx) {
        html += '<div class="rb-selected__item" draggable="true" data-idx="' + idx + '" data-key="' + key + '">' +
          '<span class="rb-selected__handle"><i aria-hidden="true" class="fas fa-grip-vertical"></i></span>' +
          '<span class="rb-selected__name">' + self._escapeHtml(labelMap[key] || key) + '</span>' +
          '<button class="rb-selected__remove" onclick="TravelAdmin.Controller._removeColumn(\'' + key + '\')" title="Remove">' +
            '<i aria-hidden="true" class="fas fa-times"></i>' +
          '</button>' +
        '</div>';
      });

      if (container) {
        container.innerHTML = html;

        container.querySelectorAll('.rb-selected__item').forEach(function(item) {
          item.addEventListener('dragstart', function(e) { self._onDragStart(e); });
          item.addEventListener('dragover', function(e) { self._onDragOver(e); });
          item.addEventListener('drop', function(e) { self._onDrop(e); });
          item.addEventListener('dragend', function(e) { self._onDragEnd(e); });
        });
      }
    },

    _onDragStart(e) {
      var item = e.target.closest('.rb-selected__item');
      if (!item) return;
      this._rbDragIdx = parseInt(item.dataset.idx);
      item.classList.add('rb-dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.idx);
    },

    _onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var item = e.target.closest('.rb-selected__item');
      if (!item) return;

      document.querySelectorAll('.rb-drag-over').forEach(function(el) {
        el.classList.remove('rb-drag-over');
      });
      item.classList.add('rb-drag-over');
    },

    _onDrop(e) {
      e.preventDefault();
      var item = e.target.closest('.rb-selected__item');
      if (!item) return;

      var fromIdx = this._rbDragIdx;
      var toIdx = parseInt(item.dataset.idx);

      if (fromIdx === null || fromIdx === toIdx) return;

      var moved = this._rbColumns.splice(fromIdx, 1)[0];
      this._rbColumns.splice(toIdx, 0, moved);

      this._renderSelectedColumns();
      this._onRbColumnsChange();
    },

    _onDragEnd(e) {
      this._rbDragIdx = null;
      document.querySelectorAll('.rb-dragging, .rb-drag-over').forEach(function(el) {
        el.classList.remove('rb-dragging', 'rb-drag-over');
      });
    },

    // =========================================================================
    // REPORT BUILDER — Filters + Preview
    // =========================================================================

    _onRbColumnsChange() {
      this._renderPreviewFromCache();
    },

    _onRbFiltersChange() {
      var self = this;

      var previewEl = document.getElementById('rbPreview');
      if (previewEl) previewEl.classList.add('rb-preview--stale');

      clearTimeout(this._rbPreviewTimer);
      this._rbPreviewTimer = setTimeout(function() {
        self._fetchPreviewData();
      }, 800);
    },

    _getRbFilters() {
      var filters = {};

      var dateEl = document.getElementById('rbFilterDateRange');
      if (dateEl && dateEl._flatpickr) {
        var dates = dateEl._flatpickr.selectedDates;
        if (dates.length >= 1) filters.dateFrom = dates[0].toISOString().split('T')[0];
        if (dates.length >= 2) filters.dateTo = dates[1].toISOString().split('T')[0];
      }

      var statusEl = document.getElementById('rbFilterStatus');
      if (statusEl && statusEl.value) filters.status = statusEl.value;

      var buEl = document.getElementById('rbFilterBU');
      if (buEl && buEl.value) filters.bu = buEl.value;

      return filters;
    },

    async _fetchPreviewData() {
      var self = this;
      var filters = this._getRbFilters();
      this._rbFilters = filters;

      try {
        var result = await this._serverCall('reportBuilderPreview', { filters: filters });

        if (result && result.success) {
          // Cache stores the unwrapped data, not the envelope — keeps the
          // _renderPreviewFromCache reads (cache.totalCount / cache.rows / etc)
          // identical to the pre-envelope shape.
          this._rbPreviewCache = result.data || {};
          this._renderPreviewFromCache();
        } else {
          console.error('Preview failed:', result && result.error);
          this._showToast('Error', (result && result.error) || 'Failed to load preview', 'error');
        }
      } catch (error) {
        console.error('Error fetching preview:', error);
        this._showToast('Error', error.message || 'Failed to load preview', 'error');
      }

      var previewEl = document.getElementById('rbPreview');
      if (previewEl) previewEl.classList.remove('rb-preview--stale');
    },

    _renderPreviewFromCache() {
      var cache = this._rbPreviewCache;
      var columns = this._rbColumns;

      var emptyEl = document.getElementById('rbPreviewEmpty');
      var tableWrap = document.getElementById('rbPreviewTableWrap');
      var countEl = document.getElementById('rbPreviewCount');
      var headEl = document.getElementById('rbPreviewHead');
      var bodyEl = document.getElementById('rbPreviewBody2');

      if (!cache || columns.length === 0) {
        if (emptyEl) emptyEl.classList.remove('hidden');
        if (tableWrap) tableWrap.classList.add('hidden');
        if (countEl) countEl.textContent = '';

        if (columns.length === 0 && emptyEl) {
          emptyEl.innerHTML = '<i aria-hidden="true" class="fas fa-columns"></i><p>Select columns from the picker to build your export</p>';
        }
        return;
      }

      if (emptyEl) emptyEl.classList.add('hidden');
      if (tableWrap) tableWrap.classList.remove('hidden');

      if (countEl) {
        countEl.textContent = cache.totalCount + ' rows match';
      }

      var allKeys = cache.allColumnKeys || [];
      var colIndices = [];
      var labels = {};
      this._RB_FIELD_CATALOG.forEach(function(cat) {
        cat.fields.forEach(function(f) { labels[f.key] = f.label; });
      });

      columns.forEach(function(key) {
        var idx = allKeys.indexOf(key);
        if (idx >= 0) colIndices.push({ key: key, idx: idx });
      });

      var headerHtml = '<tr>';
      colIndices.forEach(function(ci) {
        headerHtml += '<th>' + (labels[ci.key] || ci.key) + '</th>';
      });
      headerHtml += '</tr>';
      if (headEl) headEl.innerHTML = headerHtml;

      var bodyHtml = '';
      if (cache.rows.length === 0) {
        bodyHtml = '<tr><td colspan="' + colIndices.length + '" style="text-align:center; padding:var(--space-3); color:var(--color-slate-400);">' +
          'No requests match your current filters</td></tr>';
      } else {
        cache.rows.forEach(function(row) {
          bodyHtml += '<tr>';
          colIndices.forEach(function(ci) {
            var val = row[ci.idx];
            if (val === null || val === undefined) val = '';
            bodyHtml += '<td>' + String(val) + '</td>';
          });
          bodyHtml += '</tr>';
        });
      }
      if (bodyEl) bodyEl.innerHTML = bodyHtml;
    },

    // =========================================================================
    // REPORT BUILDER — Export
    // =========================================================================

    async _rbExportSheets() {
      if (this._rbColumns.length === 0) {
        this._showToast('Validation', 'Select at least one column before exporting', 'error');
        return;
      }

      var btn = document.getElementById('rbExportBtn');
      if (btn) this._setSaveButtonLoading(btn, true);

      var loadingEl = document.getElementById('reportLoading');
      if (loadingEl) loadingEl.classList.remove('hidden');

      try {
        var config = {
          columns: this._rbColumns,
          filters: this._getRbFilters()
        };

        var result = await this._serverCall('reportBuilderExport', config);

        if (!result || !result.success) {
          this._showToast('Error', (result && result.error) || 'Failed to export', 'error');
          return;
        }

        if (result.data && result.data.spreadsheetUrl) window.open(result.data.spreadsheetUrl, '_blank');
        this._showToast('Success', 'Report exported to Google Sheets', 'success');
      } catch (error) {
        console.error('Error exporting:', error);
        this._showToast('Error', error.message || 'Failed to export', 'error');
      } finally {
        if (btn) this._setSaveButtonLoading(btn, false);
        if (loadingEl) loadingEl.classList.add('hidden');
      }
    },

    // =========================================================================
    // REPORT BUILDER — Presets
    // =========================================================================

    async _rbSavePreset() {
      if (this._rbColumns.length === 0) {
        this._showToast('Validation', 'Select at least one column before saving', 'error');
        return;
      }

      var name = prompt('Enter a name for this preset:');
      if (!name || !name.trim()) return;
      name = name.trim();

      var btn = document.getElementById('rbSavePresetBtn');
      if (btn) this._setSaveButtonLoading(btn, true);

      try {
        var preset = {
          name: name,
          columns: this._rbColumns.slice(),
          filters: this._getRbFilters()
        };

        var result = await this._serverCall('reportBuilderSavePreset', preset);

        if (result && result.success) {
          this._showToast('Success', 'Preset "' + name + '" saved', 'success');
          this._rbLoadPresets();
        } else {
          this._showToast('Error', (result && result.error) || 'Failed to save preset', 'error');
        }
      } catch (error) {
        console.error('Error saving preset:', error);
        this._showToast('Error', error.message || 'Failed to save preset', 'error');
      } finally {
        if (btn) this._setSaveButtonLoading(btn, false);
      }
    },

    async _rbLoadPresets() {
      try {
        var result = await this._serverCall('reportBuilderGetPresets');
        if (result && result.success) {
          this._rbPresets = (result.data && result.data.presets) || [];
          this._renderPresetCards();
        }
      } catch (error) {
        console.error('Error loading presets:', error);
        this._showToast('Error', 'Failed to load saved presets', 'error');
      }
    },

    _renderPresetCards() {
      var self = this;
      var container = document.getElementById('reportCards');
      if (!container) return;

      // Remove previously-appended user preset cards
      container.querySelectorAll('.report-card--user-preset').forEach(function(el) { el.remove(); });

      if (this._rbPresets.length === 0) return;

      this._rbPresets.forEach(function(preset) {
        var card = document.createElement('div');
        card.className = 'report-card report-card--user-preset';
        card.style.cursor = 'pointer';
        card.innerHTML =
          '<div class="report-card__icon"><i aria-hidden="true" class="fas fa-bookmark"></i></div>' +
          '<div class="report-card__content">' +
            '<div class="report-card__title">' + self._escapeHtml(preset.name) + '</div>' +
            '<div class="report-card__desc">' +
              (preset.columns ? preset.columns.length + ' columns' : '') +
              (preset.createdAt ? ' &middot; ' + preset.createdAt : '') +
            '</div>' +
            '<div class="report-card__controls">' +
              '<div class="report-card__actions">' +
                '<button class="btn btn-primary btn-sm rb-preset-open">Open in Builder</button>' +
                '<button class="btn btn-outline-danger btn-sm rb-preset-delete" title="Delete" aria-label="Delete preset"><i class="fas fa-trash-alt" aria-hidden="true"></i></button>' +
              '</div>' +
            '</div>' +
          '</div>';

        card.querySelector('.rb-preset-open').addEventListener('click', function(e) {
          e.stopPropagation();
          self._rbApplyPreset(preset);
        });

        card.querySelector('.rb-preset-delete').addEventListener('click', function(e) {
          e.stopPropagation();
          self._rbDeletePreset(preset.name);
        });

        container.appendChild(card);
      });
    },

    _rbApplyPreset(preset) {
      this._rbColumns = (preset.columns || []).slice();
      var filters = preset.filters || {};

      var dateEl = document.getElementById('rbFilterDateRange');
      if (dateEl && dateEl._flatpickr) {
        if (filters.dateFrom && filters.dateTo) {
          dateEl._flatpickr.setDate([filters.dateFrom, filters.dateTo]);
        } else {
          dateEl._flatpickr.clear();
        }
      }

      var statusEl = document.getElementById('rbFilterStatus');
      if (statusEl) statusEl.value = filters.status || '';

      var buEl = document.getElementById('rbFilterBU');
      if (buEl) buEl.value = filters.bu || '';

      this._renderPickerCategories();
      this._renderSelectedColumns();

      // Switch to Data Export tab
      var tabContainer = document.getElementById('reportTabs');
      if (tabContainer) {
        tabContainer.querySelectorAll('.report-tab').forEach(function(t) {
          t.classList.remove('report-tab--active');
          if (t.dataset.reportView === 'dataExport') t.classList.add('report-tab--active');
        });
      }
      var quickEl = document.getElementById('quickReportsSubview');
      var exportEl = document.getElementById('dataExportSubview');
      var feedbackEl = document.getElementById('feedbackSubview');
      if (quickEl) quickEl.classList.add('hidden');
      if (exportEl) exportEl.classList.remove('hidden');
      if (feedbackEl) feedbackEl.classList.add('hidden');
      this._reportSubview = 'dataExport';

      this._fetchPreviewData();
    },

    async _rbDeletePreset(name) {
      if (!confirm('Delete preset "' + name + '"?')) return;

      try {
        var result = await this._serverCall('reportBuilderDeletePreset', name);
        if (result && result.success) {
          this._showToast('Success', 'Preset deleted', 'success');
          this._rbLoadPresets();
        } else {
          this._showToast('Error', (result && result.error) || 'Failed to delete preset', 'error');
        }
      } catch (error) {
        console.error('Error deleting preset:', error);
        this._showToast('Error', error.message || 'Failed to delete', 'error');
      }
    },

    // =========================================================================
    // UTILITIES
    // =========================================================================

    /**
     * Wraps google.script.run in a Promise
     */
    _serverCall(functionName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);
        runner[functionName].apply(runner, args);
      });
    },

    /**
     * DOM-based HTML escaping for XSS prevention
     */
    _escapeHtml(text) {
      if (!text && text !== 0) return '';
      var div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    },

    /**
     * Format currency as USD with 0 decimals
     */
    _formatCurrency(amount) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(amount || 0);
    },

    /**
     * Format a duration in days with a unit-aware shape.
     *   < 24 hours → hours (e.g. 0.7 days → "16.8h")
     *   ≥ 24 hours → days  (e.g. 1.2 days → "1.2d")
     *   0 / falsy  → dashes
     *
     * Returns { value, unit, short, full }:
     *   value  — bare number string ("16.8" / "1.2")
     *   unit   — "hours" / "days" (long form, for stat-card subtitles)
     *   short  — number + single-letter unit ("16.8h" / "1.2d") for chart
     *            legends + table cells
     *   full   — number + long unit ("16.8 hours" / "1.2 days")
     */
    _formatReviewDuration(days) {
      var n = parseFloat(days) || 0;
      if (n <= 0) return { value: '0', unit: 'days', short: '—', full: '—' };
      if (n < 1) {
        var hrs = Math.round(n * 24 * 10) / 10;
        var hStr = (hrs < 10 ? hrs.toFixed(1) : Math.round(hrs).toString());
        return { value: hStr, unit: 'hours', short: hStr + 'h', full: hStr + (hrs === 1 ? ' hour' : ' hours') };
      }
      var dStr = n.toFixed(1);
      return { value: dStr, unit: 'days', short: dStr + 'd', full: dStr + (n === 1 ? ' day' : ' days') };
    },

    /**
     * Format date string to short "Jan 15" format
     */
    _formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      } catch (e) {
        return '';
      }
    },

    /**
     * Get display label and CSS class for a status code
     */
    _getStatusDisplay(status) {
      var statusMap = {
        'PENDING_SECTOR': { label: 'Sector Review', class: 'pending' },
        'PENDING_BU': { label: 'BU Review', class: 'pending' },
        'PENDING_OSO': { label: 'AAS FO Review', class: 'pending-oso' },
        'PENDING_FAS': { label: 'FAS Review', class: 'pending-oso' },
        'NEEDS_INFO_SECTOR': { label: 'Needs Info', class: 'needs-info' },
        'NEEDS_INFO_BU': { label: 'Needs Info', class: 'needs-info' },
        'NEEDS_INFO_OSO': { label: 'Needs Info', class: 'needs-info' },
        'APPROVED_GOGOV': { label: 'Approved', class: 'approved' },
        'Pending_Correction': { label: 'Correction', class: 'pending' },
        'Pending_DD_Confirmation': { label: 'DD Confirm', class: 'pending' },
        'COMPLETED': { label: 'Completed', class: 'completed' },
        'DENIED': { label: 'Denied', class: 'denied' },
        'CANCELLED': { label: 'Cancelled', class: 'cancelled' },
        'SUBMITTER_CANCELLED': { label: 'Cancelled', class: 'cancelled' }
      };
      return statusMap[status] || { label: status || 'Unknown', class: 'pending' };
    },

    /**
     * Whether a status is "terminal" — request has been finalized and
     * is no longer moving through the pipeline. Used to suppress
     * fields that don't apply (Days at Stage, active Reviewer) and
     * to limit the action menu to View-only.
     */
    _isTerminalStatus(status) {
      return status === 'APPROVED_GOGOV'
          || status === 'COMPLETED'
          || status === 'DENIED'
          || status === 'CANCELLED'
          || status === 'SUBMITTER_CANCELLED';
    },

    /**
     * Calculate days at current stage from updatedAt date string
     */
    _getDaysAtStage(updatedAt) {
      if (!updatedAt) return 0;
      try {
        var updated = new Date(updatedAt);
        if (isNaN(updated.getTime())) return 0;
        var now = new Date();
        var diff = (now - updated) / (1000 * 60 * 60 * 24);
        return Math.round(diff);
      } catch (e) {
        return 0;
      }
    },

    /**
     * Get CSS class based on days at stage
     * < 2 = ok, 2-4 = warn, >= 5 = critical
     */
    _getDaysClass(days) {
      if (days < 2) return 'ok';
      if (days < 5) return 'warn';
      return 'critical';
    },

    /**
     * Calculate days until travel start date
     * Returns null if no date or date is in the past
     */
    _calcDaysUntilTravel(eventStartDate) {
      if (!eventStartDate) return null;
      try {
        var start = new Date(eventStartDate);
        if (isNaN(start.getTime())) return null;
        var now = new Date();
        now.setHours(0, 0, 0, 0);
        start.setHours(0, 0, 0, 0);
        var diff = (start - now) / (1000 * 60 * 60 * 24);
        return Math.round(diff);
      } catch (e) {
        return null;
      }
    },

    /**
     * Build the travel-status chip for the slide-in panel.
     * Returns chip HTML for upcoming-soon / today / currently-traveling
     * trips, or '' when the trip is too far out, already done, or
     * undated. Mirrors the helper on the reviewer dashboard so the
     * panel reads identically for an admin viewing a request and a BU
     * lead viewing the same one in their Action Center.
     */
    _buildTravelChip(eventStartDate, eventEndDate) {
      if (!eventStartDate) return '';
      var daysUntil = this._calcDaysUntilTravel(eventStartDate);
      if (daysUntil === null) return '';

      if (daysUntil < 0 && eventEndDate) {
        var end = new Date(eventEndDate);
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        end.setHours(0, 0, 0, 0);
        if (!isNaN(end.getTime()) && end >= today) {
          return '<span class="slidein__urgent-tag slidein__urgent-tag--current"><i aria-hidden="true" class="fas fa-plane"></i> Currently traveling</span>';
        }
        return '';
      }
      if (daysUntil < 0) return '';
      if (daysUntil === 0) return '<span class="slidein__urgent-tag"><i aria-hidden="true" class="fas fa-bolt"></i> Travel today</span>';
      if (daysUntil <= 10) return '<span class="slidein__urgent-tag"><i aria-hidden="true" class="fas fa-bolt"></i> Travel in ' + daysUntil + ' day' + (daysUntil === 1 ? '' : 's') + '</span>';
      return '';
    },

    /**
     * Show a toast notification using travel-toast pattern from base styles
     * Creates a DOM element, auto-removes after 4s
     */
    _showToast(title, message, type) {
      type = type || 'info';

      // Remove any existing toasts
      document.querySelectorAll('.travel-toast').forEach(function(t) { t.remove(); });

      var iconMap = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
      };

      var toast = document.createElement('div');
      toast.className = 'travel-toast travel-toast--' + type;
      toast.innerHTML = '<i aria-hidden="true" class="fas ' + (iconMap[type] || iconMap.info) + '"></i>' +
        '<span><strong>' + this._escapeHtml(title) + '</strong> ' + this._escapeHtml(message) + '</span>';

      var container = document.getElementById('adminToastContainer');
      if (container) {
        container.appendChild(toast);
      } else {
        document.body.appendChild(toast);
      }

      // Trigger show animation
      requestAnimationFrame(function() {
        toast.classList.add('show');
      });

      // Auto-remove after 4 seconds
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
      }, 4000);
    }

  }; // End Controller

})();
</script>
