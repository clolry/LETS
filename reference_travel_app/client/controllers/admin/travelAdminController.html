<!-- Controller for the Travel Admin Console -->
<script>
(function() {
  'use strict';

  window.TravelAdmin = window.TravelAdmin || {};

  // Store the script URL (set during init)
  window.TravelAdmin._scriptUrl = '';

  /**
   * Navigate to a different mode in the travel app
   * @param {string} mode - The mode to navigate to ('travel', 'form', 'review', 'admin')
   * @param {Object} params - Additional URL parameters
   */
  window.TravelAdmin.navigateTo = function(mode, params = {}) {
    const queryParams = new URLSearchParams();
    queryParams.set('mode', mode);

    Object.keys(params).forEach(key => {
      if (params[key]) {
        queryParams.set(key, params[key]);
      }
    });

    let baseUrl = window.TravelAdmin._scriptUrl;
    if (!baseUrl) {
      try {
        const topUrl = window.top.location.href;
        baseUrl = topUrl.split('?')[0];
      } catch (e) {
        console.error('Cannot determine script URL');
        return;
      }
    }

    safeTopNavigate(baseUrl + '?' + queryParams.toString());
  };

  /**
   * Admin Dashboard Controller
   */
  window.TravelAdmin.Controller = {

    // =========================================================================
    // STATE
    // =========================================================================

    _userEmail: '',
    _userName: '',
    _scriptUrl: '',

    _currentView: 'dashboard',

    // Data caches
    _dashboardStats: null,
    _actionCenterData: null,
    _metricsData: null,
    _requests: [],
    _buCodes: [],

    // Flags for lazy loading
    _dashboardLoaded: false,
    _requestsLoaded: false,
    _reportsLoaded: false,
    _feedbackLoaded: false,
    _feedbackEntries: [],
    _feedbackTypeFilter: '',
    _feedbackSearch: '',
    _feedbackToolbarWired: false,
    _reportSubview: 'quickReports',

    // Report builder state
    // Field catalog — single source of truth is the SERVER-side _RB_FIELD_CATALOG
    // (Reporting.js). It's delivered via reportGetFilterOptions when the Data
    // Export view opens (no extra round-trip) and adopted before the picker
    // builds. Starts empty so there's no second copy to keep in sync.
    _RB_FIELD_CATALOG: [],
    _RB_DEFAULT_COLUMNS: [
      'Request_ID', 'Trip_Name', 'Status', 'Submitter_Name',
      'Submitter_BU', 'Grand_Total', 'Submitted_At', 'Event_Start_Date'
    ],
    _rbColumns: [],
    _rbFilters: {},
    _rbPreviewCache: null,
    _rbPreviewTimer: null,
    _rbPresets: [],
    _rbDragIdx: null,

    // Sort state (table rendering is client-side; everything front-loaded)
    _sort: {
      sortBy: 'submittedAt',
      sortDir: 'desc'
    },

    // Filters
    _filters: {
      status: 'all',
      international: false,
      buCode: '',
      startDate: '',
      endDate: '',
      searchTerm: ''
    },

    // Reviewer filter
    _buReviewerFilter: 'all',

    // Current period
    _metricsPeriod: '30d',
    _customStart: null,
    _customEnd: null,
    _customPicker: null,

    // Slide-in state
    _slideinRequestId: null,

    // Bulk selection state
    _bulkSelectedIds: null, // initialized as Set in init()

    // =========================================================================
    // INITIALIZATION
    // =========================================================================

    async init(options = {}) {
      this._userEmail = options.userEmail || '';
      this._userName = options.userName || '';
      this._scriptUrl = options.scriptUrl || '';

      window.TravelAdmin._scriptUrl = this._scriptUrl;

      // Verify admin access
      const accessResult = await this._checkAccess();
      if (!accessResult) {
        return;
      }

      // Initialize bulk selection set
      this._bulkSelectedIds = new Set();

      // Setup all event listeners
      this._setupSidebarNav();
      this._setupPeriodToggle();
      this._setupActionRibbon();
      this._setupFilters();
      this._setupSorting();
      this._setupSlideInPanel();
      this._setupBulkActions();

      // Load initial view
      await this._loadDashboard();

      // Warm the Users-page cache in the background so the first click on
      // the Users sidebar item feels instant. Fires after the dashboard
      // settles so we don't compete for the same RPC slot during initial
      // render. No-op if controller isn't loaded yet (defensive).
      setTimeout(function() {
        try {
          if (window.TravelUsers && window.TravelUsers.Controller && window.TravelUsers.Controller.warmCache) {
            window.TravelUsers.Controller.warmCache();
          }
        } catch (e) { /* warm-cache is best-effort */ }
      }, 1500);
    },

    async _checkAccess() {
      try {
        const result = await this._serverCall('checkTravelAdminAccess');
        if (!result || !result.isAdmin) {
          document.body.innerHTML = '<div style="padding: 2rem; text-align: center;">' +
            '<h2 style="color: var(--color-slate-800);">Access Denied</h2>' +
            '<p style="color: var(--color-slate-500);">You do not have admin access to this page.</p>' +
            '<a href="#" onclick="window.TravelAdmin.navigateTo(\'travel\'); return false;" ' +
            'style="color: var(--color-primary);">Return to Portal</a></div>';
          return false;
        }
        return true;
      } catch (error) {
        console.error('Error checking access:', error);
        document.body.innerHTML = '<div style="padding: 2rem; text-align: center;">' +
          '<h2 style="color: var(--color-slate-800);">Error</h2>' +
          '<p style="color: var(--color-slate-500);">Unable to verify admin access. Please try again.</p>' +
          '<a href="#" onclick="window.TravelAdmin.navigateTo(\'travel\'); return false;" ' +
          'style="color: var(--color-primary);">Return to Portal</a></div>';
        return false;
      }
    },

    // =========================================================================
    // NAVIGATION
    // =========================================================================

    _setupSidebarNav() {
      var self = this;
      var navItems = document.querySelectorAll('.admin-nav__item');

      navItems.forEach(function(item) {
        item.addEventListener('click', function() {
          var view = item.dataset.view;
          if (!view || item.classList.contains('admin-nav__item--disabled')) return;

          self._switchView(view);

          navItems.forEach(function(i) { i.classList.remove('admin-nav__item--active'); });
          item.classList.add('admin-nav__item--active');
        });
      });
    },

    async _switchView(view) {
      // Tell the Users module to stop polling when leaving the Users tab.
      // The module hooks back up when activate() runs again on re-entry.
      if (this._currentView === 'users' && view !== 'users'
          && window.TravelUsers && window.TravelUsers.Controller
          && window.TravelUsers.Controller.deactivate) {
        try { window.TravelUsers.Controller.deactivate(); } catch (e) {}
      }

      // Hide all views
      document.querySelectorAll('.admin-view').forEach(function(v) { v.classList.add('hidden'); });

      var viewMap = {
        'dashboard': 'dashboardView',
        'requests': 'requestsView',
        'reports': 'reportsView',
        'users': 'usersView'
      };

      var viewEl = document.getElementById(viewMap[view]);
      if (viewEl) {
        viewEl.classList.remove('hidden');
      }

      this._currentView = view;

      // Load data lazily
      switch (view) {
        case 'dashboard':
          if (!this._dashboardLoaded) await this._loadDashboard();
          break;
        case 'requests':
          if (!this._requestsLoaded) await this._loadRequests();
          else {
            if (this._buCodes.length > 0) this._populateBUFilter();
            this._renderFilterPills();
            this._applyFiltersAndRender();
          }
          break;
        case 'reports':
          if (!this._reportsLoaded) await this._loadReports();
          break;
        case 'users':
          if (window.TravelUsers && window.TravelUsers.Controller) {
            window.TravelUsers.Controller.activate();
          }
          break;
      }
    },

    // =========================================================================
    // DASHBOARD - ACTION CENTER (Phase 2)
    // =========================================================================

    async _loadDashboard() {
      try {
        // Single consolidated call — reads Requests once, returns both payloads
        var result = await this._serverCall('getAdminDashboard', this._userEmail, '30d');

        if (result && result.success) {
          var rdata = result.data || {};
          // Action center
          if (rdata.actionCenter) {
            this._actionCenterData = rdata.actionCenter;
            this._actionCenterData.success = true;
            this._renderActionCenter(this._actionCenterData);
          } else {
            this._renderActionCenterEmpty();
          }

          // Metrics
          if (rdata.stats) {
            this._dashboardStats = rdata.stats;
            this._metricsData = rdata.stats;
            this._renderMetrics(this._metricsData);
            this._updateNavPendingCount(this._metricsData);
          }

          // Pre-load requests data (instant tab switch)
          if (rdata.requests) {
            this._allRequests = rdata.requests;
            this._requestsLoaded = true;
            if (rdata.distinctBUCodes) {
              this._buCodes = rdata.distinctBUCodes;
            }
          }

        } else {
          this._showToast('Error', (result && result.error) || 'Failed to load dashboard', 'error');
          this._renderActionCenterEmpty();
        }

        // Remove skeleton loaders
        this._removeDashboardSkeletons();

        this._dashboardLoaded = true;

      } catch (error) {
        console.error('Error loading dashboard:', error);
        this._showToast('Error', error.message || 'Failed to load dashboard', 'error');
        this._removeDashboardSkeletons();
        this._renderActionCenterEmpty();
      }
    },

    _removeDashboardSkeletons() {
      var pipelineSkeleton = document.getElementById('pipelineSkeleton');
      if (pipelineSkeleton) pipelineSkeleton.remove();
      var statCardsSkeleton = document.getElementById('statCardsSkeleton');
      if (statCardsSkeleton) statCardsSkeleton.remove();
    },

    _renderActionCenter(data) {
      var reviews = data.yourReviews || [];
      var stalled = data.stalledRequests || [];
      var dc = data.deniedCancelledCounts || {};
      this._renderYourReviews(reviews);
      this._renderStalledRequests(stalled);
      this._renderDeniedCancelledAlert(dc.denied || 0, dc.cancelled || 0);
      this._renderPipeline(data.pipelineCounts || {});
      this._updateActionRibbon(reviews, stalled, dc.denied || 0, dc.cancelled || 0);
      this._setupViewAllReviewsLink();
    },

    _renderActionCenterEmpty() {
      var reviewsList = document.getElementById('yourReviewsList');
      if (reviewsList) {
        reviewsList.innerHTML = '<div class="admin-empty" style="padding: var(--space-5);">' +
          '<i aria-hidden="true" class="fas fa-check-circle"></i><p>No reviews waiting for you</p></div>';
      }
      var stalledList = document.getElementById('stalledRequestsList');
      if (stalledList) {
        stalledList.innerHTML = '<div class="admin-empty" style="padding: var(--space-5);">' +
          '<i aria-hidden="true" class="fas fa-check-circle"></i><p>No stalled requests</p></div>';
      }
      this._updateActionRibbon([], [], 0, 0);
    },

    /**
     * Action ribbon — compact summary chips (Reviews / Stalled / Denied) that
     * sit above the collapsible detail panel. Counts are updated whenever the
     * action center re-renders. Clicking a chip toggles the detail panel and
     * scrolls the relevant card into view; the trailing chevron toggles all.
     * Expanded state persists in localStorage (per-user-machine, not server).
     */
    /**
     * Action ribbon setup.
     *
     * Chips are the only control: each one toggles its own section.
     *   • Click an inactive/none-focused chip → expand panel to that section
     *   • Click the active chip → collapse the panel
     *   • Click a different chip while focused → switch focus
     * No separate Show/Hide button — chips do double duty.
     *
     * State persists in localStorage so re-opening lands on the same
     * focused section (or collapsed state) the user last left.
     */
    _setupActionRibbon() {
      var self = this;
      var ribbon = document.getElementById('actionRibbon');
      var detail = document.getElementById('actionDetail');
      if (!ribbon || !detail) return;

      var storedExpanded = null;
      var storedFocus = null;
      try {
        storedExpanded = localStorage.getItem('admin_actionDetailExpanded');
        storedFocus = localStorage.getItem('admin_actionDetailFocus');
      } catch (e) {}
      var initialFocus = (storedFocus === 'reviews' || storedFocus === 'stalled') ? storedFocus : 'reviews';
      self._setActionDetailExpanded(storedExpanded === '1', initialFocus);

      ribbon.querySelectorAll('.action-ribbon__chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          var section = chip.dataset.section;
          // Denied chip: jump straight to filtered Requests view, no
          // detail-panel expand path — there's no "denied list" panel.
          if (section === 'denied') {
            self._filters.status = 'DENIED';
            self._switchView('requests');
            document.querySelectorAll('.admin-nav__item').forEach(function(item) {
              item.classList.remove('admin-nav__item--active');
              if (item.dataset.view === 'requests') item.classList.add('admin-nav__item--active');
            });
            return;
          }
          // Toggle behavior: clicking the active chip collapses the panel,
          // clicking any other chip expands and focuses on that section.
          var alreadyFocused = chip.classList.contains('action-ribbon__chip--active');
          var isExpanded = !detail.classList.contains('is-collapsed');
          if (alreadyFocused && isExpanded) {
            self._setActionDetailExpanded(false, section);
          } else {
            self._setActionDetailExpanded(true, section);
          }
        });
      });
    },

    _setActionDetailExpanded(expanded, focus) {
      var detail = document.getElementById('actionDetail');
      var ribbon = document.getElementById('actionRibbon');
      if (!detail) return;

      if (expanded) {
        detail.classList.remove('is-collapsed');
      } else {
        detail.classList.add('is-collapsed');
      }

      // Apply focus class — drives which column shows in the panel.
      detail.classList.remove('action-detail--focus-reviews', 'action-detail--focus-stalled');
      if (expanded && focus === 'reviews') detail.classList.add('action-detail--focus-reviews');
      else if (expanded && focus === 'stalled') detail.classList.add('action-detail--focus-stalled');

      // Sync the chip active states (only the focused chip stays lit
      // while the panel is open; collapsed = no chip lit).
      if (ribbon) {
        ribbon.querySelectorAll('.action-ribbon__chip').forEach(function(c) {
          c.classList.remove('action-ribbon__chip--active');
        });
        if (expanded && (focus === 'reviews' || focus === 'stalled')) {
          var activeChipId = focus === 'reviews' ? 'ribbonChipReviews' : 'ribbonChipStalled';
          var active = document.getElementById(activeChipId);
          if (active) active.classList.add('action-ribbon__chip--active');
        }
      }

      try {
        localStorage.setItem('admin_actionDetailExpanded', expanded ? '1' : '0');
        localStorage.setItem('admin_actionDetailFocus', focus || 'all');
      } catch (e) {}
    },

    _updateActionRibbon(reviews, stalled, deniedCount, cancelledCount) {
      var self = this;
      var reviewsCount = (reviews && reviews.length) || 0;
      var stalledCount = (stalled && stalled.length) || 0;
      var deniedTotal = (deniedCount || 0) + (cancelledCount || 0);

      // Urgent reviews — travel within 10 days.
      var urgent = 0;
      if (reviews && reviews.length) {
        reviews.forEach(function(r) {
          var d = self._calcDaysUntilTravel(r.eventStartDate);
          if (d !== null && d <= 10) urgent++;
        });
      }

      var rc = document.getElementById('ribbonReviewsCount');
      if (rc) rc.textContent = reviewsCount;
      var rChip = document.getElementById('ribbonChipReviews');
      if (rChip) rChip.classList.toggle('action-ribbon__chip--zero', reviewsCount === 0);

      var ru = document.getElementById('ribbonReviewsUrgent');
      var ruc = document.getElementById('ribbonReviewsUrgentCount');
      if (ru && ruc) {
        if (urgent > 0) {
          ruc.textContent = urgent;
          ru.classList.remove('hidden');
        } else {
          ru.classList.add('hidden');
        }
      }

      var sc = document.getElementById('ribbonStalledCount');
      if (sc) sc.textContent = stalledCount;
      var sChip = document.getElementById('ribbonChipStalled');
      if (sChip) sChip.classList.toggle('action-ribbon__chip--zero', stalledCount === 0);

      var dChip = document.getElementById('ribbonChipDenied');
      var dCount = document.getElementById('ribbonDeniedCount');
      var dLabel = document.getElementById('ribbonDeniedLabel');
      if (dChip && dCount && dLabel) {
        if (deniedTotal === 0) {
          dChip.classList.add('hidden');
        } else {
          dChip.classList.remove('hidden');
          dCount.textContent = deniedTotal;
          var parts = [];
          if (deniedCount > 0) parts.push('Denied');
          if (cancelledCount > 0) parts.push('Cancelled');
          dLabel.textContent = parts.join(' / ');
        }
      }
    },

    _renderYourReviews(reviews) {
      var self = this;
      var container = document.getElementById('yourReviewsList');
      if (!container) return;

      if (!reviews || reviews.length === 0) {
        container.innerHTML = '<div class="admin-empty" style="padding: var(--space-5);">' +
          '<i aria-hidden="true" class="fas fa-check-circle"></i><p>No reviews waiting for you</p></div>';
        return;
      }

      // Sort urgent-first (travel date <= 10 days), then by daysAtStage desc
      var sorted = reviews.slice().sort(function(a, b) {
        var aDaysUntil = self._calcDaysUntilTravel(a.eventStartDate);
        var bDaysUntil = self._calcDaysUntilTravel(b.eventStartDate);
        var aUrgent = aDaysUntil !== null && aDaysUntil <= 10;
        var bUrgent = bDaysUntil !== null && bDaysUntil <= 10;

        if (aUrgent && !bUrgent) return -1;
        if (!aUrgent && bUrgent) return 1;

        var aDays = self._getDaysAtStage(a.updatedAt);
        var bDays = self._getDaysAtStage(b.updatedAt);
        return bDays - aDays;
      });

      var html = '<div class="action-list">';
      sorted.forEach(function(item) {
        var statusDisplay = self._getStatusDisplay(item.status);
        var days = self._getDaysAtStage(item.updatedAt);
        var daysClass = self._getDaysClass(days);
        var daysUntil = self._calcDaysUntilTravel(item.eventStartDate);
        var urgentTag = (daysUntil !== null && daysUntil <= 10)
          ? '<span class="action-item__urgent"><i aria-hidden="true" class="fas fa-bolt"></i>Urgent</span>'
          : '';

        html += '<div class="action-item" data-request-id="' + self._escapeHtml(item.requestId) + '">' +
          '<div class="action-item__info">' +
            '<div class="action-item__name">' + self._escapeHtml(item.submitterName || 'Unknown') + '</div>' +
            '<div class="action-item__sub">' +
              self._escapeHtml(item.tripName || 'Untitled') +
              ' <span class="status-badge status-badge--' + statusDisplay.class + '">' + statusDisplay.label + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="action-item__meta">' +
            urgentTag +
            '<span class="action-item__days action-item__days--' + daysClass + '">' +
              '<i aria-hidden="true" class="fas fa-clock"></i>' + days + 'd' +
            '</span>' +
          '</div>' +
          '<div class="action-item__amount">' + self._formatCurrency(item.grandTotal) + '</div>' +
        '</div>';
      });
      html += '</div>';

      container.innerHTML = html;

      // Attach click handlers
      container.querySelectorAll('.action-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var reqId = el.dataset.requestId;
          if (reqId) self._openSlideIn(reqId);
        });
      });
    },

    _renderStalledRequests(stalled) {
      var self = this;
      var container = document.getElementById('stalledRequestsList');
      if (!container) return;

      if (!stalled || stalled.length === 0) {
        container.innerHTML = '<div class="admin-empty" style="padding: var(--space-5);">' +
          '<i aria-hidden="true" class="fas fa-check-circle"></i><p>No stalled requests</p></div>';
        return;
      }

      var html = '<div class="action-list">';
      stalled.forEach(function(item) {
        var statusDisplay = self._getStatusDisplay(item.status);
        var days = self._getDaysAtStage(item.updatedAt);
        var daysClass = self._getDaysClass(days);

        html += '<div class="action-item" data-request-id="' + self._escapeHtml(item.requestId) + '">' +
          '<div class="action-item__info">' +
            '<div class="action-item__name">' +
              self._escapeHtml(item.tripName || 'Untitled') +
              ' <span class="status-badge status-badge--' + statusDisplay.class + '">' + statusDisplay.label + '</span>' +
            '</div>' +
            '<div class="action-item__sub">' +
              '<i aria-hidden="true" class="fas fa-user" style="font-size:0.6rem; margin-right:3px;"></i>' +
              self._escapeHtml(item.currentReviewerName || 'Unassigned') +
            '</div>' +
          '</div>' +
          '<div class="action-item__meta">' +
            '<span class="action-item__days action-item__days--' + daysClass + '">' +
              '<i aria-hidden="true" class="fas fa-clock"></i>' + days + 'd' +
            '</span>' +
          '</div>' +
          '<div class="action-item__amount">' + self._formatCurrency(item.grandTotal) + '</div>' +
        '</div>';
      });
      html += '</div>';

      container.innerHTML = html;

      container.querySelectorAll('.action-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var reqId = el.dataset.requestId;
          if (reqId) self._openSlideIn(reqId);
        });
      });
    },

    _renderDeniedCancelledAlert(deniedCount, cancelledCount) {
      // Legacy alert stays hidden \u2014 the ribbon chip is the visible
      // surface now. We still update its text + click handler so any
      // external consumer that targets the same IDs keeps working.
      var alertEl = document.getElementById('deniedCancelledAlert');
      var textEl = document.getElementById('deniedCancelledText');
      var linkEl = document.getElementById('viewDeniedLink');
      if (!alertEl || !textEl) return;

      if (deniedCount === 0 && cancelledCount === 0) return;

      var parts = [];
      if (deniedCount > 0) parts.push(deniedCount + ' Denied');
      if (cancelledCount > 0) parts.push(cancelledCount + ' Cancelled');

      textEl.textContent = parts.join(' \u00B7 ') + ' this month';

      var self = this;
      if (linkEl) {
        linkEl.onclick = function(e) {
          e.preventDefault();
          self._filters.status = 'DENIED';
          self._switchView('requests');
          // Update active nav
          document.querySelectorAll('.admin-nav__item').forEach(function(item) {
            item.classList.remove('admin-nav__item--active');
            if (item.dataset.view === 'requests') item.classList.add('admin-nav__item--active');
          });
        };
      }
    },

    _renderPipeline(pipeline) {
      var self = this;
      var container = document.getElementById('pipelineRow');
      if (!container) return;

      var stages = [
        { key: 'sector', label: 'Sector', cssClass: 'pending', status: 'PENDING_SECTOR' },
        { key: 'bu', label: 'BU', cssClass: 'pending', status: 'PENDING_BU' },
        { key: 'oso', label: 'AAS FO', cssClass: 'oso', status: 'PENDING_OSO' },
        { key: 'fas', label: 'FAS', cssClass: 'oso', status: 'PENDING_FAS' },
        { key: 'ddConfirm', label: 'DD Confirm', cssClass: 'pending', status: 'Pending_DD_Confirmation' },
        { key: 'approved', label: 'Approved', cssClass: 'approved', status: 'APPROVED_GOGOV' }
      ];

      var html = '';
      stages.forEach(function(stage) {
        var count = (pipeline && pipeline[stage.key] !== undefined) ? pipeline[stage.key] : 0;

        html += '<div class="pipeline-card pipeline-card--' + stage.cssClass + '" data-status="' + stage.status + '">' +
          '<div class="pipeline-card__count">' + count + '</div>' +
          '<div class="pipeline-card__label">' + stage.label + '</div>' +
        '</div>';
      });

      container.innerHTML = html;

      // Click handler: navigate to requests filtered by status
      container.querySelectorAll('.pipeline-card').forEach(function(card) {
        card.addEventListener('click', function() {
          var status = card.dataset.status;
          self._filters.status = status;
          self._switchView('requests');
          document.querySelectorAll('.admin-nav__item').forEach(function(item) {
            item.classList.remove('admin-nav__item--active');
            if (item.dataset.view === 'requests') item.classList.add('admin-nav__item--active');
          });
        });
      });
    },

    _setupViewAllReviewsLink() {
      var self = this;
      var link = document.getElementById('viewAllReviews');
      if (!link) return;

      link.onclick = function(e) {
        e.preventDefault();
        // Navigate to requests view filtered by current user as reviewer
        self._filters.searchTerm = self._userEmail;
        self._filters.status = 'all';
        self._switchView('requests');
        document.querySelectorAll('.admin-nav__item').forEach(function(item) {
          item.classList.remove('admin-nav__item--active');
          if (item.dataset.view === 'requests') item.classList.add('admin-nav__item--active');
        });
        var searchEl = document.getElementById('filterSearch');
        if (searchEl) searchEl.value = self._userEmail;
      };
    },

    _updateNavPendingCount(stats) {
      var badge = document.getElementById('navPendingCount');
      if (!badge) return;

      var pending = stats.pending || {};
      var total = (pending.sector || 0) + (pending.bu || 0) + (pending.oso || 0) + (pending.fas || 0);
      if (total > 0) {
        badge.textContent = total;
        badge.style.display = '';
      } else {
        badge.textContent = '';
        badge.style.display = 'none';
      }
    },

    // =========================================================================
    // DASHBOARD - METRICS (Phase 3)
    // =========================================================================

    _setupPeriodToggle() {
      var self = this;
      var toggleContainer = document.getElementById('periodToggle');
      if (!toggleContainer) return;

      toggleContainer.querySelectorAll('.period-toggle__btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var period = btn.dataset.period;
          if (!period) return;

          toggleContainer.querySelectorAll('.period-toggle__btn').forEach(function(b) {
            b.classList.remove('period-toggle__btn--active');
          });
          btn.classList.add('period-toggle__btn--active');

          if (period === 'custom') {
            // Open the anchored picker; defer the reload until both
            // dates are picked. Picker is positioned beneath the
            // Custom button itself, no separate visible input needed.
            if (self._customPicker) self._customPicker.open();
            return;
          }

          // Switching off custom — reset the chosen range and the
          // Custom button's label so it reads "Custom" again.
          self._metricsPeriod = period;
          self._customStart = null;
          self._customEnd = null;
          var customBtn = document.getElementById('customPeriodBtn');
          if (customBtn) customBtn.textContent = 'Custom';
          self._loadMetrics(period);
        });
      });

      this._setupCustomDatePicker();
    },

    /**
     * Custom date range picker.
     *
     * The hidden source input (#customDateRange) is just a flatpickr handle;
     * the picker positions itself relative to the Custom button via
     * `positionElement` so it drops down from the button instead of the
     * top-left of the screen (which is where it landed when the source
     * input was display:none and had no layout box). After both dates are
     * picked, the Custom button label reflects the selected range so the
     * user has a visible record of what's applied.
     */
    _setupCustomDatePicker() {
      var self = this;
      var input = document.getElementById('customDateRange');
      var customBtn = document.getElementById('customPeriodBtn');
      if (!input || !customBtn || typeof flatpickr === 'undefined') return;

      this._customPicker = flatpickr(input, {
        mode: 'range',
        dateFormat: 'Y-m-d',
        positionElement: customBtn,
        clickOpens: false,
        onClose: function(selectedDates) {
          if (selectedDates.length !== 2) return;
          self._metricsPeriod = 'custom';
          self._customStart = selectedDates[0].toISOString();
          self._customEnd = selectedDates[1].toISOString();
          customBtn.textContent = self._formatRangeLabel(selectedDates[0], selectedDates[1]);
          self._loadMetrics('custom');
        }
      });
    },

    /**
     * Compact date range label for the Custom pill.
     * Drops the year when both dates are in the current calendar year so
     * "May 1 – May 14" doesn't blow out the toggle width on a busy header.
     */
    _formatRangeLabel(start, end) {
      var fmt = function(d, withYear) {
        var opts = { month: 'short', day: 'numeric' };
        if (withYear) opts.year = 'numeric';
        return d.toLocaleDateString('en-US', opts);
      };
      var thisYear = new Date().getFullYear();
      var sameYearAsNow = start.getFullYear() === thisYear && end.getFullYear() === thisYear;
      return fmt(start, !sameYearAsNow) + ' – ' + fmt(end, !sameYearAsNow);
    },

    async _loadMetrics(period) {
      var metricsLoading = document.getElementById('metricsLoading');
      var statCards = document.getElementById('statCards');
      var chartsRow = document.getElementById('chartsRow');
      // Note: perfTableCard intentionally not dimmed — reviewer perf is
      // all-time and unaffected by the period toggle, so the existing
      // perf rows remain valid while metrics reload.

      if (metricsLoading) metricsLoading.classList.remove('hidden');
      if (statCards) statCards.style.opacity = '0.4';
      if (chartsRow) chartsRow.style.opacity = '0.4';

      try {
        var result = await this._serverCall(
          'getAdminDashboard',
          this._userEmail,
          period,
          this._customStart || null,
          this._customEnd || null
        );

        var rdata = (result && result.data) || {};
        if (result && result.success && rdata.stats) {
          this._metricsData = rdata.stats;
          this._renderMetrics(rdata.stats);
          this._updateNavPendingCount(rdata.stats);

          // Also refresh action center since we got it for free
          if (rdata.actionCenter) {
            this._actionCenterData = rdata.actionCenter;
            this._actionCenterData.success = true;
            this._renderActionCenter(this._actionCenterData);
          }
        } else {
          this._showToast('Error', (result && result.error) || 'Failed to load metrics', 'error');
        }
      } catch (error) {
        console.error('Error loading metrics:', error);
        this._showToast('Error', error.message || 'Failed to load metrics', 'error');
      } finally {
        if (metricsLoading) metricsLoading.classList.add('hidden');
        if (statCards) statCards.style.opacity = '1';
        if (chartsRow) chartsRow.style.opacity = '1';
      }
    },

    _renderMetrics(stats) {
      this._renderStatCards(stats);
      this._renderCharts(stats);
      this._renderPerfTable(stats);
    },

    _renderStatCards(stats) {
      var container = document.getElementById('statCards');
      if (!container) return;

      var avgApproval = stats.avgApprovalTime || (stats.avgReviewTime && stats.avgReviewTime.overall) || 0;
      var totalApprovedAmount = 0;
      var totalApprovedCount = (stats.totals && stats.totals.approved) || 0;

      // Sum approved spend across BUs for total amount
      if (stats.spendByBU) {
        Object.values(stats.spendByBU).forEach(function(v) { totalApprovedAmount += v.total || 0; });
      }

      var approvalRate = stats.approvalRate || 0;

      // Avg advance notice (days between submission and event start)
      var avgLeadTime = stats.avgLeadTime || 0;

      var avgApprovalFmt = this._formatReviewDuration(avgApproval);
      var avgLeadTimeFmt = this._formatReviewDuration(avgLeadTime);
      var html =
        '<div class="stat-card">' +
          '<div class="stat-card__icon stat-card__icon--primary"><i aria-hidden="true" class="fas fa-stopwatch"></i></div>' +
          '<div class="stat-card__label">Submit → Approval</div>' +
          '<div class="stat-card__value">' + avgApprovalFmt.value + '</div>' +
          '<div class="stat-card__sub">' + avgApprovalFmt.unit + ' end-to-end</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-card__icon stat-card__icon--success"><i aria-hidden="true" class="fas fa-circle-check"></i></div>' +
          '<div class="stat-card__label">Total Approved</div>' +
          '<div class="stat-card__value">' + this._formatCurrency(totalApprovedAmount) + '</div>' +
          '<div class="stat-card__sub">' + totalApprovedCount + ' requests</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-card__icon stat-card__icon--warning"><i aria-hidden="true" class="fas fa-chart-pie"></i></div>' +
          '<div class="stat-card__label">Approval Rate</div>' +
          '<div class="stat-card__value">' + approvalRate + '%</div>' +
          '<div class="stat-card__sub">of decided requests</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-card__icon stat-card__icon--info"><i aria-hidden="true" class="fas fa-route"></i></div>' +
          '<div class="stat-card__label">Avg Advance Notice</div>' +
          '<div class="stat-card__value">' + avgLeadTimeFmt.value + '</div>' +
          '<div class="stat-card__sub">' + avgLeadTimeFmt.unit + ' before event</div>' +
        '</div>';

      container.innerHTML = html;
    },

    _renderCharts(stats) {
      var container = document.getElementById('chartsRow');
      if (!container) return;

      // "Time per Stage" measures only how long each reviewer actively held
      // the request (sum of consecutive Approval_Log gaps within the stage).
      // The "Avg Approval Time" KPI in the strip above is end-to-end —
      // submission to final approval, including needs-info pauses — so the
      // two numbers are intentionally different. Captions here make that
      // explicit instead of leaving admins to guess.
      // Funding-source split moved into the pulse strip above (it's a
      // glance metric, not an analytical chart) — chart row is now 2-up
      // with Time per Stage left and Spend by BU right; BU still gets
      // full width on a separate row for its many bars.
      // Two charts side-by-side, one per column. Matches the reviewer
      // dashboard's chart row.
      // Pre-compute the header totals so they sit next to the chart titles
      // instead of inside the body. Empty totals render as nothing (the
      // builders handle their own empty states for the body).
      var avgStage = stats.approvalTimeByStage || stats.avgReviewTime || {};
      var stageTotal = (avgStage.sector || 0) + (avgStage.bu || 0) + (avgStage.oso || 0) + (avgStage.fas || 0);
      var stageTotalLabel = stageTotal > 0
        ? '<span class="admin-card__header-total">' + this._formatReviewDuration(stageTotal).full + ' <span class="admin-card__header-total-label">avg</span></span>'
        : '';

      var spendBUData = this._getSpendByBUData(stats);
      var spendGrandTotal = 0;
      if (spendBUData && spendBUData.length && !(spendBUData.length === 1 && spendBUData[0].label === 'No data')) {
        spendBUData.forEach(function(d) { spendGrandTotal += d.value; });
      }
      var spendTotalLabel = spendGrandTotal > 0
        ? '<span class="admin-card__header-total">' + this._formatCurrency(spendGrandTotal) + ' <span class="admin-card__header-total-label">total approved</span></span>'
        : '';

      var html =
        '<div class="admin-card admin-card--chart">' +
          '<div class="admin-card__header">' +
            '<div>' +
              '<h3 class="admin-card__title"><i aria-hidden="true" class="fas fa-clock"></i> Time per Stage</h3>' +
              '<div class="admin-card__caption">Avg time each reviewer actively held the request</div>' +
            '</div>' +
            stageTotalLabel +
          '</div>' +
          '<div class="admin-card__body">' +
            this._buildApprovalTimePipeline(stats) +
          '</div>' +
        '</div>' +
        '<div class="admin-card admin-card--chart">' +
          '<div class="admin-card__header">' +
            '<div>' +
              '<h3 class="admin-card__title"><i aria-hidden="true" class="fas fa-dollar-sign"></i> Spend by BU</h3>' +
              '<div class="admin-card__caption">Approved obligations in selected period</div>' +
            '</div>' +
            spendTotalLabel +
          '</div>' +
          '<div class="admin-card__body">' +
            this._buildSpendByBUChart(stats) +
          '</div>' +
        '</div>';

      container.innerHTML = html;

      // Render the funding split into the pulse strip's funding row so
      // the period-filtered glance metrics live together.
      this._renderFundingSplitInPulse(stats);
    },

    /**
     * Render the funding-source split into the pulse strip (above the
     * Live divider). Compact two-line layout: a slim stacked bar +
     * inline legend with values, designed to add ~50px of fold not
     * the ~180px the chart card was eating in the chart row.
     */
    _renderFundingSplitInPulse(stats) {
      var container = document.getElementById('pulseFundingRow');
      if (!container) return;

      var fts = stats.fundingTypeSpend || {};
      var clientPaid = fts.clientPaid || { total: 0, count: 0 };
      var overhead = fts.overhead || { total: 0, count: 0 };
      var total = (clientPaid.total || 0) + (overhead.total || 0);

      if (total === 0) {
        container.innerHTML = '<div class="funding-strip funding-strip--empty">No approved spend yet</div>';
        return;
      }

      var clientPct = (clientPaid.total / total) * 100;
      var overheadPct = 100 - clientPct;
      var clientColor = '#286D3B';
      var overheadColor = '#004f87';
      var self = this;

      var html = '<div class="funding-strip">';
      // Top line: small label + formatted total
      html += '<div class="funding-strip__head">' +
        '<span class="funding-strip__label">Funding Source</span>' +
        '<span class="funding-strip__total">' + self._formatCurrency(total) + ' approved</span>' +
        '</div>';
      // Compact stacked bar
      html += '<div class="funding-strip__bar">';
      if (clientPaid.total > 0) {
        html += '<div class="funding-strip__seg" style="width:' + clientPct.toFixed(2) + '%; background:' + clientColor + ';" title="Client-Paid: ' + self._formatCurrency(clientPaid.total) + '"></div>';
      }
      if (overhead.total > 0) {
        html += '<div class="funding-strip__seg" style="width:' + overheadPct.toFixed(2) + '%; background:' + overheadColor + ';" title="Overhead: ' + self._formatCurrency(overhead.total) + '"></div>';
      }
      html += '</div>';
      // Inline legend with pct + dollars on each side
      html += '<div class="funding-strip__legend">';
      html += '<span class="funding-strip__legend-item">' +
        '<span class="funding-strip__dot" style="background:' + clientColor + ';"></span>' +
        '<span class="funding-strip__legend-name">Client-Paid</span>' +
        '<span class="funding-strip__legend-pct">' + Math.round(clientPct) + '%</span>' +
        '<span class="funding-strip__legend-value">' + self._formatCurrency(clientPaid.total) + '</span>' +
        '</span>';
      html += '<span class="funding-strip__legend-item">' +
        '<span class="funding-strip__dot" style="background:' + overheadColor + ';"></span>' +
        '<span class="funding-strip__legend-name">Overhead</span>' +
        '<span class="funding-strip__legend-pct">' + Math.round(overheadPct) + '%</span>' +
        '<span class="funding-strip__legend-value">' + self._formatCurrency(overhead.total) + '</span>' +
        '</span>';
      html += '</div>';
      html += '</div>';

      container.innerHTML = html;
    },

    _buildApprovalTimePipeline(stats) {
      var self = this;
      var byStage = stats.approvalTimeByStage || stats.avgReviewTime || {};
      var stages = [
        { key: 'sector', label: 'Sector', color: '#004f87' },
        { key: 'bu', label: 'BU', color: '#1B7CAC' },
        { key: 'oso', label: 'AAS FO', color: '#CF4817' },
        { key: 'fas', label: 'FAS', color: '#286D3B' }
      ];

      var total = 0;
      var stageData = [];
      stages.forEach(function(s) {
        var val = byStage[s.key] || 0;
        total += val;
        stageData.push({ label: s.label, value: val, color: s.color });
      });

      if (total === 0) {
        return '<p style="font-size:0.8rem; color:var(--color-slate-400); text-align:center;">No approval data yet</p>';
      }

      // Total label is now rendered in the card header (see _renderCharts);
      // this builder returns just the chart body.
      var html = '<div class="pipeline">';
      html += '<div class="pipeline__bar">';
      stageData.forEach(function(s) {
        var pct = (s.value / total) * 100;
        if (pct < 1 && s.value > 0) pct = 1; // minimum visible width
        html += '<div class="pipeline__segment" style="width:' + pct + '%; background:' + s.color + ';" title="' + s.label + ': ' + self._formatReviewDuration(s.value).full + '"></div>';
      });
      html += '</div>';

      // Legend row below
      html += '<div class="pipeline__legend">';
      stageData.forEach(function(s) {
        var pct = total > 0 ? ((s.value / total) * 100).toFixed(0) : 0;
        html += '<div class="pipeline__legend-item">' +
          '<span class="pipeline__dot" style="background:' + s.color + ';"></span>' +
          '<span class="pipeline__legend-label">' + s.label + '</span>' +
          '<span class="pipeline__legend-value">' + self._formatReviewDuration(s.value).short + '</span>' +
          '<span class="pipeline__legend-pct">' + (s.value > 0 ? pct + '%' : '') + '</span>' +
        '</div>';
      });
      html += '</div>';
      html += '</div>';

      return html;
    },

    _getSpendByBUData(stats) {
      var self = this;
      var spendByBU = stats.spendByBU || {};
      var entries = Object.entries(spendByBU).filter(function(e) { return e[1].total > 0; });

      if (entries.length === 0) {
        return [{ label: 'No data', value: 0, display: '$0' }];
      }

      // Fixed display order: OSO, Army, AF/Navy/SF, Civilian, Defense
      var buOrder = ['OSO', 'Army', 'Air Force', 'Navy', 'Space Force', 'Civilian', 'Defense'];
      entries.sort(function(a, b) {
        var aName = a[0].toLowerCase();
        var bName = b[0].toLowerCase();
        var aIdx = buOrder.length;
        var bIdx = buOrder.length;
        for (var i = 0; i < buOrder.length; i++) {
          if (aName.indexOf(buOrder[i].toLowerCase()) >= 0 && aIdx === buOrder.length) aIdx = i;
          if (bName.indexOf(buOrder[i].toLowerCase()) >= 0 && bIdx === buOrder.length) bIdx = i;
        }
        return aIdx - bIdx;
      });

      return entries.map(function(entry) {
        return {
          label: entry[0],
          value: entry[1].total,
          count: entry[1].count,
          display: entry[1].total > 0 ? self._formatCurrency(entry[1].total) : '$0'
        };
      });
    },

    _buildBarChart(data) {
      if (!data || data.length === 0) {
        return '<p style="font-size:0.8rem; color:var(--color-slate-400); text-align:center;">No data available</p>';
      }

      var maxValue = Math.max.apply(null, data.map(function(d) { return d.value; }));
      if (maxValue === 0) maxValue = 1;

      var html = '<div class="bar-chart">';
      data.forEach(function(item) {
        var pct = (item.value / maxValue) * 100;
        html += '<div class="bar-chart__row">' +
          '<div class="bar-chart__label">' + item.label + '</div>' +
          '<div class="bar-chart__track">' +
            '<div class="bar-chart__fill" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<div class="bar-chart__value">' + item.display + '</div>' +
        '</div>';
      });
      html += '</div>';
      return html;
    },

    _buildSpendByBUChart(stats) {
      var self = this;
      var buData = this._getSpendByBUData(stats);
      var sectorData = stats.spendBySector || {};

      if (!buData || buData.length === 0 || (buData.length === 1 && buData[0].label === 'No data')) {
        return '<p style="font-size:0.8rem; color:var(--color-slate-400); text-align:center;">No approved spend yet</p>';
      }

      // Grand total
      var grandTotal = 0;
      buData.forEach(function(d) { grandTotal += d.value; });

      var maxValue = Math.max.apply(null, buData.map(function(d) { return d.value; }));
      if (maxValue === 0) maxValue = 1;

      // Total label is now rendered in the card header (see _renderCharts);
      // this builder returns just the chart body.
      var html = '<div class="bar-chart">';

      buData.forEach(function(item) {
        var pct = (item.value / maxValue) * 100;
        var buSectors = sectorData[item.label];
        var hasSectors = buSectors && Object.keys(buSectors).some(function(s) { return buSectors[s].total > 0; });

        // BU row — clickable if it has sector data
        if (hasSectors) {
          html += '<div class="bar-chart__row bar-chart__row--clickable" role="button" tabindex="0" aria-label="Toggle ' + item.label + ' drilldown" onclick="TravelAdmin.Controller.toggleBUDrilldown(\'' + item.label.replace(/'/g, "\\'") + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}">';
          html += '<div class="bar-chart__label"><i aria-hidden="true" class="fas fa-chevron-right bar-chart__chevron" data-bu-chevron="' + item.label + '"></i>' + item.label + '</div>';
        } else {
          html += '<div class="bar-chart__row">';
          html += '<div class="bar-chart__label">' + item.label + '</div>';
        }
        html += '<div class="bar-chart__track">' +
            '<div class="bar-chart__fill" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<div class="bar-chart__value">' + item.display + ' <span class="bar-chart__count">(' + (item.count || 0) + ')</span></div>' +
        '</div>';

        // Sector drilldown rows (hidden by default)
        if (hasSectors) {
          var sectorEntries = Object.entries(buSectors).filter(function(e) { return e[1].total > 0; });
          sectorEntries.sort(function(a, b) {
            if (a[0] === 'FO') return -1;
            if (b[0] === 'FO') return 1;
            var aMatch = a[0].match(/(\D*)(\d+)$/);
            var bMatch = b[0].match(/(\D*)(\d+)$/);
            if (aMatch && bMatch && aMatch[1] === bMatch[1]) return parseInt(aMatch[2]) - parseInt(bMatch[2]);
            return a[0].localeCompare(b[0]);
          });

          // Also show shared costs if any
          var sectorSum = 0;
          sectorEntries.forEach(function(e) { sectorSum += e[1].total; });
          var sharedAmount = item.value - sectorSum;

          var maxSectorVal = Math.max.apply(null, sectorEntries.map(function(e) { return e[1].total; }));
          if (sharedAmount > maxSectorVal) maxSectorVal = sharedAmount;
          if (maxSectorVal === 0) maxSectorVal = 1;

          html += '<div class="bar-chart__sector-group hidden" data-bu-sectors="' + item.label + '">';
          sectorEntries.forEach(function(se) {
            var sPct = (se[1].total / maxSectorVal) * 100;
            var sDisplay = self._formatCurrency(se[1].total);
            html += '<div class="bar-chart__row bar-chart__row--sector">' +
              '<div class="bar-chart__label">' + se[0] + '</div>' +
              '<div class="bar-chart__track">' +
                '<div class="bar-chart__fill bar-chart__fill--sector" style="width:' + sPct + '%"></div>' +
              '</div>' +
              '<div class="bar-chart__value">' + sDisplay + ' <span class="bar-chart__count">(' + se[1].count + ')</span></div>' +
            '</div>';
          });

          if (sharedAmount > 0) {
            var sharedPct = (sharedAmount / maxSectorVal) * 100;
            html += '<div class="bar-chart__row bar-chart__row--sector">' +
              '<div class="bar-chart__label">Shared</div>' +
              '<div class="bar-chart__track">' +
                '<div class="bar-chart__fill bar-chart__fill--shared" style="width:' + sharedPct + '%"></div>' +
              '</div>' +
              '<div class="bar-chart__value">' + self._formatCurrency(sharedAmount) + '</div>' +
            '</div>';
          }
          html += '</div>';
        }
      });
      html += '</div>';
      return html;
    },

    toggleBUDrilldown(buName) {
      var group = document.querySelector('[data-bu-sectors="' + buName + '"]');
      var chevron = document.querySelector('[data-bu-chevron="' + buName + '"]');
      if (!group) return;

      var isHidden = group.classList.contains('hidden');
      group.classList.toggle('hidden');

      if (chevron) {
        if (isHidden) {
          chevron.classList.remove('fa-chevron-right');
          chevron.classList.add('fa-chevron-down');
        } else {
          chevron.classList.remove('fa-chevron-down');
          chevron.classList.add('fa-chevron-right');
        }
      }
    },

    _renderPerfTable(stats) {
      var self = this;
      var container = document.getElementById('perfTableContainer');
      if (!container) return;

      var reviewerPerf = stats.reviewerPerformance || [];

      if (reviewerPerf.length === 0) {
        container.innerHTML = '<div class="admin-empty" style="padding: var(--space-5);">' +
          '<i aria-hidden="true" class="fas fa-chart-bar"></i><p>No reviewer performance data yet</p></div>';
        return;
      }

      // Split into primary (BU/FO/OSO) and sector reviewers; sector goes
      // in its own column to the right so it doesn't dominate the vertical
      // space when there are many sector directors.
      var mainReviewers = [];
      var sectorReviewers = [];
      reviewerPerf.forEach(function(r) {
        if (r.role === 'Sector') sectorReviewers.push(r);
        else mainReviewers.push(r);
      });

      function renderRow(r, compact) {
        var avgDays = r.avgDays || r.avgReviewTime || 0;
        var warnClass = avgDays >= 2 ? ' perf-row__metric--warn' : '';
        var fmt = self._formatReviewDuration(avgDays);
        var name = self._escapeHtml(r.name || r.reviewerName || 'Unknown');
        // Prefer the actual scope (BU name, sector code, "Front Office")
        // over the generic role bucket; fall back to role if scope absent.
        var scope = self._escapeHtml(r.scope || r.role || 'Reviewer');
        var pending = r.pendingCount || r.pending || 0;
        var reviewed = r.reviewedCount || r.reviewed || 0;
        var rowClass = compact ? 'perf-row perf-row--compact' : 'perf-row';
        var fmtValue = self._escapeHtml(fmt.short || '—');
        var nameAttr = self._escapeHtml(r.name || r.reviewerName || '');

        // Pending metric is clickable when > 0 — navigates to the Requests
        // table filtered by this reviewer's name. The Requests search
        // matches Current_Reviewer_Name (among other fields), so name is
        // the right key — emails aren't shown in the table and don't
        // match the stored Current_Reviewer_Name strings.
        var pendingClasses = 'perf-row__metric perf-row__metric--pending' +
          (pending > 0 ? ' perf-row__metric--clickable' : ' perf-row__metric--zero');
        var pendingAttrs = pending > 0
          ? ' data-reviewer-name="' + nameAttr + '" title="Click to view this reviewer\'s pending requests"'
          : '';

        return '<div class="' + rowClass + '">' +
          '<div class="perf-row__main">' +
            '<div class="perf-row__name">' + name + '</div>' +
            '<div class="perf-row__scope">' + scope + '</div>' +
          '</div>' +
          '<div class="perf-row__metrics">' +
            '<div class="' + pendingClasses + '"' + pendingAttrs + '>' +
              '<div class="perf-row__metric-value">' + pending + '</div>' +
              '<div class="perf-row__metric-label">Pending</div>' +
            '</div>' +
            '<div class="perf-row__metric perf-row__metric--reviewed' + (reviewed > 0 ? '' : ' perf-row__metric--zero') + '">' +
              '<div class="perf-row__metric-value">' + reviewed + '</div>' +
              '<div class="perf-row__metric-label">Reviewed</div>' +
            '</div>' +
            '<div class="perf-row__metric perf-row__metric--time' + warnClass + (reviewed > 0 ? '' : ' perf-row__metric--zero') + '" title="Avg time this reviewer actively held requests in the selected period — a subset of the Submit→Approval KPI above (which includes pauses, weekends, needs-info bounces).">' +
              '<div class="perf-row__metric-value">' + fmtValue + '</div>' +
              '<div class="perf-row__metric-label">Avg time</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      var html = '<div class="perf-list">';

      // Primary column — always visible
      html += '<div class="perf-list__col perf-list__col--primary">' +
        '<div class="perf-list__heading">Primary Reviewers' +
          '<span class="perf-list__count">(' + mainReviewers.length + ')</span>' +
        '</div>' +
        '<div class="perf-list__rows">';
      if (mainReviewers.length === 0) {
        html += '<div class="perf-list__empty">No primary reviewer activity yet</div>';
      } else {
        mainReviewers.forEach(function(r) { html += renderRow(r, false); });
      }
      html += '</div></div>';

      // Sector column — sits to the right; only renders if there's data
      if (sectorReviewers.length > 0) {
        html += '<div class="perf-list__col perf-list__col--sector">' +
          '<div class="perf-list__heading">Sector Directors' +
            '<span class="perf-list__count">(' + sectorReviewers.length + ')</span>' +
          '</div>' +
          '<div class="perf-list__rows">';
        sectorReviewers.forEach(function(r) { html += renderRow(r, true); });
        html += '</div></div>';
      }

      html += '</div>';
      container.innerHTML = html;

      // Wire up "click pending → filter Requests by this reviewer".
      // Reuses the existing searchTerm filter, which matches against
      // Current_Reviewer_Name (among other fields) — emails aren't
      // searched, so name is the right key.
      container.querySelectorAll('.perf-row__metric--clickable').forEach(function(el) {
        el.addEventListener('click', function() {
          var name = el.dataset.reviewerName;
          if (!name) return;
          self._filters.searchTerm = name;
          self._filters.status = 'pending';
          self._switchView('requests');
          document.querySelectorAll('.admin-nav__item').forEach(function(item) {
            item.classList.remove('admin-nav__item--active');
            if (item.dataset.view === 'requests') item.classList.add('admin-nav__item--active');
          });
          var searchEl = document.getElementById('filterSearch');
          if (searchEl) searchEl.value = name;
        });
      });
    },

    refreshDashboard() {
      this._dashboardLoaded = false;
      this._dashboardStats = null;
      this._actionCenterData = null;
      this._metricsData = null;
      this._loadDashboard();
    },

    // =========================================================================
    // REQUESTS TABLE (Phase 4)
    // =========================================================================

    _renderFilterPills() {
      var self = this;
      var container = document.getElementById('statusFilterPills');
      if (!container) return;

      // Pills grouped: quick filters → in-flight stages → decided
      // outcomes. A subtle divider between groups makes "what's still
      // moving" vs "what's settled" easier to parse at a glance.
      var pillGroups = [
        { items: [
          { key: 'all', label: 'All' },
          { key: 'pending', label: 'Pending' }
        ]},
        { items: [
          { key: 'PENDING_SECTOR', label: 'Sector' },
          { key: 'PENDING_BU', label: 'BU' },
          { key: 'PENDING_OSO', label: 'AAS FO' },
          { key: 'PENDING_FAS', label: 'FAS' }
        ]},
        { items: [
          { key: 'APPROVED_GOGOV', label: 'Approved' },
          { key: 'DENIED', label: 'Denied' },
          { key: 'CANCELLED', label: 'Cancelled' }
        ]}
      ];

      var html = '';
      pillGroups.forEach(function(group, gi) {
        if (gi > 0) html += '<span class="filter-pills__divider" aria-hidden="true"></span>';
        group.items.forEach(function(pill) {
          var isActive = self._filters.status === pill.key;
          html += '<button class="filter-pill' + (isActive ? ' filter-pill--active' : '') + '" data-status="' + pill.key + '">' +
            pill.label +
          '</button>';
        });
      });

      // International toggle (independent of status filters; separate
      // divider so it reads as a different control type).
      html += '<span class="filter-pills__divider" aria-hidden="true"></span>';
      html += '<button class="filter-pill filter-pill--toggle' + (self._filters.international ? ' filter-pill--active' : '') + '" data-filter="international">' +
        '<i aria-hidden="true" class="fas fa-globe" style="margin-right:3px"></i>International' +
      '</button>';

      container.innerHTML = html;

      // Status pill click handlers
      container.querySelectorAll('.filter-pill[data-status]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          container.querySelectorAll('.filter-pill[data-status]').forEach(function(b) { b.classList.remove('filter-pill--active'); });
          btn.classList.add('filter-pill--active');
          self._filters.status = btn.dataset.status;
          self._applyFiltersAndRender();
        });
      });

      // International toggle click handler (independent)
      var intlBtn = container.querySelector('.filter-pill[data-filter="international"]');
      if (intlBtn) {
        intlBtn.addEventListener('click', function() {
          self._filters.international = !self._filters.international;
          intlBtn.classList.toggle('filter-pill--active', self._filters.international);
          self._applyFiltersAndRender();
        });
      }
    },

    _setupFilters() {
      var self = this;

      // BU filter — wraps in .filter-input-wrap so the clear-X reveals
      // when a BU is selected. has-value class drives the X visibility.
      var buEl = document.getElementById('filterBU');
      var buWrap = document.getElementById('filterBUWrap');
      var buClear = document.getElementById('filterBUClear');
      var setBUHasValue = function() {
        if (!buWrap) return;
        if (buEl && buEl.value) buWrap.classList.add('has-value');
        else buWrap.classList.remove('has-value');
      };
      if (buEl) {
        buEl.addEventListener('change', function() {
          self._filters.buCode = buEl.value;
          setBUHasValue();
          self._applyFiltersAndRender();
        });
      }
      if (buClear && buEl) {
        buClear.addEventListener('click', function() {
          buEl.value = '';
          self._filters.buCode = '';
          setBUHasValue();
          self._applyFiltersAndRender();
        });
      }

      // Date range (Flatpickr) — same wrap pattern with a clear-X.
      var dateRangeEl = document.getElementById('filterDateRange');
      var dateWrap = document.getElementById('filterDateRangeWrap');
      var dateClear = document.getElementById('filterDateRangeClear');
      var setDateHasValue = function() {
        if (!dateWrap) return;
        if (dateRangeEl && dateRangeEl.value) dateWrap.classList.add('has-value');
        else dateWrap.classList.remove('has-value');
      };
      if (dateRangeEl && typeof flatpickr !== 'undefined') {
        var datePicker = flatpickr(dateRangeEl, {
          mode: 'range',
          dateFormat: 'Y-m-d',
          onChange: function(selectedDates) {
            if (selectedDates.length === 2) {
              self._filters.startDate = selectedDates[0].toISOString().split('T')[0];
              self._filters.endDate = selectedDates[1].toISOString().split('T')[0];
            } else {
              self._filters.startDate = '';
              self._filters.endDate = '';
            }
            setDateHasValue();
            self._applyFiltersAndRender();
          }
        });
        self._dateRangePicker = datePicker;
      }
      if (dateClear && dateRangeEl) {
        dateClear.addEventListener('click', function() {
          if (self._dateRangePicker) self._dateRangePicker.clear();
          dateRangeEl.value = '';
          self._filters.startDate = '';
          self._filters.endDate = '';
          setDateHasValue();
          self._applyFiltersAndRender();
        });
      }

      // Search
      var searchEl = document.getElementById('filterSearch');
      if (searchEl) {
        var searchTimeout;
        searchEl.addEventListener('input', function() {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(function() {
            self._filters.searchTerm = searchEl.value;
            self._applyFiltersAndRender();
          }, 300);
        });
      }
    },

    _setupSorting() {
      var self = this;
      var headers = document.querySelectorAll('.admin-table th.sortable');

      headers.forEach(function(th) {
        th.addEventListener('click', function() {
          var sortBy = th.dataset.sort;
          if (!sortBy) return;

          if (self._sort.sortBy === sortBy) {
            self._sort.sortDir = self._sort.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            self._sort.sortBy = sortBy;
            self._sort.sortDir = 'desc';
          }
          self._applyFiltersAndRender();
        });
      });
    },

    _populateBUFilter() {
      var buEl = document.getElementById('filterBU');
      if (!buEl) return;

      // Custom display order admins expect — Commissioners office first,
      // then OSO/AAS FO, then military and civilian groupings. Anything
      // not in this list falls to the bottom alphabetically.
      var preferredOrder = [
        'Commissioners office',
        'OSO',
        'Army',
        'Air Force',
        'Navy',
        'Space Force',
        'Civilian',
        'Defense'
      ];
      var orderIndex = function(name) {
        var lower = String(name || '').toLowerCase();
        for (var i = 0; i < preferredOrder.length; i++) {
          if (lower.indexOf(preferredOrder[i].toLowerCase()) === 0) return i;
        }
        return preferredOrder.length;
      };
      var sorted = (this._buCodes || []).slice().sort(function(a, b) {
        var ai = orderIndex(a);
        var bi = orderIndex(b);
        if (ai !== bi) return ai - bi;
        return String(a).localeCompare(String(b));
      });

      var html = '<option value="">All BUs</option>';
      sorted.forEach(function(bu) {
        html += '<option value="' + bu + '">' + bu + '</option>';
      });
      buEl.innerHTML = html;
    },

    /**
     * Load full request dataset from server (once).
     * Subsequent filter/sort/paginate operations are client-side via _applyFiltersAndRender().
     * Pass forceRefresh=true to re-fetch from server.
     */
    async _loadRequests(forceRefresh) {
      var loadingEl = document.getElementById('requestsLoading');
      var tableContainerEl = document.getElementById('requestsTableContainer');

      // If data already loaded and not forcing refresh, just re-filter
      if (this._allRequests && !forceRefresh) {
        this._applyFiltersAndRender();
        return;
      }

      if (loadingEl) loadingEl.classList.remove('hidden');
      if (tableContainerEl) tableContainerEl.classList.add('hidden');

      // Clear bulk selection on fresh load
      if (this._bulkSelectedIds) this._bulkSelectedIds.clear();
      this._updateBulkActionBar();

      // Render filter pills (in case status was changed externally)
      this._renderFilterPills();

      try {
        var result = await this._serverCall('getAllTravelRequests');

        if (!result || !result.success) {
          this._showToast('Error', (result && result.error) || 'Failed to load requests', 'error');
          if (loadingEl) loadingEl.classList.add('hidden');
          return;
        }

        var rdata = result.data || {};
        // Store full dataset
        this._allRequests = rdata.requests || [];

        if (rdata.distinctBUCodes && rdata.distinctBUCodes.length > 0) {
          this._buCodes = rdata.distinctBUCodes;
          this._populateBUFilter();
        }

        this._requestsLoaded = true;
        this._applyFiltersAndRender();

      } catch (error) {
        console.error('Error loading requests:', error);
        this._showToast('Error', error.message || 'Failed to load requests', 'error');
        if (loadingEl) loadingEl.classList.add('hidden');
      }
    },

    /**
     * Client-side filter + sort from _allRequests. Instant — no server call, no pagination.
     */
    _applyFiltersAndRender() {
      var self = this;
      var filtered = (this._allRequests || []).filter(function(r) {
        // Status filter
        if (self._filters.status && self._filters.status !== 'all') {
          if (self._filters.status === 'pending') {
            if (r.status.indexOf('PENDING_') !== 0 && r.status.indexOf('NEEDS_INFO_') !== 0) return false;
          } else if (r.status !== self._filters.status) {
            return false;
          }
        }

        // International toggle
        if (self._filters.international && !r.isInternational) return false;

        // BU filter
        if (self._filters.buCode && r.buCode !== self._filters.buCode) return false;

        // Date range
        if (self._filters.startDate) {
          var startDate = new Date(self._filters.startDate);
          if (new Date(r.submittedAt) < startDate) return false;
        }
        if (self._filters.endDate) {
          var endDate = new Date(self._filters.endDate);
          endDate.setHours(23, 59, 59, 999);
          if (new Date(r.submittedAt) > endDate) return false;
        }

        // Search
        if (self._filters.searchTerm) {
          var q = self._filters.searchTerm.toLowerCase();
          // Search across the fields users actually type into the box —
          // ID, trip name, submitter (name + email), reviewer name.
          var fields = [r.requestId, r.tripName, r.submitterName, r.submitterEmail, r.currentReviewerName].join(' ').toLowerCase();
          if (fields.indexOf(q) === -1) return false;
        }

        return true;
      });

      // Sort
      var sortBy = this._sort.sortBy || 'submittedAt';
      var sortDir = this._sort.sortDir || 'desc';
      var dateFields = { submittedAt: 1, updatedAt: 1, eventStartDate: 1 };
      var numFields = { grandTotal: 1, travelerCount: 1 };

      filtered.sort(function(a, b) {
        var aVal = a[sortBy], bVal = b[sortBy];
        if (dateFields[sortBy]) {
          aVal = aVal ? new Date(aVal).getTime() : 0;
          bVal = bVal ? new Date(bVal).getTime() : 0;
        } else if (numFields[sortBy]) {
          aVal = parseFloat(aVal) || 0;
          bVal = parseFloat(bVal) || 0;
        }
        if (sortDir === 'desc') return bVal > aVal ? 1 : bVal < aVal ? -1 : 0;
        return aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
      });

      this._requests = filtered;
      this._renderRequestsTable(filtered);
      this._updateRequestsCount(filtered.length, (this._allRequests || []).length);

      var loadingEl = document.getElementById('requestsLoading');
      var tableContainerEl = document.getElementById('requestsTableContainer');
      if (loadingEl) loadingEl.classList.add('hidden');
      if (tableContainerEl) tableContainerEl.classList.remove('hidden');
    },

    /**
     * Show "Showing X of Y" near the filters. When the filter set is
     * the default (no narrowing), shows just "Y requests" since the
     * "X of Y" feels noisy when X === Y.
     */
    _updateRequestsCount(shown, total) {
      var el = document.getElementById('requestsRowCount');
      if (!el) return;
      if (!total) {
        el.textContent = '';
        return;
      }
      var fmt = function(n) { return Number(n).toLocaleString('en-US'); };
      el.textContent = (shown === total)
        ? fmt(total) + (total === 1 ? ' request' : ' requests')
        : 'Showing ' + fmt(shown) + ' of ' + fmt(total);
    },

    /**
     * Patch a single request in the local dataset after a server action (override, reassign).
     * Avoids full server reload.
     */
    _patchLocalRequest(requestId, updates) {
      if (!this._allRequests) return;
      for (var i = 0; i < this._allRequests.length; i++) {
        if (this._allRequests[i].requestId === requestId) {
          for (var key in updates) {
            if (updates.hasOwnProperty(key)) {
              this._allRequests[i][key] = updates[key];
            }
          }
          break;
        }
      }
      this._applyFiltersAndRender();
    },

    /**
     * Remove request(s) from the local dataset after deletion.
     */
    _removeLocalRequests(requestIds) {
      if (!this._allRequests) return;
      var idSet = {};
      for (var i = 0; i < requestIds.length; i++) idSet[requestIds[i]] = true;
      this._allRequests = this._allRequests.filter(function(r) { return !idSet[r.requestId]; });
      this._applyFiltersAndRender();
    },

    _renderRequestsTable(requests) {
      var self = this;
      var tbody = document.getElementById('requestsTableBody');
      if (!tbody) return;

      // Update sort indicators
      document.querySelectorAll('.admin-table th.sortable').forEach(function(th) {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.sort === self._sort.sortBy) {
          th.classList.add('sorted-' + self._sort.sortDir);
        }
      });

      if (requests.length === 0) {
        // Fuller empty state — icon + title + helper instead of bare text.
        tbody.innerHTML = '<tr class="admin-table__empty-row"><td colspan="11" class="admin-table__empty">' +
          '<i aria-hidden="true" class="fas fa-filter-circle-xmark"></i>' +
          '<div class="admin-table__empty-title">No requests match your filters</div>' +
          '<div class="admin-table__empty-help">Try clearing the date range or selecting a different status</div>' +
        '</td></tr>';
        this._updateRequestsCount(0, (this._allRequests || []).length);
        return;
      }

      var rows = requests.map(function(req) {
        var statusDisplay = self._getStatusDisplay(req.status);
        var submittedDate = self._formatDate(req.submittedAt);
        var days = self._getDaysAtStage(req.updatedAt);
        var daysClass = self._getDaysClass(days);
        var isChecked = self._bulkSelectedIds && self._bulkSelectedIds.has(req.requestId);
        var isTerminal = self._isTerminalStatus(req.status);

        // Terminal rows (Approved / Completed / Denied / Cancelled) suppress
        // the active-stage fields — Days at Stage and Reviewer don't apply
        // once the request has been finalized. Em-dash placeholders keep
        // column alignment without showing stale data.
        var daysCellHtml = isTerminal
          ? '<td class="days-cell days-cell--terminal" aria-label="Not applicable for finalized requests">—</td>'
          : '<td class="days-cell days-cell--' + daysClass + '">' + days + 'd</td>';
        var reviewerCellHtml = isTerminal
          ? '<td class="reviewer-cell reviewer-cell--terminal">—</td>'
          : '<td class="reviewer-cell">' + self._escapeHtml(req.currentReviewerName || '') + '</td>';

        return '<tr data-request-id="' + self._escapeHtml(req.requestId) + '"' + (isTerminal ? ' class="is-terminal"' : '') + '>' +
          '<td class="td-checkbox"><input type="checkbox" class="row-checkbox" data-rid="' + self._escapeHtml(req.requestId) + '"' + (isChecked ? ' checked' : '') + '></td>' +
          '<td><code style="font-size:0.7rem;">' + self._escapeHtml(req.requestId) + '</code></td>' +
          '<td title="' + self._escapeHtml(req.tripName || 'Untitled') + '"><div class="trip-name-clamp">' + self._escapeHtml(req.tripName || 'Untitled') + '</div></td>' +
          '<td class="submitter-cell">' +
            '<div class="submitter-cell__name">' + self._escapeHtml(req.submitterName || 'Unknown') + '</div>' +
            '<div class="submitter-cell__email">' + self._escapeHtml(req.submitterEmail || '') + '</div>' +
          '</td>' +
          '<td><span class="status-badge status-badge--' + statusDisplay.class + '">' + statusDisplay.label + '</span></td>' +
          '<td>' + self._escapeHtml(req.buCode || '') + '</td>' +
          '<td class="amount-cell">' + self._formatCurrency(req.grandTotal) + '</td>' +
          '<td>' + submittedDate + '</td>' +
          daysCellHtml +
          reviewerCellHtml +
          '<td class="actions-cell">' +
            '<button type="button" class="action-kebab" title="Actions" aria-haspopup="true" aria-expanded="false" ' +
              'data-rid="' + self._escapeHtml(req.requestId) + '" ' +
              'data-status="' + self._escapeHtml(req.status) + '" ' +
              'data-reviewer="' + self._escapeHtml(req.currentReviewerEmail || '') + '" ' +
              'data-terminal="' + (isTerminal ? '1' : '0') + '">' +
              '<i aria-hidden="true" class="fas fa-ellipsis-vertical"></i>' +
            '</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      tbody.innerHTML = rows;

      // Attach row click (open slide-in) and action button handlers
      tbody.querySelectorAll('tr[data-request-id]').forEach(function(row) {
        row.addEventListener('click', function(e) {
          // Don't open slide-in if clicking action buttons
          // Don't open slide-in if user clicked the kebab or its menu
          if (e.target.closest('.action-kebab') || e.target.closest('.action-menu')) return;
          var reqId = row.dataset.requestId;
          if (reqId) self._openSlideIn(reqId);
        });
      });

      // Kebab → action menu popover. One handler per row trigger;
      // menu DOM is created on demand and torn down on close.
      tbody.querySelectorAll('.action-kebab').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          self._openActionMenu(btn);
        });
      });

      // Row checkbox handlers — also toggle the row's .is-selected class
      // so the row gets visual feedback (brand-tinted bg + left border)
      // not just the checkbox tick.
      tbody.querySelectorAll('.row-checkbox').forEach(function(cb) {
        // Apply initial state to the parent row
        var initialRow = cb.closest('tr');
        if (initialRow && cb.checked) initialRow.classList.add('is-selected');

        cb.addEventListener('click', function(e) {
          e.stopPropagation();
        });
        cb.addEventListener('change', function() {
          var rid = cb.dataset.rid;
          var row = cb.closest('tr');
          if (cb.checked) {
            self._bulkSelectedIds.add(rid);
            if (row) row.classList.add('is-selected');
          } else {
            self._bulkSelectedIds.delete(rid);
            if (row) row.classList.remove('is-selected');
          }
          self._updateBulkActionBar();
        });
      });
    },

    // =========================================================================
    // SLIDE-IN PANEL (Phase 4)
    // =========================================================================

    _setupSlideInPanel() {
      var self = this;

      var backdrop = document.getElementById('slideinBackdrop');
      var closeBtn = document.getElementById('slideinClose');
      var openReviewBtn = document.getElementById('slideinOpenReview');
      var overrideBtn = document.getElementById('slideinOverride');
      var reassignBtn = document.getElementById('slideinReassign');

      if (backdrop) {
        backdrop.addEventListener('click', function() { self._closeSlideIn(); });
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', function() { self._closeSlideIn(); });
      }
      if (openReviewBtn) {
        openReviewBtn.addEventListener('click', function() {
          if (self._slideinRequestId) {
            window.TravelAdmin.navigateTo('review', { requestId: self._slideinRequestId });
          }
        });
      }
      if (overrideBtn) {
        overrideBtn.addEventListener('click', function() {
          var rid = self._slideinRequestId;
          if (!rid) return;
          var status = (self._slideinData && self._slideinData.status) || '';
          self._closeSlideIn();
          self.showOverrideModal(rid, status);
        });
      }
      if (reassignBtn) {
        reassignBtn.addEventListener('click', function() {
          var rid = self._slideinRequestId;
          if (!rid) return;
          var current = (self._slideinData && self._slideinData.currentReviewerEmail) || '';
          self._closeSlideIn();
          self.showReassignModal(rid, current);
        });
      }

      var deleteBtn = document.getElementById('slideinDelete');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', function() {
          if (self._slideinRequestId) {
            var rid = self._slideinRequestId;
            self._closeSlideIn();
            self.promptDeleteRequests([rid]);
          }
        });
      }
    },

    async _openSlideIn(requestId) {
      this._slideinRequestId = requestId;
      this._slideinData = null;
