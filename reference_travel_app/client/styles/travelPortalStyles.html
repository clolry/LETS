<!-- client/styles/travelPortalStyles.html -->
<!-- Styles for the Travel Request Portal page -->
<style>
/* ============================================
   AAS Brand Colors (standalone definition)
   ============================================ */
:root {
  /* AAS Brand Colors */
  --brand-dark: #424143;
  --brand-blue: #004f87;
  --brand-blue-dark: #003a66;
  --brand-gold: #F4D06F;
  --brand-orange: #CF4817;
  --brand-light-orange: #F19A4D;
  --brand-green: #286D3B;
  --brand-red: #522032;
  --brand-lightBlue: #1B7CAC;
  --brand-lightGrey: #F2F2F2;
  --brand-mediumGrey: #BBBDBF;
  --brand-darkGrey: #424143;
  --brand-bg-light: #FFFFFF;

  /* Portal Variables */
  --portal-primary: var(--brand-blue);
  --portal-primary-dark: var(--brand-blue-dark);
  --portal-accent: var(--brand-lightBlue);
  --portal-success: #10b981;
  --portal-warning: #f59e0b;
  --portal-danger: #ef4444;
  --portal-gray-50: #f8fafc;
  --portal-gray-100: #f1f5f9;
  --portal-gray-200: #e2e8f0;
  --portal-gray-300: #cbd5e1;
  --portal-gray-400: #94a3b8;
  --portal-gray-500: #64748b;
  --portal-gray-600: #475569;
  --portal-gray-700: #334155;
  --portal-gray-800: #1e293b;
  --portal-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --portal-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
  --portal-shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
  --portal-radius: 12px;
  --portal-radius-sm: 8px;

  /* Status Colors */
  --status-pending: #f59e0b;
  --status-pending-bg: #fef3c7;
  --status-pending-oso: #3b82f6;
  --status-pending-oso-bg: #dbeafe;
  --status-approved: #10b981;
  --status-approved-bg: #d1fae5;
  --status-needs-info: #ef4444;
  --status-needs-info-bg: #fee2e2;
  --status-completed: #6b7280;
  --status-completed-bg: #f3f4f6;
  --status-cancelled: #9ca3af;
  --status-cancelled-bg: #f3f4f6;
  --status-denied: #991b1b;
  --status-denied-bg: #fecaca;

  /* Sidebar */
  --sidebar-width: 280px;
}

/* ============================================
   Welcome Loader
   ============================================ */
.welcome-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease;
}

.welcome-loader--hidden {
  opacity: 0;
  pointer-events: none;
}

.welcome-loader--removed {
  display: none;
}

.welcome-loader__content {
  width: min(720px, 92vw);
}

.welcome-loader__content svg {
  width: 100%;
  height: auto;
}

/* ============================================
   Utility Classes
   ============================================ */
.hidden { display: none !important; }
.visible { display: block !important; }
.visible-flex { display: flex !important; }
.visible-inline { display: inline !important; }
.visible-inline-block { display: inline-block !important; }

/* Skip Link for Accessibility */
.skip-link {
  position: absolute;
  top: -100%;
  left: 0;
  background: var(--portal-primary);
  color: white;
  padding: 0.75rem 1.25rem;
  z-index: 10000;
  font-weight: 600;
  font-size: 0.875rem;
  text-decoration: none;
  border-radius: 0 0 8px 0;
  transition: top 0.2s ease;
}

.skip-link:focus {
  top: 0;
  outline: 2px solid var(--brand-gold);
  outline-offset: 2px;
}

/* ============================================
   Base Reset
   ============================================ */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

/* ============================================
   Body & Layout
   ============================================ */
.travel-portal-body {
  font-family: var(--font-sans);
  background: var(--portal-gray-100);
  height: 100vh;
  padding-top: 52px;
  overflow: hidden;
}

.travel-main {
  height: calc(100vh - 52px);
  overflow: hidden;
}

.travel-portal-layout {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  height: 100%;
  overflow: hidden;
}

/* ============================================
   Header
   ============================================ */
.travel-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: linear-gradient(135deg, var(--portal-primary) 0%, var(--portal-primary-dark) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.25rem;
  z-index: 1000;
  box-shadow: var(--portal-shadow);
}

.travel-header__left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.travel-header__title h1 {
  margin: 0;
}

.travel-header__right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.travel-header__user {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.9);
}

.travel-header__admin-link {
  display: flex;
  align-items: center;
  padding: 0.35rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  text-decoration: none;
  transition: all 0.15s ease;
}

.travel-header__admin-link:hover {
  background: rgba(255, 255, 255, 0.2);
  color: white;
}

/* Modernized role-switch pills (Admin / Reviewer Dashboard).
   Subtler default, crisper hover, slightly tighter spacing than the
   legacy admin-link class. Both pills share this surface so they read
   as a connected set when an admin sees both. */
.travel-header__role-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.85rem;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: rgba(255, 255, 255, 0.92);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  text-decoration: none;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
  white-space: nowrap;
}

.travel-header__role-link i {
  font-size: 0.82rem;
  opacity: 0.85;
}

.travel-header__role-link:hover {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.32);
  color: #fff;
  transform: translateY(-1px);
}

.travel-header__role-link:hover i {
  opacity: 1;
}

.travel-header__role-link:active {
  transform: translateY(0);
  background: rgba(255, 255, 255, 0.22);
}

/* On narrow viewports, drop the label and show the icon only so the
   header stays tidy without losing the affordance. */
@media (max-width: 640px) {
  .travel-header__role-link {
    padding: 0.45rem;
    width: 36px;
    height: 36px;
    justify-content: center;
    border-radius: 50%;
  }
  .travel-header__role-link span {
    display: none;
  }
}

.travel-header__menu-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: background 0.15s ease;
}

.travel-header__menu-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.travel-header__menu-btn i {
  font-size: 1rem;
}

/* ============================================
   Sidebar Overlay (Mobile)
   ============================================ */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.sidebar-overlay--visible {
  display: block;
  opacity: 1;
}

/* ============================================
   Sidebar
   ============================================ */
.portal-sidebar {
  background: white;
  border-right: 1px solid var(--portal-gray-200);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  height: calc(100vh - 52px);
  overflow-y: auto;
}

.portal-sidebar__new-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  width: 100%;
  padding: 0.65rem 0.875rem;
  background: linear-gradient(135deg, var(--portal-primary) 0%, var(--portal-accent) 100%);
  color: white;
  border: none;
  border-radius: var(--portal-radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: var(--portal-shadow-sm);
}

.portal-sidebar__new-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--portal-shadow);
}

.portal-sidebar__new-btn i {
  font-size: 0.75rem;
}

.portal-sidebar__section {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.portal-sidebar__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 0.5rem;
  margin-bottom: 0.4rem;
  border-bottom: 1px solid var(--portal-gray-200);
}

.portal-sidebar__title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--portal-gray-500);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.portal-sidebar__title i {
  font-size: 0.65rem;
}

.portal-sidebar__count {
  background: var(--portal-gray-200);
  color: var(--portal-gray-600);
  font-size: 0.6rem;
  font-weight: 600;
  padding: 0.15rem 0.4rem;
  border-radius: 10px;
}

.portal-sidebar__list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.portal-sidebar__empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1.5rem 0.75rem;
  color: var(--portal-gray-400);
  font-size: 0.75rem;
  gap: 0.35rem;
}

.portal-sidebar__empty i {
  font-size: 1.25rem;
  opacity: 0.4;
  margin-bottom: 0.25rem;
}

.portal-sidebar__empty p {
  margin: 0;
  font-weight: 500;
  color: var(--portal-gray-500);
}

.portal-sidebar__empty span {
  font-size: 0.65rem;
  opacity: 0.8;
}

/* ============================================
   Sidebar Draft Cards
   ============================================ */
.sidebar-draft {
  background: var(--portal-gray-50);
  border: 1px solid var(--portal-gray-200);
  border-radius: 6px;
  padding: 0.55rem 0.65rem;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}

.sidebar-draft:hover {
  background: white;
  border-color: var(--portal-primary);
  box-shadow: var(--portal-shadow-sm);
}

.sidebar-draft__title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--portal-gray-800);
  margin: 0 0 0.25rem 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 1.25rem;
}

.sidebar-draft__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  font-size: 0.65rem;
  color: var(--portal-gray-500);
}

.sidebar-draft__meta span {
  display: flex;
  align-items: center;
  gap: 0.2rem;
}

.sidebar-draft__meta i {
  font-size: 0.55rem;
}

.sidebar-draft__actions {
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  display: flex;
  gap: 0.2rem;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.sidebar-draft:hover .sidebar-draft__actions {
  opacity: 1;
}

.sidebar-draft__delete {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 3px;
  color: var(--portal-gray-400);
  cursor: pointer;
  font-size: 0.6rem;
  transition: all 0.15s ease;
}

.sidebar-draft__delete:hover {
  background: var(--status-needs-info-bg);
  color: var(--portal-danger);
}

/* Inline delete confirmation state */
.sidebar-draft--confirming {
  background: #fef2f2;
  border-color: var(--portal-danger);
  cursor: default;
}

.sidebar-draft__confirm {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 0.15rem 0;
}

.sidebar-draft__confirm-text {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--portal-danger);
}

.sidebar-draft__confirm-text i {
  font-size: 0.7rem;
}

.sidebar-draft__confirm-actions {
  display: flex;
  gap: 0.4rem;
}

.sidebar-draft__confirm-cancel,
.sidebar-draft__confirm-delete {
  flex: 1;
  padding: 0.3rem 0.5rem;
  font-size: 0.65rem;
  font-weight: 500;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  transition: all 0.15s ease;
}

.sidebar-draft__confirm-cancel {
  background: var(--portal-gray-200);
  color: var(--portal-gray-600);
}

.sidebar-draft__confirm-cancel:hover {
  background: var(--portal-gray-300);
}

.sidebar-draft__confirm-delete {
  background: var(--portal-danger);
  color: white;
}

.sidebar-draft__confirm-delete:hover {
  background: #b91c1c;
}

/* Deleting animation */
.sidebar-draft--deleting {
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.2s ease;
}

/* ============================================
   Main Content Area
   ============================================ */
.portal-content {
  padding: 1.25rem;
  background: var(--portal-gray-50);
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  height: 100%;
}

/* ============================================
   Portal Sections
   ============================================ */
.portal-section {
  background: white;
  border-radius: var(--portal-radius-sm);
  box-shadow: var(--portal-shadow-sm);
  display: flex;
  flex-direction: column;
  flex: 0 1 auto;
  min-height: 0;
  /* Viewport-aware max-height: 50vh minus header (52px) and padding/gap buffer */
  max-height: calc(50vh - 60px);
  overflow: hidden;
  /* Constrain width on large screens */
  width: 100%;
  max-width: 1200px;
}

.portal-section__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.65rem 1rem;
  background: var(--portal-gray-50);
  border-bottom: 1px solid var(--portal-gray-200);
  position: sticky;
  top: 0;
  z-index: 10;
  transition: box-shadow 0.2s ease;
}

.portal-section__header.scrolled {
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.portal-section__header h2 {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--portal-gray-700);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.portal-section__header h2 i {
  color: var(--portal-primary);
  font-size: 0.75rem;
}

.portal-section__count {
  background: var(--portal-gray-200);
  color: var(--portal-gray-600);
  font-size: 0.65rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 20px;
}

.portal-section__body {
  padding: 0;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
  transition: scrollbar-color 0.2s ease;
}

.portal-section__body:hover {
  scrollbar-color: var(--portal-gray-300) transparent;
}

.portal-section__body::-webkit-scrollbar {
  width: 6px;
}

.portal-section__body::-webkit-scrollbar-track {
  background: transparent;
}

.portal-section__body::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: 3px;
  transition: background 0.2s ease;
}

.portal-section__body:hover::-webkit-scrollbar-thumb {
  background: var(--portal-gray-300);
}

.portal-section__body::-webkit-scrollbar-thumb:hover {
  background: var(--portal-gray-400);
}

/* ============================================
   Section Filter
   ============================================ */
.portal-section__filter {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid var(--portal-gray-100);
  background: white;
  flex-wrap: wrap;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.6rem;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--portal-gray-500);
  background: var(--portal-gray-100);
  border: 1px solid transparent;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filter-chip:hover {
  background: var(--portal-gray-200);
  color: var(--portal-gray-700);
}

.filter-chip--active {
  background: var(--portal-primary);
  color: white;
  border-color: var(--portal-primary);
}

.filter-chip--active:hover {
  background: var(--portal-primary-dark);
  color: white;
}

.filter-chip i {
  font-size: 0.6rem;
}

.filter-chip__count {
  font-size: 0.6rem;
  font-weight: 600;
  opacity: 0.8;
}

.filter-chip__count:empty {
  display: none;
}

.filter-chip--active .filter-chip__count {
  opacity: 0.9;
}

/* ============================================
   Action Required Section
   ============================================ */
.portal-section--action {
  border: 1px solid var(--portal-warning);
  background: linear-gradient(180deg, #fffbeb 0%, white 100%);
}

.portal-section__header--action {
  background: var(--status-pending-bg);
  border-bottom-color: #fde68a;
}

.portal-section__header--action h2 {
  color: #92400e;
}

.portal-section__header--action h2 i {
  color: var(--portal-warning);
}

.portal-section__count--action {
  background: var(--portal-warning);
  color: white;
}

/* ============================================
   Action Cards
   ============================================ */
.action-card {
  display: flex;
  align-items: center;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--portal-gray-100);
  gap: 0.75rem;
  transition: background 0.15s ease, transform 0.15s ease;
}

.action-card:hover {
  background: rgba(245, 158, 11, 0.04);
  transform: translateX(2px);
}

.action-card:last-child {
  border-bottom: none;
}

.action-card__icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.8rem;
}

.action-card__icon--needs-info {
  background: var(--status-needs-info-bg);
  color: var(--status-needs-info);
}

.action-card__icon--review {
  background: var(--status-pending-bg);
  color: var(--status-pending);
}

.action-card__icon--fas {
  background: rgba(0, 79, 135, 0.1);
  color: var(--portal-primary);
}

.action-card__content {
  flex: 1;
  min-width: 0;
}

.action-card__title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--portal-gray-800);
  margin: 0 0 0.15rem 0;
}

.action-card__info {
  font-size: 0.7rem;
  color: var(--portal-gray-500);
}

.action-card__actions {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.action-card__submitter {
  font-size: 0.65rem;
  color: var(--portal-gray-500);
  white-space: nowrap;
}

.action-card__days {
  font-size: 0.6rem;
  font-weight: 600;
  color: var(--portal-gray-500);
  background: var(--portal-gray-100);
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  white-space: nowrap;
}

.action-card__days--warning {
  color: var(--portal-warning);
  background: var(--status-pending-bg);
}

.action-card__days--urgent {
  color: var(--portal-danger);
  background: var(--status-needs-info-bg);
}

.action-card__actions .btn {
  font-size: 0.7rem;
  padding: 0.25rem 0.6rem;
  font-weight: 500;
}

/* ============================================
   Request Cards
   ============================================ */
.request-card {
  display: flex;
  align-items: center;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--portal-gray-100);
  transition: background 0.15s ease;
  gap: 0.75rem;
}

.request-card:hover {
  background: var(--portal-gray-50);
}

.request-card:last-child {
  border-bottom: none;
}

.request-card__status {
  flex-shrink: 0;
  min-width: 130px;
}

.request-card__content {
  flex: 1;
  min-width: 0;
}

.request-card__title {
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--portal-gray-800);
  margin: 0 0 0.15rem 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.request-card__meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.75rem;
  color: var(--portal-gray-500);
}

.request-card__meta span {
  display: flex;
  align-items: center;
  gap: 0.2rem;
}

.request-card__meta span:first-child {
  min-width: 100px;
}

.request-card__total {
  font-weight: 600;
  color: var(--portal-gray-700);
  min-width: 65px;
}

.request-card__actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
