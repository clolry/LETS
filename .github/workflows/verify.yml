# Pull-request verification gate.
#
# This workflow replaces the deploy-on-pull_request behavior that was removed
# from deploy-gas.yml. It runs the local test suites and safety guards and
# DELIBERATELY USES NO CREDENTIALS — it has no access to CLASPRC_JSON and
# therefore cannot deploy to any Google Apps Script project, including from
# fork PRs.
#
# Controls: SA-11 (developer testing), CM-3 (change control), AC-6 (least
# privilege). AGENTS.md §14.3 (verification transcript), §15.3 (one-command
# verify), §12.3 (regression tests for fixed bugs).

name: Verify

on:
  pull_request:
  workflow_dispatch:

# Read-only. No credentials are referenced anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and Safety Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to the documented floor in PROJECT_PLAN.md ("Node.js 20+").
          node-version: '20'

      - name: Budget engine unit tests
        run: node lets_app/test_budget_engine.js

      - name: FAS tracker environment isolation tests
        run: node lets_app/test_fas_tracker_env.js

      - name: LETS_CONFIG global binding tests
        run: node lets_app/test_budget_config_global.js

      # --- Regression guards -------------------------------------------------
      # These encode the fixes in this change so they cannot silently regress
      # later (AGENTS.md §12.3).

      - name: 'Guard: LETS_CONFIG must be declared with var, not const/let'
        run: |
          echo "Checking the LETS_CONFIG declaration keyword..."
          # LetsDB.js, BudgetEngine.js and RequestService.js all read this as
          # `root.LETS_CONFIG`. In the Apps Script V8 runtime a top-level
          # const/let creates a lexical binding that is NOT a property of the
          # global object, so root.LETS_CONFIG would be undefined and
          # LetsDB.js:20 throws at FILE EVALUATION time — taking down the whole
          # web app, not just the budget layer.
          #
          # test_budget_config_global.js already asserts this and carries a
          # negative control. This guard is a second, cheaper signal that names
          # the consequence directly in the build log, because the failure mode
          # is a total outage and the fix is one keyword.
          if ! grep -qE '^var LETS_CONFIG[[:space:]]*=' lets_app/server/00_config/BudgetConfig.js; then
            echo "::error file=lets_app/server/00_config/BudgetConfig.js::LETS_CONFIG is not declared with 'var'. Three files read it as root.LETS_CONFIG, which is undefined for a const/let declaration under Apps Script V8. This breaks the ENTIRE web app at file-evaluation time. Restore 'var LETS_CONFIG = {'."
            exit 1
          fi
          echo "PASS - LETS_CONFIG is declared with var."

      - name: 'Guard: deploy workflow must not trigger on pull_request'
        run: |
          echo "Checking that deploy-gas.yml has no pull_request trigger..."
          if grep -qE '^[[:space:]]*pull_request[[:space:]]*:' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::deploy-gas.yml has a 'pull_request' trigger. That deploys unreviewed code to the production GAS project. Remove it; PRs are verified by verify.yml instead."
            exit 1
          fi
          echo "PASS - deploy workflow does not run on pull_request."

      - name: 'Guard: this workflow must stay credential-free'
        run: |
          echo "Checking that verify.yml interpolates no repository credentials..."
          # Matches a real GitHub Actions credential interpolation, not prose.
          # (This comment deliberately avoids writing the pattern literally,
          # so the guard does not match its own source.)
          if grep -qE '\$\{\{[[:space:]]*secrets\.' .github/workflows/verify.yml; then
            echo "::error file=.github/workflows/verify.yml::verify.yml interpolates a repository secret. It executes untrusted pull_request code and must never hold deploy credentials."
            exit 1
          fi
          echo "PASS - verify workflow interpolates no credentials."

      - name: 'Guard: deploy job must stay behind an environment gate'
        run: |
          echo "Checking that the deploy job declares environment:..."
          # The `environment:` key is what makes GitHub apply the required
          # reviewer / prevent-self-review / deployment-branch rules BEFORE the
          # job starts, and what scopes CLASPRC_JSON once it is moved to
          # environment scope. Deleting this one line silently removes the
          # human gate on production deploys while the workflow still looks
          # correct and still goes green (CM-5; AGENTS.md §14.2).
          if ! grep -qE '^[[:space:]]*environment:' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::deploy-gas.yml has no 'environment:' key. The production deploy would run with no required-reviewer gate. Restore 'environment: \${{ needs.resolve.outputs.env_name }}' on the deploy job."
            exit 1
          fi
          # The gate must be driven by the credential-free resolve job, not a
          # literal, so the two deploy targets cannot be conflated.
          if ! grep -qE 'environment:.*needs\.resolve\.outputs\.env_name' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::'environment:' is present but is not derived from needs.resolve.outputs.env_name. A hardcoded environment name would let a sandbox push deploy under the production gate, or vice versa."
            exit 1
          fi
          echo "PASS - deploy job is gated by the resolved environment."

      - name: 'Guard: no hardcoded spreadsheet IDs in application source'
        run: |
          echo "Checking that no spreadsheet/script ID is hardcoded in lets_app/server..."
          # Spreadsheet and script IDs are environment configuration and must be
          # read from Script Properties, never embedded in source (AGENTS.md
          # §4.1 "never hardcode connection strings"; §12.1 config-from-code).
          #
          # Deliberately a generic length pattern rather than a list of real
          # IDs, so this guard does not itself disclose any identifier. Google
          # Sheets IDs are 44 chars and Apps Script IDs are 57; the 40-char
          # floor catches both. `-a` is required because one source file trips
          # grep's binary heuristic on high-byte UTF-8 characters.
          if grep -raEn "['\"]1[A-Za-z0-9_-]{39,}['\"]" lets_app/server/; then
            echo "::error::A spreadsheet or script ID literal appears in lets_app/server/. Move it to a Script Property and read it via 00_config."
            exit 1
          fi
          echo "PASS - no hardcoded spreadsheet or script IDs in application source."
