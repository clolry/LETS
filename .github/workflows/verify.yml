# Pull-request verification gate.
#
# This workflow replaces the deploy-on-pull_request behavior that was removed
# from deploy-gas.yml. It runs the local test suites and safety guards and
# DELIBERATELY USES NO CREDENTIALS — it has no access to CLASPRC_JSON and
# therefore cannot deploy to any Google Apps Script project, including from
# fork PRs.
#
# Controls: SA-11 (developer testing), CM-3 (change control), AC-6 (least
# privilege). AGENTS.md §14.3 (verification transcript), §15.3 (one-command
# verify), §12.3 (regression tests for fixed bugs).

name: Verify

on:
  pull_request:
  workflow_dispatch:

# Read-only. No credentials are referenced anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and Safety Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to the documented floor in PROJECT_PLAN.md ("Node.js 20+").
          node-version: '20'

      - name: Budget engine unit tests
        run: node lets_app/test_budget_engine.js

      - name: FAS tracker environment isolation tests
        run: node lets_app/test_fas_tracker_env.js

      - name: LETS_CONFIG global binding tests
        run: node lets_app/test_budget_config_global.js

      - name: HC data layer tests
        run: node lets_app/test_hc_data.js

      - name: Other-cost percentage config tests
        run: node lets_app/test_other_cost_percentage.js

      - name: City pair airfare tests
        run: node lets_app/test_city_pairs.js

      - name: Access audit (G-008) tests
        run: node lets_app/test_access_audit.js

      - name: Airport selection and preference tests
        run: node lets_app/test_airport_prefs.js

      - name: Diagnostics smoke tests
        run: node lets_app/test_diagnostics.js

      - name: Cache warming tests
        run: node lets_app/test_cache_warming.js

      # --- Regression guards -------------------------------------------------
      # These encode the fixes in this change so they cannot silently regress
      # later (AGENTS.md §12.3).

      - name: 'Guard: HC must be declared with var, not const/let'
        run: |
          echo "Checking the HC declaration keyword..."
          # Same failure mode as LETS_CONFIG below, and the same consequence.
          # 28 call sites across 9 server files reference the HC namespace.
          if ! grep -qE '^var HC[[:space:]]*=' lets_app/server/20_data/HCData.js; then
            echo "::error file=lets_app/server/20_data/HCData.js::HC is not declared with 'var'. A top-level const/let is not a property of the global object under Apps Script V8. 28 call sites depend on this namespace. Restore 'var HC = '."
            exit 1
          fi
          echo "PASS - HC is declared with var."

      - name: 'Guard: org chart projection must not emit PII'
        run: |
          echo "Checking the org chart projection for sensitive fields..."
          # hcGetOrgChartTree feeds a SEPARATE Apps Script project that any
          # domain user can open with the link. Its reduced payload — workgroup
          # name, supervisor name, employee names — IS the access control for
          # that deployment, because there is no role check behind it.
          #
          # test_hc_data.js §10 serializes the real payload and asserts no
          # sensitive value appears. This guard is a cheaper structural check
          # that fails the build if someone adds a sensitive field to the node
          # literal, and names the consequence in the log.
          BODY=$(awk '/function hcGetOrgChartTree/,/^  }$/' lets_app/server/20_data/HCData.js)
          for FIELD in emailAddress employeeId supervisoryStatus locationCode occupancyStatus; do
            if echo "$BODY" | grep -qE "(^|[^a-zA-Z_])${FIELD}[^a-zA-Z_]*:" ; then
              echo "::error file=lets_app/server/20_data/HCData.js::hcGetOrgChartTree emits '${FIELD}'. That projection is served by the org chart deployment, which any domain user can open with the link and which has no role check. It must emit only workgroup name, supervisor name and employee names."
              exit 1
            fi
          done
          # `grade` and the duty-station fields are checked separately because
          # 'grade' appears legitimately in the GS-15 predicate comment above.
          if echo "$BODY" | grep -qE "(grade|dutyStation|location)[[:space:]]*:"; then
            echo "::error file=lets_app/server/20_data/HCData.js::hcGetOrgChartTree emits a grade or duty-station field. See the comment above this guard."
            exit 1
          fi
          echo "PASS - org chart projection emits no sensitive fields."

      - name: 'Guard: seed data must not contain real email addresses'
        run: |
          echo "Checking HCSeed.js for non-example.gov addresses..."
          # HCSeed.js is fictional test data. Every address must stay on the
          # RFC 2606 reserved example.gov domain so a stray notification cannot
          # reach a real mailbox, and so the roster can never be mistaken for
          # a real one. A real address here would also grant its owner LETS
          # access through canAccessTrip (Access.js:416) once seeded.
          if grep -oE '[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+' lets_app/server/91_setup/HCSeed.js \
             | grep -v '@example\.gov' | grep . ; then
            echo "::error file=lets_app/server/91_setup/HCSeed.js::HCSeed.js contains an address outside example.gov. Seed data must stay fictional; a real address here is seeded into HC_Positions and grants that person LETS access via canAccessTrip."
            exit 1
          fi
          echo "PASS - all seed addresses are on example.gov."

      - name: 'Guard: client must not hardcode the other-cost percentage'
        run: |
          echo "Checking for hardcoded gross-up percentages in the client..."
          # The percentage is configurable via the `other_cost_percentage`
          # Script Property. A literal in the client silently overrides it,
          # because Costs.js:675 prefers whatever percentage the row carries —
          # so the form would display one number and store another.
          #
          # Callers must use TravelRequest.getOtherCostPercentage() or
          # TravelCostService.getOtherCostPercentage().
          if grep -nE "otherPercentage[[:space:]]*[:=][[:space:]]*[0-9]+" \
               lets_app/client/controllers/form/travelRequestState.html \
               lets_app/client/shared/travelCostService.html; then
            echo "::error::A hardcoded otherPercentage literal was found in the client. Use getOtherCostPercentage() instead; a literal silently overrides the configured other_cost_percentage Script Property."
            exit 1
          fi
          if grep -nE "percentage[[:space:]]*=[[:space:]]*[0-9]+" \
               lets_app/client/shared/travelCostService.html; then
            echo "::error file=lets_app/client/shared/travelCostService.html::calculateOtherCosts has a hardcoded default percentage. Leave the parameter undefined so it resolves from the configured value."
            exit 1
          fi
          echo "PASS - no hardcoded gross-up percentage in the client."

      - name: 'Guard: HC-derived access must stay logged and switchable'
        run: |
          echo "Checking the G-008 access-audit controls are still wired..."
          # canAccessTrip grants site access from HR data on two of its three
          # paths, with no row in Travel_User_Roles and no admin-console
          # visibility. Those grants must stay (a) logged and (b) disableable
          # without a deploy, or G-008 reopens silently.
          for FN in _logAccessDecision_ isHcDerivedAccessEnabled getAccessInventory; do
            if ! grep -q "function ${FN}" lets_app/server/30_services/Access.js; then
              echo "::error file=lets_app/server/30_services/Access.js::${FN} is missing. HC-derived access grants must remain logged and switchable (G-008)."
              exit 1
            fi
          done
          # Each allow-path must log before returning. Three GRANTED calls, one
          # per path, plus the DENIED paths.
          GRANTS=$(grep -c "_logAccessDecision_(emailLower, 'GRANTED'" lets_app/server/30_services/Access.js || true)
          if [ "$GRANTS" -lt 3 ]; then
            echo "::error file=lets_app/server/30_services/Access.js::Expected 3 GRANTED log calls in canAccessTrip (one per allow-path), found ${GRANTS}. An unlogged allow-path is exactly the G-008 defect."
            exit 1
          fi
          echo "PASS - access decisions are logged and the kill switch is present."

      - name: 'Guard: bulk fare lookups must warm the single-lookup cache'
        run: |
          echo "Checking getCityPairFaresBulk writes through to the cache..."
          # A cold fare lookup scans all 17,403 City_Pairs rows (2.7s measured
          # in the sandbox). warmCityPairCache pre-warms common routes via the
          # bulk reader, so the bulk reader MUST write the same cache keys
          # getCityPairFare reads.
          #
          # It originally did not. Warming ran, reported success, and left
          # every later lookup paying the full cold scan — a feature that was
          # entirely decorative with no visible failure.
          if ! grep -q "cp_fare_' + key" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::getCityPairFaresBulk no longer writes cp_fare_ cache entries. Cache warming becomes a no-op and every fare lookup pays a 2.7s cold scan, silently."
            exit 1
          fi
          echo "PASS - bulk lookups warm the single-lookup cache."

      - name: 'Guard: diagAll members must take no arguments'
        run: |
          echo "Checking every diagAll member is zero-arity..."
          # The Apps Script editor CANNOT pass arguments — the Run button always
          # calls with none. A diagnostic that requires a parameter is
          # unrunnable from the editor, which defeats the purpose of having a
          # committed diagnostics file at all. @clolry hit this with
          # diagCityNamesForState('TX').
          for FN in $(grep -oE '^  diag[A-Za-z]+\(\);$' lets_app/server/99_triggers/Diagnostics.js | tr -d ' ();'); do
            if ! grep -qE "function ${FN}\(\)" lets_app/server/99_triggers/Diagnostics.js; then
              echo "::error file=lets_app/server/99_triggers/Diagnostics.js::${FN} is called by diagAll but does not have a zero-argument signature. The editor Run button cannot pass arguments, so it would be unrunnable by hand."
              exit 1
            fi
          done
          echo "PASS - every diagAll member is zero-arity."

      - name: 'Guard: diagnostics must stay read-only'
        run: |
          echo "Checking Diagnostics.js performs no writes..."
          # Diagnostics.js is run by hand against live environments, including
          # production. A mutating call in here is a foot-gun: the whole point
          # is that it is safe to run anywhere at any time.
          for OP in setValue setValues appendRow deleteRow insertSheet \
                    clearContent setProperty deleteProperty createTrigger; do
            if grep -q "${OP}(" lets_app/server/99_triggers/Diagnostics.js; then
              echo "::error file=lets_app/server/99_triggers/Diagnostics.js::Diagnostics.js calls ${OP}(). Diagnostics are run by hand against production and must stay read-only. Move anything that writes into 91_setup/ with its own authorization guard."
              exit 1
            fi
          done
          echo "PASS - diagnostics are read-only."

      - name: 'Guard: sheet writes that are re-read must flush'
        run: |
          echo "Checking SpreadsheetApp.flush() after preference writes..."
          # Apps Script BUFFERS sheet writes. recordAirportPreference writes
          # then may be called again in the same execution, so without a flush
          # the second call reads a stale getLastRow(), finds no existing row,
          # and appends onto the SAME physical row — overwriting the first.
          #
          # Observed in the sandbox: two calls produced one row with Use_Count
          # 1, so promotion never fired and the hybrid-learning feature was
          # entirely inert. The failure is silent; nothing errors.
          FLUSHES=$(grep -c "SpreadsheetApp.flush()" lets_app/server/30_services/AirportPrefs.js || true)
          if [ "$FLUSHES" -lt 2 ]; then
            echo "::error file=lets_app/server/30_services/AirportPrefs.js::Expected a SpreadsheetApp.flush() after both the update and the append path in recordAirportPreference, found ${FLUSHES}. Without it Use_Count cannot increment and airport preferences never get promoted."
            exit 1
          fi
          if ! grep -q "LockService.getScriptLock()" lets_app/server/30_services/AirportPrefs.js; then
            echo "::error file=lets_app/server/30_services/AirportPrefs.js::recordAirportPreference lost its LockService guard. Concurrent submissions clobber the same preference row."
            exit 1
          fi
          echo "PASS - preference writes flush and are serialized."

      - name: 'Guard: metro-area codes must never win an airport default'
        run: |
          echo "Checking the metro-aware airport sort..."
          # WAS is an IATA metropolitan-area code covering DCA, IAD and BWI.
          # In the real GSA data it carries MORE routes than DCA (260 vs 254),
          # so a plain route-count sort makes an unbookable aggregate the
          # default origin for Washington. Nothing in the CSV marks these, so
          # the IATA_METRO_CODES list and the sort that demotes them are the
          # only defence.
          if ! grep -q "IATA_METRO_CODES" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::IATA_METRO_CODES is missing. Without it, metro aggregates like WAS outrank real airports on route count and become the default."
            exit 1
          fi
          if ! grep -q "a.isMetroArea ? 1 : -1" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::The airport sort no longer demotes metro-area codes. WAS has more routes than DCA in the real data and will win the default."
            exit 1
          fi
          echo "PASS - metro-area codes sort last."

      - name: 'Guard: city pair keys must be alphabetically normalized'
        run: |
          echo "Checking buildPairKey_ still sorts its inputs..."
          # GSA stores every pair with origin and destination in ALPHABETICAL
          # order regardless of travel direction, so DCA->ORD and ORD->DCA are
          # the same row. buildPairKey_ is the only place that ordering is
          # decided, and both the sync and the lookup depend on it.
          #
          # Removing the sort makes reverse-direction lookups return "no
          # contract fare awarded" for routes that have one — silently, and in
          # a way that reads as missing data rather than a bug.
          if ! grep -qE "x <= y \? \(x \+ '\|' \+ y\) : \(y \+ '\|' \+ x\)" \
               lets_app/server/91_setup/CityPairSync.js; then
            echo "::error file=lets_app/server/91_setup/CityPairSync.js::buildPairKey_ no longer sorts its inputs alphabetically. GSA stores pairs in alphabetical order; without the sort, half of all lookups silently return no fare."
            exit 1
          fi
          echo "PASS - pair keys are alphabetically normalized."

      - name: 'Guard: LETS_CONFIG must be declared with var, not const/let'
        run: |
          echo "Checking the LETS_CONFIG declaration keyword..."
          # LetsDB.js, BudgetEngine.js and RequestService.js all read this as
          # `root.LETS_CONFIG`. In the Apps Script V8 runtime a top-level
          # const/let creates a lexical binding that is NOT a property of the
          # global object, so root.LETS_CONFIG would be undefined and
          # LetsDB.js:20 throws at FILE EVALUATION time — taking down the whole
          # web app, not just the budget layer.
          #
          # test_budget_config_global.js already asserts this and carries a
          # negative control. This guard is a second, cheaper signal that names
          # the consequence directly in the build log, because the failure mode
          # is a total outage and the fix is one keyword.
          if ! grep -qE '^var LETS_CONFIG[[:space:]]*=' lets_app/server/00_config/BudgetConfig.js; then
            echo "::error file=lets_app/server/00_config/BudgetConfig.js::LETS_CONFIG is not declared with 'var'. Three files read it as root.LETS_CONFIG, which is undefined for a const/let declaration under Apps Script V8. This breaks the ENTIRE web app at file-evaluation time. Restore 'var LETS_CONFIG = {'."
            exit 1
          fi
          echo "PASS - LETS_CONFIG is declared with var."

      - name: 'Guard: deploy workflow must not trigger on pull_request'
        run: |
          echo "Checking that deploy-gas.yml has no pull_request trigger..."
          if grep -qE '^[[:space:]]*pull_request[[:space:]]*:' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::deploy-gas.yml has a 'pull_request' trigger. That deploys unreviewed code to the production GAS project. Remove it; PRs are verified by verify.yml instead."
            exit 1
          fi
          echo "PASS - deploy workflow does not run on pull_request."

      - name: 'Guard: this workflow must stay credential-free'
        run: |
          echo "Checking that verify.yml interpolates no repository credentials..."
          # Matches a real GitHub Actions credential interpolation, not prose.
          # (This comment deliberately avoids writing the pattern literally,
          # so the guard does not match its own source.)
          if grep -qE '\$\{\{[[:space:]]*secrets\.' .github/workflows/verify.yml; then
            echo "::error file=.github/workflows/verify.yml::verify.yml interpolates a repository secret. It executes untrusted pull_request code and must never hold deploy credentials."
            exit 1
          fi
          echo "PASS - verify workflow interpolates no credentials."

      - name: 'Guard: deploy job must stay behind an environment gate'
        run: |
          echo "Checking that the deploy job declares environment:..."
          # The `environment:` key is what makes GitHub apply the required
          # reviewer / prevent-self-review / deployment-branch rules BEFORE the
          # job starts, and what scopes CLASPRC_JSON once it is moved to
          # environment scope. Deleting this one line silently removes the
          # human gate on production deploys while the workflow still looks
          # correct and still goes green (CM-5; AGENTS.md §14.2).
          if ! grep -qE '^[[:space:]]*environment:' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::deploy-gas.yml has no 'environment:' key. The production deploy would run with no required-reviewer gate. Restore 'environment: \${{ needs.resolve.outputs.env_name }}' on the deploy job."
            exit 1
          fi
          # The gate must be driven by the credential-free resolve job, not a
          # literal, so the two deploy targets cannot be conflated.
          if ! grep -qE 'environment:.*needs\.resolve\.outputs\.env_name' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::'environment:' is present but is not derived from needs.resolve.outputs.env_name. A hardcoded environment name would let a sandbox push deploy under the production gate, or vice versa."
            exit 1
          fi
          echo "PASS - deploy job is gated by the resolved environment."

      - name: 'Guard: no hardcoded spreadsheet IDs in application source'
        run: |
          echo "Checking that no spreadsheet/script ID is hardcoded in lets_app/server..."
          # Spreadsheet and script IDs are environment configuration and must be
          # read from Script Properties, never embedded in source (AGENTS.md
          # §4.1 "never hardcode connection strings"; §12.1 config-from-code).
          #
          # Deliberately a generic length pattern rather than a list of real
          # IDs, so this guard does not itself disclose any identifier. Google
          # Sheets IDs are 44 chars and Apps Script IDs are 57; the 40-char
          # floor catches both. `-a` is required because one source file trips
          # grep's binary heuristic on high-byte UTF-8 characters.
          if grep -raEn "['\"]1[A-Za-z0-9_-]{39,}['\"]" lets_app/server/; then
            echo "::error::A spreadsheet or script ID literal appears in lets_app/server/. Move it to a Script Property and read it via 00_config."
            exit 1
          fi
          echo "PASS - no hardcoded spreadsheet or script IDs in application source."
