# Pull-request verification gate.
#
# This workflow replaces the deploy-on-pull_request behavior that was removed
# from deploy-gas.yml. It runs the local test suites and safety guards and
# DELIBERATELY USES NO CREDENTIALS — it has no access to CLASPRC_JSON and
# therefore cannot deploy to any Google Apps Script project, including from
# fork PRs.
#
# Controls: SA-11 (developer testing), CM-3 (change control), AC-6 (least
# privilege). AGENTS.md §14.3 (verification transcript), §15.3 (one-command
# verify), §12.3 (regression tests for fixed bugs).

name: Verify

on:
  pull_request:
  workflow_dispatch:

# Read-only. No credentials are referenced anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and Safety Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to the documented floor in PROJECT_PLAN.md ("Node.js 20+").
          node-version: '20'

      - name: Budget engine unit tests
        run: node lets_app/test_budget_engine.js

      - name: FAS tracker environment isolation tests
        run: node lets_app/test_fas_tracker_env.js

      - name: LETS_CONFIG global binding tests
        run: node lets_app/test_budget_config_global.js

      - name: HC data layer tests
        run: node lets_app/test_hc_data.js

      - name: Other-cost percentage config tests
        run: node lets_app/test_other_cost_percentage.js

      - name: City pair airfare tests
        run: node lets_app/test_city_pairs.js

      - name: Access audit (G-008) tests
        run: node lets_app/test_access_audit.js

      - name: Airport selection and preference tests
        run: node lets_app/test_airport_prefs.js

      - name: Diagnostics smoke tests
        run: node lets_app/test_diagnostics.js

      - name: Cache warming tests
        run: node lets_app/test_cache_warming.js

      - name: Airfare picker UI tests
        run: node lets_app/test_airfare_ui.js

      - name: Funding label tests
        run: node lets_app/test_funding_label.js

      - name: UI fix regression tests
        run: node lets_app/test_ui_fixes.js

      - name: FAS tracker column mapping tests
        run: node lets_app/test_fas_tracker_mapping.js

      - name: Trip Overview field tests
        run: node lets_app/test_trip_overview.js

      - name: FAS tracker test-submission tests
        run: node lets_app/test_fas_tracker_submit.js

      - name: Environment email gate tests
        run: node lets_app/test_email_gate.js

      - name: Step 4 classification tests
        run: node lets_app/test_classification.js

      - name: Routing visibility tests
        run: node lets_app/test_routing_visibility.js

      - name: Branding configurability tests
        run: node lets_app/test_branding.js

      - name: Feedback pipeline tests
        run: node lets_app/test_feedback.js

      - name: Guard - the org hierarchy must be stored, not derived
        run: |
          echo "Checking the org hierarchy..."
          # I derived the tree from org-code LENGTH and got it wrong: FCBA
          # reads as a child of FCA because it is four characters, and it is
          # actually under FCB. @clolry: "FCBA is not under FCA - it's part of
          # FCB."
          #
          # The '0' in FCA0A is a FILLER, not a level, and FCA has no 4-char
          # level at all while FCB and FCC do — so two service centres sit at
          # different depths and length cannot stand in for level.
          H=lets_app/server/91_setup/HCSeed.js
          for FIELD in "p:" "v:"; do
            if ! grep -aq "{ c: 'FCBA',.*${FIELD}" "$H"; then
              echo "::error file=$H::HC_REAL_ORGS rows must carry an explicit parent (p:) and level (v:). Deriving either from the code length produces a wrong tree."
              exit 1
            fi
          done
          # 4 spaces of padding after the comma, not 1 — the table is aligned,
          # so ' *' matched nothing and the check passed with FCBA reparented
          # to FCA. The negative control reported it.
          if ! grep -aqE "\{ c: 'FCBA', +p: 'FCB'," "$H"; then
            echo "::error file=$H::FCBA (Office of MAS) must have parent FCB. It is NOT under FCA, however the code length reads."
            exit 1
          fi
          if ! grep -aqE "\{ c: 'FCA0A', +p: 'FCA'," "$H"; then
            echo "::error file=$H::FCA0A's parent must be FCA. The 0 is a filler, not a level — there is no FCA0."
            exit 1
          fi
          # Both columns must exist on the tab and be read back, or the stored
          # hierarchy never reaches a consumer.
          if ! grep -aq "'Parent_Org_Code'" lets_app/server/01_constants/Sheets.js; then
            echo "::error file=lets_app/server/01_constants/Sheets.js::HC_Orgs must store Parent_Org_Code."
            exit 1
          fi
          if ! grep -aq "parentOrgCode:  _str_(row\['Parent_Org_Code'\])" lets_app/server/20_data/HCData.js; then
            echo "::error file=lets_app/server/20_data/HCData.js::_normalizeOrg_ must read Parent_Org_Code, or the stored hierarchy never reaches the org chart."
            exit 1
          fi
          # 22 service centres, identified by LEVEL. A Service Center Director
          # is the supervisory person whose own Dept ID is one of these, which
          # is how the routing reviewer should be found — the four existing
          # call sites match a 'sector director' title that does not exist in
          # this organisation.
          SC=$(grep -ac "v: 'SERVICE_CENTER'," "$H" || true)
          if [ "$SC" -ne 22 ]; then
            echo "::error file=$H::Expected 22 SERVICE_CENTER rows; found ${SC}. @clolry's org has 22 service centres."
            exit 1
          fi
          echo "PASS - the org hierarchy is stored explicitly: 22 service centres, parents pinned."

      - name: Coordinator role tests
        # §2 holds the boundary: a coordinator reassigns reviewers and manages
        # the event catalogue, but cannot set budgets, reserve set-asides,
        # import travel, edit the HR roster or grant roles. Money and
        # privilege stay admin-only.
        run: node lets_app/test_coordinator_role.js

      - name: Events UI tests
        # §4 is the one that matters: promoting a proposal must go through
        # resolveEventProposal, not saveTravelEvent. Only the former links the
        # originating request, and without that link a DAC's reservation never
        # draws down — silently.
        run: node lets_app/test_events_ui.js

      - name: Delegation tests
        # §4 holds @clolry's requirement: the approval log records the HUMAN
        # who pressed the button, not the principal. Logging the principal
        # would make the record read as though Alice approved her own coverage
        # while she was on leave.
        run: node lets_app/test_delegation.js

      - name: Request read authorization tests
        # §5 watches the CACHED path. The review cache is keyed per REQUEST
        # with no user in the key, so gating only the slow path would mean the
        # first legitimate read populated the cache and every later caller was
        # served unchecked — which is the path an enumeration loop hits.
        run: node lets_app/test_request_access.js

      - name: HC PII boundary tests
        # §2 is an ALLOW-LIST test. A deny-list passes the moment someone adds
        # a column to HC_Positions — the leak would be silent and the test
        # green. §7c proves that by patching in a deny-list and watching a new
        # field leak.
        run: node lets_app/test_hc_privacy.js

      - name: Go.gov sync tests
        # §5 asserts that an expense report is NEVER auto-matched to a request
        # belonging to a different traveller. That assertion FAILED when first
        # written: a cited LETS ID was trusted on its own, and three real
        # expense reports were attached to other people's requests.
        run: node lets_app/test_gogov_sync.js

      - name: Budget admin tests
        # §1 proves the ACCESS SPLIT @clolry asked for: reading allocations is
        # open to every user ("no secrets to hide there - we're trying to
        # develop transparency") while writing is admin-only. Two functions, so
        # the distinction is in the code rather than in a parameter.
        run: node lets_app/test_budget_admin.js

      - name: Budget backfill tests
        # §2 proves the import sends nothing and routes nothing. The email and
        # routing mocks RECORD calls rather than absorbing them, so an empty
        # recording is evidence instead of an artefact of the harness.
        run: node lets_app/test_budget_backfill.js

      - name: Budget dashboard tests
        # §1 records why BudgetEngine.js could not simply be wired up: its
        # status vocabulary has an EMPTY intersection with what the Requests
        # tab stores, so it would report every DAC at full baseline with zero
        # commitments — plausible, and false.
        run: node lets_app/test_budget_dashboard.js

      - name: Event history tests
        # §1 re-derives every row and column total from @clolry's attendance
        # table rather than trusting the transcription: 187 attendees typed in
        # by hand, where a wrong digit is invisible in the UI and a DAC would
        # reserve money against it.
        run: node lets_app/test_event_history.js

      - name: Org chart tests
        # Includes the cross-project agreement check: orgchart_app/HCRead.js is
        # a deliberate SECOND implementation of lets_app HCData.js, so both are
        # loaded and compared on all 137 real org codes. A library binding was
        # rejected because LETS exists in its current form precisely BECAUSE
        # the inherited HC library became unreachable.
        run: node orgchart_app/test_orgchart.js

      - name: Guard - the coordinator boundary is money and privilege
        run: |
          echo "Checking the coordinator role boundary..."
          # @clolry needed somebody who can reassign a reviewer when a person
          # is out and work the event proposal queue. Both sat behind
          # requireTravelAdmin, which also grants budget editing, HR roster
          # editing and role granting — so covering an absence meant handing
          # over every admin power.
          #
          # Checked per FUNCTION BODY, never file-wide: these files contain
          # several functions and a file-wide grep is satisfied by the wrong
          # one.
          for SPEC in \
            "saveBudgetAllocations:lets_app/server/40_domain/BudgetAdmin.js:sets the money every DAC spends" \
            "importExistingTravel:lets_app/server/40_domain/BudgetBackfill.js:writes approved requests that consume budget" \
            "saveEventSetAside:lets_app/server/40_domain/Events.js:reserves a DAC budget"; do
            FN="${SPEC%%:*}"
            REST="${SPEC#*:}"
            FILE="${REST%%:*}"
            WHY="${REST##*:}"
            BODY=$(awk "/^function ${FN}\(/,/^}/" "$FILE")
            if [ -z "$BODY" ]; then
              echo "::error file=$FILE::${FN} is missing."
              exit 1
            fi
            if ! echo "$BODY" | grep -aq 'isTravelAdmin'; then
              echo "::error file=$FILE::${FN} must stay ADMIN-only — it ${WHY}."
              exit 1
            fi
            if echo "$BODY" | grep -aq 'isTravelCoordinator'; then
              echo "::error file=$FILE::${FN} must NOT accept a coordinator — it ${WHY}. The coordinator role exists to carry workflow powers without money powers."
              exit 1
            fi
          done

          # And the three that a coordinator MUST reach, or the role is
          # pointless.
          for SPEC in \
            "adminReassignReviewer:lets_app/server/40_domain/Admin_Actions.js" \
            "saveTravelEvent:lets_app/server/40_domain/Events.js" \
            "resolveEventProposal:lets_app/server/40_domain/Events.js"; do
            FN="${SPEC%%:*}"
            FILE="${SPEC##*:}"
            BODY=$(awk "/^function ${FN}\(/,/^}/" "$FILE")
            if ! echo "$BODY" | grep -aqE 'isTravelCoordinator|requireTravelCoordinator'; then
              echo "::error file=$FILE::${FN} must accept a coordinator. It is one of the three things the role exists to do."
              exit 1
            fi
          done

          # The admin CONSOLE must admit a coordinator, or the role is
          # unreachable and looks broken rather than scoped.
          R=lets_app/server/50_pages/Render.js
          PAGE=$(awk '/^function serveTravelAdminPage/,/^  return template/' "$R")
          if ! echo "$PAGE" | grep -aq 'isTravelCoordinator(userEmail)'; then
            echo "::error file=$R::serveTravelAdminPage must gate on isTravelCoordinator. The reassignment modal and the event proposal queue both live on that page, so an admin-only gate makes the role unreachable."
            exit 1
          fi
          # And it must tell the page which it is, IN THAT FUNCTION. I first
          # anchored this assignment on a line whose first occurrence is in
          # serveTravelRequestForm, so the admin page never received it and a
          # coordinator saw every admin control.
          if ! echo "$PAGE" | grep -aq 'template.isFullAdmin'; then
            echo "::error file=$R::serveTravelAdminPage must set template.isFullAdmin, or the client cannot hide the money and privilege sections."
            exit 1
          fi

          # A coordinator is not a reviewer: no queue, no approve button.
          A=lets_app/server/30_services/Access.js
          COORD=$(awk '/Priority 1b: coordinator/,/Priority 2/' "$A")
          if echo "$COORD" | grep -aq 'ctx.isReviewer = true'; then
            echo "::error file=$A::The coordinator branch must not set isReviewer. They approve nothing, and granting it would put them in reviewer dashboards with an empty queue."
            exit 1
          fi

          # Grantable end to end: a role the server rejects fails on save with
          # "Invalid roleType", which reads as a bug.
          if ! grep -aq "'coordinator'," lets_app/server/40_domain/Users.js; then
            echo "::error file=lets_app/server/40_domain/Users.js::TRAVEL_ROLE_TYPES must include 'coordinator', or granting it fails validation."
            exit 1
          fi
          echo "PASS - the coordinator boundary holds: workflow yes, money and privilege no."

      - name: Guard - event wiring must not break the draw-down
        run: |
          echo "Checking the event catalogue wiring..."
          EVC=lets_app/client/controllers/admin/travelEventsController.html
          RCTL=lets_app/client/controllers/form/travelRequestController.html
          SUB=lets_app/server/40_domain/Submission.js

          # PROMOTING A PROPOSAL must go through resolveEventProposal.
          # saveTravelEvent creates the event but does NOT link the
          # originating request — and without that link the reservation never
          # draws down, with nothing on screen to say so.
          # Matched on the PROMOTE action, not on the function name alone.
          # resolveEventProposal is called twice in this file — once to promote
          # and once to reject — so a name-only grep stayed satisfied when the
          # promote path was swapped for saveTravelEvent. The negative control
          # reported MISSED and that is how I found it.
          if ! grep -aq "action: 'PROMOTE'" "$EVC"; then
            echo "::error file=$EVC::Promoting a proposal must call resolveEventProposal with action PROMOTE, which also links the originating request. saveTravelEvent alone leaves the request unlinked and the DAC's reservation silently never draws down."
            exit 1
          fi
          PROMOTE_CTX=$(grep -aB 3 "action: 'PROMOTE'" "$EVC")
          if ! echo "$PROMOTE_CTX" | grep -aq 'resolveEventProposal'; then
            echo "::error file=$EVC::The PROMOTE action must be sent to resolveEventProposal."
            exit 1
          fi
          # A link failure must be surfaced; it is invisible otherwise.
          if ! grep -aq 'requestLinkWarning' "$EVC"; then
            echo "::error file=$EVC::A failed request link must be surfaced to the coordinator."
            exit 1
          fi

          # THE "OTHER" PROPOSAL MUST NOT BLOCK SUBMISSION. A traveller with a
          # deadline losing their request because a catalogue write failed is
          # far worse than a coordinator matching it up by name.
          if ! grep -aq 'submitting anyway' "$RCTL"; then
            echo "::error file=$RCTL::A failed event proposal must not block the request submission."
            exit 1
          fi
          # And the proposal must be recorded BEFORE the submit, so the
          # request can carry its ID.
          PROP_LINE=$(grep -an 'proposeTravelEvent' "$RCTL" | head -1 | cut -d: -f1)
          SUBMIT_LINE=$(grep -an 'submitTravelRequestV2' "$RCTL" | head -1 | cut -d: -f1)
          if [ -z "$PROP_LINE" ] || [ -z "$SUBMIT_LINE" ] || \
             [ "$PROP_LINE" -ge "$SUBMIT_LINE" ]; then
            echo "::error file=$RCTL::The event proposal must be recorded BEFORE submitTravelRequestV2 so the request carries the proposal ID. Without it a coordinator cannot find the request from the queue."
            exit 1
          fi

          # The server must actually store both links, or the whole chain is
          # cosmetic.
          for F in eventId eventProposalId; do
            if ! grep -aq "formData.$F || ''" "$SUB"; then
              echo "::error file=$SUB::submitTravelRequestV2 must store formData.$F."
              exit 1
            fi
          done

          # The picker must PRE-FILL, not overwrite. Somebody attending two
          # days of a five-day conference has different dates from the event,
          # and per-diem depends on theirs.
          if ! grep -aqF "if (node && !String(node.value || '').trim()) {" "$RCTL"; then
            echo "::error file=$RCTL::Event pre-fill must only fill a BLANK field. Overwriting what the traveller typed loses their work silently."
            exit 1
          fi

          # A traveller must not be able to write the catalogue — only the
          # proposals tab.
          EV=lets_app/server/40_domain/Events.js
          # TWO TIERS, and the difference is money.
          #
          # A coordinator defines events and resolves proposals — workflow.
          # Reserving a DAC's budget against an event is a budget decision and
          # stays admin-only, which is the whole point of the coordinator
          # role: workflow powers without money powers.
          for FN in saveTravelEvent resolveEventProposal; do
            BODY=$(awk "/^function ${FN}\(/,/^}/" "$EV")
            if ! echo "$BODY" | grep -aq 'isTravelCoordinator'; then
              echo "::error file=$EV::${FN} must be gated on isTravelCoordinator (which admins also satisfy). A traveller writing the catalogue would put unvetted text in front of every other traveller."
              exit 1
            fi
          done
          SA_BODY=$(awk '/^function saveEventSetAside\(/,/^}/' "$EV")
          if ! echo "$SA_BODY" | grep -aq 'isTravelAdmin'; then
            echo "::error file=$EV::saveEventSetAside commits budget and must stay ADMIN-ONLY, not coordinator. The coordinator role exists to carry workflow powers without money powers."
            exit 1
          fi
          if echo "$SA_BODY" | grep -aq 'isTravelCoordinator'; then
            echo "::error file=$EV::saveEventSetAside must NOT accept a coordinator. Reserving a DAC's budget is a money decision."
            exit 1
          fi
          PROP=$(awk '/^function proposeTravelEvent\(/,/^}/' "$EV")
          if echo "$PROP" | grep -aq 'SHEET_NAMES.EVENTS'; then
            echo "::error file=$EV::proposeTravelEvent must write only to EVENT_PROPOSALS, never to the catalogue."
            exit 1
          fi
          echo "PASS - event wiring links requests, never blocks submission, and keeps travellers out of the catalogue."

      - name: Guard - delegation must not become a role grant
        run: |
          echo "Checking delegation constraints..."
          D=lets_app/server/30_services/Delegation.js
          if [ ! -f "$D" ]; then
            echo "::error::$D is missing."
            exit 1
          fi
          # @clolry described the Go.gov model: the delegate "logs in and then
          # can choose to emulate that user's access and approvals (of course
          # they're logged as themselves...)". The parenthetical is the design.
          #
          # These four refusals are what makes a delegation different from a
          # Travel_User_Roles row, which was the obvious implementation and
          # would have been indistinguishable from a permanent grant.
          for CHECK in \
            "End date is required:an open-ended delegation is a role grant in disguise" \
            "cannot lend authority onward:re-delegation would make the audit chain unfollowable" \
            "only delegate your own authority:nobody may lend authority that is not theirs" \
            "only record of why:the reason is the record"; do
            NEEDLE="${CHECK%%:*}"
            WHY="${CHECK##*:}"
            if ! grep -aqF "$NEEDLE" "$D"; then
              echo "::error file=$D::Missing the refusal for \"${NEEDLE}\" — ${WHY}."
              exit 1
            fi
          done
          # Expiry must be COMPUTED. A stored EXPIRED needs a nightly job, and
          # a delegation live until the job next runs is the failure this avoids.
          FORCE=$(awk '/^  function isInForce/,/^  }/' "$D")
          if ! echo "$FORCE" | grep -aq 'd.startDate <= when && when <= d.endDate'; then
            echo "::error file=$D::isInForce must compute the window from the dates. A stored EXPIRED status requires a scheduled job and leaves a delegation live until it next runs."
            exit 1
          fi
          # THE APPROVAL LOG MUST NAME THE HUMAN.
          RA=lets_app/server/40_domain/Review_Action.js
          if ! grep -aq 'actorEmail,  *\/\/ Action_By_Email' "$RA"; then
            echo "::error file=$RA::Action_By_Email must record the ACTOR, not the principal. Logging the principal would make the record read as though they approved their own coverage while on leave."
            exit 1
          fi
          if ! grep -aq 'Delegation.canActAs(actorEmail, actAs)' "$RA"; then
            echo "::error file=$RA::The delegation must be re-checked at ACTION time. It can be revoked between the page loading and the approval being pressed."
            exit 1
          fi
          # Every review action must carry the act-as value, or a delegate's
          # approval is attempted under their own authority and refused.
          RC=lets_app/client/controllers/review/travelReviewController.html
          CALLS=$(grep -aoc '\.submitReviewAction(' "$RC" || true)
          PASSES=$(grep -ao '_actingAs()' "$RC" | wc -l)
          CALLN=$(grep -ao '\.submitReviewAction(' "$RC" | wc -l)
          if [ "$PASSES" -ne "$CALLN" ]; then
            echo "::error file=$RC::All ${CALLN} submitReviewAction call(s) must pass the act-as value; ${PASSES} do. A delegate's approval would be attempted under their own authority."
            exit 1
          fi
          # The banner must not be dismissible while the state persists.
          P=lets_app/client/shared/travelDelegationPanel.html
          if grep -aqE 'actas-bar__dismiss|data-dismiss' "$P"; then
            echo "::error file=$P::The act-as banner must not be dismissible. A delegate who forgot they held someone's authority and approved under it is the failure it guards against."
            exit 1
          fi
          echo "PASS - delegation is bounded, audited, and logged under the real actor."

      - name: Guard - request reads must be authorized on both paths
        run: |
          echo "Checking request read authorization..."
          # getRequestForReview had NO authorization check. It computed a
          # `permissions` object and returned it ALONGSIDE the data; the client
          # used it to pick which buttons to draw and nothing gated the
          # payload. Any signed-in user who knew a sequential request ID got
          # the submitter and all four reviewers by name and email, and per
          # traveller: employee ID, security clearance, passport status,
          # telework status and home commute. Finding G-004, C4/R3.
          R=lets_app/server/40_domain/Review_Read.js
          A=lets_app/server/30_services/RequestAccess.js
          if [ ! -f "$A" ]; then
            echo "::error::$A is missing. Request read authorization must exist."
            exit 1
          fi
          # BOTH PATHS. The cache is keyed per request with no user in the key,
          # so the fast path is the one that matters.
          CACHED=$(awk '/if \(!isChainedCall\)/,/db = db \|\| new TravelDB/' "$R")
          if ! echo "$CACHED" | grep -aq 'requestReadAccess('; then
            echo "::error file=$R::The CACHED path must check requestReadAccess(). The review cache is shared across users, so gating only the uncached path leaves the fast path open."
            exit 1
          fi
          if ! echo "$CACHED" | grep -aq 'sanitizeTravelersForCaller('; then
            echo "::error file=$R::The cached envelope is the FULL record and must be re-sanitized per caller, or a scoped reviewer receives another traveller's clearance and commute."
            exit 1
          fi
          UNCACHED=$(awk '/========== AUTHORIZATION ==========/,/const envelope = successResponse/' "$R")
          if ! echo "$UNCACHED" | grep -aq 'requestReadAccess('; then
            echo "::error file=$R::The uncached path must check requestReadAccess()."
            exit 1
          fi
          # Default deny. A missing final refusal turns the whole function into
          # a pass-through.
          # The FINAL return, not any refusal anywhere in the file. There are
          # two `allowed: false` returns — the anonymous-caller check and the
          # default — so a plain grep passed with the default flipped to
          # allow. Checked against the last 12 lines of the function instead.
          TAIL=$(awk '/^function requestReadAccess/,/^}/' "$A" | tail -12)
          if ! echo "$TAIL" | grep -aq 'allowed: false'; then
            echo "::error file=$A::requestReadAccess must END in a REFUSAL. A travel request is not a public record, and a flipped default turns the whole function into a pass-through."
            exit 1
          fi
          # A failing scope lookup must deny, not degrade. Unlike the HC
          # directory, there is no safe reduced form here.
          if ! grep -aq "scope check failed" "$A"; then
            echo "::error file=$A::A failing scope lookup must be logged and must DENY."
            exit 1
          fi
          # The attachment chain: list is relationship-gated, share is admin.
          AT=lets_app/server/30_services/Attachments.js
          LISTSTART=$(grep -an 'function getRequestAttachments' "$AT" | head -1 | cut -d: -f1)
          if [ -z "$LISTSTART" ]; then
            echo "::error file=$AT::getRequestAttachments is missing."
            exit 1
          fi
          if ! sed -n "${LISTSTART},\$p" "$AT" | head -60 | grep -aq 'requestReadAccess('; then
            echo "::error file=$AT::getRequestAttachments must check request access. It returns Drive file IDs, and shareAttachmentsWithUsers will grant access to them."
            exit 1
          fi
          SHAREBODY=$(awk '/^function shareAttachmentsWithUsers/,/^}/' "$AT")
          if ! echo "$SHAREBODY" | grep -aq 'isTravelAdmin'; then
            echo "::error file=$AT::shareAttachmentsWithUsers grants Drive access to arbitrary file IDs and must be admin-gated for browser callers."
            exit 1
          fi
          # And the reviewer handoff must NOT go through the gated wrapper, or
          # every approval silently fails to share attachments.
          if grep -aqE '=\s*shareAttachmentsWithUsers\(' lets_app/server/40_domain/Review_Action.js; then
            echo "::error file=lets_app/server/40_domain/Review_Action.js::The reviewer handoff must call _shareAttachmentsInternal_. The admin-gated wrapper would break every handoff, and the call site swallows the error so nobody would notice."
            exit 1
          fi
          echo "PASS - request reads are authorized on both paths and the attachment chain is closed."

      - name: Guard - HR PII must not escape the privacy boundary
        run: |
          echo "Checking the HC PII boundary..."
          # Apps Script makes EVERY top-level function browser-callable
          # (G-001). Before this boundary existed, getHCStaffingBundle
          # returned employee ID, email, GS grade, LCAT and duty-station
          # street address for every person on the roster, to any signed-in
          # user with no role. That is ~1100 records once the FAS feed lands,
          # and name + grade is salary disclosure.
          P=lets_app/server/30_services/HCPrivacy.js
          if [ ! -f "$P" ]; then
            echo "::error::$P is missing. The HC PII boundary must exist."
            exit 1
          fi
          # ALLOW-LIST, never a deny-list. With a deny-list, a column added to
          # HC_Positions tomorrow is exposed by default.
          if ! grep -aq 'allowed.forEach' "$P"; then
            echo "::error file=$P::hcSanitizeRecord must build its output from an ALLOW-LIST. A deny-list exposes any newly added HC column by default."
            exit 1
          fi
          # These four must never appear in the public or reviewer allow-list.
          #
          # Extracted from the two allow-list ARRAYS, not grepped from the
          # whole file — HC_FIELDS_ADMIN_ONLY lists the same names by design,
          # so a file-wide grep fired on a correct file. The first version of
          # this guard did exactly that and failed on a clean tree.
          LISTS=$(awk '/^var HC_FIELDS_PUBLIC = \[/,/\];/' "$P"; \
                  awk '/^var HC_FIELDS_REVIEWER = \[/,/\];/' "$P")
          for F in employeeId grade lcat locationCode; do
            if echo "$LISTS" | grep -aq "'$F'"; then
              echo "::error file=$P::'$F' appears in a non-admin allow-list. employeeId joins to payroll systems; name+grade is salary disclosure; lcat implies employment status."
              exit 1
            fi
          done
          # Every HC entry point must apply the boundary or be admin-gated.
          # Checked per function body, not by counting.
          for SPEC in \
            "getHCStaffingBundle:lets_app/server/30_services/HCStaffing.js:hcSanitizeBundle" \
            "getTravelFormStaffing:lets_app/server/40_domain/Request.js:hcCallerTier" \
            "getSubmitterInfo:lets_app/server/91_setup/Database.js:hcCallerTier" \
            "simulateSubmissionRouting:lets_app/server/40_domain/Submission.js:isTravelAdmin" \
            "diagHcData:lets_app/server/99_triggers/Diagnostics.js:isTravelAdmin"; do
            FN="${SPEC%%:*}"
            REST="${SPEC#*:}"
            FILE="${REST%%:*}"
            NEED="${REST##*:}"
            BODY=$(awk "/^function ${FN}\(/,/^}/" "$FILE")
            if [ -z "$BODY" ]; then
              echo "::error file=$FILE::${FN} is missing."
              exit 1
            fi
            # Matched on an ACTUAL CALL, not a mention. The docblock in
            # getHCStaffingBundle names hcSanitizeBundle in prose, so a bare
            # substring grep passed even with the call deleted — the same
            # comment-satisfies-the-guard mistake as the request-ID guard.
            if ! echo "$BODY" | grep -av '^\s*//' | grep -aq "${NEED}("; then
              echo "::error file=$FILE::${FN} reads HR data but does not call ${NEED}(). Every top-level function is browser-callable, so this would serve PII to any signed-in user."
              exit 1
            fi
          done
          # The traveller picker must not key on employeeId: the server
          # withholds it from non-admins, so an option value of undefined
          # would select nobody and the form would silently fail.
          SVC=lets_app/client/shared/hcDataCenterService.html
          if grep -aq 'value: p.employeeId$' "$SVC"; then
            echo "::error file=$SVC::The traveller picker must key on positionNumber. employeeId is withheld from non-admin callers, so an employeeId-keyed option resolves to nobody."
            exit 1
          fi
          echo "PASS - HR PII is tier-restricted by allow-list at every entry point."

      - name: Guard - the request ID must fit Go.gov and match the fiscal year
        run: |
          echo "Checking the request ID format..."
          # Go.gov truncates a trip name at EXACTLY 40 characters — measured
          # across 565 real names: 79 are exactly 40 and none is longer.
          #
          # Travellers put the LETS ID at the FRONT of that name so the monthly
          # expense report can be matched back. Every character the ID takes is
          # one the trip name loses, which is why it is L27-0001 and not
          # REQ-2026-0123.
          DB=lets_app/server/91_setup/Database.js
          if ! grep -aq "\`L\${String(fy).slice(-2)}-\`" "$DB"; then
            echo "::error file=$DB::generateRequestId must produce the short L<FY2>-NNNN form. A longer prefix eats the 40-character Go.gov trip name the ID has to fit inside."
            exit 1
          fi
          # FISCAL year, not calendar. The old code used getFullYear(), so a
          # request raised on 15 October 2026 was numbered REQ-2026-xxxx while
          # drawing on FY2027 money, and the sequence reset on 1 January.
          BODY=$(awk '/^function generateRequestId\(\)/,/^}/' "$DB")
          if ! echo "$BODY" | grep -aq 'getMonth() >= 9'; then
            echo "::error file=$DB::generateRequestId must derive the year from the FISCAL year (October rollover), not the calendar year. @clolry: budgeting all resets on 10/1."
            exit 1
          fi
          # Legacy IDs must keep working: rows already exist, and three
          # hand-written REQ- ids are already in the Go.gov expense data.
          #
          # Checked against the FUNCTION BODY, not the file. The first version
          # of this grepped the whole file for 'REQ-' and 'L\d{2}-', which the
          # DOCBLOCK satisfies — so deleting the legacy branch left the guard
          # passing. A guard that a comment can satisfy is not a guard.
          V=lets_app/server/10_lib/Validation.js
          VBODY=$(awk '/^function requireRequestId\(/,/^}/' "$V")
          # Matched with -F (fixed string) so the regex literals in the source
          # do not have to be escaped twice over. The earlier attempt used a
          # grep pattern where . stood in for a backslash, which failed to
          # match and made the guard fire on a clean tree.
          if ! echo "$VBODY" | grep -aqF 'isCurrent = /^L'; then
            echo "::error file=$V::requireRequestId must accept the current L27-0001 form."
            exit 1
          fi
          if ! echo "$VBODY" | grep -aqF 'isLegacy  = /^REQ-'; then
            echo "::error file=$V::requireRequestId must still accept the legacy REQ-YYYY-NNNN form. Rejecting it would make existing requests unfindable, and three hand-written REQ- ids are already in the Go.gov expense data."
            exit 1
          fi
          # The parser must find both too, or a matched expense report cannot
          # be tied back to its request.
          GS=lets_app/server/30_services/GogovSync.js
          if ! grep -aq "return 'L' + cur\[1\]" "$GS"; then
            echo "::error file=$GS::extractLetsId must recognise the current L27-0001 form."
            exit 1
          fi
          if ! grep -aq "return 'REQ-' + legacy\[1\]" "$GS"; then
            echo "::error file=$GS::extractLetsId must still recognise the legacy REQ-YYYY-NNNN form."
            exit 1
          fi
          echo "PASS - the request ID is short, fiscal-year aligned, and both forms resolve."

      - name: Guard - reconciliation must use Amount Approved, not Report Total
        run: |
          echo "Checking the Go.gov reconciliation figure..."
          # Measured on @clolry's real export: Report Total and Amount Approved
          # differ on 37 of 182 rows, by $4,569.93. Report Total is what the
          # traveller CLAIMED; Amount Approved is what GSA PAID.
          #
          # @clolry: "we need to use Amount Approved rather than Report Total."
          #
          # Reconciling against the wrong one would overstate spend on a fifth
          # of all rows, and every row would still look plausible.
          SRC=lets_app/server/30_services/GogovSync.js
          if ! grep -aq "amountApproved:  \['Amount Approved'" "$SRC"; then
            echo "::error file=$SRC::The actual-cost field must map to 'Amount Approved' first. Report Total includes items GSA disallowed and never paid."
            exit 1
          fi
          # The traveller check on an ID match. Without it, a mistyped digit
          # moves money between travellers silently — it did, on three real
          # rows, before this guard existed.
          if ! grep -aq 'owner !== expense.employeeNameNormalized' "$SRC"; then
            echo "::error file=$SRC::An ID-based match must still verify the traveller. A cited LETS ID belonging to someone else's request would otherwise auto-match and move money between travellers."
            exit 1
          fi
          # Fiscal-year bucketing per row. One monthly export spans two years.
          if ! grep -aq 'fiscalYear: fiscalYearOf' "$SRC"; then
            echo "::error file=$SRC::Every imported row must carry its own fiscal year. @clolry: budgeting resets on 10/1, and a single monthly export spans two fiscal years."
            exit 1
          fi
          echo "PASS - reconciliation uses the paid amount, verifies the traveller, and buckets by fiscal year."

      - name: Guard - budget writes must be admin-guarded
        run: |
          echo "Checking the budget write paths..."
          # @clolry: "this would be an admin function and not be open to
          # reviewers." Apps Script makes every top-level function
          # browser-callable (G-001), so the hidden button protects nothing —
          # each write must guard itself.
          #
          # Checked PER FUNCTION by extracting its body, not by counting
          # occurrences: a count threshold passes when one function loses its
          # guard and another gains one.
          for SPEC in \
            "saveBudgetAllocations:lets_app/server/40_domain/BudgetAdmin.js" \
            "importExistingTravel:lets_app/server/40_domain/BudgetBackfill.js" \
            "validateExistingTravel:lets_app/server/40_domain/BudgetBackfill.js"; do
            FN="${SPEC%%:*}"
            FILE="${SPEC##*:}"
            BODY=$(awk "/^function ${FN}\(/,/^}/" "$FILE")
            if [ -z "$BODY" ]; then
              echo "::error file=$FILE::${FN} is missing."
              exit 1
            fi
            if ! echo "$BODY" | grep -aq 'isTravelAdmin'; then
              echo "::error file=$FILE::${FN} writes budget data but does not check isTravelAdmin(). Every top-level function is browser-callable, so hiding the button is not a control."
              exit 1
            fi
          done
          # And the converse: reading must NOT be gated. @clolry wants budget
          # figures visible to everyone for transparency, so a guard creeping
          # into the read path is also a defect.
          READBODY=$(awk '/^function getBudgetAllocations\(/,/^}/' \
                       lets_app/server/40_domain/BudgetAdmin.js)
          if echo "$READBODY" | grep -aq 'return errorResponse.*Administrator access'; then
            echo "::error file=lets_app/server/40_domain/BudgetAdmin.js::getBudgetAllocations must stay readable by all users. @clolry: budget info is deliberately transparent; only writes are restricted."
            exit 1
          fi
          # The import must never send mail or route for approval. A reviewer
          # asked to approve travel that already happened will conclude the
          # system is broken.
          if grep -aqE 'GmailApp|MailApp|sendSubmissionNotification|determineInitialRouting' \
               lets_app/server/40_domain/BudgetBackfill.js; then
            echo "::error file=lets_app/server/40_domain/BudgetBackfill.js::The backfill importer must not send notifications or route for approval. These records are entered retroactively as completed or committed travel."
            exit 1
          fi
          echo "PASS - budget writes are admin-guarded, reads are open, the importer is silent."

      - name: Guard - the budget dashboard must not hardcode dollar figures
        run: |
          echo "Checking the budget dashboard for hardcoded currency..."
          # This page WAS a mockup: 34 literal dollar figures and no server
          # calls at all. @clolry read those numbers as live for weeks.
          #
          # A stale literal sitting beside a live figure is worse than an
          # all-mockup page, because nothing distinguishes them.
          PAGE=lets_app/client/pages/travelBudgetDashboardPage.html
          # Three-digit-plus amounts only: $0 and single digits appear in
          # explanatory prose and are not balances.
          HITS=$(grep -anE '\$[0-9][0-9,]{2,}' "$PAGE" | grep -av 'toLocaleString' || true)
          if [ -n "$HITS" ]; then
            echo "::error file=$PAGE::Hardcoded dollar figures found. Budget values must come from getBudgetDashboard, not from the markup:"
            echo "$HITS"
            exit 1
          fi
          echo "PASS - no hardcoded currency on the budget dashboard."

      - name: Guard - every test file is excluded from the clasp push
        run: |
          echo "Checking .claspignore covers every test_*.js..."
          # Test files are Node scripts using require() and process.exit.
          # Apps Script has neither, so a pushed test file is dead weight at
          # best and a load-time ReferenceError at worst.
          #
          # This is caught here rather than noticed later because adding a
          # suite and forgetting the .claspignore line is invisible locally —
          # nothing fails until a deploy.
          MISSING=""
          for d in lets_app orgchart_app; do
            for f in "$d"/test_*.js; do
              [ -e "$f" ] || continue
              b=$(basename "$f")
              grep -aqxF "$b" "$d/.claspignore" || MISSING="$MISSING $d/$b"
            done
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Test files missing from .claspignore:$MISSING — they would be pushed to Apps Script, where require() does not exist."
            exit 1
          fi
          # And the converse: a stale entry means a renamed suite is silently
          # no longer excluded.
          STALE=""
          for d in lets_app orgchart_app; do
            while IFS= read -r line; do
              case "$line" in
                test_*.js)
                  [ -f "$d/$line" ] || STALE="$STALE $d/$line" ;;
              esac
            done < "$d/.claspignore"
          done
          if [ -n "$STALE" ]; then
            echo "::error::A .claspignore lists test files that no longer exist:$STALE"
            exit 1
          fi
          echo "PASS - all test files are excluded from the push."

      - name: Leg city capture tests
        run: node lets_app/test_leg_city.js

      - name: HC roster editor tests
        run: node lets_app/test_hc_admin.js

      # --- Regression guards -------------------------------------------------
      # These encode the fixes in this change so they cannot silently regress
      # later (AGENTS.md §12.3).

      - name: 'Guard: HC must be declared with var, not const/let'
        run: |
          echo "Checking the HC declaration keyword..."
          # Same failure mode as LETS_CONFIG below, and the same consequence.
          # 28 call sites across 9 server files reference the HC namespace.
          if ! grep -qE '^var HC[[:space:]]*=' lets_app/server/20_data/HCData.js; then
            echo "::error file=lets_app/server/20_data/HCData.js::HC is not declared with 'var'. A top-level const/let is not a property of the global object under Apps Script V8. 28 call sites depend on this namespace. Restore 'var HC = '."
            exit 1
          fi
          echo "PASS - HC is declared with var."

      - name: 'Guard: org chart projection must not emit PII'
        run: |
          echo "Checking the org chart projection for sensitive fields..."
          # hcGetOrgChartTree feeds a SEPARATE Apps Script project that any
          # domain user can open with the link. Its reduced payload — workgroup
          # name, supervisor name, employee names — IS the access control for
          # that deployment, because there is no role check behind it.
          #
          # test_hc_data.js §10 serializes the real payload and asserts no
          # sensitive value appears. This guard is a cheaper structural check
          # that fails the build if someone adds a sensitive field to the node
          # literal, and names the consequence in the log.
          BODY=$(awk '/function hcGetOrgChartTree/,/^  }$/' lets_app/server/20_data/HCData.js)
          for FIELD in emailAddress employeeId supervisoryStatus locationCode occupancyStatus; do
            if echo "$BODY" | grep -aqE "(^|[^a-zA-Z_])${FIELD}[^a-zA-Z_]*:" ; then
              echo "::error file=lets_app/server/20_data/HCData.js::hcGetOrgChartTree emits '${FIELD}'. That projection is served by the org chart deployment, which any domain user can open with the link and which has no role check. It must emit only workgroup name, supervisor name and employee names."
              exit 1
            fi
          done
          # `grade` and the duty-station fields are checked separately because
          # 'grade' appears legitimately in the GS-15 predicate comment above.
          if echo "$BODY" | grep -aqE "(grade|dutyStation|location)[[:space:]]*:"; then
            echo "::error file=lets_app/server/20_data/HCData.js::hcGetOrgChartTree emits a grade or duty-station field. See the comment above this guard."
            exit 1
          fi
          echo "PASS - org chart projection emits no sensitive fields."

      - name: 'Guard: seed data must not contain real email addresses'
        run: |
          echo "Checking HCSeed.js for non-example.gov addresses..."
          # HCSeed.js is fictional test data. Every address must stay on the
          # RFC 2606 reserved example.gov domain so a stray notification cannot
          # reach a real mailbox, and so the roster can never be mistaken for
          # a real one. A real address here would also grant its owner LETS
          # access through canAccessTrip (Access.js:416) once seeded.
          if grep -oE '[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+' lets_app/server/91_setup/HCSeed.js \
             | grep -av '@example\.gov' | grep . ; then
            echo "::error file=lets_app/server/91_setup/HCSeed.js::HCSeed.js contains an address outside example.gov. Seed data must stay fictional; a real address here is seeded into HC_Positions and grants that person LETS access via canAccessTrip."
            exit 1
          fi
          echo "PASS - all seed addresses are on example.gov."

      - name: 'Guard: client must not hardcode the other-cost percentage'
        run: |
          echo "Checking for hardcoded gross-up percentages in the client..."
          # The percentage is configurable via the `other_cost_percentage`
          # Script Property. A literal in the client silently overrides it,
          # because Costs.js:675 prefers whatever percentage the row carries —
          # so the form would display one number and store another.
          #
          # Callers must use TravelRequest.getOtherCostPercentage() or
          # TravelCostService.getOtherCostPercentage().
          if grep -nE "otherPercentage[[:space:]]*[:=][[:space:]]*[0-9]+" \
               lets_app/client/controllers/form/travelRequestState.html \
               lets_app/client/shared/travelCostService.html; then
            echo "::error::A hardcoded otherPercentage literal was found in the client. Use getOtherCostPercentage() instead; a literal silently overrides the configured other_cost_percentage Script Property."
            exit 1
          fi
          if grep -nE "percentage[[:space:]]*=[[:space:]]*[0-9]+" \
               lets_app/client/shared/travelCostService.html; then
            echo "::error file=lets_app/client/shared/travelCostService.html::calculateOtherCosts has a hardcoded default percentage. Leave the parameter undefined so it resolves from the configured value."
            exit 1
          fi
          echo "PASS - no hardcoded gross-up percentage in the client."

      - name: 'Guard: HC-derived access must stay logged and switchable'
        run: |
          echo "Checking the G-008 access-audit controls are still wired..."
          # canAccessTrip grants site access from HR data on two of its three
          # paths, with no row in Travel_User_Roles and no admin-console
          # visibility. Those grants must stay (a) logged and (b) disableable
          # without a deploy, or G-008 reopens silently.
          for FN in _logAccessDecision_ isHcDerivedAccessEnabled getAccessInventory; do
            if ! grep -q "function ${FN}" lets_app/server/30_services/Access.js; then
              echo "::error file=lets_app/server/30_services/Access.js::${FN} is missing. HC-derived access grants must remain logged and switchable (G-008)."
              exit 1
            fi
          done
          # Each allow-path must log before returning. Three GRANTED calls, one
          # per path, plus the DENIED paths.
          GRANTS=$(grep -ac "_logAccessDecision_(emailLower, 'GRANTED'" lets_app/server/30_services/Access.js || true)
          if [ "$GRANTS" -lt 3 ]; then
            echo "::error file=lets_app/server/30_services/Access.js::Expected 3 GRANTED log calls in canAccessTrip (one per allow-path), found ${GRANTS}. An unlogged allow-path is exactly the G-008 defect."
            exit 1
          fi
          echo "PASS - access decisions are logged and the kill switch is present."

      - name: 'Guard: HR roster writes must be admin-guarded and validated'
        run: |
          echo "Checking the HC roster editor's guards..."
          # Apps Script makes every top-level function browser-callable
          # (G-001), so the admin page's gate protects the PAGE, not these
          # functions. Each must guard independently.
          for FN in getHCAdminData saveHCPosition deactivateHCPosition refreshHCAdminData hcLoadRealOrgCodes; do
            if ! grep -aq "function ${FN}" lets_app/server/40_domain/HCAdmin.js; then
              echo "::error file=lets_app/server/40_domain/HCAdmin.js::${FN} is missing."
              exit 1
            fi
            # CHECKED PER FUNCTION, not by counting occurrences.
            #
            # This was a >= threshold against a total count, which does not
            # bite: adding a fifth entry point raised the count to 6, so
            # deleting a guard from any one of them left 5 and still passed.
            # Verified by deleting one — the guard MISSED it.
            #
            # A count cannot express "every one of these, individually". This
            # extracts each function body and looks inside it.
            BODY=$(awk "/^function ${FN}\(/,/^}/" lets_app/server/40_domain/HCAdmin.js)
            if ! echo "$BODY" | grep -aq '_hcAdminGuard_()'; then
              echo "::error file=lets_app/server/40_domain/HCAdmin.js::${FN} does not call _hcAdminGuard_(). Apps Script makes every top-level function browser-callable (G-001), so an unguarded entry point lets any authenticated user edit HR data."
              exit 1
            fi
          done
          # A half-applied edit to HR data produces exactly the dangling
          # references and cycles this editor exists to prevent.
          if ! grep -q 'if (problems.length) {' lets_app/server/40_domain/HCAdmin.js; then
            echo "::error file=lets_app/server/40_domain/HCAdmin.js::saveHCPosition no longer refuses an invalid write before touching the sheet."
            exit 1
          fi
          # The bundle caches for six hours; without invalidation an edit is
          # invisible long enough to look like the save failed.
          # PER FUNCTION, for the same reason as the guard check above: a count
          # threshold passes when one write loses its invalidation and another
          # gains one.
          for FN in saveHCPosition deactivateHCPosition refreshHCAdminData; do
            BODY=$(awk "/^function ${FN}\(/,/^}/" lets_app/server/40_domain/HCAdmin.js)
            if ! echo "$BODY" | grep -aqE 'hcCacheInvalidateAll\(\)|hcRefreshBundleCache\(\)'; then
              echo "::error file=lets_app/server/40_domain/HCAdmin.js::${FN} does not invalidate the HC cache. The bundle caches for six hours, so the edit would be invisible long enough to look like the save failed."
              exit 1
            fi
          done
          echo "PASS - roster writes are guarded, validated and invalidate the cache."

      - name: 'Guard: a typed leg city must be captured'
        run: |
          echo "Checking manual city entry is not conditional..."
          # leg.city was only written on the SUCCESS branch of the GSA city
          # lookup, while the failure branch changed the placeholder to
          # "Type any city..." — inviting input nothing captured. The user got
          # a field that accepted text and a Continue button that refused,
          # reporting "Please complete all destination details".
          #
          # The API key fixes the success path, not the bug: any GSA outage
          # reproduces it.
          if ! grep -q '_bindLegCityManualEntry' lets_app/client/controllers/form/travelRequestItinerary.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestItinerary.html::_bindLegCityManualEntry is gone. A typed city will not be captured when the GSA lookup fails, and Continue will block with no way to proceed."
            exit 1
          fi
          # It must be called on BOTH failure branches and unconditionally on
          # the success path.
          CALLS=$(grep -ac '_bindLegCityManualEntry(legId)' lets_app/client/controllers/form/travelRequestItinerary.html || true)
          if [ "$CALLS" -lt 3 ]; then
            echo "::error file=lets_app/client/controllers/form/travelRequestItinerary.html::Expected _bindLegCityManualEntry on the failure branch, the catch branch and the success path (3 calls); found ${CALLS}."
            exit 1
          fi
          echo "PASS - manual city entry is always bound."

      - name: 'Guard: branding must stay configurable'
        run: |
          echo "Checking for hardcoded brand strings..."
          # The app was inherited from another workgroup and identified as
          # theirs in 136 places. @clolry wants a redeploy for a different group
          # to be a configuration change, not a code change.
          #
          # Comments and STORED values are permitted: 'AAS FO' is an
          # Initial_Review_Level value, and TRIP_FAVICON_ID / _buildAASLogo are
          # identifiers. Display strings are not.
          BAD=$(grep -arnE "'[^']*\bTRIP\b|\"[^\"]*\bTRIP\b|aastravel@gsa\.gov" \
                  lets_app/server/30_services/Email.js \
                  lets_app/server/50_pages/Render.js \
                  lets_app/client/shared/travelUtils.html \
                  lets_app/client/controllers/portal/travelPortalController.html \
                | grep -avE ":[0-9]+:\s*(//|\*|/\*|<!--)" \
                | grep -avE "TRIP_FAVICON|_buildAASLogo|aas-brand-header|TRAVEL_LOGO" || true)
          if [ -n "$BAD" ]; then
            echo "::error::A hardcoded brand string was found. Use getAppName() / getEmailFromAddress() or a {{appName}} token so another workgroup can rebrand without a code change:"
            echo "$BAD"
            exit 1
          fi
          # The email FOOTER. It survived the first rebranding sweep because it was a
          # hardcoded literal inside a template string rather than a {{token}}, so
          # @clolry was still seeing "ASSISTED ACQUISITION SERVICES" — a different
          # office under the same service — weeks after the rebrand.
          #
          # Checked separately from the loop below because the strings differ: a footer
          # names the AGENCY and the SERVICE, and neither is derivable from
          # ORG_LONG_NAME. Substituting the office name would be a third wrong answer.
          # -a because Email.js trips grep's binary heuristic, and without it the
          # check prints "binary file matches" and exits 1 through the pipe —
          # looking like a pass. The guard was silently dead when first written.
          #
          # ^[0-9]+: not :[0-9]+: — a single-file grep emits "528:..." with no
          # filename prefix, so the leading colon never matched and every
          # comment line counted as a hit.
          if grep -anE "ASSISTED ACQUISITION|'GENERAL SERVICES ADMINISTRATION" \
               lets_app/server/30_services/Email.js \
             | grep -avE "^[0-9]+:[[:space:]]*(//|\*|/\*)" | grep -aq .; then
            echo "::error file=lets_app/server/30_services/Email.js::The email footer must resolve through EMAIL_CONTENT.global.orgLine, which reads getAgencyName() and getOrgServiceName(). A literal here cannot be rebranded by another workgroup."
            exit 1
          fi
          # The stage labels must resolve from configuration, not literals.
          for LIT in "label: 'SD'" "label: 'BU'" "label: 'AAS FO'"; do
            if grep -qF "$LIT" lets_app/server/30_services/Email.js; then
              echo "::error file=lets_app/server/30_services/Email.js::Workflow stage label \"${LIT}\" is hardcoded. This organisation calls them SCD and DAC; use getReviewLabelSector() / getReviewLabelBU()."
              exit 1
            fi
          done
          # The submission confirmation must start the tracker at the first
          # stage. Deriving it from the routed level put green checkmarks on
          # reviews nobody had done.
          if ! grep -q "const currentStage = 'submitted';" lets_app/server/30_services/Email.js; then
            echo "::error file=lets_app/server/30_services/Email.js::sendSubmitterConfirmation no longer starts the progress tracker at 'submitted'. Deriving the stage from the routed review level marks every earlier stage complete on a brand-new request."
            exit 1
          fi
          # Every review surface must read ONE label source. Four status maps
          # plus the help modal each hardcoded 'AAS FO' and 'BU'
          # independently; a property change has to move all of them or the
          # help text contradicts the status badge beside it.
          for FILE in lets_app/client/controllers/review/travelReviewController.html \
                      lets_app/client/controllers/admin/travelAdminController.html \
                      lets_app/client/controllers/admin/travelReviewerDashboardController.html \
                      lets_app/client/controllers/admin/travelUsersController.html \
                      lets_app/client/controllers/portal/travelPortalController.html; do
            if ! grep -q 'stageLabels()' "$FILE"; then
              echo "::error file=${FILE}::This surface no longer reads TravelUtils.stageLabels(). Hardcoded stage labels mean a REVIEW_LABEL_BU change leaves this screen showing the old name."
              exit 1
            fi
          done
          # include() evaluates each file as its OWN template (Render.js:373),
          # so a variable set on a PAGE template is invisible inside an
          # included file. Adding <?= appName ?> to travelHelpModal — which
          # every page includes — threw "ReferenceError: appName is not
          # defined" and took the whole app down, on pages that never
          # referenced appName themselves.
          #
          # A scriptlet CALLING a server function is fine; a bare identifier
          # is a page variable and will throw.
          STRAY=$(grep -arnE '<\?=?!?=[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\?>' \
                    lets_app/client/shared/ lets_app/client/components/ \
                    lets_app/client/controllers/ 2>/dev/null \
                  | grep -av '(' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::An included file references a page template variable. include() gives each file its own template, so this throws ReferenceError on every page that includes it. Use a data- attribute filled from window._letsBranding instead:"
            echo "$STRAY"
            exit 1
          fi
          echo "PASS - branding is configurable."

      - name: 'Guard: unrouted requests must be visible'
        run: |
          echo "Checking routing destination is surfaced..."
          # Routing degrades QUIETLY. If HC cannot resolve a Sector Director or
          # no BU Reviewer is configured, the request submits, the confirmation
          # reads normally, and the portal shows a normal pending badge — while
          # the request sits unrouted indefinitely.
          #
          # An empty reviewer name is the only evidence, so both surfaces must
          # say so explicitly rather than omitting the line.
          if ! grep -q '_describeRoutingDestination' lets_app/server/30_services/Email.js; then
            echo "::error file=lets_app/server/30_services/Email.js::The confirmation email no longer names where the request was routed. A submitter cannot tell whether routing resolved."
            exit 1
          fi
          if ! grep -q 'not yet assigned' lets_app/server/30_services/Email.js; then
            echo "::error file=lets_app/server/30_services/Email.js::The unrouted case no longer says so. An unrouted request reads as a normal pending one and sits until someone notices."
            exit 1
          fi
          if ! grep -q '_describeRouting' lets_app/client/controllers/portal/travelPortalController.html; then
            echo "::error file=lets_app/client/controllers/portal/travelPortalController.html::The portal card no longer shows who holds the request."
            exit 1
          fi
          if ! grep -q 'No reviewer assigned yet' lets_app/client/controllers/portal/travelPortalController.html; then
            echo "::error file=lets_app/client/controllers/portal/travelPortalController.html::The portal no longer flags unrouted requests."
            exit 1
          fi
          # The stage must derive from STATUS, not Initial_Review_Level. That
          # column records where a request STARTED and never advances, so
          # pairing it with the current reviewer showed the right person
          # against the wrong stage once a request progressed.
          for FILE in lets_app/server/30_services/Email.js \
                      lets_app/client/shared/travelUtils.html; do
            if ! grep -q 'STATUS_STAGES' "$FILE"; then
              echo "::error file=${FILE}::describeReviewStage no longer derives the stage from status. A request past its first stage will show the current reviewer against the stage it started at."
              exit 1
            fi
          done
          # NEEDS_INFO and PENDING_CORRECTION wait on the SUBMITTER. Showing
          # "with <reviewer>" there is actively wrong.
          if ! grep -q 'isAwaitingSubmitter' lets_app/client/shared/travelUtils.html; then
            echo "::error file=lets_app/client/shared/travelUtils.html::isAwaitingSubmitter is gone. A needs-info request will read as waiting on a reviewer when it is waiting on the submitter."
            exit 1
          fi
          echo "PASS - routing destination is visible on both surfaces."

      - name: 'Guard: classification options must stay tracker-verbatim'
        run: |
          echo "Checking Step 4 options against the FAS tracker..."
          # These values are written into a GOOGLE FORM. A value it does not
          # recognise is rejected or lands as free text, so the strings cannot
          # be tidied — including the tracker's own typo "Oversees Employee".
          #
          # The previous lists were the inherited TRIP taxonomy and the prose
          # from the OAS memo quoted in the tracker's introduction, neither of
          # which the form matches.
          # Any purpose string that reaches the tracker must be one of its own.
          # "Internal Travel" was the inherited TRIP wording and does not exist
          # in the tracker.
          if grep -q "'Internal Travel'" lets_app/client/controllers/form/travelRequestState.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestState.html::\"Internal Travel\" is not a FAS tracker option. getTrackerPurposes() must only emit the tracker's own strings."
            exit 1
          fi
          if grep -q 'Sensitive Compartmented Information Facility' lets_app/client/pages/travelRequestPage.html; then
            echo "::error file=lets_app/client/pages/travelRequestPage.html::The mission-critical list has reverted to the OAS memo prose. The tracker's option label is \"SCIF or Secure Facility Activities\"."
            exit 1
          fi
          # The tracker's typo must be preserved. The string now lives in
          # getTrackerPurposes() rather than the page, because Purpose of
          # Travel is derived — but it is still the value the Google Form
          # matches on, and spell-correcting it is the obvious well-meant
          # change that would break submission.
          if ! grep -q "Oversees Employee (within OCONUS)" \
               lets_app/client/controllers/form/travelRequestState.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestState.html::The \"Oversees Employee (within OCONUS)\" value is missing or was spell-corrected in getTrackerPurposes(). That is the tracker's own spelling and the Google Form matches on it."
            exit 1
          fi
          # The second mission-critical question the form previously lacked.
          if ! grep -q 'id="primaryJustification"' lets_app/client/pages/travelRequestPage.html; then
            echo "::error file=lets_app/client/pages/travelRequestPage.html::The primary-justification single-select is missing. The tracker requires it separately from the mission-critical multi-select, and a submission without it is incomplete."
            exit 1
          fi
          # Purpose of Travel must stay DERIVED. It duplicated Step 1's
          # Purpose of Travel in different words, and @clolry could not tell
          # what to pick for an internal management meeting because he had
          # already said so in Step 1. All 13 tracker options are knowable from
          # the Step 1 delegation code plus computed itinerary flags.
          if grep -q 'id="travelTypesContainer"' lets_app/client/pages/travelRequestPage.html; then
            echo "::error file=lets_app/client/pages/travelRequestPage.html::The Type of Travel checkbox column is back. Purpose of Travel is derived in getTrackerPurposes() from Step 1 and the trip details; asking again duplicates a question the submitter has already answered."
            exit 1
          fi
          if ! grep -q 'id="derivedPurposeList"' lets_app/client/pages/travelRequestPage.html; then
            echo "::error file=lets_app/client/pages/travelRequestPage.html::The derived Purpose of Travel panel is missing. A value sent to the tracker that nobody selected must be visible and attributable to the submitter."
            exit 1
          fi
          echo "PASS - Step 4 options match the tracker."

      - name: 'Guard: email must be environment-gated and template refs must resolve'
        run: |
          echo "Checking the environment email gate..."
          # Nothing was stopping the sandbox from emailing real people. The only
          # suppression was a per-tester opt-in keyed on the SENDER, and
          # Test_Submitters was empty.
          if ! grep -q '_resolveEmailRecipients' lets_app/server/30_services/Email.js; then
            echo "::error file=lets_app/server/30_services/Email.js::The environment email gate is gone. Non-production environments will send travel notifications to real recipients."
            exit 1
          fi
          # Both the GmailApp path and the MailApp fallback must use the routed
          # recipients, not the raw options.
          if grep -qE 'GmailApp\.sendEmail\(options\.to' lets_app/server/30_services/Email.js; then
            echo "::error file=lets_app/server/30_services/Email.js::GmailApp.sendEmail is using options.to, bypassing the environment gate."
            exit 1
          fi
          # Scoped to the MailApp call. _resolveEmailRecipients legitimately
          # returns `to: options.to` on its production pass-through branch, and
          # a file-wide grep matched that — a guard that trips on correct code
          # is one people delete.
          if awk '/MailApp\.sendEmail\(\{/,/\}\);/' lets_app/server/30_services/Email.js \
               | grep -aqE 'to: options\.to'; then
            echo "::error file=lets_app/server/30_services/Email.js::The MailApp fallback is using options.to, bypassing the environment gate."
            exit 1
          fi
          echo "PASS - email sends go through the environment gate."
          echo "Checking template file references resolve..."
          # clasp strips ONE .html extension, so a file named x.html.html is
          # reachable as 'x.html' and NOT as 'x'. Four files were named that
          # way; one of them broke the entire admin page.
          if find lets_app -name '*.html.html' | grep . ; then
            echo "::error::A file ends in .html.html. clasp strips one extension, so include('...') cannot resolve it. Rename it."
            exit 1
          fi
          node -e "
            const fs=require('fs'), path=require('path');
            const files=[];
            (function walk(d){ for(const e of fs.readdirSync(d,{withFileTypes:true})){
              const p=path.join(d,e.name);
              if(e.isDirectory())walk(p); else files.push(p);
            }})('lets_app');
            const refs=new Set();
            for(const f of files){
              if(!/\.(html|js)\$/.test(f)) continue;
              const s=fs.readFileSync(f,'utf8');
              for(const m of s.matchAll(/(?:include|createTemplateFromFile|createHtmlOutputFromFile)\(\s*'([^']+)'/g)){
                if(m[1]==='...') continue;
                refs.add(m[1]);
              }
            }
            const missing=[...refs].filter(r=>!fs.existsSync('lets_app/'+r+'.html'));
            if(missing.length){ console.error('Unresolved template references: '+missing.join(', ')); process.exit(1); }
            console.log(refs.size+' template references all resolve.');
          " || {
            echo "::error::An include() or createTemplateFromFile() target does not exist. The page will throw at render time."
            exit 1
          }
          echo "PASS - every template reference resolves."

      - name: 'Guard: FAS tracker writes must refuse production'
        run: |
          echo "Checking the FAS test-submission harness refuses production..."
          # FASTrackerTest.js WRITES to whichever tracker the environment gate
          # resolves. In production that is the OFFICIAL FAS sheet, owned by the
          # front office and shared across every portfolio.
          #
          # resolveFASTrackerTarget already refuses to resolve production
          # outside production, but a diagnostic that writes needs its own
          # refusal — one check failing silently must not be enough.
          for FN in submitFASTrackerTestRow deleteFASTrackerTestRows; do
            if ! grep -q "function ${FN}" lets_app/server/91_setup/FASTrackerTest.js; then
              echo "::error file=lets_app/server/91_setup/FASTrackerTest.js::${FN} is missing."
              exit 1
            fi
          done
          REFUSALS=$(grep -ac 'LETS_IS_PRODUCTION' lets_app/server/91_setup/FASTrackerTest.js || true)
          if [ "$REFUSALS" -lt 2 ]; then
            echo "::error file=lets_app/server/91_setup/FASTrackerTest.js::Expected both submitFASTrackerTestRow and deleteFASTrackerTestRows to check LETS_IS_PRODUCTION, found ${REFUSALS} reference(s). Without it a diagnostic can write to or delete from the official FAS tracker."
            exit 1
          fi
          # Cleanup must match on the marker, never on a row number: a stale
          # index on a shared sheet deletes someone else's request.
          if ! grep -q 'FAS_TEST_ROW_MARKER' lets_app/server/91_setup/FASTrackerTest.js; then
            echo "::error file=lets_app/server/91_setup/FASTrackerTest.js::FAS_TEST_ROW_MARKER is gone. Diagnostic rows must be self-identifying so cleanup can find them without relying on row numbers."
            exit 1
          fi
          echo "PASS - FAS tracker writes refuse production and are marked."

      - name: 'Guard: submission rows must match their schema width'
        run: |
          echo "Checking positional row widths against the schemas..."
          # Sheet writes are POSITIONAL (docs/DATA_DICTIONARY.md 3.9). A row one
          # value short shifts every column after it, silently.
          #
          # This already happened: Submission.js wrote 38 values into a
          # 40-column Request_Travelers schema because DD_Confirmed and
          # DD_Confirmed_At were omitted. It was benign ONLY because the two
          # missing columns happened to be last — appending anything after them
          # would have put every new value in the wrong cell.
          node -e "
            const fs=require('fs'), vm=require('vm');
            const ctx=vm.createContext({console});
            vm.runInContext(fs.readFileSync('lets_app/server/01_constants/Sheets.js','utf8'),ctx);
            const S=vm.runInContext('TRAVEL_SHEET_SCHEMAS',ctx);
            const s=fs.readFileSync('lets_app/server/40_domain/Submission.js','utf8');
            function count(open,close){
              const i=s.indexOf(open), j=s.indexOf(close,i);
              const b=s.slice(i+open.length,j).split('\n').map(l=>l.replace(/\/\/.*\$/,'')).join('\n');
              let d=0,n=1;
              for(const ch of b){ if('([{'.includes(ch))d++; else if(')]}'.includes(ch))d--; else if(ch===','&&d===0)n++; }
              return n;
            }
            const a=count('const requestRow = [','\n    ];');
            const b=count('travelerRows.push([','      ]);');
            let bad=false;
            if(a!==S.Requests.length){ console.error('requestRow has '+a+' values, Requests schema has '+S.Requests.length); bad=true; }
            if(b!==S.Request_Travelers.length){ console.error('travelerRow has '+b+' values, Request_Travelers schema has '+S.Request_Travelers.length); bad=true; }
            if(bad) process.exit(1);
            console.log('requestRow '+a+'/'+S.Requests.length+', travelerRow '+b+'/'+S.Request_Travelers.length);
          " || {
            echo "::error file=lets_app/server/40_domain/Submission.js::A submission row does not match its schema width. Writes are positional, so every column after the gap is written to the wrong cell."
            exit 1
          }
          echo "PASS - row widths match."

      - name: 'Guard: FAS tracker row must be built from the column list'
        run: |
          echo "Checking the FAS tracker row is not hand-ordered..."
          # submitToFASTracker appends to a LIVE sheet owned by the FAS front
          # office and shared across every FAS portfolio. A misaligned row is
          # an uncorrectable write to someone else's system of record.
          #
          # The previous version hand-ordered 14 values into a 27-column sheet
          # and matched nothing. Building the row by mapping over
          # FAS_TRACKER_COLUMNS is what makes a tracker change shift nothing.
          if ! grep -q 'FAS_TRACKER_COLUMNS.map(function (col)' lets_app/server/30_services/FASTrackerSync.js; then
            echo "::error file=lets_app/server/30_services/FASTrackerSync.js::The FAS tracker row is no longer built by mapping over FAS_TRACKER_COLUMNS. A hand-ordered array writes every value into the wrong column of a live shared sheet."
            exit 1
          fi
          if ! grep -q '_verifyTrackerHeader' lets_app/server/30_services/FASTrackerSync.js; then
            echo "::error file=lets_app/server/30_services/FASTrackerSync.js::The tracker header verification is gone. The FAS front office can re-order their sheet without notice; appending a positionally-built row to a changed layout corrupts it."
            exit 1
          fi
          # LETS must never assert a value in the front office's decision
          # columns. Matched only in CODE: the comment explaining why the old
          # status write was removed necessarily contains the old string, and a
          # guard that trips on its own documentation is a guard people delete.
          if grep -avE "^\s*(\*|//)" lets_app/server/30_services/FASTrackerSync.js \
               | grep -aq "'Pending FAS CoS Approval'"; then
            echo "::error file=lets_app/server/30_services/FASTrackerSync.js::LETS is writing an approval status into the FAS tracker. 'Status:' is the front office's own decision column and must stay blank."
            exit 1
          fi
          echo "PASS - tracker row is column-mapped and header-verified."

      - name: 'Guard: no relative ?mode= navigation'
        run: |
          echo "Checking for relative mode navigation in page templates..."
          # Apps Script serves the app inside a sandbox iframe on
          # googleusercontent.com, so window.location.href='?mode=x' resolves
          # against the IFRAME origin, not /exec. The result is a blank page
          # plus a history entry per attempt — @clolry needed ~25 back presses
          # to escape the budget page.
          #
          # Use navigateToTravel(), which builds an absolute URL and navigates
          # window.top.
          if grep -rnE "window\.location\.href\s*=\s*['\"]\?mode=" \
               lets_app/client/pages/ lets_app/client/controllers/ \
               | grep -avE '^\s*(//|\*|<!--)' | grep -av 'NOT window.location'; then
            echo "::error::A relative ?mode= navigation was found. Inside the Apps Script sandbox iframe this navigates to googleusercontent.com and renders a blank page. Use navigateToTravel(mode) instead."
            exit 1
          fi
          echo "PASS - no relative mode navigation."

      - name: 'Guard: funding relabel must not change the stored value'
        run: |
          echo "Checking the GSA-Paid label did not rename the stored value..."
          # "Overhead" was relabelled "GSA-Paid" for users. The STORED value is
          # still 'overhead', and Submission.js routing, Admin_Dashboard spend
          # buckets, ReviewerDashboard filtering and Review_Action's overhead
          # detection all branch on that string — plus every already-submitted
          # row carries it. Renaming it would misroute requests silently.
          if ! grep -q 'value="overhead"' lets_app/client/controllers/form/travelRequestTravelers.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestTravelers.html::The funding radio no longer submits value=\"overhead\". Four server paths branch on that string and submitted rows already carry it; changing it misroutes requests."
            exit 1
          fi
          if ! grep -q '<span>GSA-Paid</span>' lets_app/client/controllers/form/travelRequestTravelers.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestTravelers.html::The GSA-Paid label is missing. Users should not see \"Overhead\"."
            exit 1
          fi
          echo "PASS - label is GSA-Paid, stored value is still overhead."

      - name: 'Guard: airfare must never overwrite a manual figure'
        run: |
          echo "Checking the airfare estimate stays a suggestion..."
          # The feature pre-fills Estimated Cost. It must never overwrite a
          # figure the user typed: they may have a quote, or know the contract
          # fare is unavailable on their dates. airfareIsEstimate is the flag
          # that distinguishes the two, and _onAirfareManualEdit clears it.
          if ! grep -q "userHasOwnFigure" lets_app/client/controllers/form/travelRequestAirfare.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestAirfare.html::The guard against overwriting a user-entered airfare is gone. _applyAirfareIfUntouched must check airfareIsEstimate before writing ticketCost."
            exit 1
          fi
          if ! grep -q "_onAirfareManualEdit" lets_app/client/controllers/form/travelRequestTravelers.html; then
            echo "::error file=lets_app/client/controllers/form/travelRequestTravelers.html::The cost input no longer notifies the airfare module on manual edit, so a later lookup can silently overwrite a hand-typed figure."
            exit 1
          fi
          echo "PASS - the airfare estimate remains a suggestion."

      - name: 'Guard: bulk fare lookups must warm the single-lookup cache'
        run: |
          echo "Checking getCityPairFaresBulk writes through to the cache..."
          # A cold fare lookup scans all 17,403 City_Pairs rows (2.7s measured
          # in the sandbox). warmCityPairCache pre-warms common routes via the
          # bulk reader, so the bulk reader MUST write the same cache keys
          # getCityPairFare reads.
          #
          # It originally did not. Warming ran, reported success, and left
          # every later lookup paying the full cold scan — a feature that was
          # entirely decorative with no visible failure.
          # Keyed on the call to the versioned key builder, not on a raw
          # literal — the literal moved into cityPairFareCacheKey_ when keys
          # were versioned, which silently broke the previous form of this
          # check while it still reported PASS.
          if ! grep -q "cityPairFareCacheKey_(key" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::getCityPairFaresBulk no longer writes cache entries via cityPairFareCacheKey_. Cache warming becomes a no-op and every fare lookup pays a 2.7s cold scan, silently."
            exit 1
          fi
          echo "PASS - bulk lookups warm the single-lookup cache."

      - name: 'Guard: diagAll members must take no arguments'
        run: |
          echo "Checking every diagAll member is zero-arity..."
          # The Apps Script editor CANNOT pass arguments — the Run button always
          # calls with none. A diagnostic that requires a parameter is
          # unrunnable from the editor, which defeats the purpose of having a
          # committed diagnostics file at all. @clolry hit this with
          # diagCityNamesForState('TX').
          for FN in $(grep -aoE '^  diag[A-Za-z]+\(\);$' lets_app/server/99_triggers/Diagnostics.js | tr -d ' ();'); do
            if ! grep -qE "function ${FN}\(\)" lets_app/server/99_triggers/Diagnostics.js; then
              echo "::error file=lets_app/server/99_triggers/Diagnostics.js::${FN} is called by diagAll but does not have a zero-argument signature. The editor Run button cannot pass arguments, so it would be unrunnable by hand."
              exit 1
            fi
          done
          echo "PASS - every diagAll member is zero-arity."

      - name: 'Guard: diagnostics must stay read-only'
        run: |
          echo "Checking Diagnostics.js performs no writes..."
          # Diagnostics.js is run by hand against live environments, including
          # production. A mutating call in here is a foot-gun: the whole point
          # is that it is safe to run anywhere at any time.
          for OP in setValue setValues appendRow deleteRow insertSheet \
                    clearContent setProperty deleteProperty createTrigger; do
            if grep -q "${OP}(" lets_app/server/99_triggers/Diagnostics.js; then
              echo "::error file=lets_app/server/99_triggers/Diagnostics.js::Diagnostics.js calls ${OP}(). Diagnostics are run by hand against production and must stay read-only. Move anything that writes into 91_setup/ with its own authorization guard."
              exit 1
            fi
          done
          echo "PASS - diagnostics are read-only."

      - name: 'Guard: sheet writes that are re-read must flush'
        run: |
          echo "Checking SpreadsheetApp.flush() after preference writes..."
          # Apps Script BUFFERS sheet writes. recordAirportPreference writes
          # then may be called again in the same execution, so without a flush
          # the second call reads a stale getLastRow(), finds no existing row,
          # and appends onto the SAME physical row — overwriting the first.
          #
          # Observed in the sandbox: two calls produced one row with Use_Count
          # 1, so promotion never fired and the hybrid-learning feature was
          # entirely inert. The failure is silent; nothing errors.
          FLUSHES=$(grep -ac "SpreadsheetApp.flush()" lets_app/server/30_services/AirportPrefs.js || true)
          if [ "$FLUSHES" -lt 2 ]; then
            echo "::error file=lets_app/server/30_services/AirportPrefs.js::Expected a SpreadsheetApp.flush() after both the update and the append path in recordAirportPreference, found ${FLUSHES}. Without it Use_Count cannot increment and airport preferences never get promoted."
            exit 1
          fi
          if ! grep -q "LockService.getScriptLock()" lets_app/server/30_services/AirportPrefs.js; then
            echo "::error file=lets_app/server/30_services/AirportPrefs.js::recordAirportPreference lost its LockService guard. Concurrent submissions clobber the same preference row."
            exit 1
          fi
          echo "PASS - preference writes flush and are serialized."

      - name: 'Guard: CacheService keys must be versioned'
        run: |
          echo "Checking cache keys carry a version token..."
          # Cache entries live 24h. An UNVERSIONED key means a deploy that
          # changes what a cached value MEANS keeps serving the old shape until
          # the TTL expires — correct new code producing stale output, with
          # nothing erroring.
          #
          # This already happened: the three-tier city resolution shipped and
          # FORT WORTH still reported NO MATCH, because its airport list had
          # been cached EMPTY before the alias logic existed.
          #
          # This guard only checks the keys are BUILT through the versioned
          # helpers. It cannot tell you a bump was NEEDED — that judgement
          # belongs to whoever changes a cached result's shape.
          for CONST in CP_AIRPORTS_CACHE_VERSION CP_FARE_CACHE_VERSION; do
            if ! grep -q "var ${CONST} = 'v" lets_app/server/30_services/CityPairs.js; then
              echo "::error file=lets_app/server/30_services/CityPairs.js::${CONST} is missing or malformed. Cache keys must carry a version so a shape change cannot serve stale entries for 24h."
              exit 1
            fi
          done
          # Any raw key literal outside the two helper functions bypasses
          # versioning entirely.
          STRAY=$(grep -anE "'cp_(fare|airports)_'" lets_app/server/30_services/CityPairs.js \
                  | grep -avE 'cp_fare_. \+ CP_FARE_CACHE_VERSION|cp_airports_. \+ CP_AIRPORTS_CACHE_VERSION' || true)
          if [ -n "$STRAY" ]; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::An unversioned cache key literal was found. Build keys with cityPairFareCacheKey_() or cityAirportsCacheKey_():"
            echo "$STRAY"
            exit 1
          fi
          echo "PASS - cache keys are versioned."

      - name: 'Guard: city resolution must have a fallback'
        run: |
          echo "Checking getAirportsForCity never returns an empty picker..."
          # getAirportsForCity matches the GSA award file's city name EXACTLY.
          # HR and GSA do not always agree: FORT WORTH, TX resolved to NOTHING
          # because GSA files DFW and DAL under DALLAS, so a traveller based
          # there got an empty airport picker — which blocks a submission.
          #
          # The state-level fallback is what guarantees an actionable result,
          # and matchType is what lets the UI explain itself instead of
          # silently presenting 22 state airports as serving the asked-for city.
          if ! grep -q "GSA_CITY_ALIASES" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::GSA_CITY_ALIASES is missing. Cities GSA names differently from HR resolve to no airports at all."
            exit 1
          fi
          if ! grep -q "matchType = 'state'" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::The state-level fallback in getAirportsForCity is gone. An unrecognised city name now yields an empty airport picker instead of a broad but usable list."
            exit 1
          fi
          echo "PASS - city resolution falls back to state level."

      - name: 'Guard: metro-area codes must never win an airport default'
        run: |
          echo "Checking the metro-aware airport sort..."
          # WAS is an IATA metropolitan-area code covering DCA, IAD and BWI.
          # In the real GSA data it carries MORE routes than DCA (260 vs 254),
          # so a plain route-count sort makes an unbookable aggregate the
          # default origin for Washington. Nothing in the CSV marks these, so
          # the IATA_METRO_CODES list and the sort that demotes them are the
          # only defence.
          if ! grep -q "IATA_METRO_CODES" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::IATA_METRO_CODES is missing. Without it, metro aggregates like WAS outrank real airports on route count and become the default."
            exit 1
          fi
          if ! grep -q "a.isMetroArea ? 1 : -1" lets_app/server/30_services/CityPairs.js; then
            echo "::error file=lets_app/server/30_services/CityPairs.js::The airport sort no longer demotes metro-area codes. WAS has more routes than DCA in the real data and will win the default."
            exit 1
          fi
          echo "PASS - metro-area codes sort last."

      - name: 'Guard: city pair keys must be alphabetically normalized'
        run: |
          echo "Checking buildPairKey_ still sorts its inputs..."
          # GSA stores every pair with origin and destination in ALPHABETICAL
          # order regardless of travel direction, so DCA->ORD and ORD->DCA are
          # the same row. buildPairKey_ is the only place that ordering is
          # decided, and both the sync and the lookup depend on it.
          #
          # Removing the sort makes reverse-direction lookups return "no
          # contract fare awarded" for routes that have one — silently, and in
          # a way that reads as missing data rather than a bug.
          if ! grep -aqE "x <= y \? \(x \+ '\|' \+ y\) : \(y \+ '\|' \+ x\)" \
               lets_app/server/91_setup/CityPairSync.js; then
            echo "::error file=lets_app/server/91_setup/CityPairSync.js::buildPairKey_ no longer sorts its inputs alphabetically. GSA stores pairs in alphabetical order; without the sort, half of all lookups silently return no fare."
            exit 1
          fi
          echo "PASS - pair keys are alphabetically normalized."

      - name: 'Guard: LETS_CONFIG must be declared with var, not const/let'
        run: |
          echo "Checking the LETS_CONFIG declaration keyword..."
          # LetsDB.js, BudgetEngine.js and RequestService.js all read this as
          # `root.LETS_CONFIG`. In the Apps Script V8 runtime a top-level
          # const/let creates a lexical binding that is NOT a property of the
          # global object, so root.LETS_CONFIG would be undefined and
          # LetsDB.js:20 throws at FILE EVALUATION time — taking down the whole
          # web app, not just the budget layer.
          #
          # test_budget_config_global.js already asserts this and carries a
          # negative control. This guard is a second, cheaper signal that names
          # the consequence directly in the build log, because the failure mode
          # is a total outage and the fix is one keyword.
          if ! grep -qE '^var LETS_CONFIG[[:space:]]*=' lets_app/server/00_config/BudgetConfig.js; then
            echo "::error file=lets_app/server/00_config/BudgetConfig.js::LETS_CONFIG is not declared with 'var'. Three files read it as root.LETS_CONFIG, which is undefined for a const/let declaration under Apps Script V8. This breaks the ENTIRE web app at file-evaluation time. Restore 'var LETS_CONFIG = {'."
            exit 1
          fi
          echo "PASS - LETS_CONFIG is declared with var."

      - name: 'Guard: deploy workflow must not trigger on pull_request'
        run: |
          echo "Checking that deploy-gas.yml has no pull_request trigger..."
          if grep -qE '^[[:space:]]*pull_request[[:space:]]*:' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::deploy-gas.yml has a 'pull_request' trigger. That deploys unreviewed code to the production GAS project. Remove it; PRs are verified by verify.yml instead."
            exit 1
          fi
          echo "PASS - deploy workflow does not run on pull_request."

      - name: 'Guard: this workflow must stay credential-free'
        run: |
          echo "Checking that verify.yml interpolates no repository credentials..."
          # Matches a real GitHub Actions credential interpolation, not prose.
          # (This comment deliberately avoids writing the pattern literally,
          # so the guard does not match its own source.)
          if grep -qE '\$\{\{[[:space:]]*secrets\.' .github/workflows/verify.yml; then
            echo "::error file=.github/workflows/verify.yml::verify.yml interpolates a repository secret. It executes untrusted pull_request code and must never hold deploy credentials."
            exit 1
          fi
          echo "PASS - verify workflow interpolates no credentials."

      - name: 'Guard: deploy job must stay behind an environment gate'
        run: |
          echo "Checking that the deploy job declares environment:..."
          # The `environment:` key is what makes GitHub apply the required
          # reviewer / prevent-self-review / deployment-branch rules BEFORE the
          # job starts, and what scopes CLASPRC_JSON once it is moved to
          # environment scope. Deleting this one line silently removes the
          # human gate on production deploys while the workflow still looks
          # correct and still goes green (CM-5; AGENTS.md §14.2).
          if ! grep -qE '^[[:space:]]*environment:' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::deploy-gas.yml has no 'environment:' key. The production deploy would run with no required-reviewer gate. Restore 'environment: \${{ needs.resolve.outputs.env_name }}' on the deploy job."
            exit 1
          fi
          # The gate must be driven by the credential-free resolve job, not a
          # literal, so the two deploy targets cannot be conflated.
          if ! grep -qE 'environment:.*needs\.resolve\.outputs\.env_name' .github/workflows/deploy-gas.yml; then
            echo "::error file=.github/workflows/deploy-gas.yml::'environment:' is present but is not derived from needs.resolve.outputs.env_name. A hardcoded environment name would let a sandbox push deploy under the production gate, or vice versa."
            exit 1
          fi
          echo "PASS - deploy job is gated by the resolved environment."

      - name: 'Guard: no hardcoded spreadsheet IDs in application source'
        run: |
          echo "Checking that no spreadsheet/script ID is hardcoded in lets_app/server..."
          # Spreadsheet and script IDs are environment configuration and must be
          # read from Script Properties, never embedded in source (AGENTS.md
          # §4.1 "never hardcode connection strings"; §12.1 config-from-code).
          #
          # Deliberately a generic length pattern rather than a list of real
          # IDs, so this guard does not itself disclose any identifier. Google
          # Sheets IDs are 44 chars and Apps Script IDs are 57; the 40-char
          # floor catches both. `-a` is required because one source file trips
          # grep's binary heuristic on high-byte UTF-8 characters.
          if grep -raEn "['\"]1[A-Za-z0-9_-]{39,}['\"]" lets_app/server/ orgchart_app/server/; then
            echo "::error::A spreadsheet or script ID literal appears in server source. Move it to a Script Property and read it via the project's config module."
            exit 1
          fi
          echo "PASS - no hardcoded spreadsheet or script IDs in application source."
